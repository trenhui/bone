# =============================================================================
# 脱敏模板 — bone-tpa（dev）。详见同目录 README.md
# =============================================================================
spring:
  application:
    name: bone-tpa-server
  profiles:
    active: dev
  datasource:
    url: ${TPA_DB_URL:jdbc:mysql://127.0.0.1:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${TPA_DB_USERNAME:root}
    password: ${TPA_DB_PASSWORD:}
    type: com.zaxxer.hikari.HikariDataSource
  data:
    redis:
      host: ${TPA_REDIS_HOST:127.0.0.1}
      port: ${TPA_REDIS_PORT:6379}
      database: 0
      password: ${TPA_REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8885}

metadata:
  sdk:
    appcode: ${METADATA_APPCODE:tpa}
    open: ${METADATA_SDK_OPEN:true}
    secret: ${METADATA_SDK_SECRET:}
    url: ${METADATA_SDK_URL:http://127.0.0.1:8081}
    sqlpath: ${METADATA_SQLPATH:customsql/}

sa-token:
  disable: true
  sign:
    secret-key: ${SA_TOKEN_SECRET_KEY:}
  alone-redis:
    host: ${TPA_REDIS_HOST:127.0.0.1}
    port: ${TPA_REDIS_PORT:6379}
    password: ${TPA_REDIS_PASSWORD:}
    database: 11

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://127.0.0.1:8761/eureka/}

oss:
  ENDPOINT: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
  ACCESSKEYID: ${ALIYUN_OSS_ACCESS_KEY_ID:}
  ACCESSKEYSECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
  BUCKETNAME: ${ALIYUN_OSS_BUCKET:}
  KEY: ${ALIYUN_OSS_KEY_PREFIX:}
  VISITURL: ${ALIYUN_OSS_VISIT_URL:}

xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:9090/xxl-job-admin}
    executor:
      appname: ${XXL_JOB_APPNAME:tpa-saas}
      ip: ${spring.cloud.client.ip-address:127.0.0.1}
      port: ${XXL_JOB_EXECUTOR_PORT:18000}
      logpath: ./api/logs/job_log
      accessToken: ${XXL_JOB_ACCESS_TOKEN:}
      logretentiondays: 5

tpa:
  apiurl: ${TPA_API_URL:http://127.0.0.1:8080}

kt:
  access-key: ${KT_ACCESS_KEY:}
  access-secret: ${KT_ACCESS_SECRET:}
