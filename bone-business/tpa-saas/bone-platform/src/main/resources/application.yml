alert:
  policies:
    CRITICAL:
      channels: [DINGTALK, SMS, EMAIL]
      retry: 3
    HIGH:
      channels: [EMAIL, DINGTALK]

  channels:
    mail:
      enabled: true
      from: alerts@company.com
      recipients:
        - ops@company.com
    dingtalk:
      enabled: true
      webhook: https://oapi.dingtalk.com/robot/send?access_token=your_token
      secret: your_secret
      atMobiles:
        - "13800000000"
    sms:
      enabled: true
      provider: "Aliyun"
      apiKey: "your-api-key"
      apiSecret: "your-api-secret"
      phoneNumbers:
        - "13800000001"
        - "13800000002"
      templateId: "your-template-id"

  async:
    corePoolSize: 10
    maxPoolSize: 20
    queueCapacity: 1000
    keepAliveSeconds: 60
