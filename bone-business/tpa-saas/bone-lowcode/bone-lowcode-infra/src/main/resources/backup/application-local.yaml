spring:
  datasource:
    url: ${LOWCODE_DB_URL:jdbc:mysql://127.0.0.1:3306/bone?useSSL=false&characterEncoding=utf8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${LOWCODE_DB_USERNAME:root}
