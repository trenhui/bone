version: '3.8'

services:
  mysql:
    image: mysql:8.0.33
    container_name: bone-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${BONE_DB_PASSWORD:-bone_root_pass}
      MYSQL_DATABASE: bone
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./bone-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: bone-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bone-iam:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE_PATH: bone-platform/bone-iam
        ARTIFACT_ID: bone-iam
    container_name: bone-iam
    ports:
      - "8081:8081"
    environment:
      BONE_DB_URL: jdbc:mysql://mysql:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8
      BONE_DB_USERNAME: root
      BONE_DB_PASSWORD: ${BONE_DB_PASSWORD:-bone_root_pass}
      BONE_REDIS_HOST: redis
      BONE_REDIS_PASSWORD: ${BONE_REDIS_PASSWORD:-}
      BONE_SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  bone-system:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE_PATH: bone-platform/bone-system
        ARTIFACT_ID: bone-system
    container_name: bone-system
    ports:
      - "8083:8083"
    environment:
      BONE_DB_URL: jdbc:mysql://mysql:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8
      BONE_DB_USERNAME: root
      BONE_DB_PASSWORD: ${BONE_DB_PASSWORD:-bone_root_pass}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  bone-masterdata:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE_PATH: bone-platform/bone-masterdata
        ARTIFACT_ID: bone-masterdata
    container_name: bone-masterdata
    ports:
      - "8084:8080"
    environment:
      BONE_DB_URL: jdbc:mysql://mysql:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8
      BONE_DB_USERNAME: root
      BONE_DB_PASSWORD: ${BONE_DB_PASSWORD:-bone_root_pass}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  bone-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE_PATH: bone-platform/bone-gateway
        ARTIFACT_ID: bone-gateway
    container_name: bone-gateway
    ports:
      - "8888:8888"
    environment:
      BONE_GATEWAY_PORT: 8888
      BONE_REDIS_HOST: redis
      BONE_REDIS_PASSWORD: ${BONE_REDIS_PASSWORD:-}
      # 网关上游改写为 compose 服务名（容器网络内可达），覆盖默认 localhost
      BONE_IAM_URI: http://bone-iam:8081
      BONE_SYSTEM_URI: http://bone-system:8083
      BONE_METADATA_SERVER_URI: http://bone-metadata-server:9001
      BONE_INTEGRATION_URI: http://bone-integration:8085
    depends_on:
      bone-iam:
        condition: service_healthy
      bone-system:
        condition: service_healthy
      bone-metadata-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  bone-metadata-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE_PATH: bone-engine/bone-metadata-server
        ARTIFACT_ID: bone-metadata-server
    container_name: bone-metadata-server
    ports:
      - "9001:9001"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: bone
      MYSQL_USERNAME: root
      BONE_DB_PASSWORD: ${BONE_DB_PASSWORD:-bone_root_pass}
      BONE_REDIS_HOST: redis
      BONE_REDIS_PASSWORD: ${BONE_REDIS_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9001/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
  redis_data:
