<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1200" height="920" fill="#ffffff"/>
  <defs>
    <marker id="dMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="dRo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/>
    </marker>
    <marker id="dGpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="580" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">procuraAI 私有化部署架构</text>

  <!-- ===== L0 用户与接入 ===== -->
  <rect x="40" y="44" width="1080" height="86" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="62" font-size="11.5" font-weight="700" fill="#64748b">用户与接入</text>
  <rect x="58" y="70" width="240" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="178" y="91" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">采购工作台（Web）</text>
  <text x="178" y="107" text-anchor="middle" font-size="10.5" fill="#64748b">文件上传 · 审查任务 · HITL 确认台 · 预警看板 · 问答</text>
  <line x1="320" y1="93" x2="348" y2="93" stroke="#475569" stroke-width="1.6" marker-end="url(#dMain)"/>
  <rect x="352" y="70" width="220" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="462" y="91" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">API 网关</text>
  <text x="462" y="107" text-anchor="middle" font-size="10.5" fill="#64748b">鉴权 · 租户隔离 · 限流 · 审计</text>
  <line x1="592" y1="93" x2="620" y2="93" stroke="#475569" stroke-width="1.6" marker-end="url(#dMain)"/>
  <rect x="624" y="70" width="260" height="46" rx="8" fill="#fefce8" stroke="#fde047"/>
  <text x="754" y="91" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">审查编排服务（LangGraph 状态机）</text>
  <text x="754" y="107" text-anchor="middle" font-size="10.5" fill="#854d0e">任务分解 · 多 Agent 协同 · 重试/降级 · 快照</text>
  <line x1="904" y1="93" x2="932" y2="93" stroke="#475569" stroke-width="1.6" marker-end="url(#dMain)"/>
  <rect x="936" y="70" width="160" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1016" y="91" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">规则管理台</text>
  <text x="1016" y="107" text-anchor="middle" font-size="10.5" fill="#64748b">规则 CRUD · 版本 · 灰度</text>

  <!-- ===== L1 应用服务 ===== -->
  <rect x="40" y="146" width="1080" height="168" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="58" y="164" font-size="11.5" font-weight="700" fill="#1d4ed8">应用服务（可单机合并起步）</text>
  <g>
    <rect x="58" y="174" width="330" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="223" y="194" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">L1 文档解析服务</text>
    <text x="223" y="212" text-anchor="middle" font-size="10.5" fill="#64748b">PyMuPDF/pdfplumber · Camelot · PaddleOCR · 语义切片 · 脱敏</text>
    <text x="223" y="226" text-anchor="middle" font-size="10" fill="#94a3b8">解析 → 表格抽取 → 切片 → IR 输出</text>
    <rect x="404" y="174" width="330" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="569" y="194" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">L2 规则引擎服务</text>
    <text x="569" y="212" text-anchor="middle" font-size="10.5" fill="#64748b">自研 DSL（JSON 规则表 + QLExpress）· 毫秒级确定性校验</text>
    <text x="569" y="226" text-anchor="middle" font-size="10" fill="#94a3b8">R01–R24 · 版本化 · shadow 灰度</text>
    <rect x="750" y="174" width="346" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="923" y="194" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">RAG 问答服务（M5）</text>
    <text x="923" y="212" text-anchor="middle" font-size="10.5" fill="#64748b">混合检索（BM25+向量+RRF）· bge-reranker · 出处溯源</text>
    <text x="923" y="226" text-anchor="middle" font-size="10" fill="#94a3b8">政策法规库 · 范本库 · 历史案例</text>
  </g>
  <g>
    <rect x="58" y="246" width="330" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="223" y="266" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">数据集成适配服务</text>
    <text x="223" y="284" text-anchor="middle" font-size="10.5" fill="#64748b">适配器模式 + 标准字段映射（contract_no 主键）</text>
    <text x="223" y="298" text-anchor="middle" font-size="10" fill="#94a3b8">OA · U8 · SAP · Oracle · 金蝶 · 信用源（只读）</text>
    <rect x="404" y="246" width="330" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="569" y="266" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">履约预警调度（M4）</text>
    <text x="569" y="284" text-anchor="middle" font-size="10.5" fill="#64748b">Quartz 每日扫描 · T-15/T-0/T+0 三级预警</text>
    <text x="569" y="298" text-anchor="middle" font-size="10" fill="#94a3b8">ERP 记录消警闭环 · OA 待办触达</text>
    <rect x="750" y="246" width="346" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="923" y="266" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">评测与质量服务</text>
    <text x="923" y="284" text-anchor="middle" font-size="10.5" fill="#64748b">评测集 ≥200 条回归 · 月度质量报表</text>
    <text x="923" y="298" text-anchor="middle" font-size="10" fill="#94a3b8">采纳率/误报率/漏检率 · 一致性抽查</text>
  </g>
  <line x1="580" y1="314" x2="580" y2="330" stroke="#475569" stroke-width="1.6" marker-end="url(#dMain)"/>

  <!-- ===== L2 AI 推理 ===== -->
  <rect x="40" y="334" width="1080" height="96" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="58" y="352" font-size="11.5" font-weight="700" fill="#6d28d9">LLM 推理服务（GPU 节点 · vLLM）</text>
  <rect x="58" y="360" width="330" height="58" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="223" y="380" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">结构化模型档（9B）</text>
  <text x="223" y="398" text-anchor="middle" font-size="10.5" fill="#64748b">要素抽取 · 规则启发 · 预警节点</text>
  <text x="223" y="412" text-anchor="middle" font-size="10" fill="#94a3b8">Qwen3.5-9B（FP8，成本优先）</text>
  <rect x="404" y="360" width="330" height="58" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="569" y="380" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">开放推理模型档（27B / 35B-A3B）</text>
  <text x="569" y="398" text-anchor="middle" font-size="10.5" fill="#64748b">风险判定 · 交叉矛盾 · 修改建议</text>
  <text x="569" y="412" text-anchor="middle" font-size="10" fill="#94a3b8">Qwen3.5-27B/35B-A3B（FP8 约 31GB，单 80G）</text>
  <rect x="750" y="360" width="346" height="58" rx="8" fill="#fefce8" stroke="#fde047"/>
  <text x="923" y="380" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">降级开关</text>
  <text x="923" y="398" text-anchor="middle" font-size="10.5" fill="#854d0e">LLM 不可用 → 纯规则兜底（rules_only）</text>
  <text x="923" y="412" text-anchor="middle" font-size="10" fill="#94a3b8">审查仍可完成 · AI 建议置灰</text>
  <line x1="580" y1="430" x2="580" y2="446" stroke="#475569" stroke-width="1.6" marker-end="url(#dMain)"/>

  <!-- ===== L3 数据层 ===== -->
  <rect x="40" y="450" width="1080" height="96" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="58" y="468" font-size="11.5" font-weight="700" fill="#047857">数据层（PostgreSQL + pgvector + 对象存储）</text>
  <rect x="58" y="476" width="330" height="58" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="223" y="496" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">业务库</text>
  <text x="223" y="514" text-anchor="middle" font-size="10.5" fill="#64748b">review · risk_item · rule · alert_task</text>
  <text x="223" y="528" text-anchor="middle" font-size="10" fill="#94a3b8">review_snapshot（可复现）· feedback</text>
  <rect x="404" y="476" width="330" height="58" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="569" y="496" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">向量库（pgvector HNSW）</text>
  <text x="569" y="514" text-anchor="middle" font-size="10.5" fill="#64748b">法规/范本/案例向量 · 十万级承载</text>
  <text x="569" y="528" text-anchor="middle" font-size="10" fill="#94a3b8">混合检索（向量 + BM25 + RRF）</text>
  <rect x="750" y="476" width="346" height="58" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="923" y="496" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">对象存储（加密）</text>
  <text x="923" y="514" text-anchor="middle" font-size="10.5" fill="#64748b">文档原文（加密）· IR 快照 · 导出报告</text>
  <text x="923" y="528" text-anchor="middle" font-size="10" fill="#94a3b8">原文留存策略按合规要求</text>
  <line x1="580" y1="546" x2="580" y2="562" stroke="#475569" stroke-width="1.6" marker-end="url(#dMain)"/>

  <!-- ===== L4 外部数据源 ===== -->
  <rect x="40" y="566" width="1080" height="86" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="584" font-size="11.5" font-weight="700" fill="#475569">外部数据源（只读接入 · 适配器可插拔）</text>
  <g font-size="12" fill="#1e293b">
    <rect x="58" y="592" width="196" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="156" y="614" text-anchor="middle" font-weight="600">OA 审批流</text>
    <text x="156" y="630" text-anchor="middle" font-size="10.5" fill="#64748b">流程事件订阅</text>
    <rect x="272" y="592" width="236" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="390" y="614" text-anchor="middle" font-weight="600">U8 / SAP / Oracle / 金蝶</text>
    <text x="390" y="630" text-anchor="middle" font-size="10.5" fill="#64748b">账套映射 · 只读拉取</text>
    <rect x="526" y="592" width="196" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="624" y="614" text-anchor="middle" font-weight="600">第三方信用源</text>
    <text x="624" y="630" text-anchor="middle" font-size="10.5" fill="#64748b">企查查/天眼查/信用中国</text>
    <rect x="740" y="592" width="356" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="918" y="614" text-anchor="middle" font-weight="600">内部台账 / 供应商库 / 历史审查</text>
    <text x="918" y="630" text-anchor="middle" font-size="10.5" fill="#64748b">导入 / 同步</text>
  </g>

  <!-- ===== L5 横切 ===== -->
  <rect x="40" y="668" width="1080" height="54" rx="12" fill="#0f172a"/>
  <text x="580" y="692" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">横切：审计日志（全操作留痕）· OpenTelemetry 链路追踪 · 指标/月度质量报表</text>
  <text x="580" y="710" text-anchor="middle" font-size="10.5" fill="#94a3b8">模型/算法备案 · 密钥管理 · 租户隔离 · 脱敏链路（仅脱敏后进 LLM）</text>

  <!-- 数据流（右侧竖虚线通道） -->
  <circle cx="1096" cy="203" r="3.5" fill="#7c3aed"/>
  <path d="M1096,203 L1116,203 L1116,389 L1096,389" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#dGpu)"/>
  <text x="1075" y="196" font-size="10.5" fill="#7c3aed">LLM 调用（脱敏）</text>
  <circle cx="1096" cy="270" r="3.5" fill="#0891b2"/>
  <path d="M1096,270 L1132,270 L1132,505 L1096,505" fill="none" stroke="#0891b2" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#dRo)"/>
  <text x="1075" y="263" font-size="10.5" fill="#0891b2">数据读写（IR/快照）</text>

  <!-- 图例 -->
  <g font-size="10.5" fill="#64748b">
    <text x="40" y="756">图例：</text>
    <line x1="78" y1="752" x2="108" y2="752" stroke="#475569" stroke-width="1.6" marker-end="url(#dMain)"/>
    <text x="114" y="756">主链路（实线）</text>
    <line x1="200" y1="752" x2="230" y2="752" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#dGpu)"/>
    <text x="236" y="756">LLM 调用（虚线）</text>
    <line x1="322" y1="752" x2="352" y2="752" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#dRo)"/>
    <text x="358" y="756">数据读写（虚线）</text>
  </g>
</svg>
