<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="860" viewBox="0 0 1160 860" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="aMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="aFeed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="550" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">procuraAI 技术架构（三层防御 + HITL）</text>

  <!-- ===== 数据源带 ===== -->
  <rect x="40" y="44" width="1020" height="78" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="56" y="64" font-size="11.5" font-weight="700" fill="#475569">数据源</text>
  <g font-size="12" fill="#1e293b">
    <rect x="56" y="74" width="150" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="131" y="96" text-anchor="middle" font-weight="600">OA 审批流</text>
    <rect x="216" y="74" width="220" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="326" y="96" text-anchor="middle" font-weight="600">U8 / SAP / Oracle / 金蝶</text>
    <rect x="446" y="74" width="180" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="536" y="96" text-anchor="middle" font-weight="600">第三方信用源</text>
    <rect x="636" y="74" width="220" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="746" y="96" text-anchor="middle" font-weight="600">招标 / 合同 / 投标文档</text>
    <rect x="866" y="74" width="174" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="953" y="96" text-anchor="middle" font-weight="600">法规知识库 · 范本库</text>
  </g>
  <line x1="550" y1="122" x2="550" y2="136" stroke="#475569" stroke-width="1.6" marker-end="url(#aMain)"/>

  <!-- ===== 编排器 ===== -->
  <rect x="40" y="140" width="1020" height="66" rx="12" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.2"/>
  <text x="60" y="162" font-size="13" font-weight="700" fill="#3730a3">Agent 编排器（Orchestrator）</text>
  <text x="60" y="180" font-size="10.5" fill="#6366f1">任务分解 · 多角色协同 · 队列与重试 · 降级策略</text>
  <g font-size="11" fill="#ffffff">
    <rect x="360" y="150" width="108" height="24" rx="6" fill="#6366f1"/>
    <text x="414" y="166" text-anchor="middle" font-weight="600">解析器 Agent</text>
    <rect x="478" y="150" width="96" height="24" rx="6" fill="#6366f1"/>
    <text x="526" y="166" text-anchor="middle" font-weight="600">规则 Agent</text>
    <rect x="584" y="150" width="96" height="24" rx="6" fill="#6366f1"/>
    <text x="632" y="166" text-anchor="middle" font-weight="600">审查 Agent</text>
    <rect x="690" y="150" width="96" height="24" rx="6" fill="#6366f1"/>
    <text x="738" y="166" text-anchor="middle" font-weight="600">建议 Agent</text>
    <rect x="796" y="150" width="96" height="24" rx="6" fill="#6366f1"/>
    <text x="844" y="166" text-anchor="middle" font-weight="600">预警 Agent</text>
  </g>
  <line x1="550" y1="206" x2="550" y2="224" stroke="#475569" stroke-width="1.6" marker-end="url(#aMain)"/>

  <!-- ===== L1 解析层 ===== -->
  <rect x="40" y="228" width="1020" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="60" y="248" font-size="13" font-weight="700" fill="#1d4ed8">L1 · 解析层（确定性优先）</text>
  <g font-size="12" fill="#1e293b">
    <rect x="56" y="258" width="230" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="171" y="278" text-anchor="middle" font-weight="600">文档解析（PDF / Word / OCR）</text>
    <text x="171" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">段落 · 表格 · 章节结构</text>
    <rect x="306" y="258" width="230" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="421" y="278" text-anchor="middle" font-weight="600">表格抽取</text>
    <text x="421" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">技术参数表 · 评分表 · 报价表</text>
    <rect x="556" y="258" width="230" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="671" y="278" text-anchor="middle" font-weight="600">敏感信息脱敏</text>
    <text x="671" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">主体 / 金额 / 联系方式</text>
    <rect x="806" y="258" width="230" height="46" rx="8" fill="#fefce8" stroke="#fde047"/>
    <text x="921" y="274" text-anchor="middle" font-weight="600">结构化中间表示 IR</text>
    <text x="921" y="290" text-anchor="middle" font-size="10.5" fill="#854d0e">统一供 L2 / L3 消费</text>
  </g>
  <line x1="550" y1="320" x2="550" y2="338" stroke="#475569" stroke-width="1.6" marker-end="url(#aMain)"/>

  <!-- ===== L2 规则层 ===== -->
  <rect x="40" y="342" width="1020" height="92" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
  <text x="60" y="362" font-size="13" font-weight="700" fill="#b45309">L2 · 规则层（确定性校验 · 毫秒级）</text>
  <g font-size="12" fill="#1e293b">
    <rect x="56" y="372" width="354" height="46" rx="8" fill="#ffffff" stroke="#fcd34d"/>
    <text x="233" y="392" text-anchor="middle" font-weight="600">规则引擎</text>
    <text x="233" y="408" text-anchor="middle" font-size="10.5" fill="#64748b">排他性条款 / 权责不对等 / 违约金 / 质保金 …… 零漏检</text>
    <rect x="430" y="372" width="354" height="46" rx="8" fill="#ffffff" stroke="#fcd34d"/>
    <text x="607" y="392" text-anchor="middle" font-weight="600">规则库 v1（24 条法规三元组 + 自定义规则）</text>
    <text x="607" y="408" text-anchor="middle" font-size="10.5" fill="#64748b">特征→风险→依据 · 版本化灰度</text>
    <rect x="804" y="372" width="236" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="922" y="392" text-anchor="middle" font-weight="600">命中必出</text>
    <text x="922" y="408" text-anchor="middle" font-size="10.5" fill="#b91c1c">L2 为准 · 兜底</text>
  </g>
  <line x1="550" y1="434" x2="550" y2="452" stroke="#475569" stroke-width="1.6" marker-end="url(#aMain)"/>

  <!-- ===== L3 推理层 ===== -->
  <rect x="40" y="456" width="1020" height="92" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="60" y="476" font-size="13" font-weight="700" fill="#6d28d9">L3 · 推理层（LLM 开放推理）</text>
  <g font-size="12" fill="#1e293b">
    <rect x="56" y="486" width="320" height="46" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="216" y="506" text-anchor="middle" font-weight="600">LLM 审查引擎（CoT 推理）</text>
    <text x="216" y="522" text-anchor="middle" font-size="10.5" fill="#64748b">语义理解 · 交叉矛盾 · 修改建议</text>
    <rect x="396" y="486" width="200" height="46" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="496" y="506" text-anchor="middle" font-weight="600">条款级引用</text>
    <text x="496" y="522" text-anchor="middle" font-size="10.5" fill="#64748b">无引用不出结果</text>
    <rect x="616" y="486" width="200" height="46" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="716" y="506" text-anchor="middle" font-weight="600">置信度评分</text>
    <text x="716" y="522" text-anchor="middle" font-size="10.5" fill="#64748b">法律条款阈值 0.85</text>
    <rect x="836" y="486" width="200" height="46" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="936" y="506" text-anchor="middle" font-weight="600">风险分级</text>
    <text x="936" y="522" text-anchor="middle" font-size="10.5" fill="#64748b">高 / 中 / 低</text>
  </g>
  <line x1="550" y1="548" x2="550" y2="566" stroke="#475569" stroke-width="1.6" marker-end="url(#aMain)"/>

  <!-- ===== HITL ===== -->
  <rect x="40" y="570" width="1020" height="92" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="60" y="590" font-size="13" font-weight="700" fill="#047857">HITL · 人工确认台（AI 不替代法定责任）</text>
  <g font-size="12" fill="#1e293b">
    <rect x="56" y="600" width="230" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="171" y="620" text-anchor="middle" font-weight="600">高风险 → 法务复核</text>
    <text x="171" y="636" text-anchor="middle" font-size="10.5" fill="#b91c1c">合规红线 · 必审</text>
    <rect x="306" y="600" width="230" height="46" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="421" y="620" text-anchor="middle" font-weight="600">中风险 → 采购专员</text>
    <text x="421" y="636" text-anchor="middle" font-size="10.5" fill="#92400e">法务抽查</text>
    <rect x="556" y="600" width="230" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="671" y="620" text-anchor="middle" font-weight="600">低风险 → 自动归档</text>
    <text x="671" y="636" text-anchor="middle" font-size="10.5" fill="#64748b">可查 · 可追溯</text>
    <rect x="806" y="600" width="230" height="46" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="921" y="620" text-anchor="middle" font-weight="600">三态流转</text>
    <text x="921" y="636" text-anchor="middle" font-size="10.5" fill="#047857">采纳 / 驳回 / 改判（留痕）</text>
  </g>
  <line x1="550" y1="662" x2="550" y2="680" stroke="#475569" stroke-width="1.6" marker-end="url(#aMain)"/>

  <!-- ===== 输出带 ===== -->
  <rect x="40" y="684" width="1020" height="64" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="60" y="704" font-size="13" font-weight="700" fill="#334155">输出</text>
  <g font-size="12" fill="#1e293b">
    <rect x="56" y="714" width="230" height="26" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="171" y="732" text-anchor="middle" font-weight="600">预审摘要</text>
    <rect x="306" y="714" width="230" height="26" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="421" y="732" text-anchor="middle" font-weight="600">风险清单 + 修改建议</text>
    <rect x="556" y="714" width="230" height="26" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="671" y="732" text-anchor="middle" font-weight="600">履约预警（临期 / 到期 / 逾期）</text>
    <rect x="806" y="714" width="230" height="26" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="921" y="732" text-anchor="middle" font-weight="600">审查报告（导出）</text>
  </g>
  <line x1="550" y1="748" x2="550" y2="766" stroke="#475569" stroke-width="1.6" marker-end="url(#aMain)"/>

  <!-- ===== 审计条 ===== -->
  <rect x="40" y="770" width="1020" height="48" rx="12" fill="#0f172a"/>
  <text x="550" y="793" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">全链路审计 · 留痕 · 可追溯（输入 → IR → 规则命中 → LLM 输出 → 人工结论）</text>
  <text x="550" y="809" text-anchor="middle" font-size="10.5" fill="#94a3b8">对齐 195 号文「严格算法备案与安全审核 · 防范幻觉与算法歧视」；EU AI Act 人工监督原则</text>

  <!-- 回流通道（右侧双分支：规则库优化 + 提示词调优） -->
  <path d="M1060,615 L1098,615 L1098,505 L1064,505" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#aFeed)"/>
  <path d="M1098,505 L1098,405 L1064,405" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#aFeed)"/>
  <text x="1102" y="498" font-size="10.5" fill="#7c3aed" text-anchor="middle">提示词调优</text>
  <text x="1102" y="398" font-size="10.5" fill="#7c3aed" text-anchor="middle">规则库优化</text>

  <!-- 图例 -->
  <g font-size="10.5" fill="#64748b">
    <text x="40" y="840">图例：</text>
    <line x1="78" y1="836" x2="108" y2="836" stroke="#475569" stroke-width="1.6" marker-end="url(#aMain)"/>
    <text x="114" y="840">处理流（实线）</text>
    <line x1="200" y1="836" x2="230" y2="836" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#aFeed)"/>
    <text x="236" y="840">反馈迭代（虚线）</text>
  </g>
</svg>
