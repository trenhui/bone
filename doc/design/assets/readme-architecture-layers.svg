<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="960" viewBox="0 0 1080 960" role="img" aria-labelledby="la-title la-desc" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <title id="la-title">Bone 平台架构与两种部署形态</title>
  <desc id="la-desc">前端 Qiankun 微前端经网关访问平台服务、元数据引擎、扩展集成引擎与 AI 能力中台，统一元模型 catalog 贯穿模式 A 与 B，底层为 MySQL 与 Redis。部署形态分已交付的局部组合根 bone-boot 与默认的多进程独立 JAR；全平台单进程 all-in-one 未交付，K8s 编排仍为草稿。</desc>

  <defs>
    <linearGradient id="la-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/><stop offset="0.5" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="la-frontend" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0F9FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="la-cap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0FDF4"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="la-model" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient>
    <linearGradient id="la-infra" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="la-gateway" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#312E81"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient>
    <linearGradient id="la-modeA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBEB"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="la-modeB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF2FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <filter id="la-shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="la-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <style>
    .h1 { font-size:19px; font-weight:700; fill:#0F172A; }
    .sub { font-size:12.5px; fill:#64748B; }
    .band-t { font-size:12px; font-weight:700; letter-spacing:1px; fill:#475569; }
    .name { font-size:13px; font-weight:600; fill:#1E293B; }
    .desc { font-size:11.5px; fill:#64748B; }
    .pill { font-size:11px; font-weight:700; }
    .foot { font-size:11.5px; fill:#94A3B8; }
    .card { fill:#FFFFFF; stroke:#E2E8F0; stroke-width:1; filter:url(#la-shadow); }
    .card-ai { fill:#FFFFFF; stroke:#DDD6FE; stroke-width:1; filter:url(#la-shadow); }
  </style>

  <rect width="1080" height="960" fill="#FFFFFF"/>
  <rect width="1080" height="6" fill="url(#la-top)"/>

  <text class="h1" x="40" y="44">Bone 平台架构</text>
  <text class="sub" x="40" y="66">一份元模型，两种装配方式 · 进程与端口见运行时拓扑图</text>
  <rect x="836" y="28" width="204" height="28" rx="14" fill="#F1F5F9"/>
  <circle cx="856" cy="42" r="5" fill="#10B981"/>
  <text class="pill" x="868" y="46" fill="#475569">已交付形态 · 2 种</text>

  <!-- 1 前端 -->
  <rect x="40" y="88" width="1000" height="112" rx="16" fill="url(#la-frontend)" stroke="#BAE6FD"/>
  <rect x="40" y="104" width="4" height="80" rx="2" fill="#0EA5E9"/>
  <circle cx="66" cy="112" r="11" fill="#0EA5E9"/>
  <text x="66" y="116" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text class="band-t" x="86" y="116" fill="#0369A1">前端 · QIANKUN 微前端</text>
  <rect class="card" x="64" y="128" width="300" height="56" rx="10"/>
  <text class="name" x="80" y="150">bone-shell 管理端</text>
  <text class="desc" x="80" y="170">主应用 · 布局 / 登录 / 菜单</text>
  <rect class="card" x="380" y="128" width="636" height="56" rx="10"/>
  <text class="name" x="396" y="150">业务微应用</text>
  <text class="desc" x="396" y="170">metadata · masterdata · generator · extension · integration · system</text>

  <line x1="540" y1="202" x2="540" y2="218" stroke="#94A3B8" stroke-width="2" marker-end="url(#la-arrow)"/>

  <!-- 2 网关 -->
  <rect x="40" y="222" width="1000" height="80" rx="16" fill="url(#la-gateway)"/>
  <circle cx="66" cy="246" r="11" fill="#818CF8"/>
  <text x="66" y="250" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="86" y="250" font-size="13" font-weight="700" fill="#FFFFFF">bone-gateway</text>
  <text x="220" y="250" font-size="11.5" fill="#C7D2FE">Spring Cloud Gateway · 统一入口</text>
  <text x="86" y="276" font-size="12" fill="#A5B4FC">/api/v1/{domain}/** · JWT 鉴权 · 限流 · 路由到独立上游</text>
  <rect x="826" y="238" width="190" height="26" rx="13" fill="#4338CA" fill-opacity="0.55"/>
  <text class="pill" x="921" y="255" fill="#E0E7FF" text-anchor="middle">多进程形态的统一入口</text>

  <line x1="540" y1="304" x2="540" y2="320" stroke="#94A3B8" stroke-width="2" marker-end="url(#la-arrow)"/>

  <!-- 3 能力层 -->
  <rect x="40" y="324" width="1000" height="196" rx="16" fill="url(#la-cap)" stroke="#BBF7D0"/>
  <rect x="40" y="340" width="4" height="164" rx="2" fill="#10B981"/>
  <circle cx="66" cy="348" r="11" fill="#10B981"/>
  <text x="66" y="352" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text class="band-t" x="86" y="352" fill="#047857">能力层 · 四大引擎与 AI 能力中台</text>

  <rect class="card" x="64" y="366" width="226" height="140" rx="12"/>
  <text class="name" x="80" y="390">平台服务</text>
  <text class="desc" x="80" y="412">bone-iam · bone-system</text>
  <text class="desc" x="80" y="432">bone-masterdata</text>
  <text class="desc" x="80" y="452">bone-integration</text>
  <text class="desc" x="80" y="472">bone-file</text>
  <text class="desc" x="80" y="494" fill="#059669">账户 · 权限 · 主数据 · 集成</text>

  <rect class="card" x="306" y="366" width="226" height="140" rx="12"/>
  <text class="name" x="322" y="390">智能元数据引擎</text>
  <text class="desc" x="322" y="412">bone-metadata-sdk</text>
  <text class="desc" x="322" y="432">bone-metadata-engine</text>
  <text class="desc" x="322" y="452">bone-metadata-server</text>
  <text class="desc" x="322" y="472">studio-generator</text>
  <text class="desc" x="322" y="494" fill="#059669">模式 A / B 同源</text>

  <rect class="card" x="548" y="366" width="226" height="140" rx="12"/>
  <text class="name" x="564" y="390">扩展与集成引擎</text>
  <text class="desc" x="564" y="412">bone-extension-sdk</text>
  <text class="desc" x="564" y="432">bone-extension-studio</text>
  <text class="desc" x="564" y="452">ExtPoint 以依赖嵌入宿主</text>
  <text class="desc" x="564" y="472">Camel 编排 · 连接器</text>
  <text class="desc" x="564" y="494" fill="#059669">Outbox 可靠投递</text>

  <rect class="card-ai" x="790" y="366" width="226" height="140" rx="12"/>
  <text class="name" x="806" y="390" fill="#6D28D9">AI 能力中台</text>
  <text class="desc" x="806" y="412">bone-ai-app 可运行宿主</text>
  <text class="desc" x="806" y="432">LLM 网关 · RAG 接地守卫</text>
  <text class="desc" x="806" y="452">编排 · trace · 评测集</text>
  <text class="desc" x="806" y="472">rules · document · ledger</text>
  <text class="desc" x="806" y="494" fill="#7C3AED">以库形式随宿主装配</text>

  <line x1="540" y1="522" x2="540" y2="538" stroke="#94A3B8" stroke-width="2" marker-end="url(#la-arrow)"/>

  <!-- 4 元模型 -->
  <rect x="40" y="542" width="1000" height="92" rx="16" fill="url(#la-model)" stroke="#93C5FD"/>
  <rect x="40" y="558" width="4" height="60" rx="2" fill="#2563EB"/>
  <circle cx="66" cy="566" r="11" fill="#2563EB"/>
  <text x="66" y="570" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text class="band-t" x="86" y="570" fill="#1D4ED8">统一元模型 · CATALOG（meta_* 表）</text>
  <rect x="826" y="556" width="190" height="26" rx="13" fill="#DBEAFE"/>
  <text class="pill" x="921" y="573" fill="#1D4ED8" text-anchor="middle">两种形态共用一层</text>
  <text class="desc" x="86" y="596">实体 · 字段 · 关系 · 规则集中定义；模式 A 生成可审计源码，模式 B 运行时读取定义提供动态 API</text>
  <text class="desc" x="86" y="618">SDK 的 EMBEDDED / REMOTE 决定读表还是远程调用元数据服务，不改变业务逻辑。</text>

  <line x1="540" y1="636" x2="540" y2="652" stroke="#94A3B8" stroke-width="2" marker-end="url(#la-arrow)"/>

  <!-- 5 基础设施 -->
  <rect x="40" y="656" width="1000" height="72" rx="16" fill="url(#la-infra)" stroke="#E2E8F0"/>
  <rect x="40" y="672" width="4" height="40" rx="2" fill="#64748B"/>
  <circle cx="66" cy="680" r="11" fill="#64748B"/>
  <text x="66" y="684" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text class="band-t" x="86" y="684">基础设施</text>
  <text class="desc" x="86" y="708">MySQL 8（meta_* + 业务表） · Redis 7（会话 / 缓存） · 可选 Nacos / RocketMQ（默认不启用）</text>

  <!-- 部署形态 -->
  <text x="40" y="766" font-size="14" font-weight="700" fill="#0F172A">部署形态</text>
  <text class="sub" x="130" y="766">同一份元模型，可按装配粒度选择；两种形态均已落地</text>

  <rect x="40" y="780" width="490" height="116" rx="14" fill="url(#la-modeA)" stroke="#FCD34D" filter="url(#la-shadow)"/>
  <rect x="60" y="796" width="70" height="20" rx="10" fill="#FEF3C7"/>
  <text class="pill" x="95" y="810" fill="#B45309" text-anchor="middle">局部组合根</text>
  <text class="name" x="140" y="811">bone-boot · 单进程合并</text>
  <text class="desc" x="60" y="840">把 metadata-server 与报销 / 采购业务模块装进同一个</text>
  <text class="desc" x="60" y="860">Spring 上下文，复用 :9001 宿主；不含 iam / system /</text>
  <text class="desc" x="60" y="880">gateway / integration，也不进 compose 与 CI 镜像矩阵。</text>

  <rect x="550" y="780" width="490" height="116" rx="14" fill="url(#la-modeB)" stroke="#A5B4FC" filter="url(#la-shadow)"/>
  <rect x="570" y="796" width="70" height="20" rx="10" fill="#E0E7FF"/>
  <text class="pill" x="605" y="810" fill="#4338CA" text-anchor="middle">默认形态</text>
  <text class="name" x="650" y="811">多进程 · 独立 JAR + 网关</text>
  <text class="desc" x="570" y="840">每个模块一个可执行 JAR 与独立 JVM，网关按</text>
  <text class="desc" x="570" y="860">/api/v1/{domain}/** 转发；compose 8 个服务键、CI 9 个</text>
  <text class="desc" x="570" y="880">服务镜像。README 快速开始跑的就是这套形态。</text>

  <text class="foot" x="40" y="930">边界：全平台 all-in-one 单进程未交付；生产级 K8s 编排仍是草稿，不能当上线依据。</text>
</svg>
