<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1140" viewBox="0 0 1080 1140" role="img" aria-labelledby="tp-title tp-desc" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <title id="tp-title">Bone 开发环境运行时拓扑</title>
  <desc id="tp-desc">前端 bone-shell :3000 与九个 qiankun 子应用经 bone-gateway :8888 调用 bone-platform 业务服务、bone-engine 引擎与 bone-ai 能力中台；基础设施为 MySQL 8 与 Redis 7。默认形态为各模块独立进程，bone-boot 可把元数据服务与业务模块合并到 :9001 单进程。</desc>

  <defs>
    <linearGradient id="tp-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/><stop offset="0.5" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="tp-front" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0F9FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="tp-cap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0FDF4"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="tp-eng" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBEB"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="tp-ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF5FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="tp-infra" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="tp-gw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#312E81"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient>
    <filter id="tp-shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <marker id="tp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <style>
    .h1 { font-size:19px; font-weight:700; fill:#0F172A; }
    .sub { font-size:12.5px; fill:#64748B; }
    .bt { font-size:12px; font-weight:700; letter-spacing:1px; }
    .nm { font-size:12.5px; font-weight:600; fill:#1E293B; }
    .pt { font-size:11.5px; font-weight:700; }
    .ds { font-size:11px; fill:#64748B; }
    .fp { font-size:11.5px; fill:#94A3B8; }
    .card { fill:#FFFFFF; stroke:#E2E8F0; stroke-width:1; filter:url(#tp-shadow); }
    .dash { fill:#F8FAFC; stroke:#CBD5E1; stroke-width:1; stroke-dasharray:4 3; }
  </style>

  <rect width="1080" height="1140" fill="#FFFFFF"/>
  <rect width="1080" height="6" fill="url(#tp-top)"/>
  <text class="h1" x="40" y="44">Bone 开发环境运行时拓扑</text>
  <text class="sub" x="40" y="66">默认独立进程形态 · 端口真源：各模块 application.yml 与前端 vite.config.ts</text>
  <rect x="806" y="28" width="234" height="28" rx="14" fill="#F1F5F9"/>
  <circle cx="826" cy="42" r="5" fill="#10B981"/>
  <text class="pt" x="838" y="46" fill="#475569">G41 门禁守护 · 端口零漂移</text>

  <!-- 1 前端 -->
  <rect x="40" y="88" width="1000" height="212" rx="16" fill="url(#tp-front)" stroke="#BAE6FD"/>
  <rect x="40" y="104" width="4" height="180" rx="2" fill="#0EA5E9"/>
  <circle cx="66" cy="112" r="11" fill="#0EA5E9"/>
  <text x="66" y="116" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text class="bt" x="86" y="116" fill="#0369A1">前端 · BONE-FRONTEND / QIANKUN 微前端</text>

  <rect class="card" x="64" y="128" width="300" height="56" rx="10"/>
  <text class="nm" x="80" y="149">bone-shell 管理端</text>
  <rect x="80" y="156" width="56" height="20" rx="6" fill="#E0F2FE"/>
  <text class="pt" x="88" y="170" fill="#0369A1">:3000</text>
  <text class="ds" x="144" y="170">主应用 · 布局 / 登录 / 菜单</text>

  <rect class="dash" x="380" y="128" width="636" height="56" rx="10"/>
  <text class="ds" x="396" y="150">子应用经 qiankun 注册挂载，各自独立 dev server，可单独启动</text>
  <text class="ds" x="396" y="170">统一调用网关 :8888，不直连后端服务端口</text>

  <text class="bt" x="64" y="208" fill="#0369A1">领域微应用 × 9</text>

  <rect class="card" x="64" y="218" width="184" height="32" rx="8"/>
  <text class="nm" x="78" y="239">iam</text><text class="pt" x="232" y="239" text-anchor="end" fill="#0369A1">:3003</text>
  <rect class="card" x="260" y="218" width="184" height="32" rx="8"/>
  <text class="nm" x="274" y="239">metadata</text><text class="pt" x="428" y="239" text-anchor="end" fill="#0369A1">:3004</text>
  <rect class="card" x="456" y="218" width="184" height="32" rx="8"/>
  <text class="nm" x="470" y="239">masterdata</text><text class="pt" x="624" y="239" text-anchor="end" fill="#0369A1">:3005</text>
  <rect class="card" x="652" y="218" width="184" height="32" rx="8"/>
  <text class="nm" x="666" y="239">integration</text><text class="pt" x="820" y="239" text-anchor="end" fill="#0369A1">:3006</text>
  <rect class="card" x="848" y="218" width="184" height="32" rx="8"/>
  <text class="nm" x="862" y="239">system</text><text class="pt" x="1016" y="239" text-anchor="end" fill="#0369A1">:3007</text>

  <rect class="card" x="64" y="258" width="184" height="32" rx="8"/>
  <text class="nm" x="78" y="279">extension</text><text class="pt" x="232" y="279" text-anchor="end" fill="#0369A1">:3008</text>
  <rect class="card" x="260" y="258" width="184" height="32" rx="8"/>
  <text class="nm" x="274" y="279">generator</text><text class="pt" x="428" y="279" text-anchor="end" fill="#0369A1">:3009</text>
  <rect class="card" x="456" y="258" width="184" height="32" rx="8"/>
  <text class="nm" x="470" y="279">commerce</text><text class="pt" x="624" y="279" text-anchor="end" fill="#0369A1">:3012</text>
  <rect class="card" x="652" y="258" width="184" height="32" rx="8"/>
  <text class="nm" x="666" y="279">claim</text><text class="pt" x="820" y="279" text-anchor="end" fill="#0369A1">:3013</text>
  <rect class="dash" x="848" y="258" width="184" height="32" rx="8"/>
  <text class="ds" x="940" y="279" text-anchor="middle">其余领域按需新增</text>

  <line x1="540" y1="300" x2="540" y2="318" stroke="#94A3B8" stroke-width="2" marker-end="url(#tp-arrow)"/>

  <!-- 2 网关 -->
  <rect x="40" y="322" width="1000" height="82" rx="16" fill="url(#tp-gw)"/>
  <circle cx="66" cy="348" r="11" fill="#818CF8"/>
  <text x="66" y="352" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="86" y="352" font-size="13" font-weight="700" fill="#FFFFFF">bone-gateway</text>
  <text x="222" y="352" font-size="11.5" fill="#C7D2FE">Spring Cloud Gateway · 统一入口</text>
  <rect x="86" y="362" width="60" height="22" rx="6" fill="#4338CA" fill-opacity="0.7"/>
  <text class="pt" x="94" y="378" fill="#E0E7FF">:8888</text>
  <text x="158" y="378" font-size="12" fill="#A5B4FC">/api/v1/{domain}/** · JWT 校验 · CORS · 限流 · 路由到独立上游</text>
  <rect x="826" y="342" width="190" height="26" rx="13" fill="#4338CA" fill-opacity="0.55"/>
  <text class="pt" x="921" y="359" fill="#E0E7FF" text-anchor="middle">服务间不经网关</text>

  <line x1="540" y1="404" x2="540" y2="422" stroke="#94A3B8" stroke-width="2" marker-end="url(#tp-arrow)"/>

  <!-- 3 平台业务服务 -->
  <rect x="40" y="426" width="1000" height="196" rx="16" fill="url(#tp-cap)" stroke="#BBF7D0"/>
  <rect x="40" y="442" width="4" height="164" rx="2" fill="#10B981"/>
  <circle cx="66" cy="450" r="11" fill="#10B981"/>
  <text x="66" y="454" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text class="bt" x="86" y="454" fill="#047857">BONE-PLATFORM · 业务服务（各占独立进程）</text>

  <rect class="card" x="64" y="466" width="226" height="68" rx="11"/>
  <text class="nm" x="80" y="488">bone-iam</text>
  <rect x="80" y="498" width="56" height="20" rx="6" fill="#DCFCE7"/><text class="pt" x="88" y="512" fill="#047857">:8081</text>
  <text class="ds" x="144" y="512">账户 / 权限 / 租户</text>

  <rect class="card" x="306" y="466" width="226" height="68" rx="11"/>
  <text class="nm" x="322" y="488">bone-system</text>
  <rect x="322" y="498" width="56" height="20" rx="6" fill="#DCFCE7"/><text class="pt" x="330" y="512" fill="#047857">:8083</text>
  <text class="ds" x="386" y="512">菜单 / 参数 / 字典</text>

  <rect class="card" x="548" y="466" width="226" height="68" rx="11"/>
  <text class="nm" x="564" y="488">bone-masterdata</text>
  <rect x="564" y="498" width="56" height="20" rx="6" fill="#DCFCE7"/><text class="pt" x="572" y="512" fill="#047857">:8084</text>
  <text class="ds" x="628" y="512">主数据治理</text>

  <rect class="card" x="790" y="466" width="226" height="68" rx="11"/>
  <text class="nm" x="806" y="488">bone-integration</text>
  <rect x="806" y="498" width="56" height="20" rx="6" fill="#DCFCE7"/><text class="pt" x="814" y="512" fill="#047857">:8085</text>
  <text class="ds" x="870" y="512">连接器 / 编排</text>

  <rect class="card" x="64" y="542" width="226" height="68" rx="11"/>
  <text class="nm" x="80" y="564">bone-file</text>
  <rect x="80" y="574" width="56" height="20" rx="6" fill="#DCFCE7"/><text class="pt" x="88" y="588" fill="#047857">:8107</text>
  <text class="ds" x="144" y="588">文件 / 对象存储</text>

  <rect class="card" x="306" y="542" width="226" height="68" rx="11"/>
  <text class="nm" x="322" y="564">bone-blueprint</text>
  <rect x="322" y="574" width="56" height="20" rx="6" fill="#DCFCE7"/><text class="pt" x="330" y="588" fill="#047857">:8082</text>
  <text class="ds" x="386" y="588">DDD 参考实现</text>

  <rect class="card" x="548" y="542" width="226" height="68" rx="11"/>
  <text class="nm" x="564" y="564">synap-claim</text>
  <rect x="564" y="574" width="56" height="20" rx="6" fill="#DCFCE7"/><text class="pt" x="572" y="588" fill="#047857">:8087</text>
  <text class="ds" x="628" y="588">智能理赔域</text>

  <rect class="dash" x="790" y="542" width="226" height="68" rx="11"/>
  <text class="ds" x="806" y="566">notification / workflow</text>
  <text class="ds" x="806" y="586">无独立进程 · 随宿主装配</text>

  <line x1="540" y1="622" x2="540" y2="640" stroke="#94A3B8" stroke-width="2" marker-end="url(#tp-arrow)"/>

  <!-- 4 引擎与组合根 -->
  <rect x="40" y="644" width="1000" height="176" rx="16" fill="url(#tp-eng)" stroke="#FDE68A"/>
  <rect x="40" y="660" width="4" height="144" rx="2" fill="#F59E0B"/>
  <circle cx="66" cy="668" r="11" fill="#F59E0B"/>
  <text x="66" y="672" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text class="bt" x="86" y="672" fill="#B45309">BONE-ENGINE · 引擎与工具</text>

  <rect class="card" x="64" y="684" width="226" height="88" rx="11"/>
  <text class="nm" x="80" y="706">bone-metadata-server</text>
  <rect x="80" y="716" width="56" height="20" rx="6" fill="#FEF3C7"/><text class="pt" x="88" y="730" fill="#B45309">:9001</text>
  <text class="ds" x="144" y="730">含 workflow 路由</text>
  <rect x="80" y="742" width="96" height="18" rx="9" fill="#FEF3C7"/>
  <text class="pt" x="128" y="755" fill="#B45309" text-anchor="middle">可合并进程</text>

  <rect class="card" x="306" y="684" width="226" height="88" rx="11"/>
  <text class="nm" x="322" y="706">bone-extension-studio</text>
  <rect x="322" y="716" width="56" height="20" rx="6" fill="#FEF3C7"/><text class="pt" x="330" y="730" fill="#B45309">:8088</text>
  <text class="ds" x="386" y="730">扩展控制面</text>
  <text class="ds" x="322" y="754">bone-extension-sdk 以依赖嵌入宿主</text>

  <rect class="card" x="548" y="684" width="226" height="88" rx="11"/>
  <text class="nm" x="564" y="706">studio-generator</text>
  <rect x="564" y="716" width="56" height="20" rx="6" fill="#FEF3C7"/><text class="pt" x="572" y="730" fill="#B45309">:8086</text>
  <text class="ds" x="628" y="730">模式 A 代码生成</text>
  <text class="ds" x="564" y="754">生成可审计源码</text>

  <rect class="dash" x="790" y="684" width="226" height="88" rx="11"/>
  <text class="nm" x="806" y="706">bone-boot · 组合根</text>
  <text class="ds" x="806" y="728">把 metadata-server 与报销 / 采购</text>
  <text class="ds" x="806" y="746">业务模块合并到 :9001 单进程</text>
  <text class="ds" x="806" y="764">不进 compose 与 CI 镜像矩阵</text>

  <text class="ds" x="64" y="800">workflow 设计器经 /api/v1/workflow/** 由 metadata-server 承接；扩展 SDK 以依赖形式嵌入宿主，不单独起进程。</text>

  <line x1="540" y1="820" x2="540" y2="838" stroke="#94A3B8" stroke-width="2" marker-end="url(#tp-arrow)"/>

  <!-- 5 AI -->
  <rect x="40" y="842" width="1000" height="124" rx="16" fill="url(#tp-ai)" stroke="#DDD6FE"/>
  <rect x="40" y="858" width="4" height="92" rx="2" fill="#8B5CF6"/>
  <circle cx="66" cy="866" r="11" fill="#8B5CF6"/>
  <text x="66" y="870" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text class="bt" x="86" y="870" fill="#6D28D9">BONE-AI · 能力中台（当前未经主网关路由）</text>

  <rect class="card" x="64" y="882" width="226" height="56" rx="11"/>
  <text class="nm" x="80" y="903">bone-ai-app</text>
  <rect x="80" y="910" width="56" height="20" rx="6" fill="#EDE9FE"/><text class="pt" x="88" y="924" fill="#6D28D9">:8080</text>
  <text class="ds" x="144" y="924">可运行宿主</text>

  <rect class="dash" x="306" y="882" width="226" height="56" rx="11"/>
  <text class="ds" x="322" y="905">LLM 网关 · 模型接入与配额</text><text class="ds" x="322" y="925">库 · 无独立端口</text>

  <rect class="dash" x="548" y="882" width="226" height="56" rx="11"/>
  <text class="ds" x="564" y="905">RAG / 编排 / trace</text><text class="ds" x="564" y="925">接地守卫 · gen_ai.* 追踪</text>

  <rect class="dash" x="790" y="882" width="226" height="56" rx="11"/>
  <text class="ds" x="806" y="905">bone-ai-server 参考宿主</text><text class="ds" x="806" y="925">默认同为 :8080 · 择一启动</text>

  <text class="ds" x="64" y="956">AI 能力以库（SDK）形式随宿主装配：网关 / RAG / 编排 / trace 均无独立端口；宿主侧未在 bone-gateway 登记路由。</text>

  <line x1="540" y1="966" x2="540" y2="984" stroke="#94A3B8" stroke-width="2" marker-end="url(#tp-arrow)"/>

  <!-- 6 基础设施 -->
  <rect x="40" y="988" width="1000" height="84" rx="16" fill="url(#tp-infra)" stroke="#E2E8F0"/>
  <rect x="40" y="1004" width="4" height="52" rx="2" fill="#64748B"/>
  <circle cx="66" cy="1012" r="11" fill="#64748B"/>
  <text x="66" y="1016" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text class="bt" x="86" y="1016" fill="#475569">基础设施 · docker compose</text>

  <rect class="card" x="64" y="1024" width="300" height="38" rx="9"/>
  <text class="nm" x="80" y="1048">MySQL 8</text>
  <rect x="146" y="1032" width="56" height="20" rx="6" fill="#F1F5F9"/><text class="pt" x="154" y="1046" fill="#475569">:3306</text>
  <text class="ds" x="212" y="1048">bone-init.sql 初始化</text>

  <rect class="card" x="380" y="1024" width="300" height="38" rx="9"/>
  <text class="nm" x="396" y="1048">Redis 7</text>
  <rect x="458" y="1032" width="56" height="20" rx="6" fill="#F1F5F9"/><text class="pt" x="466" y="1046" fill="#475569">:6379</text>
  <text class="ds" x="524" y="1048">会话 / 缓存</text>

  <rect class="dash" x="696" y="1024" width="320" height="38" rx="9"/>
  <text class="ds" x="712" y="1048">可选 · RocketMQ / Nacos / Sentinel（按需接入）</text>

  <text class="fp" x="40" y="1100">部署形态：默认「独立进程」（每模块一个可执行 JAR + 网关）；bone-boot 可把元数据服务与业务模块合并到 :9001 单进程。</text>
  <text class="fp" x="40" y="1122">最小启动子集：MySQL + Redis + bone-iam(:8081) + bone-gateway(:8888) + bone-system(:8083) + bone-metadata-server(:9001) + bone-shell(:3000)；引导账号见 bone-init.sql。</text>
</svg>
