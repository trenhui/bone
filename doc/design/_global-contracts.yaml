# ---------------------------------------------------------------------------
# 跨模块边界契约（改本模块 API / 事件前必须先对照本节）
# ---------------------------------------------------------------------------
cross_module_contracts:
  - between: ["bone-gateway", "bone-iam"]
    api_contract: "网关不回源 IAM；用共享 JWT secret（环境变量 BONE_IAM_JWT_SECRET_KEY）本地 HMAC/RSA 验签后转发租户/角色 Header"
    shared_dtos: ["JwtPrincipal", "JwtConfig"]
    constraint_risk: "契约只靠共享密钥，无 REST 契约与版本协商；密钥轮换需网关与 IAM 同步发布。设计稿假设的 /api/iam/auth/verify 不存在，网关白名单中的 /api/v1/iam/auth/login 永不命中。"
  - between: ["bone-gateway", "全部后端模块"]
    api_contract: "路由前缀 /api/v1/{module}/** 由 bone-gateway/src/main/resources/application.yml 静态声明（无服务发现）"
    shared_dtos: []
    constraint_risk: "新增模块端点必须同步改网关路由，否则前端 404；路由表是隐式契约且无测试守护。"
  - between: ["bone-masterdata", "bone-metadata-server"]
    api_contract: "MetaEntityCatalogPortAdapter 用 JDBC 直读元数据目录表（跨上下文读）"
    shared_dtos: ["MetaEntityRow"]
    constraint_risk: "违反 P-6（跨上下文优先公开 API / Published Language，禁止共享表集成）；元数据目录表结构变更会静默打断主数据。已登记在 sdk-persistence-bypass-baseline.json（只可收缩）。"
  - between: ["bone-metadata-server", "bone-iam"]
    api_contract: "仅以 module_id / appId / userId 逻辑外键关联（IamModuleValidator / IamApplicationValidator），编译期零 import"
    shared_dtos: ["IamModuleRef", "IamApplicationRef", "IamAppRoleRef"]
    constraint_risk: "无外键、无事件补偿；IAM 侧删除应用/模块后元数据侧引用悬挂。"
  - between: ["bone-integration", "其他全部模块"]
    api_contract: "Outbox 事件信封 IntegrationEventEnvelope（模块私有 record，schemaVersion=1.0），topic 前缀 domain.integration.*"
    shared_dtos: ["IntegrationEventEnvelope"]
    constraint_risk: "全仓无订阅方（subscribed_events 全为空），Outbox 只投递不消费；未实现 IntegrationEnvelope 接口 → 无编译期契约，且事件侧无 breaking-change 检查。"
  - between: ["bone-extension-studio", "bone-iam"]
    api_contract: "ExtIamTenantDirectory 在扩展模块落一份 IAM 租户目录副本"
    shared_dtos: ["ExtIamTenantDirectory"]
    constraint_risk: "跨上下文数据复制，无同步机制与数据所有权声明（CORE-01）。"
  - between: ["bone-masterdata", "bone-metadata-*"]
    api_contract: "错误码跨域命名：MasterDataErrorCodes 定义 MD_META_ENTITY_NOT_FOUND / MD_META_ENTITY_NOT_PUBLISHED"
    shared_dtos: []
    constraint_risk: "元数据域错误码定义在主数据模块，前缀域归属混乱；元数据侧无 MetadataErrorCodes，只有裸字符串。"
  - between: ["bone-system", "bone-frontend/bone-shell"]
    api_contract: "Shell 直连 /api/v1/console/overview 与 /api/v1/console/quick-actions"
    shared_dtos: []
    constraint_risk: "doc1 规划的 dashboards / widgets / preferences 前后端均未实现，能力面与文档不一致（表 cnsl_dashboard_widget 已建但无聚合）。"
  - between: ["studio-generator", "bone-metadata-server"]
    api_contract: "generator 通过 /api/v1/generator/metadata-entity-snapshots 与 data-sources 读元数据与库结构"
    shared_dtos: ["CatalogMetaEntity", "CatalogMetaField", "GenTableMetadata", "GenColumnMetadata"]
    constraint_risk: "DatabaseMetadataGatewayAdapter 走原生 JDBC 读库结构（已在 baseline 登记）。"
  - between: ["bone-metadata-engine", "bone-metadata-server"]
    api_contract: "engine 以库形态内嵌，HTTP 入口在 server 的 /api/v1/runtime/**；事件为 Spring 进程内 ApplicationEvent"
    shared_dtos: ["EntityMetadata", "PlatformMetaEntity", "PlatformMetaField", "MetadataChangeEvent"]
    constraint_risk: "server 侧无订阅方 → MetadataChangeEvent 发布即丢弃；engine 的 JdbcRuntimeRecordService 绕过 SDK 执行层。"

