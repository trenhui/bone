<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>界面设计 · 交互稿</title>
<style>
  :root { --ink:#1f1f1f; --sub:#8c8c8c; --line:#e6eaf0; --bg:#f4f6f9; --pri:#1677ff; --pri-weak:#e6f4ff; --ok:#237804; --gold:#ad6800; --err:#cf1322; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: var(--ink); background: #eef1f5; font-size: 13px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--pri); outline-offset: 1px; }
  .shell { max-width: 1280px; margin: 14px auto 28px; padding: 0 16px; }
  .crumb { color: var(--sub); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .etabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); background: #fafafa; border-radius: 12px 12px 0 0; }
  .etabs button { border: 0; background: transparent; padding: 12px 14px; color: var(--sub); font-weight: 650; border-bottom: 2px solid transparent; }
  .etabs button.on { color: var(--pri); border-bottom-color: var(--pri); background: #fff; }
  .pad { padding: 12px; }
  .goal { background: #f7f9fc; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; display: flex; gap: 16px; align-items: center; }
  .goal b { display: block; }
  .goal ol { display: flex; gap: 14px; margin: 0; padding: 0; list-style: none; color: #595959; flex-wrap: wrap; }
  .goal li.ok { color: var(--ok); }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  .tag { border-radius: 6px; padding: 1px 8px; font-weight: 650; font-size: 12px; }
  .tag.warn { color: #d46b08; background: #fff7e6; }
  .tag.ok { color: var(--ok); background: #f6ffed; }
  .tag.gold { color: var(--gold); background: #fff7e6; }
  .muted { color: #595959; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; padding: 2px; background: #f5f5f5; border-radius: 8px; }
  .seg button, .btn { border: 0; background: transparent; border-radius: 6px; padding: 4px 10px; font-weight: 650; color: #595959; }
  .seg button.on { background: #fff; color: var(--pri); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .btn { border: 1px solid #d9d9d9; background: #fff; color: var(--ink); }
  .btn:hover { border-color: #91caff; color: var(--pri); }
  .btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
  .btn.coach { box-shadow: 0 0 0 3px rgba(22,119,255,.28); }
  .split { display: flex; min-height: 700px; }
  .left { width: 420px; min-width: 320px; border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; position: relative; background: #fff; }
  .modes { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
  .modes button { border: 0; background: #f5f5f5; border-radius: 6px; padding: 4px 8px; font-weight: 650; color: #595959; }
  .modes button.on { background: var(--pri-weak); color: var(--pri); }
  .cardlet { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 8px; background: #fff; }
  .cardlet.on { border-color: var(--pri); }
  .trace { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  textarea.json { width: 100%; min-height: 460px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; border: 1px solid #d9d9d9; border-radius: 8px; padding: 8px; }
  .grip { width: 10px; cursor: col-resize; }
  .right { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); overflow: auto; padding: 16px; }
  .body { overflow: auto; padding: 10px 10px 76px; flex: 1; }
  .sec { border: 1px solid #f0f0f0; border-radius: 10px; margin-bottom: 8px; }
  .sec.on { border-color: var(--pri); box-shadow: 0 0 0 3px rgba(22,119,255,.12); }
  .hd { display: flex; gap: 8px; align-items: center; padding: 7px 8px; background: #fafbfd; }
  .hd input { font-weight: 700; border: 1px solid transparent; border-radius: 4px; padding: 2px 4px; width: 140px; background: transparent; }
  .hd input:focus { border-color: #d9d9d9; background: #fff; }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 8px; padding: 6px 8px; border: 1px solid #f0f0f0; border-radius: 8px; cursor: pointer; }
  .row:hover { border-color: #91caff; }
  .row.on { border-color: var(--pri); background: var(--pri-weak); }
  .row.over { box-shadow: inset 0 2px 0 var(--pri); }
  .pill { font-size: 11px; color: #595959; background: #f5f5f5; border-radius: 4px; padding: 0 6px; }
  .insp { margin: 0 8px 8px; padding: 10px; background: #fafbfd; border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .insp .wide { grid-column: 1 / -1; }
  .insp span, .opt span { display: block; color: var(--sub); font-size: 11px; margin-bottom: 2px; }
  .insp input, .insp select, .opt input { width: 100%; border: 1px solid #d9d9d9; border-radius: 6px; padding: 4px 8px; }
  .suggest { margin: 8px; padding: 10px; border-radius: 8px; background: #f0f5ff; border: 1px solid #d6e4ff; }
  .dock { border-top: 1px solid var(--line); background: #fff; padding: 8px; max-height: 320px; overflow: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chips .chip { width: auto; margin: 0; }
  .drop { margin: 6px 8px 8px; padding: 8px; border: 1px dashed #91caff; border-radius: 8px; color: #595959; text-align: center; background: #f8fbff; }
  .drop.over, .hd.over, .row.over { background: #e6f4ff; }
  .chip { display: flex; width: 100%; text-align: left; gap: 8px; border: 1px solid #d6e4ff; background: #fff; border-radius: 8px; padding: 7px 8px; margin-top: 6px; }
  .chip:hover { border-color: var(--pri); }
  .idbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .sheet { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .mobile { width: 390px; margin: 0 auto; border: 10px solid #1f1f1f; border-radius: 28px; overflow: hidden; background: #fff; }
  .mobile .sheet { border: 0; border-radius: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .mobile .grid, .full { grid-column: 1 / -1; }
  .mobile .grid { display: grid; grid-template-columns: 1fr; }
  .fld { border-radius: 8px; padding: 4px; cursor: pointer; }
  .fld:hover { background: #f7fbff; }
  .fld.on { outline: 2px solid var(--pri); background: #f0f7ff; }
  .fld b { font-weight: 650; }
  .req { color: var(--err); }
  .fld input, .fld select { width: 100%; margin-top: 4px; border: 1px solid #d9d9d9; border-radius: 6px; padding: 5px 8px; }
  .note { color: var(--gold); font-size: 12px; margin-top: 4px; }
  .bad { color: var(--err); font-size: 12px; margin-top: 4px; }
  .good { color: var(--ok); font-size: 12px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border-bottom: 1px solid #f0f0f0; text-align: left; padding: 6px; }
  th { font-size: 12px; color: #595959; font-weight: 650; }
  td input { width: 100%; border: 1px solid #d9d9d9; border-radius: 4px; padding: 3px 6px; }
  .tabs span { display: inline-block; padding: 6px 10px; cursor: pointer; color: #595959; }
  .tabs span.on { color: var(--pri); font-weight: 700; box-shadow: inset 0 -2px 0 var(--pri); }
  .ph { border: 1px dashed #d9d9d9; border-radius: 8px; padding: 12px; color: var(--sub); background: #fafafa; margin-top: 4px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #1f1f1f; color: #fff; border-radius: 8px; padding: 8px 14px; opacity: 0; transition: .2s; max-width: 520px; }
  .toast.show { opacity: 1; }
  .callout { padding: 8px 10px; border-radius: 8px; margin-top: 8px; }
  .callout.bad { background: #fff1f0; color: var(--err); }
  .callout.ok { background: #f6ffed; color: var(--ok); }
</style>
</head>
<body>
<div class="shell">
  <div class="crumb">
    <span>元数据</span>
    <div class="seg" id="objects"></div>
    <span>界面 · 交互稿，不会写入真实数据</span>
  </div>
  <div class="card">
    <div class="etabs" id="etabs">
      <button type="button" data-page="design" class="on">界面</button>
      <button type="button" data-page="data">线上页面</button>
      <button type="button" data-page="publish">发布</button>
    </div>
    <div class="pad">
      <div class="goal" id="goal"></div>
      <div id="design">
        <div class="bar" id="bar"></div>
        <div class="split">
          <aside class="left">
            <div class="modes" id="modes"></div>
            <div class="body" id="outline"></div>
            <div class="dock" id="dock" hidden></div>
          </aside>
          <div class="grip" id="grip"></div>
          <main class="right" id="stage"></main>
        </div>
      </div>
      <div id="other" hidden></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2200); }
const clone = (o) => JSON.parse(JSON.stringify(o));

function fld(code, extra) { return Object.assign({ fieldCode: code, label: "" }, extra); }
function sec(id, title, codes, patch) {
  return { id, title, controls: codes.map((c) => ({ ...(patch?.[c] || {}), fieldCode: c, label: "" })) };
}

const CATALOG = {
  expense: () => scenarioExpense(),
  purchase: () => scenarioPurchase(),
  claim: () => scenarioClaim()
};

function scenarioExpense() {
  const names = {
    claim_no: "报销单号", applicant: "申请人", department: "部门", cost_center: "成本中心",
    expense_date: "费用日期", title: "事由", invoice_type: "发票类型", amount: "价税合计",
    tax_amount: "税额", tax_no: "纳税人识别号", lines: "费用明细", files: "发票附件",
    approver: "审批人", remark: "备注", project: "项目"
  };
  const opts = {
    invoice_type: { NORMAL: "普通发票", SPECIAL: "增值税专用发票" },
    department: { RD: "研发中心", SALES: "销售中心", FIN: "财务部" },
    cost_center: { CC01: "研发-平台", CC02: "销售-华东", CC09: "管理-公共" },
    approver: { li: "李四 · 部门负责人", zhou: "周敏 · 财务经理" },
    project: { P1: "华东客户", P2: "内部培训" }
  };
  const base = {
    claim_no: { readonly: true }, tax_amount: { hidden: true }, tax_no: { hidden: true }, amount: { props: { precision: 2 } }
  };
  return {
    id: "expense", objectName: "费用报销", audience: "员工",
    fillTitle: "填写报销单", viewTitle: "查看报销单",
    names, opts,
    form: {
      fill: [
        sec("base", "基本信息", ["claim_no", "applicant", "department", "cost_center", "expense_date", "title"], base),
        sec("money", "发票", ["invoice_type", "amount", "tax_amount", "tax_no"], base),
        sec("lines", "费用明细", ["lines"], base),
        sec("file", "附件", ["files"], base),
        sec("appr", "审批", ["remark"], base)
      ],
      view: [sec("sum", "报销摘要", ["claim_no", "applicant", "title", "amount", "invoice_type"], { claim_no: { readonly: true }, applicant: { readonly: true }, title: { readonly: true }, amount: { readonly: true }, invoice_type: { readonly: true } })]
    },
    rules: [{
      id: "vat", name: "专票要填税号和税额", on: true, when: "发票类型是增值税专用发票",
      test: { field: "invoice_type", op: "eq", value: "SPECIAL" },
      effects: { tax_no: { show: true, required: true, notice: "专票必须填写纳税人识别号" }, tax_amount: { show: true } }
    }],
    policyRule: {
      id: "big", name: "超过 5000 元指定审批人", on: true, when: "价税合计超过 5000 元",
      test: { field: "amount", op: "gt", value: 5000 },
      effects: { approver: { show: true, required: true, notice: "单笔超过 5000 元，需要部门负责人审批" } }
    },
    policy: {
      title: "公司新制度：单笔超过 5000 元，必须指定审批人。",
      hint: "专票税号、明细合计已经在线上生效，这次只要补审批。",
      done: "费用报销的界面已经按新制度配好。",
      doneHint: "发布之后，员工新开的超标单据才会要求指定审批人。可以再换采购申请或理赔报案，设计器是同一套。",
      steps: ["加上审批人", "用一笔超过 5000 的单据看效果", "保存", "到「线上页面」核对"],
      sectionId: "appr", field: "approver",
      suggestTitle: "超过 5000 元谁来批？",
      suggestBody: "加上审批人后，只有超标单据才必须填写。",
      saveToast: "已保存。去「线上页面」确认他们暂时还没有审批人。",
      publishToast: "已发布。员工新开的超标单据会要求审批人。",
      publishBody: "这次会多出一个「审批人」。只有价税合计超过 5000 元时才必填。",
      dataOld: "你加上的审批人还没有发布，所以这里没有。",
      dataNone: "线上还没有审批人字段。",
      dataLive: "线上已经要求超标单据指定审批人。",
      tryToast: "已加上。右侧改成一笔 8600 的专票，审批人出现了，可以直接提交看结果。"
    },
    roles: [
      { id: "wang", label: "王五 · 申请人" },
      { id: "li", label: "李四 · 审批人", openList: true, decide: ["同意", "退回"], readonly: ["amount"] }
    ],
    values: {
      claim_no: "BX20261016018", applicant: "王五", department: "SALES", cost_center: "CC02",
      expense_date: "2026-10-16", title: "华东客户拜访", invoice_type: "NORMAL", amount: "1280.00",
      tax_amount: "147.20", tax_no: "", approver: "", remark: "", project: "",
      lines: [{ date: "10-15", cat: "交通", amount: "1280.00", note: "高铁 上海-杭州" }]
    },
    samples: [
      { id: "normal", label: "试一笔普通差旅", values: { title: "华东客户拜访", invoice_type: "NORMAL", amount: "1280.00", tax_no: "", approver: "" }, lines: [{ date: "10-15", cat: "交通", amount: "1280.00", note: "高铁 上海-杭州" }] },
      { id: "big", label: "试一笔 8600 的招待", values: { title: "客户晚宴", invoice_type: "SPECIAL", amount: "8600.00", tax_amount: "991.15", tax_no: "91310000MA1FL0XX1X", approver: "li" }, lines: [{ date: "10-16", cat: "招待", amount: "8600.00", note: "客户晚宴" }] }
    ],
    policySample: "big",
    lines: { field: "lines", cols: [{ k: "date", label: "日期" }, { k: "cat", label: "类别" }, { k: "amount", label: "金额" }, { k: "note", label: "说明" }], sumField: "amount", sumName: "价税合计" },
    files: { field: "files", live: "这里会上传发票影像。演示不接收真实文件。", quiet: "附件在提交时上传" },
    wide: ["lines", "files", "title", "remark"],
    money: ["amount"],
    palette: ["approver", "project"],
    keep: ["lines", "amount"],
    keepToast: "金额和明细要留在表单上",
    sel: { sec: 1, ci: 1 },
    list: {
      note: "待我审批只显示需要这个人处理的单据。",
      tabs: [
        { id: "approve", label: "待我审批", by: "approver" },
        { id: "mine", label: "我提交的", by: "owner" },
        { id: "all", label: "全部" }
      ],
      cols: [{ key: "title", label: "事由" }, { key: "applicant", label: "申请人" }, { key: "amount", label: "金额" }, { key: "status", label: "状态" }],
      rows: [
        { title: "华东客户拜访", applicant: "王五", amount: "1,280.00", status: "草稿", owner: "wang", approver: "li" },
        { title: "客户晚宴", applicant: "王五", amount: "8,600.00", status: "待审批", owner: "wang", approver: "li" },
        { title: "测试机采购", applicant: "赵六", amount: "32,000.00", status: "待审批", owner: "zhao", approver: "wang" },
        { title: "新员工培训", applicant: "王五", amount: "2,400.00", status: "已通过", owner: "wang", approver: "li" }
      ]
    }
  };
}

function scenarioPurchase() {
  const names = {
    pr_no: "申请单号", requester: "申请人", department: "申请部门", need_date: "需求日期", title: "采购事由",
    buy_type: "采购类型", vendor: "建议供应商", amount: "预算金额", urgent_reason: "紧急原因",
    lines: "采购明细", files: "报价附件", finance: "财务会签人", remark: "备注", contract: "框架合同"
  };
  const opts = {
    department: { IT: "信息技术部", ADMIN: "行政部", MFG: "制造部" },
    buy_type: { STANDARD: "标准采购", URGENT: "紧急采购" },
    vendor: { V1: "联想企业购", V2: "京东企业", V3: "指定供应商" },
    finance: { ma: "马丽 · 采购经理", qian: "钱程 · 财务负责人" },
    contract: { C0: "无框架", C9: "2026 办公集采" }
  };
  const base = { pr_no: { readonly: true }, urgent_reason: { hidden: true }, amount: { props: { precision: 2 } } };
  return {
    id: "purchase", objectName: "采购申请", audience: "申请人",
    fillTitle: "填写采购申请", viewTitle: "查看采购申请",
    names, opts,
    form: {
      fill: [
        sec("base", "基本信息", ["pr_no", "requester", "department", "need_date", "title"], base),
        sec("buy", "采购内容", ["buy_type", "vendor", "amount", "urgent_reason"], base),
        sec("lines", "明细", ["lines"], base),
        sec("file", "附件", ["files"], base),
        sec("sign", "会签", ["remark"], base)
      ],
      view: [sec("sum", "申请摘要", ["pr_no", "requester", "title", "amount", "buy_type"], { pr_no: { readonly: true }, requester: { readonly: true }, title: { readonly: true }, amount: { readonly: true }, buy_type: { readonly: true } })]
    },
    rules: [{
      id: "urgent", name: "紧急采购要写原因", on: true, when: "采购类型是紧急采购",
      test: { field: "buy_type", op: "eq", value: "URGENT" },
      effects: { urgent_reason: { show: true, required: true, notice: "紧急采购需要说明为什么不能走标准周期" } }
    }],
    policyRule: {
      id: "budget", name: "超过 10 万财务会签", on: true, when: "预算金额超过 10 万",
      test: { field: "amount", op: "gt", value: 100000 },
      effects: { finance: { show: true, required: true, notice: "预算超过 10 万，需要财务负责人会签" } }
    },
    policy: {
      title: "采购制度：预算超过 10 万，必须指定财务会签人。",
      hint: "紧急原因和明细合计已经在线上生效，这次只要补会签。",
      done: "采购申请的界面已经按新制度配好。",
      doneHint: "发布之后，新开的大额申请才会要求财务会签。可以再换费用报销或理赔报案。",
      steps: ["加上财务会签人", "用一笔超过 10 万的申请看效果", "保存", "到「线上页面」核对"],
      sectionId: "sign", field: "finance",
      suggestTitle: "超过 10 万谁来会签？",
      suggestBody: "加上财务会签人后，只有大额申请才必须填写。",
      saveToast: "已保存。去「线上页面」确认他们暂时还没有财务会签人。",
      publishToast: "已发布。新开的大额采购会要求财务会签。",
      publishBody: "这次会多出一个「财务会签人」。只有预算超过 10 万时才必填。",
      dataOld: "你加上的财务会签人还没有发布，所以这里没有。",

    state.values[key] = t.value; state.msg = null; renderStage(); renderGoal();
    const n = document.querySelector(`[data-val="${CSS.escape(key)}"]`);
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) { /* 下拉没有光标 */ } }
    return;
  }
  if (t.dataset.line != null) {
    lineRowsOf(state.values)[+t.dataset.line][t.dataset.k] = t.value;
    const box = t.closest("table")?.parentElement?.querySelector(".good, .bad");
    if (box) {
      const sum = lineSumOf(state.values);
      const tol = Number(bagSubmit().tolerance);
      const same = !bagSubmit().on || Math.abs(sum - (Number(state.values[state.lines.sumField]) || 0)) <= (Number.isNaN(tol) ? 0.01 : tol);
      box.className = same ? "good" : "bad";
      box.textContent = `明细合计 ${sum.toFixed(2)}，${same ? `与${state.lines.sumName}一致` : (bagSubmit().message || "不一致")}`;
    }
    return;
  }
  if (!t.dataset.bind || t.dataset.bind === "newcode") return;
  if (t.dataset.bind === "q") {
    const pos = t.selectionStart;
    state.fieldQuery = t.value;
    renderDock();
    const n = $("#q");
    if (n) { n.focus(); n.setSelectionRange(pos, pos); }
    return;
  }
  if (t.dataset.bind === "json") { state.jsonText = t.value; return; }
  if (t.dataset.once !== "1" && t.dataset.bind !== "col") { push(); t.dataset.once = "1"; t.addEventListener("blur", () => { t.dataset.once = ""; }, { once: true }); }
  const c = cur();
  if (t.dataset.bind === "label" && c) { c.label = t.value; renderStage(); renderBar(); renderGoal(); }
  if (t.dataset.bind === "ph" && c) { c.placeholder = t.value; renderStage(); }
  if (t.dataset.bind === "precision" && c) { c.props = { precision: Number(t.value) || 0 }; renderBar(); }
  if (t.dataset.bind === "sec") { secs()[+t.dataset.si].title = t.value; renderStage(); renderBar(); }
  if (t.dataset.bind === "opt" && c) { state.labels[c.fieldCode][t.dataset.code] = t.value; renderStage(); renderBar(); }
  if (t.dataset.bind === "rule-name") { state.rules[+t.dataset.i].name = t.value; renderBar(); }
  if (t.dataset.bind === "rule-value") { state.rules[+t.dataset.i].test.value = t.value; touchRule(+t.dataset.i); renderStage(); renderBar(); }
  if (t.dataset.bind === "fx-note") { state.rules[+t.dataset.i].effects[t.dataset.code].notice = t.value; renderStage(); }
  if (t.dataset.bind === "act-label") { state.actions[+t.dataset.i].label = t.value; renderStage(); renderBar(); }
  if (t.dataset.bind === "act-confirm") state.actions[+t.dataset.i].confirm = t.value;
  if (t.dataset.bind === "sum-tol") { state.submit.tolerance = t.value; renderStage(); renderBar(); }
  if (t.dataset.bind === "sum-msg") { state.submit.message = t.value; renderBar(); }
  if (t.dataset.bind === "dict") { state.labels[t.dataset.field][t.dataset.code] = t.value; renderStage(); renderBar(); }
  if (t.dataset.bind === "tab") { state.listTabs[+t.dataset.i].label = t.value; applyListTabs(); renderStage(); renderBar(); }
});
document.body.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.val) { state.values[t.dataset.val] = t.value; state.msg = null; renderStage(); renderGoal(); }
  if (t.dataset.bind === "col") { state.listCols[t.dataset.col] = t.checked; renderStage(); renderBar(); }
  if (t.dataset.bind === "rule-on") { push(); state.rules[+t.dataset.i].on = t.checked; render(); }
  if (t.dataset.bind === "rule-field") {
    push();
    const rule = state.rules[+t.dataset.i];
    rule.test.field = t.value;
    rule.test.value = state.labels[t.value] ? Object.keys(state.labels[t.value])[0] : "";
    touchRule(+t.dataset.i);
    render();
  }
  if (t.dataset.bind === "rule-op") { push(); state.rules[+t.dataset.i].test.op = t.value; touchRule(+t.dataset.i); render(); }
  if (t.dataset.bind === "rule-value") { push(); state.rules[+t.dataset.i].test.value = t.value; touchRule(+t.dataset.i); render(); }
  if (t.dataset.bind === "fx-field") {
    push();
    const rule = state.rules[+t.dataset.i];
    const effect = rule.effects[t.dataset.from];
    delete rule.effects[t.dataset.from];
    rule.effects[t.value] = effect;
    render();
  }
  if (t.dataset.bind === "fx-show") { push(); state.rules[+t.dataset.i].effects[t.dataset.code].show = t.checked; render(); }
  if (t.dataset.bind === "fx-req") { push(); state.rules[+t.dataset.i].effects[t.dataset.code].required = t.checked; render(); }
  if (t.dataset.bind === "act-view") { push(); state.actions[+t.dataset.i].view = t.value; render(); }
  if (t.dataset.bind === "act-role") { push(); toggleIn(state.actions[+t.dataset.i].roles, t.dataset.role, t.checked); render(); }
  if (t.dataset.bind === "var-list") { push(); state.variants[+t.dataset.i].openList = t.checked; render(); }
  if (t.dataset.bind === "var-ro") { push(); toggleIn(state.variants[+t.dataset.i].readonly, t.dataset.code, t.checked); render(); }
  if (t.dataset.bind === "var-hide") { push(); toggleIn(state.variants[+t.dataset.i].hidden, t.dataset.code, t.checked); render(); }
  if (t.dataset.bind === "dict-hide") {
    push();
    const field = t.dataset.field;
    state.dictHidden[field] = state.dictHidden[field] || {};
    state.dictHidden[field][t.dataset.code] = t.checked;
    if (!t.checked) delete state.dictHidden[field][t.dataset.code];
    render();
  }
  if (t.dataset.bind === "sum-on") { push(); state.submit.on = t.checked; render(); }
  if (t.id === "who") {
    state.who = t.value;
    const variant = state.variants.find((v) => v.roleId === t.value);
    if (variant?.openList) {
      state.view = "list";
      state.listTab = state.list.tabs[0].id;
      const who = state.roles.find((r) => r.id === t.value);
      toast(`${shortName(who)}先看待办。要改填写页，再点「填写」。`);
    }
    render();
  }
});
let drag = null;
document.body.addEventListener("dragstart", (e) => {
  const chip = e.target.closest("[data-add]");
  const row = e.target.closest("#outline .row");
  if (chip) { drag = { code: chip.dataset.add }; document.body.classList.add("dragging"); return; }
  if (row && row.dataset.ci != null) { drag = { si: +row.dataset.si, ci: +row.dataset.ci }; document.body.classList.add("dragging"); }
});
document.body.addEventListener("dragend", () => { document.body.classList.remove("dragging"); });
document.body.addEventListener("dragover", (e) => {
  const zone = e.target.closest("#outline [data-sec], #outline .row");
  if (!zone || !drag) return;
  e.preventDefault();
  zone.classList.add("over");
});
document.body.addEventListener("dragleave", (e) => e.target.closest("#outline [data-sec], #outline .row")?.classList.remove("over"));
document.body.addEventListener("drop", (e) => {
  const zone = e.target.closest("#outline [data-sec], #outline .row");
  if (!zone || !drag) return;
  e.preventDefault();
  const si = zone.dataset.ci != null ? +zone.dataset.si : +zone.dataset.sec;
  const ci = zone.dataset.ci != null ? +zone.dataset.ci : null;
  if (Number.isNaN(si)) { drag = null; return; }
  if (drag.code) {
    if (usedCodes().has(drag.code)) { drag = null; return; }
    push();
    state.sel = { sec: si };
    place(drag.code, drag.code === state.policy.field, ci);
  } else if (drag.si != null) {
    const from = state.form.fill[drag.si]?.controls;
    const to = state.form.fill[si]?.controls;
    if (!from || !to) { drag = null; return; }
    let at = ci == null ? to.length : ci;
    if (drag.si === si && (ci == null || drag.ci === at)) { drag = null; render(); return; }
    push();
    const [it] = from.splice(drag.ci, 1);
    if (from === to && drag.ci < at) at -= 1;
    to.splice(at, 0, it);
    state.sel = { sec: si, ci: Math.max(0, Math.min(at, to.length - 1)) };
  }
  drag = null;
  render();
});
let resizing = false;
$("#grip").onmousedown = () => { resizing = true; };
window.addEventListener("mouseup", () => { resizing = false; });
window.addEventListener("mousemove", (e) => {
  if (!resizing) return;
  const left = $(".left");
  left.style.width = Math.max(300, Math.min(560, e.clientX - left.parentElement.getBoundingClientRect().left)) + "px";
});
window.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); }
  if (e.key === "Escape") { state.pop = false; renderDock(); }
});
window.addEventListener("beforeunload", (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ""; } });
openObject("expense");
