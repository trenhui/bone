function onAction(a){
  const msgs=runSubmitRules();
  const errs=msgs.filter(m=>m.level==="ERROR");
  if(errs.length){
    toast("提交被拦截："+errs[0].message);
    showSubmitMsgs(msgs);
    return;
  }
  if(a.confirm){
    if(!confirm(a.confirm.title+"\n"+a.confirm.content))return;
  }
  if(a.decisionKind==="hitl"){toast("执行 HITL 动作："+a.actionCode+"（演示）");}
  else toast("执行动作："+a.actionCode);
  const extras=[];
  if(a.decisionKind==="hitl"){
    // HITL 诚实回显：把协议参数摊开（对标 n8n 人工审批节点的"待处理输入"展示），演示不真实执行
    const bits=[];
    if(a.reasonTypes&&a.reasonTypes.length)bits.push("reasonTypes=["+a.reasonTypes.join(" / ")+"]");
    if(a.maxRounds!=null)bits.push("maxRounds="+a.maxRounds);
    if(a.confirm)bits.push("需二次确认「"+a.confirm.title+"」");
    extras.push({level:"ok",message:"HITL "+a.actionCode+"："+(bits.length?bits.join("，"):"无附加参数")+"（演示，未真实执行）"});
  }
  const all=extras.concat(msgs);
  showSubmitMsgs(all.length?all:[{level:"ok",message:"校验通过，可提交"}]);
}
let _msgBox=null;
function showSubmitMsgs(msgs){
  if(!_msgBox){_msgBox=el("div");}

  else{

      const d=el("div",{class:"submit-msg "+(m.level==="ERROR"?"err":m.level==="WARNING"?"warn":"ok")},
        (m.level==="ERROR"?"✕ ":"⚠ ")+(m.code?"["+m.code+"] ":"")+m.message);
      _msgBox.append(d);
    });
  }
  const pv=$("#preview");
  const old=$("#submitMsgs");if(old)old.remove();
  _msgBox.id="submitMsgs";
  _msgBox.classList.remove("fld-enter");void _msgBox.offsetWidth;_msgBox.classList.add("fld-enter");

}

/* ============================================================
 *  预览入口
 * ============================================================ */
function ctrlSig(c){return JSON.stringify({k:c.controlKind||"INPUT",l:c.labelOverride||"",ro:!!c.readonly,vis:c.visible!==false?1:0,p:c.props||{}});}
function ctrlChgNote(b,c){
  const out=[];
  if((b.controlKind||"INPUT")!==(c.controlKind||"INPUT"))out.push("类型");
  if((b.labelOverride||"")!==(c.labelOverride||""))out.push("显示名");
  if(!!b.readonly!==!!c.readonly)out.push("只读");
  if((b.visible!==false)!==(c.visible!==false))out.push("可见性");
  if(JSON.stringify(b.props||{})!==JSON.stringify(c.props||{}))out.push("属性");
  return out.join("、")||"未知差异";
}
function diffSections(baseSecs,varSecs){
  // base vs 变体分区对照：add/del/mod/same；控件级按 fieldCode 对齐
  const bm=new Map((baseSecs||[]).map(s=>[s.id,s]));
  const ids=[...(baseSecs||[]).map(s=>s.id)];
  (varSecs||[]).forEach(s=>{if(!bm.has(s.id))ids.push(s.id);});
  const vm=new Map((varSecs||[]).map(s=>[s.id,s]));
  return ids.map(id=>{
    const b=bm.get(id),v=vm.get(id);
    if(!b)return{id,title:v.title||id,status:"add",base:null,vs:v,added:(v.controls||[]).map(c=>c.fieldCode),removed:[],changed:[],titleChg:false};
    if(!v)return{id,title:b.title||id,status:"del",base:b,vs:null,added:[],removed:(b.controls||[]).map(c=>c.fieldCode),changed:[],titleChg:false};
    const bcm=new Map((b.controls||[]).map(c=>[c.fieldCode,c]));
    const vcm=new Map((v.controls||[]).map(c=>[c.fieldCode,c]));
    const added=[],removed=[],changed=[];
    (v.controls||[]).forEach(c=>{
      if(!bcm.has(c.fieldCode))added.push(c.fieldCode);
      else if(ctrlSig(bcm.get(c.fieldCode))!==ctrlSig(c))changed.push({fc:c.fieldCode,note:ctrlChgNote(bcm.get(c.fieldCode),c)});
    });
    (b.controls||[]).forEach(c=>{if(!vcm.has(c.fieldCode))removed.push(c.fieldCode);});
    const titleChg=(b.title||"")!==(v.title||"");
    return{id,title:v.title||b.title||id,status:(added.length||removed.length||changed.length||titleChg)?"mod":"same",
      base:b,vs:v,added,removed,changed,titleChg};
  });
}
function diffTag(status){
  return status==="add"?el("span",{class:"vtag ok"},"新增")
    :status==="del"?el("span",{class:"vtag err"},"删除")
    :status==="mod"?el("span",{class:"vtag warn"},"变更")
    :el("span",{class:"vtag",style:"background:var(--line2);color:var(--sub)"},"一致");
}
function diffCell(side,sec,r,isVar){
  const cell=el("div",{class:"dsec"+(r.status==="same"?"":" "+r.status)});
  cell.append(el("div",{class:"dsec-side"},side));
  if(!sec){cell.append(el("div",{class:"dempty"},isVar?"变体中已移除":"base 无此分区"));return cell;}
  cell.append(el("div",{class:"dsec-hd"},sec.title||sec.id,diffTag(r.status)));
  cell.append(el("div",{class:"hint"},"kind="+(sec.kind||"form")+" · id="+sec.id));
  if(r.titleChg&&isVar)cell.append(el("div",{class:"hint"},"标题："+(r.base.title||"")+" → "+(r.vs.title||"")));
  const box=el("div",{class:"dchips"});
  (sec.controls||[]).forEach(c=>{
    let cls="dchip",title=(c.labelOverride||c.fieldCode)+" · "+(c.controlKind||"INPUT");
    const ch=r.changed.find(x=>x.fc===c.fieldCode);
    if(!isVar&&r.removed.includes(c.fieldCode)){cls+=" del";title+="（变体中删除）";}
    else if(isVar&&r.added.includes(c.fieldCode)){cls+=" add";title+="（变体新增）";}
    else if(ch){cls+=" chg";title+="（变更："+ch.note+"）";}
    box.append(el("span",{class:cls,title:title},c.fieldCode));
  });
  if(!(sec.controls||[]).length)box.append(el("span",{class:"hint"},"（空分区）"));
  cell.append(box);
  return cell;
}
function renderDiffView(){
  // GitHub split diff 式左右对照：左 base，右当前变体（配置评审用）
  const vv=resolveVariant();
  const root=el("div");
  if(!vv){root.append(el("div",{class:"empty"},"当前无命中变体（自动裁决为空且未手动强制），切身份或手动强制一个变体后再对比"));return root;}
  const rows=diffSections((state.schema.views.form||{}).sections,(vv.views&&vv.views.form||{}).sections);
  let nAdd=0,nDel=0,nMod=0,cAdd=0,cDel=0,cChg=0;
  rows.forEach(r=>{
    if(r.status==="add"){nAdd++;cAdd+=r.added.length;}
    else if(r.status==="del"){nDel++;cDel+=r.removed.length;}
    else if(r.status==="mod"){nMod++;cAdd+=r.added.length;cDel+=r.removed.length;cChg+=r.changed.length;}
  });
  root.append(el("div",{class:"diff-sum"},
    el("b",{},"base ↔ "+vv.key),
    el("span",{class:"meta",html:nAdd+" 新增分区 · "+nDel+" 删除分区 · "+nMod+" 变更分区"}),
    el("span",{class:"meta",html:"控件 +"+cAdd+" −"+cDel+" ~"+cChg})));
  const lg=el("div",{class:"diff-legend"});
  [["add","新增"],["del","删除"],["mod","变更"],["same","一致"]].forEach(([k,lab])=>lg.append(el("i",{},el("span",{class:"dot "+k}),lab)));
  lg.append(el("span",{},"分区排序变化暂不标出"));
  root.append(lg);
  const vside=vv.key+(state.variantKey?"（手动强制）":"（自动裁决 ⚡）");
  rows.forEach(r=>{
    const g=el("div",{class:"diff-grid"});
    g.append(diffCell("BASE",r.base,r,false),diffCell(vside,r.vs,r,true));
    root.append(g);
  });
  return root;
}

  );
  pv.append(head);

/* ---------- 撤销 / 重做（快照栈） ---------- */
let _histLock=false;
function pushHistory(){
  if(_histLock)return;
  const snap=JSON.stringify(state.schema);
  if(state.history.length && state.history[state.historyIndex]===snap)return;
  state.history=state.history.slice(0,state.historyIndex+1);
  state.history.push(snap);
  if(state.history.length>80)state.history.shift();
  state.historyIndex=state.history.length-1;
  updateUndoRedo();
}
let _histT=null;
function pushHistoryDebounced(){clearTimeout(_histT);_histT=setTimeout(pushHistory,700);}
function updateUndoRedo(){
  const u=$("#undoBtn"),r=$("#redoBtn");
  if(u)u.disabled=state.historyIndex<=0;
  if(r)r.disabled=state.historyIndex>=state.history.length-1;
}
function applyHistory(){
  state.schema=JSON.parse(state.history[state.historyIndex]);
  _histLock=true;renderConfig();renderPreview();updateUndoRedo();_histLock=false;
  state.dirty=true;updateDraftBadge();
  if(state.selected&&state.selected.type==="json"){const ta=$("#json");if(ta)ta.value=JSON.stringify(state.schema,null,2);}
}
function undo(){if(state.historyIndex<=0)return;state.historyIndex--;applyHistory();toast("已撤销");}
function redo(){if(state.historyIndex>=state.history.length-1)return;state.historyIndex++;applyHistory();toast("已重做");}

/* ---------- 拖拽排序（仅手柄可拖，避免干扰输入框） ---------- */
let _drag=null;
function makeDraggable(row,arr,i,grip){
  const g=grip||row;
  g.draggable=true;
  g.classList.add("draggable-grip");
  g.addEventListener("dragstart",e=>{
    _drag={arr,i};g.classList.add("dragging");
    try{e.dataTransfer.setData("text/plain",String(i));}catch(err){}
  });
  g.addEventListener("dragend",()=>{
    _drag=null;g.classList.remove("dragging");
    $$(".drag-over").forEach(n=>n.classList.remove("drag-over"));
  });
  row.addEventListener("dragover",e=>{
    if(!_drag||_drag.arr!==arr)return;
    e.preventDefault();row.classList.add("drag-over");
  });
  row.addEventListener("dragleave",()=>row.classList.remove("drag-over"));
  row.addEventListener("drop",e=>{
    if(!_drag||_drag.arr!==arr)return;
    e.preventDefault();row.classList.remove("drag-over");
    const from=_drag.i;_drag=null;
    if(from===i)return;
    const it=arr.splice(from,1)[0];arr.splice(i,0,it);
    pushHistory();renderConfig();syncOut();toast("已调整顺序");
  });
}
/* 复制一项：fieldCode/id 加 _copy，避免同名冲突 */
function hDup(arr,i){
  const it=clone(arr[i]);
  if(it.fieldCode)it.fieldCode=it.fieldCode+"_copy";
  if(it.id)it.id=it.id+"_copy";
  if(it.title)it.title=it.title+" 副本";
  arr.splice(i+1,0,it);
  pushHistory();renderConfig();syncOut();toast("已复制");
}

let _pal=null;
function newControl(kind){
  const cfg=CONTROLS[kind]||{};
  const c={fieldCode:"new_"+String(kind).toLowerCase()+"_"+Date.now().toString().slice(-4),controlKind:kind};
  if(cfg.defaults)c.props=clone(cfg.defaults);
  return c;
}
/* 插入模板分区：自动规避 fieldCode / id 冲突（重复 fieldCode 是协议级 ERROR） */
function insertSectionTemplate(view,t){
  const taken=new Set(),ids=new Set();
  (view.sections||[]).forEach(s=>{
    if(s.id)ids.add(s.id);
    (s.controls||[]).forEach(c=>{if(c.fieldCode)taken.add(c.fieldCode);});
  });
  const sec=t.build();
  let sid=sec.id,k=2;
  while(ids.has(sid))sid=sec.id+"_"+(k++);
  sec.id=sid;
  (sec.controls||[]).forEach(c=>{
    if(!c.fieldCode)return;
    let fc=c.fieldCode,n=2;
    while(taken.has(fc))fc=c.fieldCode+"_"+(n++);
    if(fc!==c.fieldCode)c.fieldCode=fc;
    taken.add(fc);
  });
  hAdd(view.sections,sec);
}

}
function bindPaletteDrop(node,arr){
  node.addEventListener("dragover",e=>{if(_pal){e.preventDefault();node.classList.add("dz-on");}});

/* 按类型的精选属性由 CONTROLS 注册表派生（见文件头部）；校验必须用下面这份全局全集 */
const ALL_PROP_KEYS=["min","max","step","precision","maxLength","rows","currencyField","targetEntity","labelField","valueField","childEntity","columns","maxCount","maxSizeMB","chartType","dataRef","computedFn","computedFrom","anchorRef","lineage","ai","mask","tier","roles"];
const PROP_TYPE={
  min:"num",max:"num",step:"num",precision:"num",maxLength:"num",rows:"num",maxCount:"num",maxSizeMB:"num",
  currencyField:"text",targetEntity:"text",labelField:"text",childEntity:"text",anchorRef:"text",lineage:"text",dataRef:"text",
  columns:"csv",computedFrom:"csv",roles:"csv",tier:"csv",   // 权限 / 订阅档可见性（协议白名单字段）
  mask:["hash","last4"],
  chartType:["line","band","scatter","matrix","funnel","bar"],
  computedFn:["daysLeft","pricePosition","debitDiff","payableAmount","expectedRevenue"],
  optionsRef:"optset"
};
function propEditor(c,key){
  const t=PROP_TYPE[key];
  const val=(c.props&&c.props[key]);
  const set=v=>{c.props=c.props||{};if(v===""||v==null)delete c.props[key];else c.props[key]=v;syncOut();};
  if(t==="csv"||(t===undefined&&Array.isArray(val)))
    return txtInput(Array.isArray(val)?val.join(","):(val==null?"":String(val)),v=>{set(v?v.split(",").map(s=>s.trim()).filter(Boolean):null);},"逗号分隔");
  if(Array.isArray(t))return selInput(val==null?"":String(val),t,set);
  if(t==="num"){
    const i=el("input",{class:"txt small",type:"number",value:val==null?"":val});
    i.addEventListener("change",()=>{set(i.value===""?null:Number(i.value));});
    return i;
  }
  if(t==="csv")return txtInput(Array.isArray(val)?val.join(","):(val==null?"":String(val)),v=>{set(v?v.split(",").map(s=>s.trim()).filter(Boolean):null);},"逗号分隔");
  if(t==="optset")return selInput(val==null?"":String(val),["",...Object.keys(MOCK.options)],set);
  return txtInput(val==null?"":String(val),set);
}

/* ---------- 自检（schema lint） ---------- */
function lintSchema(){
  const issues=[];
  const view=state.schema.views.form;
  const seen=new Map();
  // 演示扩展字段（x_ 前缀）一律显式报出：协议 additionalProperties=false，这些字段过不了 schema.json
  const checkView=(vw,label)=>{
    if(!vw)return;
    (vw.sections||[]).forEach(sec=>{
      Object.keys(sec).forEach(k=>{
        if(k.startsWith("x_"))issues.push({lv:"warn",msg:label+"分区「"+(sec.title||sec.id)+"」含演示扩展字段 "+k+"（非协议字段，schema.json 会拒绝）"});
      });
    });
    (vw.pageHeader||[]).forEach(fc=>{
      if(fc&&!vw.sections.some(s=>(s.controls||[]).some(c=>c.fieldCode===fc)))
        issues.push({lv:"err",msg:label+"pageHeader 引用了不存在的字段 "+fc+"（悬空引用，协议 §13.2 判 ERROR）"});
    });
  };
  checkView(view,"");
  checkView(state.schema.views.detail,"详情页 ");
  (view.sections||[]).forEach(sec=>{
    if(!sec.controls||!sec.controls.length)issues.push({lv:"warn",msg:"分区「"+(sec.title||sec.id)+"」没有任何控件"});
    (sec.controls||[]).forEach(c=>{
      if(seen.has(c.fieldCode))issues.push({lv:"err",msg:"fieldCode 重复："+c.fieldCode});
      else seen.set(c.fieldCode,1);
      Object.keys(c.props||{}).forEach(k=>{
        if(k==="optionsRef")issues.push({lv:"warn",msg:"控件 "+c.fieldCode+" 用了 props.optionsRef，但协议 props 白名单尚未纳入（DEMO 提议新增，需评审）"});
        else if(!ALL_PROP_KEYS.includes(k))issues.push({lv:"err",msg:"控件 "+c.fieldCode+" 的 props."+k+" 不在协议 props 白名单"});
      });
      if((c.controlKind==="ENUM"||c.controlKind==="REFERENCE")&&c.props&&c.props.optionsRef&&!MOCK.options[c.props.optionsRef])
        issues.push({lv:"warn",msg:"控件 "+c.fieldCode+" 引用了未定义的选项集 "+c.props.optionsRef});
      if((c.controlKind==="ENUM"||c.controlKind==="REFERENCE")&&optList(c).length===0)
        issues.push({lv:"warn",msg:"控件 "+c.fieldCode+" 按 fieldCode 隐式绑定未取到码表（元数据域无 enumValues，或 DEMO mock 缺失）"});
    });
  });
  (state.schema.linkageRules||[]).forEach(r=>{
    const fcs=[];
    const collect=c=>{if(!c)return;if(c.all)c.all.forEach(collect);if(c.any)c.any.forEach(collect);if(c.not)collect(c.not);if(c.fieldCode)fcs.push(c.fieldCode);};
    collect(r.when);
    fcs.concat((r.then||[]).map(t=>t.fieldCode)).forEach(fc=>{
      if(fc&&!seen.has(fc))issues.push({lv:"warn",msg:"联动规则 "+r.code+" 引用了表单中不存在的字段 "+fc});
    });
  });
  (state.schema.submitRules||[]).forEach(r=>{
    if(!r.message)issues.push({lv:"warn",msg:"提交规则 "+(r.code||r.name)+" 缺少 message（校验失败时无提示）"});
    if(!r.fields||!r.fields.length)issues.push({lv:"err",msg:"提交规则 "+(r.code||r.name)+" 缺少 fields（引擎无从取数）"});
    (r.fields||[]).forEach(fc=>{
      const root=fc.split(".")[0];
      if(root&&!seen.has(root)&&!String(root).startsWith("items"))
        issues.push({lv:"warn",msg:"提交规则 "+(r.code||r.name)+" 引用了表单中不存在的字段 "+fc});
    });
  });
  // 字典覆写一致性（协议 §3.1：只引用，不新造 value）
  Object.keys(state.schema.dictionaries||{}).forEach(k=>{
    const ov=state.schema.dictionaries[k];
    if(!MOCK.options[k]){issues.push({lv:"err",msg:"dictionaries 覆写了不存在的码表 "+k});return;}
    const known=MOCK.options[k].map(o=>o.value);
    (ov.hidden||[]).forEach(v=>{
      if(!known.includes(v))issues.push({lv:"err",msg:"码表 "+k+" 隐藏了不存在的 value "+v+"（UI 层不得新造 value）"});
    });
    Object.keys(ov.labelOverride||{}).forEach(v=>{
      if(!known.includes(v))issues.push({lv:"err",msg:"码表 "+k+" 覆写了不存在的 value "+v+"（UI 层不得新造 value）"});
    });
  });
  // 变体一致性（协议 priority+match 自动裁决：key 唯一、match 类型正确）
  const vkeys=new Set();
  (state.schema.variants||[]).forEach(v=>{
    if(!v.key)issues.push({lv:"err",msg:"变体缺少 key（无法被手动强制选中）"});
    else if(vkeys.has(v.key))issues.push({lv:"err",msg:"变体 key 重复："+v.key+"（自动裁决只取第一个）"});
    else vkeys.add(v.key);
    ["roles","tiers","channels","devices"].forEach(k=>{
      if(v.match&&v.match[k]!==undefined&&!Array.isArray(v.match[k]))
        issues.push({lv:"err",msg:"变体 "+(v.key||"?")+" 的 match."+k+" 必须是数组（引擎按数组匹配）"});
    });
    if(v.priority!==undefined&&typeof v.priority!=="number")
      issues.push({lv:"err",msg:"变体 "+(v.key||"?")+" 的 priority 必须是数字（越大越优先）"});
    if(!v.match||!Object.keys(v.match).length)
      issues.push({lv:"info",msg:"变体 "+(v.key||"?")+" 无 match，全员命中（按 priority 参与排序，注意遮挡 base）"});
  });
  // 身份/通配变量拼写漂移（fail-closed：未知 $ 变量按字面量比对，恒不命中）
  const DOLLAR_OK=["$me","$myteam","$all"];
  const checkDollar=(val,where)=>{
    if(typeof val==="string"&&val.startsWith("$")&&!DOLLAR_OK.includes(val))
      issues.push({lv:"err",msg:where+" 用了未知变量 "+val+"（仅支持 $me/$myteam/$all，否则恒不命中）"});
  };
  const walkWhen=(w,cb)=>{
    if(!w)return;
    (w.all||[]).forEach(x=>walkWhen(x,cb));(w.any||[]).forEach(x=>walkWhen(x,cb));
    if(w.not)walkWhen(w.not,cb);cb(w);
  };
  (state.schema.linkageRules||[]).forEach(r=>walkWhen(r.when,w=>{
    if(w&&w.valueType!=="field")checkDollar(w.value,"联动规则 "+(r.code||r.name));
  }));
  (state.schema.actionBar||[]).forEach(a=>walkWhen(a.visibleWhen,w=>{
    if(w&&w.valueType!=="field")checkDollar(w.value,"动作 "+a.actionCode+" 的 visibleWhen");
  }));
  const lv=state.schema.views.list||{};
  (lv.tabs||[]).forEach(t=>checkDollar(t.value,"列表 tab「"+t.title+"」"));
  (lv.columns||[]).forEach(col=>{
    if(!seen.has(col.fieldCode))issues.push({lv:"info",msg:"列表列 "+col.fieldCode+" 不在表单字段中（可能来自聚合/关联，属正常）"});
  });
  // 文本槽位注入检查（协议 §14 安全不变量：文本槽位禁 HTML 标签，渲染器一律按纯文本，避免「碰巧安全」→「约定安全」）
  (state.schema.views.form.sections||[]).forEach(sec=>{
    if(sec.title&&/<[a-z][\s\S]*>/i.test(sec.title))issues.push({lv:"warn",msg:"分区「"+sec.id+"」title 含 HTML 标签（协议 §14：渲染器按纯文本显示，不执行）"});
    (sec.controls||[]).forEach(c=>{
      [[c.labelOverride,"labelOverride"],[c.props&&c.props.placeholder,"props.placeholder"]].forEach(pair=>{
        if(pair[0]&&/<[a-z][\s\S]*>/i.test(String(pair[0])))
          issues.push({lv:"warn",msg:"控件 "+c.fieldCode+" 的 "+pair[1]+" 含 HTML 标签（协议 §14：按纯文本显示；确需富文本走评审）"});
      });
    });
  });
  // 未知更高 minor：协议语义「只告警、不拒绝」（前向兼容），告警落自检 + 预览顶部提示条（v1.2 行为）
  if(typeof state.schema.minor==="number"&&state.schema.minor>KNOWN_MINOR)
    issues.push({lv:"warn",msg:"schema.minor="+state.schema.minor+" 高于本引擎支持的 "+KNOWN_MINOR+"：未知增量字段将被前向忽略（不拒绝），预览顶部已提示"});
  return issues;
}
function renderLintTab(){
  const wrap=el("div");

  const warns=issues.filter(i=>i.lv==="warn").length;

}

function buildFormTree(tree){

function renderInspector(box){
  const s=state.selected;
  if(!s){

    em.append(el("div",{style:"font-size:22px;margin-bottom:8px"},"🎯"));
    em.append(el("div",{},"从左侧树选择分区 / 控件 / 规则开始编辑"));

    row.append(el("button",{class:"btn sm",on:{click:()=>{state.selected={type:"group",g:"lint"};renderConfig();}}},"打开自检"));
    row.append(el("button",{class:"btn sm",on:{click:()=>openCmdk()}},"⌘K 命令面板"));
    em.append(row);
    box.append(em);return;
  }
  if(s.type==="control"){
    const c=((state.schema.views.form.sections[s.si]||{}).controls||[])[s.ci];
    if(!c){box.append(el("div",{class:"insp-empty"},"控件不存在（可能已被删除，Ctrl+Z 可撤销）"));return;}
    box.append(inspectControlFields(c));

  }
  if(s.type==="vcontrol"){
    box.append(el("div",{class:"tenant-note"},"该字段来自变体 "+(s.vkey||"")+"（基线树无此节点）。此处编辑直接改写变体对象。"));

    if(!c){box.append(el("div",{class:"insp-empty"},"变体字段已不在当前视图"));return;}
    box.append(inspectControlFields(c));
    box.append(renderControlInspector(c));
    return;
  }
  if(s.type==="section"){
    const sec=(state.schema.views.form.sections||[])[s.si];
    if(!sec){box.append(el("div",{class:"insp-empty"},"分区不存在"));return;}
    box.append(inspectSection(sec,s.si));return;

  if(s.type==="pageheader"){box.append(renderPageHeaderEditor());return;}
  if(s.type==="footer"){box.append(renderFooterEditor());return;}
  if(s.type==="linkrule"){const r=(state.schema.linkageRules||[])[s.ri];if(!r){box.append(el("div",{class:"insp-empty"},"规则不存在"));return;}box.append(renderLinkRuleEditor(r,s.ri));return;}
  if(s.type==="submitrule"){const r=(state.schema.submitRules||[])[s.ri];if(!r){box.append(el("div",{class:"insp-empty"},"规则不存在"));return;}box.append(renderSubmitRuleEditor(r,s.ri));return;}
  if(s.type==="action"){const a=(state.schema.actionBar||[])[s.ai];if(!a){box.append(el("div",{class:"insp-empty"},"动作不存在"));return;}box.append(renderActionEditor(a,s.ai));return;}
  if(s.type==="group"){
    if(s.g==="list")box.append(renderListStruct());
    else if(s.g==="dict")box.append(renderOptionsTab());
    else if(s.g==="lint"){box.append(renderLintTab());box.append(renderMachineCheck());}
    else if(s.g==="json")box.append(renderJsonTab());
    else if(s.g==="linkrules")box.append(renderLinkRuleGroupTools());
    else if(s.g==="submitrules")box.append(renderSubmitRuleGroupTools());
    else if(s.g==="actions")box.append(renderActionGroupTools());
    return;
  }
  box.append(el("div",{class:"insp-empty"},"未知选择态"));
}

/* 配置器操作助手：把内联箭头体收敛为单语句，规避花括号配对错误 */
function hMove(arr,i,dir){ if(dir<0&&i>0){arr.splice(i-1,0,arr.splice(i,1)[0]);} else if(dir>0&&i<arr.length-1){arr.splice(i+1,0,arr.splice(i,1)[0]);} pushHistory(); renderConfig(); syncOut(); }
function hDel(arr,i){ arr.splice(i,1); pushHistory(); renderConfig(); syncOut(); toast("已删除，Ctrl+Z 可撤销"); }
function hAdd(arr,item){ arr.push(item); pushHistory(); renderConfig(); syncOut(); }
function hToggleSearch(lv,c,checked){ lv.searchFields=lv.searchFields||[]; if(checked){ if(!lv.searchFields.includes(c.fieldCode))lv.searchFields.push(c.fieldCode);} else { lv.searchFields=lv.searchFields.filter(x=>x!==c.fieldCode);} syncOut(); }

/* ---------- 联动演练（一键构造命中条件，对标 designer rehearsal；演练验联动，试运行验提交） ---------- */
function whenAtoms(w,out){
  out=out||[];
  if(!w)return out;
  if(w.all)w.all.forEach(x=>whenAtoms(x,out));
  else if(w.any)w.any.forEach(x=>whenAtoms(x,out));
  else if(w.not)whenAtoms(w.not,out);
  else if(w.fieldCode&&w.operator!=="isNull"&&w.operator!=="isNotNull"&&w.valueType!=="field")
    out.push({fieldCode:w.fieldCode,operator:w.operator,value:w.value});
  return out;
}
function rehearseRule(r){
  if(state._reh)resetRehearse(true);
  const atoms=whenAtoms(r.when);
  if(!atoms.length){toast("该规则无可构造的固定值条件（字段引用/空值判断需手动填值）");return;}
  state._reh={key:"link:"+(r.code||""),backup:clone(state.values)};
  atoms.forEach(a=>{
    const v=a.value;
    if(["eq","neq","in","notIn"].includes(a.operator))setVal(a.fieldCode,Array.isArray(v)?v[0]:v);
    else if(["gt","gte"].includes(a.operator))setVal(a.fieldCode,(Number(v)||0)+1);
    else if(["lt","lte"].includes(a.operator))setVal(a.fieldCode,Math.max(0,(Number(v)||0)-1));
    else if(a.operator==="between"&&Array.isArray(v)&&v.length)setVal(a.fieldCode,v[0]);
    else setVal(a.fieldCode,v);
  });
  renderConfig();refreshPreview();
  toast("已演练 "+(r.code||r.name)+"：构造了 "+atoms.length+" 个条件值，追踪条查看命中");
}
function resetRehearse(silent){
  if(!state._reh)return;
  state.values=state._reh.backup||{};
  state._reh=null;
  renderConfig();refreshPreview();
  if(!silent)toast("已复位演练值");
}

/* ---------- 机器结构校验（轻量版）：类型/枚举/必填/未知键，与语义 lint 互补 ---------- */
function validateMachine(){
  const errs=[];
  const CK={
    operators:["isNull","isNotNull","in","notIn","eq","neq","gt","gte","lt","lte","between","earlierThan","laterThan"],
    functions:["sum","count","max","min","compare","balance","unique","consistency","completeness"],
    submitOps:["eq","neq","gt","gte","lt","lte"],
    kinds:["INPUT","TEXTAREA","NUMBER","MONEY","SWITCH","DATE","DATETIME","ENUM","REFERENCE","CHILD_TABLE","ATTACHMENT","SLIDER","CHART","STAT","QUOTE","TIMELINE","COMPUTED","ALERT"],
    secKinds:["form","dashboard","timeline","compare","report","tasks"],
    layouts:["single","split-left-40","split-left-60"]
  };
  const S=state.schema||{};
  const req=(o,k,p)=>{if(!o||!(k in o))errs.push("缺少必填 "+p+"."+k);};
  ["schemaVersion","entityCode","views"].forEach(k=>req(S,k,"$"));
  if("schemaVersion" in S&&typeof S.schemaVersion!=="number")errs.push("$.schemaVersion 应为数字");
  if("entityCode" in S&&typeof S.entityCode!=="string")errs.push("$.entityCode 应为字符串");
  const walkCond=(w,p)=>{
    if(!w||typeof w!=="object"){errs.push(p+" 条件应为对象");return;}
    const comp=["all","any","not"].filter(k=>w[k]!==undefined);
    if(comp.length>1)errs.push(p+" all/any/not 与原子条件互斥（三选一）");
    if(w.all||w.any)(w.all||w.any).forEach((x,i)=>walkCond(x,p+"."+(w.all?"all":"any")+"["+i+"]"));
    if(w.not)walkCond(w.not,p+".not");
    if(!comp.length){
      if(!w.fieldCode)errs.push(p+" 原子条件缺少 fieldCode");
      if(w.operator&&!CK.operators.includes(w.operator))errs.push(p+" 未知操作符 "+w.operator);
      if(w.valueType&&!["fixed","field"].includes(w.valueType))errs.push(p+" valueType 非法");
    }
  };
  const views=S.views||{};
  ["form","list","detail"].forEach(vk=>{
    const vw=views[vk];if(!vw)return;
    (vw.sections||[]).forEach((sec,si)=>{
      const p="views."+vk+".sections["+si+"]";
      ["id","title","controls"].forEach(k=>req(sec,k,p));
      if(sec.kind&&!CK.secKinds.includes(sec.kind))errs.push(p+".kind 非法："+sec.kind);
      if(sec.layout&&!CK.layouts.includes(sec.layout))errs.push(p+".layout 非法："+sec.layout);
      (sec.controls||[]).forEach((c,ci)=>{
        const cp=p+".controls["+ci+"]";
        req(c,"fieldCode",cp);
        if(c.controlKind&&!CK.kinds.includes(c.controlKind))errs.push(cp+" 未知 controlKind "+c.controlKind);
      });
    });
    (vw.pageHeader||[]).forEach(fc=>{
      if(!(vw.sections||[]).some(s=>(s.controls||[]).some(c=>c.fieldCode===fc)))errs.push("views."+vk+".pageHeader 悬空引用 "+fc);
    });
  });
  (S.linkageRules||[]).forEach((r,ri)=>{
    const p="linkageRules["+ri+"]";
    req(r,"when",p);req(r,"then",p);
    if(r.when)walkCond(r.when,p+".when");
    if(r.then&&!Array.isArray(r.then))errs.push(p+".then 应为数组");
  });
  (S.submitRules||[]).forEach((r,ri)=>{
    const p="submitRules["+ri+"]";
    ["name","function","fields","operator","message"].forEach(k=>req(r,k,p));
    if(r.function&&!CK.functions.includes(r.function))errs.push(p+" 未知 function "+r.function);
    if(r.operator&&!CK.submitOps.includes(r.operator))errs.push(p+" 非法 operator "+r.operator);
    if(r.when)walkCond(r.when,p+".when");
  });
  (S.actionBar||[]).forEach((a,ai)=>{
    const p="actionBar["+ai+"]";
    req(a,"actionCode",p);
    if(a.visibleWhen)walkCond(a.visibleWhen,p+".visibleWhen");
    if(a.maxRounds!=null&&(typeof a.maxRounds!=="number"||a.maxRounds<1))errs.push(p+".maxRounds 非法");
  });
  const known=["schemaVersion","minor","entityCode","displayModes","views","linkageRules","submitRules","actionBar","footer","dictionaries","i18n","base","variants"];
  Object.keys(S).forEach(k=>{
    if(known.includes(k)||k.startsWith("x_"))return;
    errs.push("$. "+k+" 协议未定义（schema.json additionalProperties=false，x_ 扩展除外）");
  });
  return errs;
}
/* ---------- 真源机校（内嵌 bone-ui-schema.schema.json，JSON Schema 子集遍历） ----------
 * 之前 validateMachine 是人工镜像协议规则；现在直接用真源 schema.json 对账：
 * 协议演进时只改 schema.json，这里自动跟随，避免「镜像版号滞后」——引用不复制。
 */
let _SCHEMA_EMBED;
function loadSchemaEmbed(fresh){
  if(fresh)_SCHEMA_EMBED=undefined;
  if(_SCHEMA_EMBED!==undefined)return _SCHEMA_EMBED;
  try{
    if(typeof document==="undefined"||!document.getElementById)return _SCHEMA_EMBED=null; // node 桩环境跳过
    const j=document.getElementById("schemaJsonEmbed");
    _SCHEMA_EMBED=j?JSON.parse(j.textContent):null;
  }catch(e){_SCHEMA_EMBED=null;}
  return _SCHEMA_EMBED;
}
function validateAgainstSchema(inst,sch){
  const out=[];
  const typeOk=(v,t)=>{switch(t){case "object":return v&&typeof v==="object"&&!Array.isArray(v);case "array":return Array.isArray(v);case "string":return typeof v==="string";case "number":return typeof v==="number";case "integer":return typeof v==="number"&&Number.isInteger(v);case "boolean":return typeof v==="boolean";default:return true;}};
  const walk=(n,s,p,d)=>{
    if(!s||d>60)return;
    if(s.$ref){walk(n,sch.definitions[s.$ref.replace(/^#\/definitions\//,"")],p,d+1);return;}
    if(s.type&&!typeOk(n,s.type)){out.push({p,why:"类型应为 "+s.type});return;}
    if(s.enum&&n!==undefined&&!s.enum.includes(n))out.push({p,why:"值不在枚举"});
    if(s.const!==undefined&&n!==s.const)out.push({p,why:"应为常量 "+JSON.stringify(s.const)});
    if(s.minimum!==undefined&&typeof n==="number"&&n<s.minimum)out.push({p,why:"应 ≥ "+s.minimum});
    if(s.type==="object"&&n&&typeof n==="object"&&!Array.isArray(n)){
      (s.required||[]).forEach(k=>{if(!(k in n))out.push({p:p+"."+k,why:"缺少必填"});});
      const props=s.properties||
      Object.keys(n).forEach(k=>{
        if(props[k])walk(n[k],props[k],p+"."+k,d+1);
        else if(s.additionalProperties===false)out.push({p:p+"."+k,why:"协议未定义（additionalProperties=false）",x:k.startsWith("x_")});
      });
    }
    if(s.type==="array"&&Array.isArray(n)&&s.items)n.forEach((it,i)=>walk(it,s.items,p+"["+i+"]",d+1));
  };
  walk(inst,sch,"$",0);
  return out;
}
function schemaEmbedLabel(){const s=loadSchemaEmbed();return s?((s.$id||"schema.json").replace(/^.*\//,"")+" · "+(s.title||"")):null;}

  }

}

  a.click();toast("已下载 "+state.schema.entityCode+".ui-schema.json");
}

/* ============================================================
 *  ⌘K 命令面板 / 快捷键 / 新手引导（P2 效率精修）
 * ============================================================ */
function cmdkCommands(){
  const cmds=[];
  const add=(group,label,run)=>cmds.push({group,label,run});
  Object.keys(SAMPLES).forEach(k=>add("样板","切换样板："+SAMPLES[k].name,()=>{loadSample(k);renderConfig();renderPreview();}));
  [["form","切换到表单视图"],["list","切换到列表视图"]].forEach(([v,lab])=>add("视图",lab,()=>{
    state.view=v;state.diff=false;$$("#viewSeg button").forEach(x=>x.classList.toggle("active",x.dataset.v===v));renderPreview();
  }));
  add("环境","切换深色 / 浅色主题",()=>toggleTheme());
  add("环境","打开预览环境（模式/变体/身份/设备）",()=>{const b=$("#envBtn");if(b)b.click();});
  add("校验","▶ 试运行（只跑提交校验）",()=>{const b=$("#testRunBtn");if(b)b.click();});
  add("校验","打开自检 lint",()=>{state.selected={type:"group",g:"lint"};renderConfig();});
  if(state._reh)add("校验","复位演练值",()=>resetRehearse());
  add("结构","页脚与合规 footer",()=>{state.selected={type:"footer"};renderConfig();});
  (state.schema.linkageRules||[]).forEach(r=>add("联动","定位 "+(r.code||"")+" "+(r.name||""),()=>gotoRule(r.code||"")));
  (state.schema.submitRules||[]).forEach((r,ri)=>add("提交","定位 "+(r.code||"")+" "+(r.name||""),()=>{state.selected={type:"submitrule",ri};renderConfig();flashTree("rsub-"+ri);}));
  (state.schema.actionBar||[]).forEach((a,ai)=>add("动作","定位 "+(a.actionCode||""),()=>{state.selected={type:"action",ai};renderConfig();flashTree("act-"+ai);}));
  ((state.schema.views.form||{}).sections||[]).forEach(sec=>(sec.controls||[]).forEach(c=>add("字段","定位 "+(c.fieldCode||"")+" "+(c.labelOverride||""),()=>selectControl(c.fieldCode))));
  add("编辑","撤销",()=>undo());
  add("编辑","重做",()=>redo());
  add("编辑","发布当前配置",()=>{const p=$("#publishBtn");if(p)p.click();});
  return cmds;
}
function openCmdk(){
  if(document.querySelector(".cmdk"))return;
  closePop();
  const ovl=el("div",{class:"ovl"});
  const box=el("div",{class:"cmdk"});
  const inp=el("input",{placeholder:"输入命令 / 字段 / 规则 code…（↑↓ 选择，回车执行，Esc 关闭）",value:""});
  const list=el("div",{class:"cmdk-list"});
  box.append(inp,list);ovl.append(box);document.body.append(ovl);
  const items=cmdkCommands();
  let act=0;
  const paint=()=>{
    const q=inp.value.trim().toLowerCase();
    const hit=items.filter(c=>!q||(c.group+" "+c.label).toLowerCase().includes(q)).slice(0,60);
    list.innerHTML="";act=Math.min(act,Math.max(0,hit.length-1));
    if(!hit.length)list.append(el("div",{class:"hint",style:"padding:10px"},"无匹配命令"));
    hit.forEach((c,i)=>{
      const it=el("div",{class:"cmdk-item"+(i===act?" act":"")},el("span",{class:"k"},c.group),el("span",{},c.label));
      it.addEventListener("click",()=>{ovl.remove();c.run();});
      it.addEventListener("mousemove",()=>{if(act!==i){act=i;paint();}});
      list.append(it);
    });
    box._hit=hit;
  };
  inp.addEventListener("input",()=>{act=0;paint();});
  inp.addEventListener("keydown",e=>{
    const hit=box._hit||[];
    if(e.key==="ArrowDown"){e.preventDefault();act=Math.min(act+1,hit.length-1);paint();}
    else if(e.key==="ArrowUp"){e.preventDefault();act=Math.max(act-1,0);paint();}
    else if(e.key==="Enter"){e.preventDefault();const c=hit[act];if(c){ovl.remove();c.run();}}
    else if(e.key==="Escape"){ovl.remove();}
    e.stopPropagation();
  });
  ovl.addEventListener("click",e=>{if(e.target===ovl)ovl.remove();});
  paint();setTimeout(()=>inp.focus(),0);
}
function openShortcuts(){
  if(document.querySelector(".ovl"))return;
  closePop();
  const ovl=el("div",{class:"ovl"});
  const box=el("div",{class:"cmdk",style:"padding:14px 16px"});
  box.append(el("div",{style:"font-weight:700;margin-bottom:8px"},"⌨ 快捷键（按 ? 随时查看）"));
  [["⌘/Ctrl + K","命令面板：直达样板 / 规则 / 字段 / 动作"],["⌘/Ctrl + Z · ⇧+Z","撤销 / 重做"],["⌘/Ctrl + S","发布当前配置"],["Esc","关闭弹窗 / 面板"],["点击预览字段","反向定位到左侧树节点"]].forEach(([k,d])=>{
    box.append(el("div",{class:"cmdk-item"},el("span",{class:"k"},k),el("span",{},d)));
  });
  ovl.append(box);document.body.append(ovl);
  ovl.addEventListener("click",e=>{if(e.target===ovl)ovl.remove();});
}
function maybeOnboard(){
  try{if(localStorage.getItem("bone-ui-schema-onboarded-v1"))return;}catch(e){return;}
  const steps=[
    {t:"左树 = 结构，右栏 = 属性",d:"左侧结构树承载表单 / 联动 / 提交 / 动作 / 页脚，选中节点后右侧属性面板即时编辑。点击中间预览里的字段，可反向定位到树节点。"},
    {t:"演练验联动，试运行验提交",d:"联动规则点「▶ 演练」按 when 反推填入命中条件值；顶栏「▶ 试运行」只跑提交校验不触发动作，结果常驻预览下方。"},
    {t:"环境与命令",d:"顶栏「预览环境」切换模式 / 变体 / 身份 / 设备；⌘K 打开命令面板直达任何规则与字段；? 查看快捷键。"}
  ];
  let i=0;
  const ovl=el("div",{class:"ovl"});
  const card=el("div",{class:"onb-card"});
  const done=()=>{try{localStorage.setItem("bone-ui-schema-onboarded-v1","1");}catch(e){} ovl.remove();};
  const paint=()=>{
    card.innerHTML="";
    card.append(el("h3",{},(i+1)+" / 3 · "+steps[i].t));
    card.append(el("p",{},steps[i].d));
    const dots=el("div",{class:"onb-dots"});steps.forEach((_,k)=>dots.append(el("i",{class:k===i?"on":""})));card.append(dots);
    const acts=el("div",{class:"onb-acts"});
    const skip=el("button",{class:"btn sm"},"跳过");skip.addEventListener("click",done);acts.append(skip);
    if(i>0){const prev=el("button",{class:"btn sm"},"上一步");prev.addEventListener("click",()=>{i--;paint();});acts.append(prev);}
    const next=el("button",{class:"btn sm primary"},i===steps.length-1?"开始体验":"下一步");
    next.addEventListener("click",()=>{if(i===steps.length-1)done();else{i++;paint();}});
    acts.append(next);card.append(acts);
  };
  ovl.append(card);document.body.append(ovl);paint();
}
document.addEventListener("keydown",e=>{
  const tag=(e.target&&e.target.tagName||"").toLowerCase();
  const inField=(tag==="input"||tag==="textarea"||tag==="select");
  if((e.ctrlKey||e.metaKey)&&((e.key||"").toLowerCase()==="k")){e.preventDefault();openCmdk();return;}
  if(e.key==="Escape"){const o=document.querySelector(".ovl");if(o)o.remove();return;}
  if(inField||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="?")openShortcuts();
});

/* ============================================================
 *  启动
 * ============================================================ */
function boot(){
  initTop();
  initTheme();
  const restored=restoreSaved();
  if(!restored)loadSample(state.sampleId);
  syncVariantUI();
  state.history=[JSON.stringify(state.schema)];state.historyIndex=0;updateUndoRedo();
  renderConfig();
  renderPreview();
  maybeOnboard();
  if(restored)toast("已恢复上次编辑的配置（点「重置」回到样板初始状态）");
}
boot();
</script>
