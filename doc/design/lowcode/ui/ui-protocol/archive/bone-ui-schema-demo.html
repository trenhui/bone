<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BONE 业务对象界面协议 · 可配置 DEMO</title>
<style>
  :root{
    --bg:#f2f4f8; --panel:#ffffff; --panel2:#fafbfd; --ink:#131720; --sub:#6b7280;
    --line:#e5e7ee; --line2:#eef0f5;
    --pri:#2f6bff; --pri2:#5b8cff; --pri-weak:#eef3ff; --pri-soft:#dfe9ff;
    --ok:#15a34a; --warn:#d97706; --err:#dc2626;
    --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
    --shadow-md:0 4px 14px rgba(16,24,40,.08);
    --shadow-lg:0 12px 32px rgba(16,24,40,.10);
    --dot:#dfe3ea;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  [data-theme="dark"]{
    --bg:#0d1016; --panel:#141821; --panel2:#171c26; --ink:#e7eaf0; --sub:#8f9aa9;
    --line:#232936; --line2:#1d222c;
    --pri:#5b8cff; --pri2:#7aa5ff; --pri-weak:#1b2438; --pri-soft:#26314a;
    --ok:#34d17e; --warn:#f0b429; --err:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 4px 14px rgba(0,0,0,.45); --shadow-lg:0 14px 36px rgba(0,0,0,.5);
    --dot:#1e2430;
  }
  *{box-sizing:border-box}
  :focus-visible{outline:2px solid var(--pri);outline-offset:1px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none!important;animation:none!important}
  }
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);font-size:13px;-webkit-font-smoothing:antialiased;transition:background .2s ease,color .2s ease}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--sub);background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:56px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;box-shadow:var(--shadow);z-index:5;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;padding-right:12px;border-right:1px solid var(--line2)}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(47,107,255,.35)}
  .brand-txt .t{font-weight:700;font-size:13.5px;letter-spacing:.2px;line-height:1.2}
  .brand-txt .s{color:var(--sub);font-size:11px;margin-top:1px}
  .hd-group{display:flex;align-items:center;gap:8px}
  .hd-div{width:1px;height:22px;background:var(--line2);margin:0 2px}
  .fld-lbl{font-size:11px;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
  .seg{display:inline-flex;padding:2px;background:var(--line2);border-radius:9px;gap:2px}
  .seg button{border:0;background:transparent;padding:5px 13px;border-radius:7px;color:var(--sub);font-size:12px;font-weight:600;transition:.16s}
  .seg button:hover{color:var(--ink)}
  .seg button.active{background:var(--panel);color:var(--pri);box-shadow:var(--shadow)}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;color:var(--ink);font-size:12px;font-weight:500;transition:.16s}
  .btn:hover{border-color:var(--pri-soft);color:var(--pri);transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent;color:#fff}
  .btn.pri:hover{color:#fff;box-shadow:0 4px 14px rgba(47,107,255,.35)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--pri)}
  button[disabled]{opacity:.4;cursor:not-allowed}
  button[disabled]:hover{transform:none;box-shadow:none}
  .iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;width:27px;height:27px;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;transition:.16s;flex:0 0 auto}
  .iconbtn:hover{color:var(--pri);border-color:var(--pri-soft);background:var(--pri-weak)}
  .ico{display:inline-flex;align-items:center;justify-content:center;line-height:0}
  .ico svg{display:block}

  /* ---------- layout ---------- */
  .main{display:flex;flex:1;min-height:0}
  .cfg{width:42%;min-width:390px;max-width:660px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  .preview{flex:1;overflow:auto;padding:24px;background:var(--bg);
    background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0);background-size:22px 22px}

  /* ---------- config panel ---------- */
  .cfg-tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--panel2);padding:0 6px;gap:2px}
  .cfg-tabs button{flex:1;border:0;background:transparent;padding:11px 6px;color:var(--sub);font-size:12px;border-bottom:2px solid transparent;transition:.16s;white-space:nowrap}
  .cfg-tabs button:hover{color:var(--ink)}
  .cfg-tabs button.active{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
  .cfg-body{flex:1;overflow:auto;padding:14px}
  .subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .subtabs button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 12px;color:var(--sub);font-size:12px;transition:.16s}
  .subtabs button:hover{border-color:var(--pri-soft);color:var(--pri)}
  .subtabs button.active{background:var(--pri-weak);color:var(--pri);border-color:var(--pri-soft);font-weight:600}
  .card{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .18s}
  .card:hover{box-shadow:var(--shadow-md)}
  .card>.hd{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--line2);background:var(--panel2)}
  .card>.hd .t{font-weight:600;flex:1;min-width:0;font-size:12.5px}
  .card>.hd .t input{border:1px solid transparent;background:transparent;font-weight:600;width:100%;padding:3px 5px;border-radius:6px;color:var(--ink)}
  .card>.hd .t input:hover{background:var(--panel);border-color:var(--line)}
  .card>.hd .t input:focus{background:var(--panel);border-color:var(--pri);outline:none}
  .card>.bd{padding:11px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
  .row>label{color:var(--sub);min-width:62px;font-size:11.5px}
  .txt,select,textarea#json{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--panel);color:var(--ink);transition:.16s}
  [data-theme="dark"] .txt,[data-theme="dark"] select,[data-theme="dark"] .row input,[data-theme="dark"] textarea#json{background:var(--panel2)}
  .txt:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-weak);outline:none}
  .row .txt,.row select{flex:1;min-width:90px}
  .row .txt.small{flex:0 0 90px}
  .ctrl{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px dashed var(--line);border-radius:9px;margin:6px 0;background:var(--panel2);transition:.16s}
  .ctrl:hover{border-color:var(--pri-soft);background:var(--pri-weak)}
  .ctrl .grip{color:#aab0bb;cursor:grab;user-select:none;display:inline-flex;padding:1px}
  .ctrl .grip:active{cursor:grabbing}
  .ctrl .meta{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ctrl .meta .code{font-family:var(--mono);font-size:11.5px;color:var(--pri)}
  .ctrl .meta .kind{font-size:11px;color:var(--sub);background:var(--line2);border-radius:5px;padding:1px 6px}
  .hint{color:var(--sub);font-size:11px;line-height:1.6}
  .pill{display:inline-block;font-size:10.5px;color:var(--pri);background:var(--pri-weak);border-radius:20px;padding:1px 9px}
  .empty-state{text-align:center;padding:15px;color:var(--sub);font-size:12px;border:1px dashed var(--line);border-radius:9px;background:var(--panel2)}

  /* ---------- 控件库 / 拖放区 ---------- */
  .palette-label{font-size:11px;color:var(--sub);margin:9px 0 6px;font-weight:600}
  .palette{display:flex;flex-direction:column;gap:5px;border:1px solid var(--line2);border-radius:9px;padding:8px;background:var(--panel2)}
  .palette-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .palette-g{font-size:10.5px;color:var(--sub);flex:0 0 30px}
  .palette-item{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 8px;color:var(--ink);font-size:11.5px;transition:.16s;cursor:grab}
  .palette-item:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-weak);transform:translateY(-1px);box-shadow:var(--shadow)}
  .dz-on{outline:2px dashed var(--pri);outline-offset:-3px;background:var(--pri-weak)!important}

  /* ---------- json ---------- */
  .json-wrap{display:flex;flex-direction:column;height:100%}
  textarea#json{border-radius:10px;padding:12px;font-family:var(--mono);font-size:12px;line-height:1.6;flex:1;resize:none;width:100%;tab-size:2}
  .json-bar{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .json-status{font-size:11.5px;padding:3px 10px;border-radius:20px;font-weight:600}
  .json-status.ok{background:#e7f7ec;color:var(--ok)}
  .json-status.err{background:#fdecec;color:var(--err)}
  [data-theme="dark"] .json-status.ok{background:rgba(52,209,126,.14)}
  [data-theme="dark"] .json-status.err{background:rgba(248,113,113,.14)}

  /* ---------- preview ---------- */
  .pv-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 2px;border-bottom:1px solid var(--line2)}
  .pv-head .entity{font-weight:700;font-size:15px}
  .pv-head .badge{font-size:11px;color:var(--sub);border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:2px 10px}
  .pv-head .meta{font-size:11.5px;color:var(--sub);white-space:nowrap}
  .pv-head .meta b{color:var(--ink);font-weight:700}
  .pv-head .sp{flex:1}
  /* ---------- v1.5 变体 Diff（GitHub split diff 式左右对照） ---------- */
  .diff-sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 13px;margin-bottom:12px;font-size:12px;box-shadow:var(--shadow)}
  .diff-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-bottom:12px}
  .diff-legend i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .dot.add{background:#34d17e}.dot.del{background:#f87171}.dot.mod{background:#f0b429}.dot.same{background:var(--line)}
  .diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .dsec{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 13px;box-shadow:var(--shadow);min-width:0}
  .dsec.add{border-color:rgba(52,209,126,.55);background:linear-gradient(180deg,rgba(52,209,126,.07),transparent 60%)}
  .dsec.del{border-color:rgba(248,113,113,.5);background:linear-gradient(180deg,rgba(248,113,113,.06),transparent 60%)}
  .dsec.mod{border-left:3px solid #f0b429}
  .dsec-hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;margin-bottom:2px;flex-wrap:wrap}
  .dsec-side{font-size:10.5px;color:var(--sub);font-weight:600;letter-spacing:.4px;margin-bottom:7px}
  .dchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .dchip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--panel2);color:var(--ink)}
  .dchip.add{border-color:rgba(52,209,126,.6);color:var(--ok)}
  .dchip.del{border-color:rgba(248,113,113,.55);color:var(--err);text-decoration:line-through}
  .dchip.chg{border-color:rgba(240,180,41,.6);color:#92591b}
  [data-theme="dark"] .dchip.chg{color:#e8b93e}
  .dempty{color:var(--sub);font-size:12px;border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;background:var(--panel2)}
  .vtag.ok{background:#e7f7ec;color:var(--ok)}
  [data-theme="dark"] .vtag.ok{background:rgba(52,209,126,.14)}
  /* ---------- v1.5 移动端 390px：栅格坍缩为单列（对标生产响应式断点） ---------- */
  .preview.dev-mobile #previewInner .form-grid{grid-template-columns:1fr!important}
  .preview.dev-mobile .diff-grid{grid-template-columns:1fr}
  .preview.dev-mobile .pv-header-strip{gap:12px;padding:11px 13px}
  .preview.dev-mobile .stat-grid{grid-template-columns:repeat(2,1fr)}
  .preview.dev-mobile .pv-card{overflow-x:auto}
  .preview.dev-mobile .search-bar{flex-direction:column;align-items:stretch}
  .preview.dev-mobile .actionbar button{flex:1}
  /* ---------- v1.6 数据语感：状态语义色 / 金额列 / 深色修复 ---------- */
  .st-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap}
  .st-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:0 0 auto}
  .st-gray{background:var(--line2);color:var(--sub)}
  .st-info{background:var(--pri-weak);color:var(--pri)}
  .st-ok{background:#e7f7ec;color:var(--ok)}
  .st-warn{background:#fff7e0;color:#92591b}
  .st-err{background:#fdecec;color:var(--err)}
  [data-theme="dark"] .st-ok{background:rgba(52,209,126,.14)}
  [data-theme="dark"] .st-warn{background:rgba(240,180,41,.12);color:#e8b93e}
  [data-theme="dark"] .st-err{background:rgba(248,113,113,.13)}
  .act-hidden-hint{font-size:11px;color:var(--sub);border:1px dashed var(--line);border-radius:20px;padding:5px 12px;align-self:center;cursor:help;background:var(--panel2)}
  table.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
  table.grid tbody tr:nth-child(even) td{background:var(--panel2)}
  table.grid tbody tr:hover td{background:var(--pri-weak)}
  table.grid th{white-space:nowrap}
  .stat-flat{border:0;background:var(--pri-weak)}   /* STAT/COMPUTED 表单内扁平卡：改走主题变量，修深色下硬编码 #f3f6ff 刺眼问题 */
  .pv-head .entity{font-family:var(--mono)}
  .pv-header-strip .hs .v{display:inline-flex;align-items:center;font-variant-numeric:tabular-nums}
  .pv-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:18px;margin-bottom:16px}
  .pv-card>.sec-title{font-weight:700;font-size:14px;margin:0 0 12px;padding-left:9px;border-left:3px solid var(--pri);display:flex;align-items:center;gap:8px}
  .pv-card>.sec-title .kind{font-size:11px;color:var(--sub);font-weight:400}
  .notice{background:#fff8e6;border:1px solid #ffe1a8;color:#92591b;border-radius:8px;padding:6px 10px;font-size:12px;margin:6px 0}
  .fld{margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
  .fld>label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .fld .req{color:var(--err)}
  .fld .ro{font-size:10px;color:#b08d3a;background:#fdf3e0;border-radius:4px;padding:0 5px}
  .fld.vis-off{display:none}
  .fld.inspectable{cursor:crosshair;border-radius:10px;padding:6px;margin-left:-6px;margin-right:-6px;transition:background .15s,box-shadow .15s}
  .fld.inspectable:hover{background:var(--pri-weak);box-shadow:0 0 0 1.5px var(--pri-soft)}
  .fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=datetime-local],.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;background:var(--panel);color:var(--ink);transition:.16s}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-weak);outline:none}
  .fld textarea{resize:vertical}
  .fld.row-inline{display:flex;flex-direction:row;align-items:center;gap:8px}
  .money-wrap{display:flex;gap:8px}.money-wrap input{flex:1}.money-wrap select{flex:0 0 90px}
  .switch{display:inline-flex;align-items:center;gap:6px}
  .slider-row{display:flex;align-items:center;gap:10px}.slider-row input[type=range]{flex:1;accent-color:var(--pri)}
  .ctable{border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .ctable table{width:100%;border-collapse:collapse;font-size:12px}
  .ctable th,.ctable td{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left}
  .ctable th{background:var(--panel2);color:var(--sub);font-weight:600}
  .ctable input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;background:var(--panel);color:var(--ink)}
  .ctable .rowact{color:var(--err);cursor:pointer}
  .att-list{display:flex;flex-direction:column;gap:6px}
  .att-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;background:var(--panel2)}
  .att-item .nm{flex:1}.att-item .sz{color:var(--sub)}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .stat{background:linear-gradient(135deg,var(--pri-weak),var(--panel));border:1px solid var(--pri-soft);border-radius:11px;padding:14px}
  .stat .v{font-size:22px;font-weight:700;color:var(--pri)}
  .stat .k{color:var(--sub);font-size:12px;margin-top:2px}
  .quote{border-left:3px solid var(--pri);background:var(--pri-weak);padding:8px 12px;border-radius:0 9px 9px 0;font-size:12px;color:var(--ink)}
  .timeline{position:relative;padding-left:18px}
  .timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl-item{position:relative;margin-bottom:12px}
  .tl-item::before{content:"";position:absolute;left:-16px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 3px var(--panel)}
  .tl-item .tl-t{font-weight:600;font-size:12px}.tl-item .tl-d{color:var(--sub);font-size:11px}
  .alert-box{background:#fff1f0;border:1px solid #ffccc7;color:#a8071a;border-radius:9px;padding:8px 12px;font-size:12px}
  .chart-box{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--panel2)}
  .chart-box .bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:8px}
  .chart-box .bars .bar{background:linear-gradient(180deg,var(--pri2),var(--pri));border-radius:5px 5px 0 0;flex:1;display:flex;align-items:flex-end;justify-content:center;color:#fff;font-size:10px;padding-bottom:2px}
  .actionbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;padding-top:14px;border-top:1px dashed var(--line)}
  .actionbar button{padding:8px 18px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;transition:.16s}
  .actionbar button:hover{border-color:var(--pri);color:var(--pri);transform:translateY(-1px);box-shadow:var(--shadow)}
  .actionbar button.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent;color:#fff}
  .actionbar button:disabled{opacity:.4;cursor:not-allowed}

  /* ---------- list ---------- */
  .tabs-bar{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
  .tabs-bar .tab{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 15px;color:var(--sub);font-size:12px;transition:.16s}
  .tabs-bar .tab:hover{color:var(--pri);border-color:var(--pri-soft)}
  .tabs-bar .tab.active{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 8px rgba(47,107,255,.3)}
  .search-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .search-bar .box{flex:1;min-width:120px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--panel);display:flex;align-items:center;gap:6px;transition:.16s}
  .search-bar .box:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-weak)}
  .search-bar .box input{border:0;outline:0;flex:1;width:100%;background:transparent}
  table.grid{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12px}
  table.grid th,table.grid td{border-bottom:1px solid var(--line2);padding:8px 10px;text-align:left}
  table.grid th{background:var(--panel2);color:var(--sub);font-weight:600;position:sticky;top:0}
  table.grid tr:hover td{background:var(--pri-weak)}
  .scope-chip{font-size:11px;color:#7a5b00;background:#fff7e0;border:1px solid #ffe6a3;border-radius:20px;padding:2px 10px}
  .empty{color:var(--sub);text-align:center;padding:30px;font-size:12px}
  /* ---------- v1.4 身份模拟 / 规则追踪 / inspect / 设备档 ---------- */
  .idbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .idbar .fld-lbl{white-space:nowrap}
  .idbar input.txt{width:76px}
  .idbar select{max-width:110px}
  .ctx-badge{font-size:11px;border-radius:20px;padding:2px 10px;border:1px solid var(--pri-soft);background:var(--pri-weak);color:var(--pri);font-weight:600;white-space:nowrap}
  .ctx-badge.auto{background:#e7f7ec;border-color:#bfe6cb;color:var(--ok)}
  .trace{border:1px solid var(--pri-soft);background:var(--pri-weak);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:12px}
  .trace summary{cursor:pointer;font-weight:600;color:var(--pri);list-style:none;display:flex;align-items:center;gap:6px}
  .trace summary::-webkit-details-marker{display:none}
  .trace .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .trace .chip{border:1px solid var(--pri-soft);background:var(--panel);border-radius:16px;padding:2px 10px;font-family:var(--mono);font-size:11px;color:var(--pri);cursor:pointer;transition:.15s}
  .trace .chip:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .trace .chip.warn{border-color:#ffe6a3;background:#fff7e0;color:#92591b}
  /* 深色主题：硬编码的浅色警告/成功底一律转暗色（高端深色观感，且避免刺眼） */
  [data-theme="dark"] .notice,[data-theme="dark"] .scope-chip,[data-theme="dark"] .ov-badge,
  [data-theme="dark"] .tenant-note,[data-theme="dark"] .trace .chip.warn,[data-theme="dark"] .vtag.warn,
  [data-theme="dark"] .lint-item .lv.warn,[data-theme="dark"] .submit-msg.warn{background:rgba(240,180,41,.12);border-color:rgba(240,180,41,.4);color:#e8b93e}
  [data-theme="dark"] .rule-sentence .when{color:#e8b93e}
  [data-theme="dark"] .tag-off{background:#2a2f3a;color:var(--sub)}
  [data-theme="dark"] .pill.link,[data-theme="dark"] .ctx-badge.auto,[data-theme="dark"] .submit-msg.ok,
  [data-theme="dark"] .json-status.ok{background:rgba(52,209,126,.14);border-color:rgba(52,209,126,.35)}
  [data-theme="dark"] .submit-msg.err,[data-theme="dark"] .vtag.err,
  [data-theme="dark"] .lint-item .lv.err,[data-theme="dark"] .json-status.err{background:rgba(248,113,113,.13);border-color:rgba(248,113,113,.4)}
  .pill.link{background:#e7f7ec;color:var(--ok)}
  .preview.inspect-on .fld{cursor:crosshair}
  .preview.inspect-on .fld:hover{outline:2px solid var(--pri);outline-offset:2px;border-radius:8px;background:var(--pri-weak)}
  .preview.inspect-on .pv-card:hover{outline:2px dashed var(--pri-soft);outline-offset:3px}
  .iconbtn.on{color:var(--pri);border-color:var(--pri);background:var(--pri-weak)}
  @keyframes locFlash{0%,100%{box-shadow:var(--shadow)}25%,75%{box-shadow:0 0 0 3px var(--pri-soft),var(--shadow-md)}50%{box-shadow:0 0 0 5px var(--pri-weak),var(--shadow-md)}}
  .loc-flash{animation:locFlash 1.1s ease 2;border-color:var(--pri)!important;border-radius:9px}
  .preview.dev-tablet #previewInner{max-width:768px}
  .preview.dev-mobile #previewInner{max-width:390px}
  #previewInner{margin:0 auto;transition:max-width .25s ease}
  .fld{transition:opacity .18s ease}
  .fld-enter{animation:fldIn .22s ease}
  @keyframes fldIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:11px;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;z-index:99;max-width:80vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .submit-msg{margin-top:10px;font-size:12px;padding:8px 12px;border-radius:9px}
  .submit-msg.err{background:#fdecec;color:var(--err);border:1px solid #f3c4c4}
  .submit-msg.warn{background:#fff8e6;color:#92591b;border:1px solid #ffe1a8}
  .submit-msg.ok{background:#e7f7ec;color:var(--ok);border:1px solid #bfe6cb}
  .scroller{max-height:300px;overflow:auto}
  .kbd{font-family:var(--mono);background:var(--line2);border-radius:5px;padding:0 5px;font-size:11px}

  /* ---------- 规则 / 自检 / 选项集 ---------- */
  .bd-sub{border:1px solid var(--line);border-radius:9px;padding:9px;margin:8px 0;background:var(--panel2);transition:.16s}
  .bd-sub:hover{border-color:var(--pri-soft)}
  .rule-sentence{background:var(--pri-weak);border:1px solid var(--pri-soft);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--ink);line-height:1.75;margin:6px 0}
  .rule-sentence b{color:var(--pri)}
  .rule-sentence .when{color:#92591b;font-weight:600}

  .vtag{display:inline-block;font-size:11px;border-radius:20px;padding:1px 9px;font-weight:600}
  .vtag.err{background:#fdecec;color:var(--err)}
  .vtag.warn{background:#fff8e6;color:#92591b}
  .rule-enable{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);margin-left:auto}
  .rule-enable input{width:auto}
  /* 停用的规则：声明与视觉一致（否则「开关」是假信号） */
  .rule-off{opacity:.55}
  .rule-off .rule-sentence{text-decoration:line-through}
  .tag-off{font-size:10px;color:var(--sub);background:#f0f1f3;border-radius:4px;padding:0 5px;margin-left:6px}
  .opts-card{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
  .opts-card>.hd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line2);background:var(--panel2);font-weight:600}
  .opts-card>.bd{padding:8px 10px}
  .opt-row{display:flex;align-items:center;gap:6px;margin:4px 0}
  .opt-row input{flex:1;min-width:60px}
  .ov-badge{font-size:10px;color:#7a5b00;background:#fff7e0;border:1px solid #ffe6a3;border-radius:5px;padding:0 5px}
  .tenant-note{background:#fff8e6;border:1px solid #ffe1a8;color:#92591b;border-radius:9px;padding:7px 11px;font-size:12px;margin-bottom:10px;line-height:1.7}
  .lint-item{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin:6px 0;font-size:12px;background:var(--panel);box-shadow:var(--shadow)}
  .lint-item .lv{font-size:11px;border-radius:5px;padding:1px 6px;flex:0 0 auto;font-weight:600}
  .lint-item .lv.err{background:#fdecec;color:var(--err)}
  .lint-item .lv.warn{background:#fff8e6;color:#92591b}
  .lint-item .lv.info{background:var(--line2);color:var(--sub)}
  .insp{margin:6px 0 10px;border:1px solid var(--pri-soft);background:var(--pri-weak);border-radius:9px;padding:9px 11px}
  .insp .insp-hd{font-weight:600;font-size:12px;color:var(--pri);margin-bottom:7px}
  .insp .row{margin:4px 0}
  .pv-header-strip{display:flex;gap:22px;flex-wrap:wrap;background:linear-gradient(135deg,var(--pri-weak),var(--panel));border:1px solid var(--pri-soft);border-radius:12px;padding:13px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
  .pv-header-strip .hs{display:flex;flex-direction:column;gap:3px;min-width:80px}
  .pv-header-strip .hs .k{font-size:11px;color:var(--sub)}
  .pv-header-strip .hs .v{font-weight:700;font-size:13.5px;color:var(--ink)}
  .draft-wrap{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
  .draft-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;transition:.2s}
  .draft-dot.dirty{background:var(--warn);box-shadow:0 0 0 3px #fff4e0}
  .draggable-grip{cursor:grab!important}
  .draggable-grip:active{cursor:grabbing}
  .drag-over{outline:2px dashed var(--pri);outline-offset:2px;border-radius:9px}
  .dragging{opacity:.4}
  /* 码表覆写行（协议 §3.1：只引用 / 改名 / 隐藏，禁止新造 value） */
  .dict-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 8px;border:1px solid var(--line);border-radius:8px;margin:5px 0;background:var(--panel);transition:.16s}
  .dict-row:hover{border-color:var(--pri-soft);background:var(--pri-weak)}
  .dict-row.off{opacity:.55;background:var(--line2)}
  .dict-row.off .dict-val{text-decoration:line-through}
  .dict-val{font-family:var(--mono);font-size:11.5px;color:var(--pri);flex:0 0 90px}
  .dict-row input{flex:1;min-width:90px}

  /* 搜索 / 场景模板 / 可拖拽分栏 */
  .search-box{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:var(--panel);margin-bottom:10px;transition:.16s}
  .search-box:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-weak)}
  .search-box input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--ink);font-size:12px}
  .tpl-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:4px 0}
  .tpl-item{display:inline-flex;align-items:center;gap:4px;border:1px dashed var(--line);background:var(--panel);border-radius:7px;padding:3px 9px;color:var(--sub);font-size:11.5px;transition:.16s}
  .tpl-item:hover{border-style:solid;border-color:var(--pri);color:var(--pri);background:var(--pri-weak);transform:translateY(-1px)}
  .splitter{width:5px;cursor:col-resize;flex:0 0 auto;background:transparent;transition:background .16s}
  .splitter:hover,.splitter.active{background:var(--pri-soft)}
  /* ---------- v1.9 IDE 工作台：瘦顶栏 / 树 + 属性面板 / 浮层 ---------- */
  .cfg-body{display:flex;flex-direction:column;overflow:hidden;padding:0!important}
  .treebar{display:flex;gap:6px;padding:10px 12px 8px;align-items:center;flex:0 0 auto;flex-wrap:wrap}
  .treebar .search-box{flex:1;margin-bottom:0;min-width:140px}
  #cfgTree{flex:1;overflow:auto;padding:2px 12px 12px;min-height:0}
  .tn{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;min-width:0}
  .tn:hover{background:var(--pri-weak)}
  .tn.sel{background:var(--pri-weak);border-color:var(--pri-soft)}
  .tn.grp{font-weight:700;font-size:12.5px;margin-top:6px}
  .tn .code{font-family:var(--mono);font-size:11.5px;color:var(--pri);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tn .kind{font-size:11px;color:var(--sub);background:var(--line2);border-radius:5px;padding:1px 6px;flex:0 0 auto}
  .tn .nm{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tn .cnt{font-size:10.5px;color:var(--sub);background:var(--line2);border-radius:10px;padding:0 7px;flex:0 0 auto}
  .tn .mini{margin-left:auto;display:flex;gap:2px;opacity:0;flex:0 0 auto}
  .tn:hover .mini,.tn.sel .mini{opacity:1}
  .tn .mini .iconbtn{width:23px;height:23px;font-size:12px}
  .tn.reh{border-color:rgba(240,180,41,.6)}
.pv-footer{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;padding:8px 12px;border:1px dashed var(--border);border-radius:8px;font-size:11px;color:var(--muted)}
  .tkids{margin-left:15px;border-left:1px solid var(--line2);padding-left:4px}
  .insp-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);font-weight:700;font-size:12px;flex:0 0 auto}
  .insp-bar .sub{font-weight:400;color:var(--sub);font-size:11px}
  #cfgInsp{flex:0 0 44%;overflow:auto;padding:10px 12px;background:var(--panel2);min-height:0}
  #cfgInsp.hide{display:none}
  .insp-empty{text-align:center;color:var(--sub);font-size:12px;padding:26px 10px;border:1px dashed var(--line);border-radius:10px;background:var(--panel)}
  .pop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px;min-width:300px;max-width:380px;max-height:80vh;overflow:auto}
  .pop h4{margin:0 0 4px;font-size:12px}
  .pop .plab{font-size:11px;color:var(--sub);margin:10px 0 4px;font-weight:700}
  .pop #modeWrap,.pop #variantWrap{display:flex;margin:4px 0}
  .pop #variantBadge{margin:4px 0}
  .pop .idbar{gap:8px}
  .pop #devSeg{margin-top:4px}
  .pop .idbar{flex-wrap:wrap}
  .menu{min-width:210px;padding:6px}
  .menu button{display:flex;width:100%;gap:9px;align-items:center;border:0;background:transparent;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--ink);text-align:left}
  .menu button:hover{background:var(--pri-weak);color:var(--pri)}
  .menu button.danger:hover{background:#fdecec;color:var(--err)}
  [data-theme="dark"] .menu button.danger:hover{background:rgba(248,113,113,.13)}
  .fld.selected{outline:2px solid var(--pri)!important;outline-offset:2px;border-radius:8px}
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:80;display:flex;justify-content:center;padding:12vh 12px 12px;align-items:flex-start}
  .cmdk{width:580px;max-width:94vw;max-height:62vh;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
  .cmdk>input{border:0;border-bottom:1px solid var(--line);padding:13px 16px;font-size:14px;background:transparent;color:var(--ink);outline:none}
  .cmdk-list{overflow:auto;padding:6px}
  .cmdk-item{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .cmdk-item.act{background:var(--pri-weak)}
  .cmdk-item .k{font-size:10.5px;color:var(--sub);background:var(--line2);border-radius:5px;padding:0 6px;margin-left:auto;flex:0 0 auto}
  .cmdk-item .hint{margin-left:auto}
  .onb-card{width:540px;max-width:94vw;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:26px 28px}
  .onb-card h3{margin:0 0 6px;font-size:16px}
  .onb-card p{color:var(--sub);font-size:13px;line-height:1.8;margin:6px 0}
  .onb-dots{display:flex;gap:6px;margin:14px 0}
  .onb-dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
  .onb-dots i.on{background:var(--pri)}
  .onb-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">B</div>
      <div class="brand-txt">
        <div class="t">BONE 业务对象界面协议</div>
        <div class="s">可配置 DEMO · v1.9</div>
      </div>
    </div>

    <div class="hd-group">
      <label class="fld-lbl">样板<select id="sampleSel" title="切换业务场景（报销 / 采购审查 / 医疗理赔）"></select></label>
      <div class="seg" id="viewSeg" title="切换预览视图">
        <button data-v="form" class="active">表单</button>
        <button data-v="list">列表</button>
        <button data-v="detail">详情</button>
      </div>
      <label class="fld-lbl" id="modeWrap">模式
        <select id="modeSel" title="create 新建 / edit 编辑 / view 只读">
          <option value="create">create 新建</option>
          <option value="edit" selected>edit 编辑</option>
          <option value="view">view 只读</option>
        </select>
      </label>
      <label class="fld-lbl" id="variantWrap" style="display:none" title="场景变体：自动按身份裁决（协议 priority+match），也可手动强制">变体<select id="variantSel"></select></label>
      <span class="ctx-badge" id="variantBadge" style="display:none" title="当前命中的变体"></span>
    </div>

    <div class="hd-group">
      <div class="idbar" title="模拟身份（Preview-as）：驱动 $me/$myteam 解析与变体自动裁决，对标 Salesforce Preview-as / Retool 预览身份">
        <label class="fld-lbl">👤<input class="txt" id="ctxMe" value="王五" title="当前用户（$me）"></label>
        <label class="fld-lbl" title="同团队（含自己），$myteam 解析与团队数据范围">团队<input class="txt" id="ctxTeam" value="王五,赵六" style="width:92px" title="逗号分隔"></label>
        <label class="fld-lbl" title="当前用户角色（逗号分隔，变体 roles 匹配）">角色<input class="txt" id="ctxRoles" value="reviewer,admin" style="width:96px"></label>
        <label class="fld-lbl" title="订阅档（变体 tiers 匹配，缺席回落 base）">档位<select id="ctxTier"><option value="">（无）</option><option value="standard">standard</option><option value="pro">pro</option><option value="vip">vip</option></select></label>
        <label class="fld-lbl" title="渠道（变体 channels 匹配）">渠道<select id="ctxChannel"><option value="web">web</option><option value="mobile">mobile</option><option value="api">api</option></select></label>
      </div>
      <div class="seg" id="devSeg" title="预览设备宽度（mobile 档同步 ctx.device，便于验证 devices 变体）">
        <button data-d="desktop" class="active">桌面</button>
        <button data-d="tablet">平板</button>
        <button data-d="mobile">手机</button>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="hd-group">
      <label class="draft-wrap" title="配置改动是否发布生效"><span class="draft-dot" id="draftDot"></span><span id="draftTxt">已发布</span></label>
      <button class="btn sm pri" id="publishBtn" title="将当前配置发布生效（演示，Ctrl+S）">发布</button>
      <span class="hd-div"></span>
      <button class="iconbtn" id="undoBtn" title="撤销 (Ctrl+Z)"></button>
      <button class="iconbtn" id="redoBtn" title="重做 (Ctrl+Shift+Z)"></button>
      <span class="hd-div"></span>
      <button class="btn sm" id="testRunBtn" title="只跑提交校验（不触发动作），结果常驻下方">▶ 试运行</button>
      <button class="btn sm" id="envBtn" title="预览环境：显示模式 / 变体 / 身份模拟 / 设备（原顶栏收拢于此）">预览环境</button>
      <button class="iconbtn" id="moreBtn" title="更多：导入 / 复制 / 下载 / 重置">⋯</button>
      <button class="iconbtn" id="themeBtn" title="切换深色 / 浅色主题"></button>
    </div>
  </header>
  <input type="file" id="importFile" accept=".json" style="display:none" />

  <div class="main">
    <div class="cfg">
      <div class="cfg-body" id="cfgBody"></div>
    </div>

    <div class="splitter" id="splitter" title="拖拽调整配置区宽度"></div>

    <div class="preview" id="preview"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="application/json" id="schemaJsonEmbed">
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "$id": "https://bone.local/schemas/bone-ui-schema-v1.json",
  "title": "BoneUiSchema v1.2",
  "description": "业务对象界面 JSON 协议 v1.2（向后兼容 v1.0/v1.1：所有新增字段可选；v1.0/v1.1 实例仍合法。v1.1 patch 2026-10-13：复合条件 all/any/not、虚拟控件 virtual 标识、上下文变量 $me/$myteam/$all、版本协商 minor、规则编码 code、computedFn.expectedRevenue。v1.2 2026-10-14：规则级启停 enabled/disabledReason、表单页头 pageHeader、码表覆写 dictionaries 结构落实 §3.1；props.optionsRef 关闭提案，改按 fieldCode 隐式绑定码表）。只引用结构真源，不重复定义字段。配套设计见 BONE-业务对象界面JSON协议设计.md §10/§11。通用性覆盖：费用报销 / 医疗理赔(synapClaim) / 采购审查(procuraAI) / 股票投研(synapEquity) / ERP 单据 / CRM 商机。",
  "type": "object",
  "required": [
    "schemaVersion",
    "entityCode",
    "views"
  ],
  "additionalProperties": false,
  "properties": {
    "schemaVersion": {
      "type": "integer",
      "const": 1,
      "description": "大版本锁 1；v1.1 为兼容增量，不升大版本"
    },
    "minor": {
      "type": "integer",
      "default": 2,
      "description": "版本协商：渲染器遇未知 minor 只告警、不拒绝，前向忽略未知字段（业界 JSON Schema 前向兼容惯例）"
    },
    "entityCode": {
      "type": "string",
      "minLength": 1
    },
    "displayModes": {
      "type": "array",
      "items": {
        "enum": [
          "create",
          "edit",
          "view"
        ]
      },
      "default": [
        "create",
        "edit",
        "view"
      ]
    },
    "views": {
      "type": "object",
      "required": [
        "list",
        "form"
      ],
      "additionalProperties": false,
      "properties": {
        "list": {
          "$ref": "#/definitions/listView"
        },
        "form": {
          "$ref": "#/definitions/formView"
        },
        "detail": {
          "$ref": "#/definitions/formView"
        }
      }
    },
    "linkageRules": {
      "type": "array",
      "items": {
        "$ref": "#/definitions/linkageRule"
      }
    },
    "submitRules": {
      "type": "array",
      "items": {
        "$ref": "#/definitions/submitRule"
      }
    },
    "actionBar": {
      "type": "array",
      "items": {
        "type": "object",
        "required": [
          "actionCode"
        ],
        "additionalProperties": false,
        "properties": {
          "actionCode": {
            "type": "string",
            "description": "引用 meta_entity_action_def.actionCode"
          },
          "visibleWhen": {
            "$ref": "#/definitions/condition"
          },
          "sortOrder": {
            "type": "integer"
          },
          "decisionKind": {
            "enum": [
              "open",
              "hitl"
            ],
            "default": "open",
            "description": "hitl=采纳/驳回/改判三态（审查/核赔）"
          },
          "reasonTypes": {
            "type": "array",
            "description": "驳回理由分类（审查六类；理赔拒赔理由）",
            "items": {
              "type": "string"
            }
          },
          "confirm": {
            "type": "object",
            "description": "二次确认（批量采纳/过账不可逆/退款）",
            "required": [
              "title",
              "content"
            ],
            "additionalProperties": false,
            "properties": {
              "title": {
                "type": "string"
              },
              "content": {
                "type": "string"
              },
              "titleKey": {
                "type": "string"
              },
              "contentKey": {
                "type": "string"
              }
            }
          },
          "maxRounds": {
            "type": "integer",
            "minimum": 1,
            "description": "处置流最多 3 轮，超限转人工"
          },
          "requireDualApproveWhen": {
            "$ref": "#/definitions/condition",
            "description": "大额双人复核门控（如金额≥10000）"
          }
        }
      }
    },
    "footer": {
      "type": "object",
      "description": "常驻合规条（投研免责+AI 标识；理赔条款依据入口）",
      "additionalProperties": false,
      "properties": {
        "disclaimer": {
          "type": "string"
        },
        "aiBadge": {
          "type": "boolean",
          "default": false
        },
        "mockDataMark": {
          "type": "boolean",
          "default": false
        },
        "disclaimerKey": {
          "type": "string"
        }
      }
    },
    "dictionaries": {
      "type": "object",
      "description": "枚举/码表覆写：只允许「引用」元数据域 enumValues，不允许在 UI 层新造 value（协议 §3.1）。key = 码表 code，值为覆写体。",
      "additionalProperties": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "labelOverride": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            },
            "description": "value -> 显示名覆写；未列出的 value 沿用元数据域原名"
          },
          "hidden": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "本表单隐藏的 value 列表（只能在既有 value 内裁剪，不得新增）"
          }
        }
      }
    },
    "i18n": {
      "type": "object",
      "description": "key 引用式 i18n：文案字段配 *Key 即走 t(namespace:key)，缺失回落内联中文（fallbackLng zh-CN，与 shared-utils/i18n 同源；切换经 Shell 广播，各应用不得自决语言）",
      "additionalProperties": false,
      "properties": {
        "namespace": {
          "type": "string",
          "description": "如 bone.ui.t_claim_case；键缺失时渲染内联中文，不裸奔 key"
        }
      }
    },
    "base": {
      "type": "object",
      "description": "模板跟随指针（实例侧元数据）：只声明来源与版本，合入走租户确认式 pull（diff 预览→一键合入），永不自动推送",
      "additionalProperties": false,
      "properties": {
        "templateCode": {
          "type": "string"
        },
        "baseVersion": {
          "type": "string"
        },
        "followMode": {
          "enum": [
            "pinned",
            "notify"
          ],
          "default": "pinned",
          "description": "pinned=不提示更新；notify=有新版本时提示（仍须租户确认合入）"
        }
      }
    },
    "variants": {
      "type": "array",
      "description": "场景变体（同一实体多副面孔）：员工端/审批端、免费/付费、法务/采购。无 variants 时即今日行为（全量兼容）。命中裁决见 §12：按 priority 首个全匹配胜出；命中后按块整块替换 base 对应块（views.list/form/detail、linkageRules、submitRules、actionBar），不做深度归并（可预测）",
      "items": {
        "$ref": "#/definitions/variant"
      }
    }
  },
  "definitions": {
    "formView": {
      "type": "object",
      "required": [
        "sections"
      ],
      "additionalProperties": false,
      "properties": {
        "pageHeader": {
          "type": "array",
          "items": {
            "type": "string"
          },
          "description": "页头关键信息条（字段 code 列表），独立于 sections 渲染在表单顶部（如案件号/申请人）；引用的字段必须同时存在于某个 section，否则视为悬空引用（机器校验 ERROR）。form/detail 视图各自独立配置"
        },
        "sections": {
          "type": "array",
          "minItems": 1,
          "items": {
            "type": "object",
            "required": [
              "id",
              "title",
              "controls"
            ],
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "kind": {
                "enum": [
                  "form",
                  "dashboard",
                  "timeline",
                  "compare",
                  "report",
                  "tasks"
                ],
                "default": "form",
                "description": "dashboard=统计卡区；timeline=版本链/决策轨迹；compare=三一致对照/对账；report=数字注入报告；tasks=待办"
              },
              "layout": {
                "enum": [
                  "single",
                  "split-left-40",
                  "split-left-60"
                ],
                "default": "single",
                "description": "审查报告左右分栏用 split"
              },
              "controls": {
                "type": "array",
                "minItems": 1,
                "items": {
                  "$ref": "#/definitions/control"
                }
              },
              "titleKey": {
                "type": "string"
              }
            }
          }
        }
      }
    },
    "control": {
      "type": "object",
      "required": [
        "fieldCode"
      ],
      "additionalProperties": false,
      "properties": {
        "fieldCode": {
          "type": "string"
        },
        "virtual": {
          "type": "boolean",
          "default": false,
          "description": "展示型控件（STAT/CHART/TIMELINE/COMPUTED 聚合口径）必须 virtual:true，声明该 fieldCode 不是 meta_field 引用，经 dataRef/lineage 解析，禁与真实字段码碰撞"
        },
        "controlKind": {
          "enum": [
            "INPUT",
            "TEXTAREA",
            "NUMBER",
            "MONEY",
            "SWITCH",
            "DATE",
            "DATETIME",
            "ENUM",
            "REFERENCE",
            "CHILD_TABLE",
            "ATTACHMENT",
            "SLIDER",
            "CHART",
            "STAT",
            "QUOTE",
            "TIMELINE",
            "COMPUTED",
            "ALERT"
          ]
        },
        "labelOverride": {
          "type": "string"
        },
        "placeholder": {
          "type": "string"
        },
        "readonly": {
          "type": "boolean"
        },
        "visible": {
          "type": "boolean",
          "description": "控件静态默认可见性；缺省 = true。false 表示默认隐藏，由联动规则 then[].visible 动态揭示（与 then[].visible 配合，先隐后显）"
        },
        "props": {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "min": {
              "type": "number"
            },
            "max": {
              "type": "number"
            },
            "step": {
              "type": "number"
            },
            "precision": {
              "type": "integer",
              "minimum": 0,
              "maximum": 6
            },
            "maxLength": {
              "type": "integer",
              "minimum": 1
            },
            "rows": {
              "type": "integer",
              "minimum": 1,
              "maximum": 20
            },
            "currencyField": {
              "type": "string"
            },
            "targetEntity": {
              "type": "string"
            },
            "labelField": {
              "type": "string"
            },
            "valueField": {
              "type": "string",
              "const": "id"
            },
            "childEntity": {
              "type": "string"
            },
            "columns": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "maxCount": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50
            },
            "maxSizeMB": {
              "type": "integer",
              "minimum": 1,
              "maximum": 500
            },
            "chartType": {
              "enum": [
                "line",
                "band",
                "scatter",
                "matrix",
                "funnel",
                "bar",
                "donut"
              ],
              "description": "投研 PE Band/敏感性矩阵/同业散点；CRM 漏斗；财务趋势；donut=环形占比（费用构成/风险分布）。"
            },
            "dataRef": {
              "type": "string",
              "description": "图表数据源引用（快照/聚合口径 code），UI 不自算"
            },
            "computedFn": {
              "enum": [
                "daysLeft",
                "pricePosition",
                "debitDiff",
                "payableAmount",
                "expectedRevenue"
              ],
              "description": "命名计算白名单：剩余天数/价格区间位置/借贷差额/应赔金额/预期收入(金额×概率)。纯前端展示，资金与理算仍后端确定性计算"
            },
            "computedFrom": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "anchorRef": {
              "type": "string",
              "description": "原文锚点 section_ref，点击滚动定位（审查 quote_original+basis）"
            },
            "lineage": {
              "type": "string",
              "description": "数字溯源：数据源+口径+计算链路说明 key"
            },
            "ai": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "generated": {
                  "type": "boolean"
                },
                "confidence": {
                  "type": "number",
                  "minimum": 0,
                  "maximum": 1
                }
              }
            },
            "mask": {
              "enum": [
                "hash",
                "last4"
              ],
              "description": "PII 脱敏显示（理赔假名化 ID）"
            },
            "tier": {
              "type": "array",
              "description": "订阅档可见性 free/pro（投研跟踪提醒付费）",
              "items": {
                "type": "string"
              }
            },
            "roles": {
              "type": "array",
              "description": "四角色可见性（法务/采购/管理员/IT；销售/经理）",
              "items": {
                "type": "string"
              }
            },
            "warningText": {
              "type": "string",
              "description": "内联即时警告（禁用条款红字；DCF 手动假设强警告）"
            },
            "quoteText": {
              "type": "string",
              "description": "引用块正文；QUOTE 控件展示文案（无 anchorRef 时也可独立成卡）"
            }
          }
        },
        "labelKey": {
          "type": "string"
        }
      }
    },
    "condition": {
      "type": "object",
      "additionalProperties": false,
      "description": "原子条件（fieldCode+operator）或组合（all/any/not 三选一与原子互斥；all 空数组=真，any 空数组=假）。快赔四条件（R-FAST-01）必须用 all 表达，禁拆成四条独立规则（语义从“与”漂成“或”）。深度上限 3，超限发布校验 ERROR。",
      "properties": {
        "fieldCode": {
          "type": "string"
        },
        "operator": {
          "enum": [
            "isNull",
            "isNotNull",
            "in",
            "notIn",
            "eq",
            "neq",
            "gt",
            "gte",
            "lt",
            "lte",
            "between",
            "earlierThan",
            "laterThan"
          ]
        },
        "value": {},
        "valueType": {
          "enum": [
            "fixed",
            "field"
          ],
          "default": "fixed"
        },
        "compareField": {
          "type": "string"
        },
        "all": {
          "type": "array",
          "items": {
            "$ref": "#/definitions/condition"
          }
        },
        "any": {
          "type": "array",
          "items": {
            "$ref": "#/definitions/condition"
          }
        },
        "not": {
          "$ref": "#/definitions/condition"
        }
      }
    },
    "linkageRule": {
      "type": "object",
      "required": [
        "when",
        "then"
      ],
      "additionalProperties": false,
      "properties": {
        "name": {
          "type": "string"
        },
        "code": {
          "type": "string",
          "description": "规则编码（前后端对账用：前端先拦、后端强制同一 code，日志与审计对齐，防两边文案漂移）"
        },
        "enabled": {
          "type": "boolean",
          "default": true,
          "description": "规则级启停。缺省/true 生效；显式 false 时渲染引擎与后端强制均跳过本条（可临时停用而不删除规则，保留审计轨迹）"
        },
        "disabledReason": {
          "type": "string",
          "description": "停用原因（enabled:false 时建议填写）。停用后若不记原因，排查期只剩「谁关的」没有「为什么关」，与 §13.1 的审计意图不符"
        },
        "when": {
          "$ref": "#/definitions/condition"
        },
        "then": {
          "type": "array",
          "minItems": 1,
          "items": {
            "type": "object",
            "required": [
              "fieldCode"
            ],
            "additionalProperties": false,
            "properties": {
              "fieldCode": {
                "type": "string"
              },
              "visible": {
                "type": "boolean"
              },
              "required": {
                "type": "boolean"
              },
              "readonly": {
                "type": "boolean"
              },
              "disabled": {
                "type": "boolean",
                "description": "动作/按钮可用性（v1.1 新增）"
              },
              "notice": {
                "type": "string",
                "description": "内联提示文案（黄色核对标注；v1.1 新增）"
              },
              "tier": {
                "type": "array",
                "items": {
                  "type": "string"
                }
              },
              "value": {},
              "noticeKey": {
                "type": "string"
              }
            }
          }
        }
      }
    },
    "submitRule": {
      "type": "object",
      "required": [
        "name",
        "function",
        "fields",
        "operator",
        "message"
      ],
      "additionalProperties": false,
      "properties": {
        "name": {
          "type": "string"
        },
        "code": {
          "type": "string",
          "description": "规则编码（前后端对账用，同 linkageRule.code）"
        },
        "enabled": {
          "type": "boolean",
          "default": true,
          "description": "规则级启停，语义同 linkageRule.enabled（false 时后端强制执行也跳过）"
        },
        "disabledReason": {
          "type": "string",
          "description": "停用原因，语义同 linkageRule.disabledReason"
        },
        "when": {
          "$ref": "#/definitions/condition",
          "description": "可选生效前置（如拒赔完整性仅 status=REJECTING 时跑；缺省全量跑。串联验证实证：无 when 则 SUB-COMP-01 误伤正常提交）"
        },
        "function": {
          "enum": [
            "sum",
            "count",
            "max",
            "min",
            "compare",
            "balance",
            "unique",
            "consistency",
            "completeness"
          ],
          "description": "compare=两值直接比较（取 fields[0] 为左值，如结束≥开始）；balance=借贷平衡；unique=查重提示；consistency=发票vs清单；completeness=模板要素完整性（拒赔≥3理由/研究卡片六要素）"
        },
        "fields": {
          "type": "array",
          "minItems": 1,
          "items": {
            "type": "string"
          }
        },
        "operator": {
          "enum": [
            "eq",
            "neq",
            "gt",
            "gte",
            "lt",
            "lte"
          ]
        },
        "compare": {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "valueType": {
              "enum": [
                "fixed",
                "field"
              ]
            },
            "value": {},
            "fieldCode": {
              "type": "string"
            }
          }
        },
        "params": {
          "type": "object",
          "description": "命名断言参数（tolerance 差额容差；minReasons 最少理由数；scope 查重范围）",
          "additionalProperties": false,
          "properties": {
            "tolerance": {
              "type": "number"
            },
            "minReasons": {
              "type": "integer",
              "minimum": 1
            },
            "scope": {
              "type": "string"
            }
          }
        },
        "verifyType": {
          "enum": [
            "ERROR",
            "WARNING"
          ],
          "default": "ERROR"
        },
        "message": {
          "type": "string",
          "minLength": 1
        },
        "messageKey": {
          "type": "string"
        }
      }
    },
    "variant": {
      "type": "object",
      "required": [
        "key",
        "match"
      ],
      "additionalProperties": false,
      "properties": {
        "key": {
          "type": "string",
          "description": "变体键（稳定，缓存/审计引用），如 reviewer、pro"
        },
        "label": {
          "type": "string"
        },
        "labelKey": {
          "type": "string"
        },
        "priority": {
          "type": "integer",
          "default": 100,
          "description": "越小越优先；缺省 100；同值按数组序"
        },
        "match": {
          "type": "object",
          "description": "全维度同时满足才命中；维度缺省=通配。roles 来自 JWT 应用角色；tiers 来自订阅档上下文；channels 载体（web/h5/miniapp，投研载体决策即此维度）；devices 形态（desktop/mobile，触控与底部导航即此维度）",
          "additionalProperties": false,
          "properties": {
            "roles": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "tiers": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "channels": {
              "type": "array",
              "items": {
                "type": "string",
                "description": "如 web/h5/miniapp（投研载体决策即此维度）"
              }
            },
            "devices": {
              "type": "array",

/* ---------- 规则句子化（对标 TPA：规则以自然语言呈现，便于审核） ---------- */
function condText(cond){
  if(!cond)return "（无条件）";
  if(cond.all)return "( "+cond.all.map(condText).join(" 且 ")+" )";
  if(cond.any)return "( "+cond.any.map(condText).join(" 或 ")+" )";
  if(cond.not)return "非( "+condText(cond.not)+" )";
  const f=cond.fieldCode||"?";
  const op=opLabel(cond.operator)||cond.operator||"";
  let v=cond.value;
  if(cond.valueType==="field")v=(cond.compareField||cond.value);
  let s=f+" "+op;
  if(!["isNull","isNotNull"].includes(cond.operator))s+=" "+(v==null?"":v);
  return s;
}
function describeLinkage(r){
  const wt=condText(r.when);
  const ts=(r.then||[]).map(t=>{
    const parts=[];
    if(t.visible!==undefined)parts.push(t.visible?"可见":"隐藏");
    if(t.required!==undefined)parts.push(t.required?"必填":"非必填");
    if(t.readonly!==undefined)parts.push(t.readonly?"只读":"可编辑");
    if(t.disabled!==undefined)parts.push(t.disabled?"禁用":"启用");
    if(t.notice)parts.push("提示「"+t.notice+"」");
    if("value" in t)parts.push("赋值 "+t.value);
    return (t.fieldCode||"?")+" 的 "+(parts.join("、")||"变化");
  });
  return "当 <span class='when'>"+wt+"</span> 时，<b>"+(ts.join("；")||"—")+"</b>。";
}
function describeSubmit(r){
  const fn=r.function||"compare";
  const flds=(r.fields||[]).join(", ")||"（未指定字段）";
  let cmp="自身";
  if(r.compare)cmp=(r.compare.valueType==="field"?("字段 "+r.compare.fieldCode):("值 "+r.compare.value));
  const vt=r.verifyType||"ERROR";
  // 引擎 runSubmitRules 支持 when；句子必须体现，否则审核看不到生效前提
  const wt=(r.when&&Object.keys(r.when).length)?("仅当 <span class='when'>"+condText(r.when)+"</span> 时，"):"";
  return wt+"提交时校验：<b>"+fn+"("+flds+")</b> "+opLabel(r.operator)+" "+cmp+" → "+(r.message||"无提示")+"（"+(vt==="ERROR"?"强校验":"弱校验")+"）";
}
function findControl(view,fc){let r=null;(view.sections||[]).forEach(s=>(s.controls||[]).forEach(c=>{if(c.fieldCode===fc)r=c;}));return r;}
function describeAction(a){
  const w=a.visibleWhen?condText(a.visibleWhen):"（始终可见）";
  let s="当 <span class='when'>"+w+"</span> 时，动作 <b>"+(a.actionCode||"?")+"</b> 可见";
  if(a.decisionKind==="hitl")s+="（<b>HITL 人工决策</b>"+(a.reasonTypes&&a.reasonTypes.length?" · 理由："+a.reasonTypes.join("/"):"")+(a.maxRounds?" · 最多 "+a.maxRounds+" 轮":"")+"）";
  return s+"。";
}

function matchVariant(v){

  const m=v.match||{};

  if(m.tiers&&m.tiers.length&&!m.tiers.includes(state.ctx.tier))return false;
  if(m.channels&&m.channels.length&&!m.channels.includes(state.ctx.channel))return false;
  if(m.devices&&m.devices.length&&!m.devices.includes(state.ctx.device))return false;
  return true;
}

function resolveVariant(){

/* ============================================================
 *  条件 / 联动 / 提交 引擎
 * ============================================================ */
function getVal(path){
  // 支持 items.amount 数组穿透
  const parts=path.split(".");
  let cur=state.values;
  for(let i=0;i<parts.length-1;i++){
    cur=cur?cur[parts[i]]:undefined;
    if(cur==null)return undefined;
  }
  return cur?cur[parts[parts.length-1]]:undefined;
}
function setVal(path,val){
  const parts=path.split(".");
  let cur=state.values;
  for(let i=0;i<parts.length-1;i++){
    if(cur[parts[i]]==null||typeof cur[parts[i]]!=="object")cur[parts[i]]=[];
    cur=cur[parts[i]];
  }
  cur[parts[parts.length-1]]=val;
}
function cmp(a,b){
  const na=parseFloat(a),nb=parseFloat(b);
  if(!isNaN(na)&&!isNaN(nb))return na-nb;
  return String(a)<String(b)?-1:String(a)>String(b)?1:0;
}
function evalCondition(cond,depth){
  if(!cond)return true;
  depth=depth||0;
  if(depth>3){console.warn("[ui-schema-demo] 条件嵌套超 3 层，fail-closed 不命中");return false;}
  if(cond.all)return cond.all.every(c=>evalCondition(c,depth+1));
  if(cond.any)return cond.any.some(c=>evalCondition(c,depth+1));
  if(cond.not)return !evalCondition(cond.not,depth+1);
  if(!cond.fieldCode)return true;
  const fv=getVal(cond.fieldCode);
  const op=cond.operator;
  if(op==="isNull")return fv==null||fv==="";
  if(op==="isNotNull")return !(fv==null||fv==="");
  let rv=cond.valueType==="field"?getVal(cond.compareField||cond.value):ctxVal(cond.value);
  if(cond.valueType!=="field"&&rv==="$all")return true;   // $all 通配：任何前件恒成立（与生产一致）
  if(op==="eq")return fv==rv;
  if(op==="neq")return fv!=rv;
  if(op==="in")return Array.isArray(rv)&&rv.includes(fv);
  if(op==="notIn")return Array.isArray(rv)&&!rv.includes(fv);
  if(op==="gt")return cmp(fv,rv)>0;
  if(op==="gte")return cmp(fv,rv)>=0;
  if(op==="lt")return cmp(fv,rv)<0;
  if(op==="lte")return cmp(fv,rv)<=0;
  if(op==="between")return Array.isArray(rv)&&cmp(fv,rv[0])>=0&&cmp(fv,rv[1])<=0;
  if(op==="earlierThan")return cmp(fv,rv)<0;
  if(op==="laterThan")return cmp(fv,rv)>0;
  return false; // 未知操作符 fail-closed 不命中（与生产引擎一致，防拼写漂移静默放行）
}
function applyLinkage(){
  const cs={}; // fieldCode -> {visible,required,readonly,disabled,notice,value}
  const rules=(state.schema.linkageRules||[]);
  state._fired=[];
  for(const r of rules){
    if(r.enabled===false)continue;
    if(!evalCondition(r.when))continue;
    let hasNotice=false;
    for(const t of (r.then||[])){if(t.notice!==undefined)hasNotice=true;}
    state._fired.push({code:r.code||r.name||"未命名",name:r.name||r.code||"",notice:hasNotice});
    for(const t of (r.then||[])){
      const fc=t.fieldCode;
      cs[fc]=cs[fc]||{};
      if(t.visible!==undefined)cs[fc].visible=t.visible;
      if(t.required!==undefined)cs[fc].required=t.required;
      if(t.readonly!==undefined)cs[fc].readonly=t.readonly;
      if(t.disabled!==undefined)cs[fc].disabled=t.disabled;
      if(t.notice!==undefined)cs[fc].notice=t.notice;
      if(t.tier!==undefined)cs[fc].tier=t.tier;
      if("value" in t){cs[fc].value=t.value;setVal(fc,t.value);}
      cs[fc]._rule=r.code||r.name||"";   // 记录驱动该字段的规则，便于预览追溯
    }
  }
  return cs;
}
function resolveVal(path){
  // 字段引用或固定值
  const v=getVal(path);
  return v;
}
function aggField(fieldPath){
  // items.amount -> 数组各值
  const parts=fieldPath.split(".");
  if(parts.length===1)return [getVal(parts[0])];
  const arr=state.values[parts[0]];
  if(!Array.isArray(arr))return [];
  return arr.map(r=>r&&r[parts[1]]).filter(x=>x!==undefined&&x!=="");
}
function numList(paths){
  // 多字段数值聚合（balance/consistency/sum/min/max 用）：只收数值
  const out=[];
  paths.forEach(p=>aggField(p).forEach(x=>{const n=parseFloat(x);if(!isNaN(n))out.push(n);}));
  return out;
}
function countFilled(paths){
  // 非空计数（count/completeness 用）：数组计非空元素，标量非空计 1
  let n=0;
  paths.forEach(p=>{
    const v=getVal(p);
    if(Array.isArray(v))v.forEach(x=>{if(x!=null&&x!=="")n++;});
    else if(v!=null&&v!=="")n++;
  });
  return n;
}
function scalarOrSum(path){
  const v=getVal(path);
  if(Array.isArray(v))return v.map(x=>parseFloat(x)).filter(x=>!isNaN(x)).reduce((a,b)=>a+b,0);
  const n=parseFloat(v);
  return isNaN(n)?v:n;
}
function dupCombo(paths){
  // 本单判重（unique 前端诚实口径）：数组行组内判重，标量组合全非空即提醒
  const cols=paths.map(p=>getVal(p));
  if(cols.some(Array.isArray)){
    const len=Math.max(0,...cols.map(c=>Array.isArray(c)?c.length:0));
    const seen=new Set();
    for(let i=0;i<len;i++){
      const k=JSON.stringify(cols.map(c=>Array.isArray(c)?(c[i]==null?null:c[i]):c));
      if(seen.has(k))return true;
      seen.add(k);
    }
    return false;
  }
  return cols.every(v=>v!=null&&v!=="");
}
function runSubmitRules(){
  const out=[];
  for(const r of (state.schema.submitRules||[])){
    if(r.enabled===false)continue;
    if(r.when && !evalCondition(r.when))continue;
    const tag=r.code||r.name||"校验";
    const tol=(r.params&&r.params.tolerance!=null)?r.params.tolerance:0.005;
    if(r.function==="unique"){ // 命中即按 verifyType 出 message（operator/compare 不参与）
      if(dupCombo(r.fields||[]))out.push({level:(r.verifyType||"ERROR"),code:r.code,name:r.name,message:r.message});
      continue;
    }
    let leftVal,rightVal;
    if(r.function==="balance"){ // fields[0] 借方和 vs fields[1] 贷方和
      if(!(r.fields||[])[1]){out.push({level:"ERROR",code:r.code,name:r.name,message:"配置错误：balance 需两组字段（借/贷）"});continue;}
      leftVal=numList([(r.fields||[])[0]]).reduce((a,b)=>a+b,0);
      rightVal=numList([(r.fields||[])[1]]).reduce((a,b)=>a+b,0);
    }else if(r.function==="consistency"){ // fields[0] 标量 vs 其余列聚合和
      leftVal=scalarOrSum((r.fields||[])[0]);
      rightVal=numList((r.fields||[]).slice(1)).reduce((a,b)=>a+b,0);
    }else if(r.function==="completeness"){ // 非空要素数 vs minReasons（缺省 fields.length）
      leftVal=countFilled(r.fields||[]);
      rightVal=(r.params&&r.params.minReasons!=null)?r.params.minReasons:(r.fields||[]).length;
    }else{
      const left=aggField(r.fields[0]);
      if(r.function==="sum")leftVal=left.reduce((s,x)=>s+(parseFloat(x)||0),0);
      else if(r.function==="count")leftVal=countFilled(r.fields||[]);
      else if(r.function==="max")leftVal=left.length?Math.max(...left.map(Number)):0;
      else if(r.function==="min")leftVal=left.length?Math.min(...left.map(Number)):0;
      else if(r.function==="compare")leftVal=parseFloat(left[0])||0;
      else{out.push({level:"ERROR",code:r.code,name:r.name,message:"配置错误：未知函数 "+r.function+"（rule="+tag+")"});continue;}
      if(r.compare){
        rightVal=r.compare.valueType==="field"?parseFloat(getVal(r.compare.fieldCode)):parseFloat(r.compare.value);
      }else{out.push({level:"ERROR",code:r.code,name:r.name,message:"配置错误："+r.function+" 缺 compare 右值（rule="+tag+")"});continue;}
    }
    let ok=true;
    const op=r.operator;
    if((op==="eq"||op==="neq")&&typeof leftVal==="number"&&typeof rightVal==="number"){
      const eqOK=Math.abs(leftVal-rightVal)-tol<=1e-9; // 含边界通过 + 浮点护栏（100.01-100 陷阱）
      ok=op==="eq"?eqOK:!eqOK;
    }
    else if(op==="eq")ok=leftVal==rightVal;
    else if(op==="neq")ok=leftVal!=rightVal;
    else if(op==="gt")ok=leftVal>rightVal;
    else if(op==="gte")ok=leftVal>=rightVal;
    else if(op==="lt")ok=leftVal<rightVal;
    else if(op==="lte")ok=leftVal<=rightVal;
    else ok=false;
    if(!ok){
      out.push({level:(r.verifyType||"ERROR"),code:r.code,name:r.name,message:r.message});
    }
  }
  return out;
}

/* ============================================================
 *  渲染：表单 / 详情
 * ============================================================ */
function ctrlLabel(c){
  return c.labelOverride||c.fieldCode;
}
function isReadonly(c){
  if(state.mode==="view")return true;
  return !!c.readonly;
}
/* 字典覆写：协议 §3.1 —— 码表真源在元数据域（meta_field.enumValues），
 * UI Schema 只允许「引用」，覆写限于改显示名 / 隐藏选项，不允许新造 value。
 * 覆写结果落在协议已有字段 schema.dictionaries[setKey] = { labelOverride:{}, hidden:[] }。 */
function dictOv(setKey){
  const d=state.schema.dictionaries;
  return (d&&d[setKey])?d[setKey]:null;
}
function optList(c){
  // 协议 §3.1：码表真源在元数据域，UI 层不显式引用——按字段自带 enumValues「隐式绑定」（key = fieldCode）
  // props.optionsRef 仅作历史 JSON 的兼容路径保留（不在协议白名单，自检按 WARNING 报出）
  if(c&&c.props&&c.props.options&&Array.isArray(c.props.options))return c.props.options;
  let ref=null;
  if(c&&c.props&&c.props.optionsRef)ref=c.props.optionsRef;
  else if(c&&c.fieldCode)ref=c.fieldCode;
  else if(typeof c==="string")ref=c;
  if(!ref)return [];
  const base=MOCK.options[ref]||[];
  const ov=dictOv(ref);
  if(!ov)return base;
  const hidden=ov.hidden||[];
  return base
    .filter(o=>!hidden.includes(o.value))
    .map(o=>({value:o.value,label:(ov.labelOverride||{})[o.value]||o.label}));
}
function renderControl(c,cs,si){
  const st=cs[c.fieldCode]||{};
  // 基线态优先控件声明（如专票税号/第二核赔人默认隐藏），联动规则再覆盖（与生产引擎 baseStates 同语义）
  const visible=(c.visible===false&&st.visible===undefined)?false:st.visible!==false;
  const required=st.required===true;
  const readonly=isReadonly(c)||st.readonly===true;
  const disabled=st.disabled===true;
  const notice=st.notice;
  const isSel=state.selected&&(state.selected.type==="control"||state.selected.type==="vcontrol")&&state.selected.fc===c.fieldCode;
  const fld=el("div",{class:"fld"+(visible?"":" vis-off")+(isSel?" selected":"")});
  const lbl=el("label",{},ctrlLabel(c));
  if(required)lbl.append(el("span",{class:"req"},"*"));
  if(readonly)lbl.append(el("span",{class:"ro"},"只读"));
  if(c.virtual)lbl.append(el("span",{class:"pill"},"virtual"));
  if(st.tier!==undefined)lbl.append(el("span",{class:"pill",title:"该字段被联动规则标注了档位（then.tier）"},"档位 "+(Array.isArray(st.tier)?st.tier.join(","):st.tier)));
  if(st._rule)lbl.append(el("span",{class:"pill link",title:"该字段状态由这条联动规则驱动"},"联动 "+st._rule));
  fld.append(lbl);
  if(notice)fld.append(el("div",{class:"notice"},notice));
  if(c.fieldCode&&!c.virtual){
    // 选择即所得（替代 inspect 模式）：点预览字段 = 选中，左侧树同步 + 属性面板切换
    fld.dataset.fc=c.fieldCode;
    fld.title="点击选中，在左侧属性面板编辑";
    fld.addEventListener("click",e=>{e.stopPropagation();selectControl(c.fieldCode);});
  }

  const kind=c.controlKind||"INPUT";
  const val=getVal(c.fieldCode);

    if(curCode){curSel.value=getVal(curCode)||"CNY";curSel.addEventListener("change",()=>{setVal(curCode,curSel.value);refreshPreview();});}
    inp.addEventListener("change",()=>{setVal(c.fieldCode,inp.value===""?null:inp.value);refreshPreview();});

  else if(kind==="SWITCH"){

    fld.append(sw);
  }
  else if(kind==="DATE"||kind==="DATETIME"){
    const inp=el("input",{type:kind==="DATE"?"date":"datetime-local",value:val||"",disabled:dis,readonly:dis});
    inp.addEventListener("change",()=>{setVal(c.fieldCode,inp.value);refreshPreview();});
    fld.append(inp);
  }
  else if(kind==="ENUM"){
    const sel=el("select",{disabled:dis,readonly:dis});
    sel.append(el("option",{value:""},"请选择"));
    optList(c).forEach(o=>sel.append(el("option",{value:o.value},o.label)));
    sel.value=val||"";
    sel.addEventListener("change",()=>{setVal(c.fieldCode,sel.value);refreshPreview();});
    fld.append(sel);
  }
  else if(kind==="REFERENCE"){
    const sel=el("select",{disabled:dis,readonly:dis});
    sel.append(el("option",{value:""},"请选择"));
    optList(c).forEach(o=>sel.append(el("option",{value:o.value},o.label)));
    sel.value=val||"";
    sel.addEventListener("change",()=>{setVal(c.fieldCode,sel.value);refreshPreview();});
    fld.append(sel);
    if(!dis)fld.append(el("div",{class:"hint"},"引用 "+ (c.props&&c.props.targetEntity||"-")+" · labelField "+(c.props&&c.props.labelField||"name")));
  }
  else if(kind==="CHILD_TABLE"){
    fld.append(renderChildTable(c,dis));
  }
  else if(kind==="ATTACHMENT"){
    fld.append(renderAttachment(c,dis));
  }
  else if(kind==="SLIDER"){
    const row=el("div",{class:"slider-row"});
    const s=el("input",{type:"range",disabled:dis});
    if(c.props){if(c.props.min!=null)s.min=c.props.min;if(c.props.max!=null)s.max=c.props.max;if(c.props.step!=null)s.step=c.props.step;}
    s.value=val||s.min||0;
    const out=el("span",{},s.value);
    s.addEventListener("input",()=>out.textContent=s.value);
    s.addEventListener("change",()=>{setVal(c.fieldCode,s.value);});
    row.append(s,out);
    fld.append(row);
  }
  else if(kind==="STAT"||kind==="COMPUTED"){
    const v=(c.props&&c.props.valueRef)?MOCK.agg[c.props.valueRef]:(c.props&&c.props.computedFn?computeFn(c):"—");
    fld.append(el("div",{class:"stat stat-flat"},el("div",{class:"v"},v),el("div",{class:"k"},ctrlLabel(c))));
  }
  else if(kind==="QUOTE"){
    fld.append(el("div",{class:"quote"},"“"+ (val||"此处展示原文片段，锚点 "+((c.props&&c.props.anchorRef)||"-")) +"”"));
  }
  else if(kind==="TIMELINE"){
    const tl=el("div",{class:"timeline"});
    const items=MOCK.sampleTimeline||[{t:"创建",d:"2026-09-01"},{t:"提交",d:"2026-09-02"},{t:"审核中",d:"2026-09-03"}];
    items.forEach(it=>tl.append(el("div",{class:"tl-item"},el("div",{class:"tl-t"},it.t),el("div",{class:"tl-d"},it.d))));
    fld.append(tl);
  }
  else if(kind==="CHART"){
    fld.append(renderChart(c));
  }
  else if(kind==="ALERT"){
    fld.append(el("div",{class:"alert-box"},c.labelOverride||"告警提示"));
  }
  else{
    fld.append(el("div",{class:"hint"},"未支持类型："+kind+"（降级占位）"));
  }
  return fld;
}
function computeFn(c){
  const fn=c.props&&c.props.computedFn;
  const amt=parseFloat(getVal("amount"))||0;
  if(fn==="payableAmount")return (amt*0.8).toFixed(2);
  if(fn==="expectedRevenue")return (amt*0.6).toFixed(2);
  if(fn==="daysLeft")return "—";
  return "—";
}

function renderChart(c){
  const box=el("div",{class:"chart-box"});
  box.append(el("div",{},"图表类型："+(c.props&&c.props.chartType||"bar")+" · dataRef "+(c.props&&c.props.dataRef||"-")));
  const bars=el("div",{class:"bars"});
  // 同一 dataRef 高度稳定（entityCode+dataRef 决定伪随机种子）：仪表盘每次渲染不跳动，评审时可读
  let bseed=0;const bs=String(state.schema.entityCode)+"|"+String(c.props&&c.props.dataRef||"");
  for(let i=0;i<bs.length;i++)bseed=(bseed*31+bs.charCodeAt(i))>>>0;
  const n=5;for(let i=0;i<n;i++){bseed=(bseed*1103515245+12345)>>>0;const h=24+Math.round((bseed>>>16)%1000/1000*66);bars.append(el("div",{class:"bar",style:"height:"+h+"%"},h));}
  box.append(bars);
  if(!MOCK.agg[c.props&&c.props.dataRef])box.append(el("div",{class:"hint"},"⚠ 聚合口径未接入（协议要求 UI 不自算，仅引用 dataRef）"));
  return box;
}
function selectControl(fc){
  // 预览点选 = 选择态：基线优先定位 (si,ci)，变体独有字段走 vcontrol（引用直连变体对象，编辑即生效）
  const base=state.schema.views.form||{sections:[]};
  for(let si=0;si<(base.sections||[]).length;si++){
    const ctrls=base.sections[si].controls||[];
    for(let ci=0;ci<ctrls.length;ci++){
      if(ctrls[ci].fieldCode===fc){
        state.selected={type:"control",si,ci,fc};
        renderConfig();flashTree("cfg-"+si+"-"+ci);flashPreview(fc);return;
      }
    }
  }
  const av=activeFormView();
  for(const sec of (av.sections||[])){
    const hit=(sec.controls||[]).find(c=>c.fieldCode===fc);
    if(hit){
      state.selected={type:"vcontrol",fc,ref:hit,vkey:(resolveVariant()||{}).key||""};
      renderConfig();flashPreview(fc);
      toast("该字段来自变体（基线树无此节点），已在属性面板打开");return;
    }
  }
  toast("字段 "+fc+" 不在当前视图");
}
function flashTree(id){
  // 左侧树行定位闪光（滚动容器是 #cfgTree）
  requestAnimationFrame(()=>{
    const t=id&&document.getElementById(id);
    if(t){t.scrollIntoView({block:"center"});t.classList.remove("loc-flash");void t.offsetWidth;t.classList.add("loc-flash");}
  });
}
function flashPreview(fc){
  // 预览字段定位闪光（树 → 预览方向，与点选方向互补成双向定位）
  requestAnimationFrame(()=>{
    const t=fc&&document.querySelector('#previewInner [data-fc="'+fc+'"]');
    if(t){t.scrollIntoView({block:"center"});t.classList.remove("loc-flash");void t.offsetWidth;t.classList.add("loc-flash");}
  });
}
function sanitizeSelection(){
  // schema 变更（删除/导入/切样板）后，选择态下标可能过期——校验，无效则清空
  const s=state.selected;if(!s)return;
  const F=(state.schema.views.form||{}).sections||[];
  const ok=(
    s.type==="control"?(F[s.si]&&(F[s.si].controls||[])[s.ci]?true:false):
    s.type==="section"?!!F[s.si]:
    s.type==="linkrule"?!!(state.schema.linkageRules||[])[s.ri]:
    s.type==="submitrule"?!!(state.schema.submitRules||[])[s.ri]:
    s.type==="action"?!!(state.schema.actionBar||[])[s.ai]:
    s.type==="vcontrol"?activeFormView().sections.some(sec=>(sec.controls||[]).some(c=>c.fieldCode===s.fc)):
    true // pageheader/footer/group/list 恒有效
  );
  if(!ok)state.selected=null;
}
function gotoRule(code){
  // 追踪条 chip → 选中规则节点并闪光（对标 Retool 调试跳转）
  const li=(state.schema.linkageRules||[]).findIndex(r=>((r.code||r.name)||"")===code);
  if(li>=0){state.selected={type:"linkrule",ri:li};state.structTab="form";renderConfig();flashTree("rlink-"+li);return;}
  const sj=(state.schema.submitRules||[]).findIndex(r=>((r.code||r.name)||"")===code);
  if(sj>=0){state.selected={type:"submitrule",ri:sj};state.structTab="form";renderConfig();flashTree("rsub-"+sj);return;}
  toast("规则 "+code+" 不存在（可能已被删除）");
}
function renderTraceBar(){
  // 联动命中追踪（对标 Retool Debug / Appsmith 动作执行链）：无命中则静默；可折叠，chip 直达规则
  if(!state._fired||!state._fired.length)return null;
  const sig=state._fired.map(f=>f.code).join(",");
  const fresh=sig!==state._firedSig;   // 命中集合变化时才播入场动画，避免每次输入重播闪烁
  state._firedSig=sig;
  const bar=el("details",{class:"trace"+(fresh?" fld-enter":""),open:true});
  bar.append(el("summary",{},"⚡ 联动命中 "+state._fired.length+" 条"));
  const chips=el("div",{class:"chips"});
  state._fired.forEach(f=>{
    const chip=el("button",{class:"chip"+(f.notice?" warn":""),title:f.notice?"该规则附带提示信息，点击定位到规则定义":"点击定位到规则定义"},f.code);
    chip.addEventListener("click",()=>gotoRule(f.code));
    chips.append(chip);
  });
  bar.append(chips);
  return bar;
}

function renderActionBar(){
  const bar=el("div",{class:"actionbar"});
  const all=state.schema.actionBar||[];
  let hidden=0;
  all.forEach(a=>{
    // 状态门控：visibleWhen 未命中的动作不再灰置（诚实呈现运行时形态），尾部以带悬停说明的计数提示收拢
    if(!evalCondition(a.visibleWhen)){hidden++;return;}
    const b=el("button",{class:a.actionCode==="submit"||a.actionCode==="approve"||a.actionCode==="accept"?"primary":""},a.actionCode+(a.decisionKind==="hitl"?" (HITL)":""));

  });

  if(!all.length)bar.append(el("span",{class:"hint"},"（无动作条配置）"));
