<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synap Equity · 智能投研工作台（演示）</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --panel2:#fafbfe;
    --t1:#131a2b; --t2:#5a6579; --t3:#8d97aa;
    --line:#e6eaf2; --line2:#eef1f7;
    --brand:#2b5cf0; --brand-d:#1e46c9; --brand-s:#e9efff; --brand-s2:#f4f7ff;
    --side:#0e1526; --side2:#151d31; --side-t:#aab4c8; --side-t2:#6f7b93;
    --up:#0f9d58; --up-s:#e7f7ee;
    --flat:#d98a00; --flat-s:#fdf3e0;
    --down:#e0483d; --down-s:#fdecea;
    --r:12px; --r-sm:9px;
    --sh:0 1px 2px rgba(19,26,43,.04), 0 8px 26px rgba(19,26,43,.06);
    --sh-sm:0 1px 2px rgba(19,26,43,.05), 0 3px 10px rgba(19,26,43,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--t1); font-size:14px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:13.5px;color:inherit}
  ::selection{background:var(--brand-s)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#ccd4e2;border-radius:9px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- app shell ---------- */
  .app{display:flex; min-height:100vh}
  .side{
    width:224px; flex-shrink:0; background:var(--side); color:#fff;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .side .brand{display:flex; align-items:center; gap:10px; padding:18px 18px 14px}
  .side .brand .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#5b8bf5);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .side .brand b{font-size:15px;letter-spacing:.2px}
  .side .brand small{display:block;font-size:10px;color:var(--side-t2);letter-spacing:.5px;font-weight:600;margin-top:-2px}
  .side nav{padding:8px 10px; flex:1; overflow-y:auto}
  .side .grp{font-size:10.5px;color:var(--side-t2);font-weight:700;letter-spacing:.8px;padding:14px 10px 6px}
  .side .item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--side-t);font-size:13.5px;font-weight:600;cursor:pointer;transition:.14s;margin-bottom:2px}
  .side .item:hover{background:var(--side2);color:#fff}
  .side .item.on{background:linear-gradient(90deg,rgba(43,92,240,.22),rgba(43,92,240,.06));color:#fff}
  .side .item.on::before{content:"";position:absolute;left:0;width:3px;height:18px;background:var(--brand);border-radius:0 3px 3px 0}
  .side .item{position:relative}
  .side .item .ic{width:16px;text-align:center;opacity:.9}
  .side .item .cnt{margin-left:auto;font-size:11px;background:var(--brand);color:#fff;border-radius:9px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px;font-weight:700}
  .side .usr{border-top:1px solid #1d2740;padding:12px 14px;display:flex;align-items:center;gap:10px}
  .side .usr .av{width:30px;height:30px;border-radius:50%;background:#22304d;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#c9d4ea}
  .side .usr .nm{font-size:12.5px;font-weight:600}
  .side .usr .pl{font-size:10.5px;color:var(--side-t2)}
  .side .usr .tag{margin-left:auto;font-size:10px;background:#1f2b45;border:1px solid #2c3b5c;padding:2px 7px;border-radius:6px;color:#8fa2c8;font-weight:600}

  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .topbar{
    height:58px; background:rgba(255,255,255,.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px;
    padding:0 22px; position:sticky; top:0; z-index:40;
  }
  .topbar .ttl{font-size:15.5px;font-weight:800;letter-spacing:.2px}
  .topbar .ttl small{font-weight:500;color:var(--t3);font-size:12px;margin-left:8px;letter-spacing:0}
  .search{margin-left:auto; position:relative; width:320px}
  .search input{width:100%;height:38px;border:1px solid var(--line);background:#f6f8fc;border-radius:10px;padding:0 12px 0 34px;outline:none;transition:.15s}
  .search input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-s)}
  .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3)}
  .ac{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);overflow:hidden;display:none;z-index:60}
  .ac.show{display:block}
  .ac .it{padding:10px 14px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line2)}
  .ac .it:last-child{border-bottom:none}
  .ac .it:hover{background:var(--brand-s2)}
  .ac .it .c{color:var(--t3);font-size:11.5px}
  .topbar .act{display:flex;gap:8px;align-items:center}

  .content{padding:22px; max-width:1400px; width:100%}
  .view{display:none}
  .view.on{display:block; animation:fade .26s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- primitives ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
  .pad{padding:18px 20px}
  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .wrap{flex-wrap:wrap}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g-main{grid-template-columns:minmax(0,1fr) 330px}
  .sec-t{font-size:13px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .sec-t .n{width:19px;height:19px;border-radius:6px;background:var(--brand);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
  .sub{font-size:12px;color:var(--t3);font-weight:600}
  .hint{font-size:12px;color:var(--t3)}
  .muted{color:var(--t3)}
  .divider{height:1px;background:var(--line2);margin:14px 0}
  .kpi{padding:15px 17px}
  .kpi .k{font-size:11.5px;color:var(--t3);font-weight:700;letter-spacing:.2px}
  .kpi .v{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:.2px}
  .kpi .d{font-size:11px;color:var(--t3);margin-top:2px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:700;transition:.14s;border:1px solid transparent;white-space:nowrap}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-d)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--t1)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn.soft{background:var(--brand-s);color:var(--brand)}
  .btn.soft:hover{background:#dde7ff}
  .btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:8px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn.ic-only{padding:0 9px}

  /* pills / tags */
  .pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
  .pill.u{background:var(--up-s);color:var(--up)}
  .pill.f{background:var(--flat-s);color:var(--flat)}
  .pill.o{background:var(--down-s);color:var(--down)}
  .pill.g{background:#eef1f6;color:var(--t2)}
  .tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--brand-s);color:var(--brand);display:inline-block}
  .tag.g{background:#eef1f6;color:var(--t2)}
  .tag.ok{background:var(--up-s);color:var(--up)}

  /* tabs */
  .vtabs{display:flex;gap:2px;background:#eef1f7;padding:3px;border-radius:10px;overflow-x:auto}
  .vtab{padding:7px 14px;font-size:13px;font-weight:700;color:var(--t2);border-radius:8px;transition:.14s;white-space:nowrap}
  .vtab:hover{color:var(--brand)}
  .vtab.on{background:#fff;color:var(--brand);box-shadow:var(--sh-sm)}

  /* tables */
  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:11.5px;font-weight:700;color:var(--t3);letter-spacing:.2px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
  .tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tbody tr{cursor:pointer;transition:.12s}
  .tbl tbody tr:hover{background:var(--brand-s2)}
  .tbl th.num,.tbl td.num{text-align:right}
  .tbl .nm{font-weight:700}
  .tbl .cd{color:var(--t3);font-size:11.5px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

  /* position bar */
  .posbar{position:relative;height:44px;border-radius:9px;overflow:hidden;display:flex}
  .posbar .z{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;transition:flex .25s}
  .z-u{background:var(--up-s);color:var(--up)}
  .z-f{background:var(--flat-s);color:var(--flat)}
  .z-o{background:var(--down-s);color:var(--down)}
  .posbar .mk{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--t1);border-radius:2px;transition:left .25s;z-index:2}
  .posbar .mk .lb{position:absolute;top:-23px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;background:var(--t1);color:#fff;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .posbar .mk .lb::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--t1)}
  .scale{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:9px}
  .nowline{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:13px;font-weight:800}
  .nowline .dt{width:9px;height:9px;border-radius:50%}

  /* valuation boxes */
  .vbox{border:1px solid var(--line);border-radius:11px;padding:14px;text-align:center;transition:.2s;position:relative}
  .vbox .k{font-size:11.5px;color:var(--t3);font-weight:700}
  .vbox .v{font-size:20px;font-weight:800;margin-top:6px}
  .vbox .s{font-size:10.5px;color:var(--t3);margin-top:3px}
  .vbox.low .v{color:var(--up)} .vbox.mid .v{color:var(--brand)} .vbox.high .v{color:var(--down)}
  .vbox.mid{border-color:#c9d8ff;background:linear-gradient(180deg,#f6f9ff,#fff)}
  .vbox.flashbox{box-shadow:0 0 0 3px var(--brand-s)}

  /* kv */
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line2)}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--t2)} .kv .v{font-weight:700;text-align:right}
  .q{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--t3);color:var(--t3);font-size:9px;cursor:help;position:relative;vertical-align:1px}
  .q .tip{position:absolute;bottom:20px;right:-6px;width:210px;background:var(--t1);color:#fff;font-size:11.5px;line-height:1.5;font-weight:500;padding:9px 11px;border-radius:8px;display:none;z-index:30;text-align:left;box-shadow:var(--sh)}
  .q .tip::after{content:"";position:absolute;top:100%;right:12px;border:5px solid transparent;border-top-color:var(--t1)}
  .q:hover{border-color:var(--brand);color:var(--brand)} .q:hover .tip{display:block}

  /* quality bars */
  .dim{display:grid;grid-template-columns:70px 1fr 42px;align-items:center;gap:10px;font-size:12px;margin:9px 0}
  .dim .k{color:var(--t2)}
  .track{height:7px;background:#eef1f6;border-radius:99px;overflow:hidden}
  .fill{height:100%;border-radius:99px;transition:width .45s}
  .fill.hi{background:var(--up)} .fill.md{background:var(--flat)} .fill.lo{background:var(--down)}
  .dim .s{text-align:right;font-weight:800;color:var(--t2)}

  /* sliders */
  .fld{margin-bottom:15px}
  .fld .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;margin-bottom:7px}
  .fld .lb .val{color:var(--brand);font-size:14px;font-weight:800}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:99px;background:#e4e9f2;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--brand);cursor:pointer;box-shadow:0 1px 4px rgba(19,26,43,.25)}
  .num-in{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 11px;outline:none;background:#fff}
  .num-in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-s)}
  select.num-in{cursor:pointer}
  .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;cursor:pointer;color:var(--t2);font-weight:600}
  .chk input{width:15px;height:15px;accent-color:var(--brand)}

  /* charts */
  .chart{width:100%;display:block}
  .chart .gl{stroke:#eef1f7;stroke-width:1}
  .chart .ax{font-size:10px;fill:var(--t3)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--t2);font-weight:600;margin-top:8px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
  .tipbox{position:absolute;background:var(--t1);color:#fff;font-size:11.5px;padding:7px 10px;border-radius:7px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:50}
  .chart-wrap{position:relative}

  /* matrix */
  .matrix{border-collapse:collapse;font-size:12px;width:100%}
  .matrix th,.matrix td{border:1px solid var(--line2);padding:9px 6px;text-align:center;font-weight:700}
  .matrix th{background:var(--panel2);color:var(--t2);font-size:11px}
  .matrix td.cell{color:#fff;font-variant-numeric:tabular-nums}
  .matrix td.hd{background:var(--panel2);color:var(--t2)}

  /* timeline */
  .tl{position:relative;padding-left:24px}
  .tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-i{position:relative;padding-bottom:18px}
  .tl-i::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
  .tl-i.ok::before{border-color:var(--up)}
  .tl-i .tt{font-size:11.5px;color:var(--t3);font-weight:700}
  .tl-i .th{font-size:13.5px;font-weight:800;margin:2px 0 3px}
  .tl-i .tb{font-size:12.5px;color:var(--t2)}
  .recon{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
  .recon .rc{border:1px solid var(--line);border-radius:9px;padding:9px;text-align:center}
  .recon .rc .k{font-size:10.5px;color:var(--t3);font-weight:700}
  .recon .rc .v{font-size:14.5px;font-weight:800;margin-top:3px}

  /* bars */
  .barrow{display:grid;grid-template-columns:112px 1fr 52px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line2)}
  .barrow:last-child{border-bottom:none}
  .barrow .tk{font-weight:700;font-size:12.5px}
  .bar{height:9px;background:#eef1f6;border-radius:99px;overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),#6b93f7)}
  .barrow .w{text-align:right;font-weight:800;font-size:12.5px;color:var(--t2)}

  /* modal + toast */
  .mask{position:fixed;inset:0;background:rgba(15,21,38,.44);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .mask.show{display:flex;animation:fade .18s}
  .modal{background:#fff;border-radius:15px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(15,21,38,.3);overflow:hidden;max-height:90vh;display:flex;flex-direction:column}
  .modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .mh b{font-size:15px}
  .modal .mb{padding:18px 20px;overflow-y:auto}
  .modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--panel2)}
  .toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--t1);color:#fff;font-size:13px;font-weight:600;padding:10px 17px;border-radius:10px;box-shadow:0 10px 30px rgba(19,26,43,.3);display:flex;gap:8px;align-items:center;animation:up .28s}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .loading{padding:44px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .spin{width:32px;height:32px;border:3px solid var(--brand-s);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .steps{display:flex;flex-direction:column;gap:7px;max-width:340px;width:100%}
  .step{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--t3);opacity:.4;transition:.3s}
  .step.on{opacity:1;color:var(--t1);font-weight:700}
  .step .ck{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:9px}

  .foot{padding:20px 22px 44px;font-size:11.5px;color:var(--t3);line-height:1.8;max-width:1400px}
  .foot .ai{display:inline-flex;align-items:center;gap:6px;color:var(--t2);font-weight:700;margin-bottom:5px}
  .foot .tagai{background:#eef1f6;border-radius:5px;padding:1px 7px;font-size:10.5px}

  /* ---------- 低门槛体验增强 ---------- */
  .verdict{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(120deg,#f7f9ff,#fff)}
  .verdict .vic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;background:var(--brand-s)}
  .verdict.cool .vic{background:var(--up-s)} .verdict.warm .vic{background:var(--flat-s)} .verdict.hot .vic{background:var(--down-s)}
  .verdict h3{font-size:17px;font-weight:800;letter-spacing:.2px;line-height:1.45}
  .verdict p{font-size:13.5px;color:var(--t2);margin-top:6px}
  .verdict p b{color:var(--t1)}
  .verdict .mini{font-size:11.5px;color:var(--t3);margin-top:8px}
  .starters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .starter{border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.16s;background:#fff}
  .starter:hover{border-color:var(--brand);box-shadow:var(--sh-sm);transform:translateY(-1px)}
  .starter .e{font-size:22px;line-height:1}
  .starter b{display:block;font-size:14px;margin-top:9px}
  .starter span{font-size:12px;color:var(--t3)}
  .fold{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel2);margin-top:12px}
  .fold>summary{padding:11px 15px;cursor:pointer;font-size:12.5px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--t2)}
  .fold>summary::-webkit-details-marker{display:none}
  .fold>summary::after{content:"展开";font-size:11px;color:var(--t3);font-weight:600}
  .fold[open]>summary::after{content:"收起"}
  .fold .in{padding:2px 15px 13px;background:#fff}
  .gloss{border-bottom:1px dashed var(--t3);cursor:help}
  .advt{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--t3);background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:9px 13px;margin-bottom:14px}
  .empty{text-align:center;padding:34px 20px;color:var(--t3)}
  .empty .e{font-size:34px;margin-bottom:10px}

const KEYS = Object.keys(DB);

/* 行业列表 */
const IND = [...new Set(KEYS.map(k=>DB[k].gics))];

/* ---------------- 计算引擎（确定性） ---------------- */
function computeVal(key, o={}){
  const s=DB[key];
  const fin = s.fin[s.fin.length-1];
  const g   = (o.growth ?? (s.def?.growth ?? 10))/100;
  const pe  = (o.pe ?? (s.def?.pe ?? 20));
  const band= (o.band ?? (s.def?.band ?? 15))/100;
  const epsFwd = fin.eps*(1+g);
  const fairMid= epsFwd*pe;
  const fairLow= fairMid*(1-band);
  const fairHigh=fairMid*(1+band);
  const p = s.price;
  const zone = p<fairLow?'U':(p>fairHigh?'O':'F');
  const domMin=fairLow*0.84, domMax=fairHigh*1.16;
  const wU=(fairLow-domMin)/(domMax-domMin)*100;
  const wF=(fairHigh-domMin)/(domMax-domMin)*100-wU;
  const wO=100-wU-wF;
  const marker=clamp((p-domMin)/(domMax-domMin)*100,2,98);
  const dev=(p-fairMid)/fairMid;
  return {epsFwd,fairLow,fairMid,fairHigh,zone,wU,wF,wO,marker,dev,pe,g:o.growth??s.def.growth,band:o.band??s.def.band};
}
const ZTXT={U:'低估',F:'合理',O:'高估'};
const ZCLS={U:'u',F:'f',O:'o'};
const BF={U:'便宜',F:'合理',O:'偏贵'};                       /* 人话版档位 */
const BFHINT={U:'现在价格比我们估的范围还低',F:'现在价格在我们估的范围里',O:'现在价格已超过我们估的范围'};
const zoneOf = (key,o)=>computeVal(key,o).zone;

/* ---------- 白话结论（结论先行） ---------- */
function verdict(k,v){
  const s=DB[k], dev=v.dev;
  const range=`我们估它大约值 <b>${fmt(v.fairLow)} ~ ${fmt(v.fairHigh)}</b>，现在股价 <b>${fmt(s.price)}</b>`;
  if(v.zone==='U')  return {tone:'cool',icon:'😊',title:'价格偏低，比我们估的还便宜',desc:`${range}，处在区间下方。`};
  if(v.zone==='O')  return {tone:'hot', icon:'😐',title:'价格偏高，已经超出我们的判断',desc:`${range}，高出大约 ${pct(Math.abs(dev))}。`};
  return {tone:'warm',icon:'🙂',title:`价格合理，${dev<0?'略偏便宜':'略偏贵'}`,desc:`${range}，落在合理范围内。`};
}

/* 财务派生指标 */
function finStats(key){
  const f=DB[key].fin, first=f[0], last=f[f.length-1], n=f.length-1;
  const cagr=(a,b)=> b>0&&a>0 ? (Math.pow(b/a,1/n)-1) : 0;
  return {
    revCagr:cagr(first.rev,last.rev),
    npCagr :cagr(first.np,last.np),
    last, first,
    ocf_np : last.np>0 ? (last.ocf||0)/last.np : 0
  };
}

/* ---------------- SVG 图表助手 ---------------- */
function sparkline(vals,w,h,color){
  const min=Math.min(...vals),max=Math.max(...vals),rg=max-min||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w, h-(v-min)/rg*h]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L${w} ${h} L0 ${h} Z`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">
    <path d="${area}" fill="${color}18"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
/* 双序列子图（柱+线） */
function barLine(years,bars,lines,opt={}){
  const w=560,h=opt.h||190,pl=44,pr=12,pt=14,pb=26;
  const iw=w-pl-pr, ih=h-pt-pb;
  const bmax=Math.max(...bars)*1.15;
  const lmax=Math.max(...lines.map(l=>Math.max(...l.vals)))*1.15;
  const n=bars.length, bw=iw/n*0.5;
  const x=i=>pl+iw/n*(i+0.5);
  const yB=v=>pt+ih-(v/bmax)*ih;
  const yL=v=>pt+ih-(v/lmax)*ih;
  let g='';
  for(let i=0;i<=4;i++){ const y=pt+ih/4*i; g+=`<line x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}" stroke="#eef1f7"/>`; }
  let barsS=bars.map((v,i)=>`<rect x="${x(i)-bw/2}" y="${yB(v)}" width="${bw}" height="${pt+ih-yB(v)}" rx="3" fill="${opt.barColor||'#c9d8ff'}"/>`).join('');
  let linesS=lines.map(l=>{
    const d=l.vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+yL(v).toFixed(1)).join(' ');
    return `<path d="${d}" fill="none" stroke="${l.color}" stroke-width="2.2" stroke-linejoin="round"/>`+
           l.vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${yL(v).toFixed(1)}" r="3" fill="#fff" stroke="${l.color}" stroke-width="2"/>`).join('');
  }).join('');
  const xl=years.map((y,i)=>`<text x="${x(i)}" y="${h-8}" text-anchor="middle" class="ax">${y}</text>`).join('');
  const yl=[0,.5,1].map(t=>`<text x="${pl-6}" y="${pt+ih-ih*t+4}" text-anchor="end" class="ax">${Math.round(bmax*t)}</text>`).join('');
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${w} ${h}">
    ${g}${barsS}${linesS}${xl}${yl}</svg></div>`;
}
/* PE Band 历史分位带 */
function peBand(hist,cur,w=560,h=200){
  const pl=42,pr=12,pt=14,pb=24, iw=w-pl-pr, ih=h-pt-pb;
  const all=[...hist,cur], max=Math.max(...all)*1.1, min=Math.min(...all)*0.9, rg=max-min||1;
  const x=i=>pl+iw/(hist.length-1)*i;
  const y=v=>pt+ih-(v-min)/rg*ih;
  const sorted=[...hist].sort((a,b)=>a-b);
  const q=p=>sorted[Math.floor((sorted.length-1)*p)];
  const p10=q(.1),p50=q(.5),p90=q(.9);
  let g=''; for(let i=0;i<=4;i++){const yy=pt+ih/4*i; g+=`<line x1="${pl}" y1="${yy}" x2="${w-pr}" y2="${yy}" stroke="#eef1f7"/>`;}
  const band=`<rect x="${pl}" y="${y(p90)}" width="${iw}" height="${y(p10)-y(p90)}" fill="#e9efff" opacity=".7"/>`;
  const d=hist.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const curY=y(cur);
  const labels=[[p90,'P90'],[p50,'中位'],[p10,'P10']].map(([v,t])=>`<line x1="${pl}" y1="${y(v)}" x2="${w-pr}" y2="${y(v)}" stroke="${t==='中位'?'#2b5cf0':'#a9b7d6'}" stroke-width="1" stroke-dasharray="4 3"/><text x="${w-pr-4}" y="${y(v)-3}" text-anchor="end" class="ax" fill="${t==='中位'?'#2b5cf0':'#8d97aa'}">${t} ${v.toFixed(1)}×</text>`).join('');
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${w} ${h}">
    ${g}${band}${labels}
    <path d="${d}" fill="none" stroke="#8d97aa" stroke-width="1.8"/>
    <line x1="${pl}" y1="${curY}" x2="${w-pr}" y2="${curY}" stroke="#e0483d" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="${w-pr}" cy="${curY}" r="4" fill="#e0483d"/>
    <text x="${w-pr-4}" y="${curY-7}" text-anchor="end" class="ax" fill="#e0483d">当前 ${cur.toFixed(1)}×</text>
  </svg></div>`;
}
/* 散点：PE vs 增速 */
function scatter(items,w=560,h=210){
  const pl=44,pr=16,pt=14,pb=28, iw=w-pl-pr, ih=h-pt-pb;
  const xs=items.map(i=>i.x), ys=items.map(i=>i.y);
  const xmax=Math.max(...xs)*1.15, ymax=Math.max(...ys)*1.15, ymin=Math.min(0,Math.min(...ys));
  const X=v=>pl+(v/xmax)*iw, Y=v=>pt+ih-((v-ymin)/(ymax-ymin))*ih;
  let g=''; for(let i=0;i<=4;i++){const yy=pt+ih/4*i;g+=`<line x1="${pl}" y1="${yy}" x2="${w-pr}" y2="${yy}" stroke="#eef1f7"/>`;}
  const pts=items.map(i=>`<circle cx="${X(i.x)}" cy="${Y(i.y)}" r="6" fill="${i.me?'#2b5cf0':'#b9c6de'}" opacity=".9"/><text x="${X(i.x)}" y="${Y(i.y)-10}" text-anchor="middle" class="ax" fill="${i.me?'#2b5cf0':'#8d97aa'}">${i.l}</text>`).join('');
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${w} ${h}">${g}${pts}
    <text x="${w-pr}" y="${h-8}" text-anchor="end" class="ax">净利增速（3Y CAGR）→</text>
    <text x="${pl-34}" y="${pt+10}" class="ax">PE↑</text></svg></div>`;
}
/* 敏感性矩阵（WACC × g） */
function sensMatrix(eps,baseG){
  const waccs=[7,8,9,10,11], gs=[1,2,2.5,3,4];
  const dcf=(wacc,g)=>{
    const F=[]; let fcff=eps*0.85*10;
    for(let t=1;t<=5;t++){ fcff*= (1+baseG/100); F.push(fcff/Math.pow(1+wacc/100,t)); }
    const tv=F[4]*(1+g/100)/((wacc/100)-(g/100));
    return (F.reduce((a,b)=>a+b,0)+tv/Math.pow(1+wacc/100,5))/1;
  };
  const vals=gs.map(g=>waccs.map(w=>dcf(w,g)));
  const flat=vals.flat(), mn=Math.min(...flat), mx=Math.max(...flat);
  const color=v=>{ const t=(v-mn)/(mx-mn||1);
    const r=Math.round(224+(15-224)*t), gg=Math.round(72+(157-72)*t), b=Math.round(61+(88-61)*t);
    return `rgb(${r},${gg},${b})`; };
  let head=`<tr><th>WACC ↓ \\ g →</th>${gs.map(g=>`<th>${g}%</th>`).join('')}</tr>`;
  let body=waccs.map((w,i)=>`<tr><td class="hd">${w}%</td>${gs.map((g,j)=>`<td class="cell" style="background:${color(vals[j][i])}">${Math.round(vals[j][i])}</td>`).join('')}</tr>`).join('');
  return `<table class="matrix">${head}${body}</table>`;
}

function removeWatch(k){ STATE.watch=STATE.watch.filter(x=>x!==k); $('#navWl').textContent=STATE.watch.length; toast('已移出自选池'); renderWatchlist(); }
function quickAlert(k){
  const v=computeVal(k,{});

    <div class="mh"><b>创建提醒 · ${DB[k].name}</b><button class="btn sm ghost" onclick="closeModal()">✕</button></div>

    </div>
    <div class="mf"><button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveAlert('${k}')">保存提醒</button></div>
  </div>`);
}
function saveAlert(k){
  const p=+$('#alP').value;

  closeModal(); toast('提醒已创建');
  if(STATE.view==='research') renderResearch(); else renderWatchlist();
}

/* --- 估值 --- */

function pePercentile(hist,cur){ const sorted=[...hist].sort((a,b)=>a-b); const below=sorted.filter(x=>x<=cur).length; return Math.round(below/sorted.length*100); }
function bindDCF(k,s){
  const eps=computeVal(k,STATE.hypo).epsFwd;
  STATE.dcf={w:+$('#dcfW').value, g:+$('#dcfG').value, n:+$('#dcfN').value};
  const calc=()=>{
    const w=+$('#dcfW').value, g=+$('#dcfG').value, n=+$('#dcfN').value;
    STATE.dcf={w,g,n};
    $('#dcfWv').textContent=w.toFixed(1)+'%'; $('#dcfGv').textContent=g.toFixed(2)+'%'; $('#dcfNv').textContent=n+' 年';
    if(g>=w){ $('#dcfOut').textContent='参数无效'; $('#dcfDiff').textContent='—'; return; }
    let fcff=eps*0.9, sum=0;
    for(let t=1;t<=n;t++){ fcff*=(1+STATE.hypo.growth/100); sum+=fcff/Math.pow(1+w/100,t); }
    const tv=fcff*(1+g/100)/((w-g)/100)/Math.pow(1+w/100,n);
    const out=(sum+tv);
    $('#dcfOut').textContent=fmt(out);
    const base=computeVal(k,STATE.hypo).fairMid, diff=(out-base)/base;
    $('#dcfDiff').textContent=(diff>=0?'+':'')+(diff*100).toFixed(1)+'%';
    $('#dcfDiff').style.color=Math.abs(diff)<0.15?'var(--up)':'var(--flat)';
  };
  ['dcfW','dcfG','dcfN'].forEach(id=>$('#'+id).addEventListener('input',calc));
  calc();
}

/* --- 策略 --- */
function templateMatch(k,v,s){
  const st=finStats(k), fin=s.fin.slice(-1)[0];
  const pb=DB[k].price/fin.bps, div=DB[k].dividend||0;
  const value = (v.pe<18?1:0)+(pb<2.5?1:0)+(fin.roe>=10?1:0)+(st.ocf_np>=1?1:0)+(fin.debt<60?1:0);
  const growth= (st.npCagr>0.12?1:0)+(v.pe/st.npCagr*100<1.2?1:0)+(fin.roe>=15?1:0)+(st.revCagr>0.1?1:0);
  const dividend= (div>=3?1:0)+((DB[k].dividend>0?1:0))+((DB[k].beta||1)<0.9?1:0);
  return {
    value:{score:value,of:5,name:'价值型（格雷厄姆-巴菲特式）',rule:'PE 行业分位 <40%、PB <2.5、ROE ≥10%、现金流为正、负债率 <60%'},
    growth:{score:growth,of:4,name:'质量成长型（PEG 式）',rule:'营收/净利 CAGR ≥10%、PEG <1、ROE ≥15%'},
    dividend:{score:dividend,of:3,name:'红利防守型',rule:'股息率 ≥3%、连续分红、低波动 β<0.9'}
  };
}
function tabStrategy(k,v,s){

    </div>`; };
  const zdc = v.zone;
  return `

        <div class="kv"><span class="k">低估档（价格低于区间下沿）</span><span class="v up">状态匹配</span></div>
        <div class="kv"><span class="k">合理档（区间内）</span><span class="v flat">观察 / 持有</span></div>
