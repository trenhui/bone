<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>procuraAI · 采购智能审查</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --blue:#2563EB; --blue-d:#1E3A5F; --blue-l:#DBEAFE; --blue-bg:#EFF6FF;
  --red:#DC2626; --red-l:#FEE2E2; --orange:#D97706; --orange-l:#FEF3C7;
  --green:#059669; --green-l:#D1FAE5; --gray:#64748B; --gray-l:#F1F5F9;
  --line:#E2E8F0; --text:#0F172A; --text-2:#475569;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.05);
  --shadow-lg:0 4px 12px rgba(15,23,42,.08),0 12px 40px rgba(15,23,42,.10);
  --shadow-blue:0 4px 16px rgba(37,99,235,.15);
  --radius:10px; --radius-lg:14px;
  --grad-blue:linear-gradient(135deg,#1E3A5F 0%,#2563EB 100%);
  --grad-card:linear-gradient(180deg,#fff 0%,#FAFBFE 100%);
}
body { font-family:"PingFang SC","Helvetica Neue",-apple-system,BlinkMacSystemFont,Arial,sans-serif; background:#F1F5F9; color:var(--text); font-size:14px; -webkit-font-smoothing:antialiased; }
button { font-family:inherit; cursor:pointer; border:none; border-radius:var(--radius); transition:all .18s ease; }
input,select,textarea { font-family:inherit; font-size:13px; border:1px solid var(--line); border-radius:var(--radius); padding:7px 11px; outline:none; transition:border-color .15s; }
input:focus,select:focus,textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.10); }

/* 动画 */
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes skel { 0%{background-position:-200px 0} 100%{background-position:calc(200px + 100%) 0} }
.fade-in { animation:fadeIn .32s ease-out; }
.skel { background:linear-gradient(90deg,#E2E8F0 25%,#F1F5F9 50%,#E2E8F0 75%); background-size:200px 100%; animation:skel 1.4s infinite linear; border-radius:6px; }

/* 顶栏 */
header { position:fixed; top:0; left:0; right:0; height:56px; background:var(--grad-blue); display:flex; align-items:center; padding:0 20px; z-index:50; box-shadow:0 2px 12px rgba(30,58,95,.25); }
.logo { display:flex; align-items:center; gap:10px; color:#fff; font-size:16px; font-weight:700; }
.logo .mark { width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:16px; }
.h-nav { margin-left:32px; display:flex; gap:4px; }
.h-nav button { background:transparent; color:rgba(255,255,255,.82); padding:8px 14px; font-size:14px; border-radius:8px; }
.h-nav button.on, .h-nav button:hover { background:rgba(255,255,255,.16); color:#fff; }
.h-right { margin-left:auto; display:flex; align-items:center; gap:14px; color:#fff; }
.h-right .noti { position:relative; background:rgba(255,255,255,.14); width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; }
.h-right .noti .dot { position:absolute; top:6px; right:6px; width:8px; height:8px; background:var(--red); border-radius:50%; border:2px solid #fff; }
.h-right .user { display:flex; align-items:center; gap:8px; font-size:13px; }
.h-right .avatar { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:13px; }

/* 布局 */
.layout { display:flex; padding-top:56px; min-height:100vh; }
aside { width:216px; flex-shrink:0; background:#fff; border-right:1px solid var(--line); padding:16px 10px; position:sticky; top:56px; height:calc(100vh - 56px); overflow-y:auto; box-shadow:1px 0 8px rgba(15,23,42,.03); }
.side-group { font-size:11px; color:var(--gray); font-weight:600; letter-spacing:.5px; padding:10px 12px 6px; text-transform:uppercase; }
.side-item { display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:var(--radius); color:var(--text-2); font-size:13px; cursor:pointer; margin-bottom:2px; transition:all .15s; }
.side-item:hover { background:var(--gray-l); color:var(--text); }
.side-item.on { background:var(--blue-l); color:var(--blue); font-weight:600; box-shadow:inset 3px 0 0 var(--blue); }
.side-item .badge { margin-left:auto; font-size:11px; background:var(--red); color:#fff; border-radius:10px; padding:1px 7px; }
main { flex:1; padding:24px 28px; max-width:1280px; animation:fadeIn .32s ease-out; }

/* 卡片 */
.card { background:var(--grad-card); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); transition:box-shadow .2s; }
.card:hover { box-shadow:var(--shadow-lg); }
.card-h { display:flex; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); font-weight:600; font-size:14px; }
.card-h .sub { font-weight:400; color:var(--gray); font-size:12px; margin-left:8px; }
.card-h .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
.card-b { padding:16px 18px; }

/* 按钮 */
.btn { padding:8px 16px; font-size:13px; border-radius:var(--radius); background:var(--blue); color:#fff; transition:all .18s; font-weight:500; }
.btn:hover { background:#1D4ED8; box-shadow:var(--shadow-blue); transform:translateY(-1px); }
.btn:active { transform:translateY(0); }
.btn.ghost { background:#fff; color:var(--text-2); border:1px solid var(--line); }
.btn.ghost:hover { background:var(--gray-l); color:var(--text); border-color:#CBD5E1; box-shadow:none; transform:translateY(-1px); }
.btn.green { background:var(--green); }
.btn.green:hover { background:#047857; box-shadow:0 4px 16px rgba(5,150,105,.18); }
.btn.red { background:var(--red); }
.btn.red:hover { background:#B91C1C; }
.btn.sm { padding:5px 11px; font-size:12px; }
.btn.primary { background:var(--blue); }
.btn:disabled { opacity:.5; cursor:not-allowed; }

/* 徽标与级别 */
.lv { display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:2px 8px; border-radius:4px; }
.lv.high { background:var(--red-l); color:var(--red); }
.lv.mid { background:var(--orange-l); color:var(--orange); }
.lv.low { background:#E0F2FE; color:#0369A1; }
.tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:var(--gray-l); color:var(--text-2); margin-right:4px; }
.tag.rule { background:var(--blue-l); color:var(--blue); }
.tag.llm { background:#F3E8FF; color:#7C3AED; }

/* 工作台 */
.dash-cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
.dash-card { background:var(--grad-card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow); cursor:pointer; transition:all .2s; position:relative; overflow:hidden; }
.dash-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--grad-blue); opacity:0; transition:opacity .2s; }
.dash-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); }
.dash-card:hover::before { opacity:1; }
.dash-card .num { font-size:30px; font-weight:700; color:var(--blue); line-height:1.1; }
.dash-card .num.red { color:var(--red); }
.dash-card .num.orange { color:var(--orange); }
.dash-card .num.green { color:var(--green); }
.dash-card .lbl { font-size:13px; color:var(--text-2); margin-top:4px; }
.dash-card .more { font-size:11px; color:var(--blue); margin-top:8px; }
.dash-card .spark { margin-top:8px; height:28px; }

/* sparkline */
.spark { display:flex; align-items:flex-end; gap:2px; height:28px; }
.spark .bar { flex:1; background:linear-gradient(180deg,var(--blue) 0%,#93C5FD 100%); border-radius:2px 2px 0 0; min-height:3px; transition:height .3s; }
.spark .bar.red { background:linear-gradient(180deg,var(--red) 0%,#FCA5A5 100%); }
.spark .bar.green { background:linear-gradient(180deg,var(--green) 0%,#6EE7B7 100%); }
.spark .bar.orange { background:linear-gradient(180deg,var(--orange) 0%,#FCD34D 100%); }

/* 面包屑 */
.crumb { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--gray); margin-bottom:14px; }
.crumb a { color:var(--gray); cursor:pointer; }
.crumb a:hover { color:var(--blue); }
.crumb .sep { color:var(--line); }
.crumb .cur { color:var(--text); font-weight:500; }

/* 空状态 */
.empty { text-align:center; padding:40px 20px; color:var(--gray); }
.empty .ico { font-size:40px; margin-bottom:12px; opacity:.5; }
.empty .ttl { font-size:14px; color:var(--text-2); margin-bottom:6px; }
.empty .desc { font-size:12px; margin-bottom:14px; }

/* 看板列 */
.kanban { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.kanban .col { background:var(--gray-l); border-radius:var(--radius-lg); padding:12px; min-height:300px; }
.kanban .col-h { font-size:13px; font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.kanban .col-h .cnt { background:#fff; color:var(--gray); font-size:11px; border-radius:10px; padding:1px 7px; }
.kanban .item { background:#fff; border-radius:var(--radius); padding:12px; margin-bottom:8px; border:1px solid var(--line); cursor:pointer; transition:all .15s; }
.kanban .item:hover { box-shadow:var(--shadow); transform:translateY(-1px); border-color:#CBD5E1; }
.kanban .item .ttl { font-size:13px; font-weight:500; margin-bottom:6px; }
.kanban .item .meta { font-size:11px; color:var(--gray); display:flex; justify-content:space-between; }
.dash-wrap { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.todo-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); cursor:pointer; }
.todo-item:last-child { border-bottom:none; }
.todo-item:hover .tt { color:var(--blue); }
.todo-item .ico { width:32px; height:32px; border-radius:8px; background:var(--blue-bg); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.todo-item .tt { font-size:13px; font-weight:500; }
.todo-item .ts { font-size:11px; color:var(--gray); margin-top:2px; }
.todo-item .go { margin-left:auto; color:var(--gray); font-size:12px; }

/* 审查报告 */
.report-wrap { display:flex; gap:0; height:calc(100vh - 150px); min-height:520px; }
.panel-left { width:380px; flex-shrink:0; background:#fff; border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; }
.panel-left .p-h { padding:12px 16px; border-bottom:1px solid var(--line); }
.filter-row { display:flex; gap:6px; padding:10px 16px; border-bottom:1px solid var(--line); }
.fchip { font-size:12px; padding:4px 10px; border-radius:14px; background:var(--gray-l); color:var(--text-2); cursor:pointer; }
.fchip.on { background:var(--blue); color:#fff; }
.risk-list { flex:1; overflow-y:auto; padding:8px; }
.risk-item { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; transition:.15s; }
.risk-item:hover { border-color:var(--blue); box-shadow:var(--shadow); }
.risk-item.on { border-color:var(--blue); background:var(--blue-bg); }
.risk-item .r-t { display:flex; align-items:center; gap:8px; }
.risk-item .r-title { font-size:13px; font-weight:600; }
.risk-item .r-meta { font-size:11px; color:var(--gray); margin-top:4px; line-height:1.5; }
.risk-item .r-act { display:flex; gap:6px; margin-top:8px; }
.risk-item.done { opacity:.65; }
.risk-item.done .r-t::after { content:"✓ 已处理"; font-size:11px; color:var(--green); margin-left:auto; font-weight:600; }
.panel-right { flex:1; margin-left:14px; background:#fff; border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; overflow:hidden; }
.doc-bar { display:flex; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--gray-l); gap:10px; }
.doc-bar .dt { font-weight:600; font-size:13px; }
.doc-bar .mini { font-size:11px; color:var(--gray); }
.doc-body { flex:1; overflow-y:auto; padding:24px 32px; line-height:2; font-size:13.5px; color:#1E293B; }
.doc-body h4 { font-size:15px; margin:18px 0 8px; color:var(--text); }
.doc-body .hl { background:#FDE68A; padding:0 2px; border-radius:2px; cursor:pointer; }
.doc-body .hl.lv-h { background:#FECACA; }
.doc-body .hl.lv-m { background:#FDE68A; }
.doc-body .hl.lv-l { background:#BAE6FD; }
.hl-panel { border:2px solid var(--blue); border-radius:8px; padding:12px 16px; margin:10px 0; background:var(--blue-bg); }
.hl-panel .hp-t { font-size:12px; font-weight:600; color:var(--blue); margin-bottom:4px; }

/* 表格 */
table.t { width:100%; border-collapse:collapse; font-size:13px; }
table.t th { background:var(--gray-l); color:var(--text-2); font-weight:600; text-align:left; padding:9px 12px; font-size:12px; border-bottom:1px solid var(--line); }
table.t td { padding:10px 12px; border-bottom:1px solid var(--line); }
table.t tr:hover td { background:#FAFCFF; }
table.t tr.cursor { cursor:pointer; }

/* 三一致对照 */
.cmp-table { margin:10px 0; }
.cmp-table .ct-h { display:flex; }
.cmp-table .ct-h div { flex:1; font-size:12px; font-weight:600; padding:8px 10px; background:var(--blue-bg); color:var(--blue); text-align:center; border:1px solid var(--blue-l); }
.cmp-table .ct-r { display:flex; }
.cmp-table .ct-r div { flex:1; font-size:12.5px; padding:10px; border:1px solid var(--line); border-top:none; line-height:1.7; }
.cmp-table .ct-r div.diff { background:var(--red-l); }
.cmp-table .ct-r div:first-child { border-right:none; }
.cmp-table .ct-r div:nth-child(2) { border-right:none; }
.cmp-table .ct-r .diff-mark { color:var(--red); font-weight:700; }

/* 处置流 */
.steps { display:flex; align-items:center; margin:14px 0 18px; }
.step { display:flex; align-items:center; gap:8px; }
.step .sc { width:28px; height:28px; border-radius:50%; background:#E2E8F0; color:var(--text-2); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; border:2px solid #CBD5E1; }
.step .sl { font-size:12px; color:var(--gray); }
.step.done .sc { background:var(--green); border-color:var(--green); color:#fff; }
.step.cur .sc { background:var(--blue); border-color:var(--blue); color:#fff; }
.step.cur .sl { color:var(--blue); font-weight:600; }
.step-line { flex:1; height:2px; background:var(--line); margin:0 10px; }
.step-line.done { background:var(--green); }

/* 弹层 */
.mask { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:center; justify-content:center; z-index:100; }
.mask.show { display:flex; }
.modal { background:#fff; border-radius:14px; width:520px; max-width:92vw; max-height:86vh; overflow-y:auto; box-shadow:0 20px 60px rgba(15,23,42,.25); }
.modal .m-h { display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); font-weight:600; font-size:15px; }
.modal .m-h .x { margin-left:auto; width:28px; height:28px; border-radius:50%; background:var(--gray-l); display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--gray); }
.modal .m-h .x:hover { background:#E2E8F0; }
.modal .m-b { padding:18px 20px; }
.modal .m-f { display:flex; justify-content:flex-end; gap:10px; padding:14px 20px; border-top:1px solid var(--line); }
.fm { margin-bottom:14px; }
.fm label { display:block; font-size:12px; color:var(--text-2); margin-bottom:6px; font-weight:600; }
.fm .reason-chips { display:flex; flex-wrap:wrap; gap:8px; }
.fm .reason-chips span { font-size:12px; padding:6px 12px; border-radius:16px; background:var(--gray-l); cursor:pointer; border:1px solid var(--line); }
.fm .reason-chips span.on { background:var(--blue-l); border-color:var(--blue); color:var(--blue); font-weight:600; }
.radio-group { display:flex; gap:10px; }
.radio-group label { display:flex; align-items:center; gap:5px; font-weight:400; cursor:pointer; margin:0; }

/* toast */
#toast { position:fixed; top:72px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
.toast-item { background:#0F172A; color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); animation:tp .25s; }
@keyframes tp { from { opacity:0; transform:translateY(-8px);} to { opacity:1; transform:translateY(0);} }

/* 进度 */
.prog { height:8px; background:var(--gray-l); border-radius:4px; overflow:hidden; }
.prog i { display:block; height:100%; background:var(--blue); border-radius:4px; transition:width .3s; }
.prog.green i { background:var(--green); }

/* 预警 */
.cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:10px; }
.cal .d { border:1px solid var(--line); border-radius:8px; min-height:64px; padding:6px 8px; font-size:12px; position:relative; }
.cal .d .dn { color:var(--gray); font-size:11px; }
.cal .d.warn { background:var(--orange-l); border-color:#F59E0B; }
.cal .d.over { background:var(--red-l); border-color:var(--red); }
.cal .d .mk { font-size:10px; margin-top:3px; display:block; }
.view { display:none; }
.view.show { display:block; }
.mt8 { margin-top:8px; } .mt12 { margin-top:12px; } .mt16 { margin-top:16px; }
.muted { color:var(--gray); font-size:12px; }
.row { display:flex; align-items:center; gap:10px; }
.right { margin-left:auto; }
/* ===== 增量样式（投标响应/起草/画像/搜索/通知） ===== */
.page-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
.page-head h2{ font-size:20px; margin:0; }
.page-head p{ font-size:12px; color:var(--gray); margin:0; }
.sec-t{ font-weight:600; font-size:14px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
.tbl th{ text-align:left; color:var(--gray); font-weight:500; font-size:12px; padding:8px 10px; border-bottom:1px solid var(--line); }
.tbl td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
.tbl tr:last-child td{ border-bottom:none; }
.pill{ display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.pill.g{ background:#ECFDF5; color:#059669; }
.pill.o{ background:#FFF7ED; color:#EA580C; }
.pill.y{ background:#FEF9C3; color:#CA8A04; }
.pill.r{ background:#FEE2E2; color:#DC2626; }
.pill.b{ background:#EFF6FF; color:#2563EB; }
.lnk{ color:var(--blue); cursor:pointer; font-size:13px; }
.lnk:hover{ text-decoration:underline; }
.bar{ height:8px; background:var(--gray-l); border-radius:4px; overflow:hidden; }
.bar .fill{ height:100%; background:var(--blue); border-radius:4px; }
.chip{ display:inline-block; padding:4px 12px; border-radius:14px; background:var(--gray-l); color:var(--text-2); font-size:12px; cursor:pointer; border:1px solid var(--line); }
.chip.on{ background:var(--blue); color:#fff; border-color:var(--blue); }
.btn.primary{ background:var(--blue); color:#fff; }
.btn.primary:hover{ background:#1D4ED8; }
.h-search{ position:relative; margin-right:14px; }
.h-search input{ width:230px; padding:6px 12px; border-radius:6px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.12); color:#fff; font-size:12px; outline:none; }
.h-search input::placeholder{ color:rgba(255,255,255,.65); }
.h-search input:focus{ border-color:rgba(255,255,255,.6); background:rgba(255,255,255,.2); }
.g-suggest{ position:absolute; top:34px; right:0; width:280px; background:#fff; border-radius:8px; box-shadow:0 8px 24px rgba(15,23,42,.18); z-index:99; overflow:hidden; display:none; }
.g-suggest.show{ display:block; }
.g-suggest .gs-i{ padding:9px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--gray-l); color:#334155; }
.g-suggest .gs-i:hover{ background:var(--gray-l); }
.g-suggest .gs-i .gs-t{ color:var(--gray); font-size:11px; margin-left:6px; }
.noti-panel{ position:absolute; top:44px; right:0; width:300px; background:#fff; border-radius:10px; box-shadow:0 8px 24px rgba(15,23,42,.18); z-index:99; display:none; overflow:hidden; }
.noti-panel.show{ display:block; }
.noti-panel .np-h{ padding:10px 14px; font-weight:600; font-size:13px; border-bottom:1px solid var(--line); }
.noti-panel .np-i{ padding:10px 14px; font-size:12px; border-bottom:1px solid var(--gray-l); cursor:pointer; display:flex; gap:8px; align-items:flex-start; }
.noti-panel .np-i:hover{ background:var(--gray-l); }
.noti-panel .np-i .np-d{ color:var(--gray); font-size:11px; margin-top:2px; }
.noti-panel .np-empty{ padding:20px; text-align:center; color:var(--gray); font-size:12px; }
.toast-item{ transition:opacity .3s; }
.toast-undo:hover{ text-decoration:underline; }
.risk-item{ transition:all .25s; }
.risk-item.done{ opacity:.62; }
.risk-item.just-decided{ animation:flash .6s; }
@keyframes flash{ 0%{background:var(--blue);color:#fff} 100%{background:transparent} }
.empty{ padding:40px; text-align:center; color:var(--gray); font-size:13px; }
.skel{ background:linear-gradient(90deg,var(--gray-l) 25%,#fff 50%,var(--gray-l) 75%); background-size:200% 100%; animation:sk 1.2s infinite; border-radius:6px; }
@keyframes sk{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="mark">📋</span> procuraAI <span style="font-weight:400;font-size:12px;opacity:.75">采购智能审查</span></div>
  <nav class="h-nav">
    <button class="on" data-nav="home">工作台</button>
    <button data-nav="review">审查中心</button>
    <button data-nav="alert">履约预警</button>
    <button data-nav="rules">规则管理</button>
  </nav>
  <div class="h-right">
    <div class="h-search"><input id="gSearch" placeholder="搜索合同 / 供应商 / 风险…" autocomplete="off"><div id="gSuggest" class="g-suggest"></div></div>
    <div class="noti" id="notiBtn">🔔<span class="dot"></span><div id="notiPanel" class="noti-panel"></div></div>
    <div class="user"><span class="avatar">法</span> 王法务 <span style="font-size:11px;opacity:.75">法务 · 合同审查</span></div>
  </div>
</header>

<div class="layout">
  <aside id="side">
    <div class="side-group">工作台</div>
    <div class="side-item on" data-view="dashboard">🏠 工作台</div>
    <div class="side-group">审查中心</div>
    <div class="side-item" data-view="tender">📄 招标体检</div>
    <div class="side-item" data-view="contract">📑 合同审查</div>
    <div class="side-group">采购响应</div>
    <div class="side-item" data-view="bid">🎯 投标响应</div>
    <div class="side-item" data-view="draft">✍️ 合同起草</div>
    <div class="side-item" data-view="vendor">🏢 供应商画像</div>
    <div class="side-group">履约与规则</div>
    <div class="side-item" data-view="alert">⏰ 履约预警 <span class="badge">3</span></div>
    <div class="side-item" data-view="rules">⚙️ 规则管理</div>
    <div class="side-group">数据分析</div>
    <div class="side-item" data-view="board">📋 审查看板</div>
    <div class="side-item" data-view="trend">📊 风险趋势</div>
  </aside>

  <main id="main"></main>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
/* ============ 模拟数据 ============ */
const DATA = {
  tenderRisk: [
    { id:"R01", rule:true, level:"high", type:"注册地限制", title:"投标人注册地须在本省（不合理限制）", quote:"投标人须在X省境内注册，且注册时间不少于3年", basis:"《招标投标法实施条例》第32条(六)", suggest:"删除注册地限制，改为对履约能力的要求（同类业绩、人员资质）", conf:1.0, decision:null },
    { id:"R07", rule:true, level:"high", type:"资质指向性", title:"技术参数指向特定品牌（排他条款）", quote:"核心交换机须为N品牌同档次产品，并提供N厂商授权书", basis:"《招标投标法实施条例》第32条(二)(三)", suggest:"改为\"不低于下述参数的知名品牌\"并开放≥3家满足", conf:1.0, decision:null },
    { id:"R12", rule:true, level:"mid", type:"付款节点不明", title:"付款条件与验收节点绑定不清", quote:"货到后支付50%款项，验收合格后支付剩余款项", basis:"财库〔2021〕22号 第20条", suggest:"明确\"货到验收合格后 30 日内\"等可计算节点", conf:.92, decision:null },
    { id:"LLM03", rule:false, level:"mid", type:"权责不对等", title:"质保期责任单向倾斜，采购方义务缺失", quote:"质保期内一切维修费用由供应商承担，采购方无配合义务条款", basis:"民法典 第582条 质量不符救济", suggest:"补充采购方配合义务与供应商响应时限（如 48h）", conf:.88, decision:null },
    { id:"R18", rule:true, level:"mid", type:"评标规则倾向", title:"评分项\"本地业绩\"权重过高", quote:"本地业绩满分为10分，其余地区业绩满分5分", basis:"《招标投标法实施条例》第32条(五)", suggest:"统一业绩地域口径，按业绩类型与规模评分", conf:.95, decision:null },
    { id:"LLM07", rule:false, level:"low", type:"条款一致性", title:"质保期前后表述不一致（3年/5年）", quote:"\"整机质保3年\"（P12）与\"核心部件质保5年\"（P23）", basis:"内部质检规范", suggest:"统一质保期限口径并核对明细清单", conf:.80, decision:null }
  ],
  cmpDiffs: [
    { field:"付款方式", tender:"货到验收合格后 30 日内支付 90%", bid:"货到后支付 90%", contract:"货到后 60 日内支付 90%", diff:"合同与招标文件不一致：验收前置被删除" },
    { field:"交货期", tender:"合同签订后 45 日历天", bid:"合同签订后 45 日历天", contract:"合同签订后 60 日历天", diff:"合同交货期晚于招标文件 15 天" }
  ],
  contractRisk: [
    { id:"R25-1", rule:true, level:"high", type:"实质性背离", title:"付款方式背离招标文件（三一致命中）", quote:"货到后 60 日内支付 90%，无验收前置", basis:"《招标投标法实施条例》第57条", suggest:"改回\"货到验收合格后 30 日内支付 90%\"", conf:1.0, decision:null, cmp:true },
    { id:"R25-2", rule:true, level:"high", type:"实质性背离", title:"交货期晚于招标文件 15 天", quote:"合同签订后 60 日历天交付", basis:"《招标投标法实施条例》第57条", suggest:"改回\"合同签订后 45 日历天\"", conf:1.0, decision:null, cmp:true },
    { id:"R14", rule:true, level:"mid", type:"付款节点不明", title:"付款依据引用\"双方协商\"无明确节点", quote:"剩余款项支付时间由双方协商确定", basis:"《政采法实施条例》第75条", suggest:"改为可计算节点（如\"验收合格后 30 日内\"）", conf:.94, decision:null },
    { id:"LLM11", rule:false, level:"low", type:"文字错误", title:"金额大小写不一致（元/万元）", quote:"合同总价 壹佰贰拾万元（￥1,200,000 元）", basis:"内部质检规范", suggest:"统一为\"人民币 120 万元\"并核对", conf:.82, decision:null }
  ],
  alerts: [
    { id:"A01", no:"CG-HW-2026-012", vendor:"华信科技", node:"付款到期", due:"2026-10-18", days:6, amt:"¥ 480,000", status:"UPCOMING", rule:"T-15 提醒" },
    { id:"A02", no:"CG-SW-2026-005", vendor:"中软智达", node:"验收截止", due:"2026-10-12", days:0, amt:"¥ 1,200,000", status:"EXPIRED", rule:"T-0 到期" },
    { id:"A03", no:"CG-FW-2026-002", vendor:"蓝盾安全", node:"质保到期", due:"2026-10-09", days:-3, amt:"—", status:"OVERDUE", rule:"T+0 逾期" }
  ]
};

/* ============ 状态 ============ */
let state = { view:"dashboard", tenderDone:0, contractStep:0, activeRisk:null, filter:"all", cmpShown:false };

/* ============ 工具 ============ */
function toast(msg, undoFn){
  const t=document.createElement('div'); t.className='toast-item';
  t.innerHTML = esc(msg) + (undoFn?` <a class="toast-undo" style="color:var(--blue);cursor:pointer;margin-left:10px;font-weight:600">撤销</a>`:'');
  document.getElementById('toast').appendChild(t);
  if(undoFn){ t.querySelector('.toast-undo').addEventListener('click', ()=>{ undoFn(); t.remove(); }); }
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 3600);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lvBadge = l => `<span class="lv ${l}">${l==='high'?'高':l==='mid'?'中':'低'}</span>`;
const tagHtml = r => r.rule ? '<span class="tag rule">规则</span>' : '<span class="tag llm">AI 语义</span>';
const money = s => s.replace('¥','￥');

/* ============ 视图切换 ============ */
function nav(view){
  state.view = view;
  syncNav(view);
  render();
}
function syncNav(view){
  const topMap = { dashboard:'home', tender:'review', contract:'review', bid:'review', draft:'review', vendor:'review', alert:'alert', rules:'rules', board:'home', trend:'home' };
  document.querySelectorAll('.h-nav button').forEach(b=>b.classList.toggle('on', b.dataset.nav === topMap[view]));
  document.querySelectorAll('.side-item').forEach(s=>s.classList.toggle('on', s.dataset.view===view));
}
function render(){
  const main = document.getElementById('main');
  const views = { dashboard:renderDash, tender:renderTender, contract:renderContract, alert:renderAlert, rules:renderRules, bid:renderBid, draft:renderDraft, vendor:renderVendor, board:renderBoard, trend:renderTrend };
  main.innerHTML = (views[state.view]||renderDash)();
  bind();
}

/* ============ 工作台 ============ */
function renderDash(){
  const pending = DATA.tenderRisk.filter(r=>!r.decision).length;
  const alerts = DATA.alerts.filter(a=>a.status!=='CLEARED').length;
  const hr = new Date().getHours();
  const greet = hr<6?'凌晨好':hr<12?'上午好':hr<14?'中午好':hr<18?'下午好':'晚上好';
  const today = new Date();
  const wd = ['日','一','二','三','四','五','六'][today.getDay()];
  const dateStr = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日 周${wd}`;
  return `
  <h2 style="font-size:20px;margin-bottom:4px">${greet}，王法务 👋</h2>
  <div class="muted mt8">${dateStr} · 今天有 ${pending+alerts} 项待处理：招标体检风险确认 ${pending} 条 · 履约预警 ${alerts} 条</div>
  <div class="dash-cards mt16">
    <div class="dash-card" onclick="goReview('tender')"><div class="num red">${pending}</div><div class="lbl">招标体检 · 待确认风险</div><div class="spark"><div class="spark">${[3,5,2,6,4,7,6].map(v=>`<div class="bar red" style="height:${v*4}px"></div>`).join('')}</div></div><div class="more">前往处理 →</div></div>
    <div class="dash-card" onclick="goReview('contract')"><div class="num">${DATA.contractRisk.filter(r=>!r.decision).length}</div><div class="lbl">合同审查 · 待确认</div><div class="spark"><div class="spark">${[4,3,5,2,4,3,4].map(v=>`<div class="bar" style="height:${v*4}px"></div>`).join('')}</div></div><div class="more">前往处理 →</div></div>
    <div class="dash-card" onclick="nav('alert')"><div class="num orange">${alerts}</div><div class="lbl">履约预警 · 待跟进</div><div class="spark"><div class="spark">${[2,1,3,2,4,3,3].map(v=>`<div class="bar orange" style="height:${v*4}px"></div>`).join('')}</div></div><div class="more">查看台账 →</div></div>
    <div class="dash-card" onclick="goReview('contract')"><div class="num green">${state.contractStep<3?1:0}</div><div class="lbl">处置流 · 修订中</div><div class="spark"><div class="spark">${[1,2,1,3,2,1,1].map(v=>`<div class="bar green" style="height:${v*4}px"></div>`).join('')}</div></div><div class="more">继续处理 →</div></div>
  </div>
  <div class="dash-wrap">
    <div class="card">
      <div class="card-h">待办清单 <span class="sub">点击即可处理</span><div class="right"><span class="tag rule">按优先级排序</span></div></div>
      <div class="card-b">
        <div class="todo-item" onclick="goReview('tender')"><div class="ico">📄</div><div><div class="tt">设备采购项目（一期）招标文件 · 体检报告待确认</div><div class="ts">6 条风险 · 高 2 · 中 3 · 低 1 · 10 分钟前更新</div></div><span class="go">→</span></div>
        <div class="todo-item" onclick="goReview('contract')"><div class="ico">📑</div><div><div class="tt">CG-HW-2026-012 采购合同 · 三一致校验命中 2 处背离</div><div class="ts">需在签约前处理 · 已升级为高优先级</div></div><span class="go">→</span></div>
        <div class="todo-item" onclick="nav('alert')"><div class="ico">⏰</div><div><div class="tt">CG-SW-2026-005 验收节点今日到期 · 待核销</div><div class="ts">T-0 到期 · 金额 ¥1,200,000</div></div><span class="go">→</span></div>
        <div style="text-align:center;padding:10px"><a class="lnk" onclick="toast('共 9 项待办，已展开全部')">查看全部 9 项 →</a></div>
      </div>
    </div>
    <div class="card">
      <div class="card-h">近 30 日审查概况<div class="right"><span class="muted">数据为演示样例</span></div></div>
      <div class="card-b">
        <div class="row" style="gap:24px">
          <div><div style="font-size:24px;font-weight:700;color:var(--blue)">87</div><div class="muted">审查文档（份）</div></div>
          <div><div style="font-size:24px;font-weight:700;color:var(--green)">94%</div><div class="muted">建议采纳率</div></div>
          <div><div style="font-size:24px;font-weight:700;color:var(--blue)">4.2 分</div><div class="muted">平均审查耗时（分钟）</div></div>
        </div>
        <div class="prog mt16"><i style="width:72%"></i></div>
        <div class="row mt8 muted">规则层命中 342 条 · AI 语义命中 128 条 · 人工确认后采纳 441 条</div>
      </div>
    </div>
  </div>`;
}

/* ============ 招标体检 ============ */
function renderTender(){
  const all = DATA.tenderRisk;
  const done = all.filter(r=>r.decision).length;
  const undone = all.filter(r=>!r.decision);
  return `
  <div class="card">
    <div class="card-h">📄 招标文件体检 <span class="sub">上传招标文件，先体检、再发布</span>
      <div class="right"><span class="muted">设备采购项目（一期）招标文件 · 32 页 · 12.4MB</span>
        <button class="btn ghost sm" style="margin-left:10px" onclick="openUpload()">上传新文件</button></div></div>
    <div class="card-b">
      <div class="row">
        <div class="prog" style="flex:1"><i style="width:100%" class="green"></i></div>
        <span class="muted" style="margin-left:12px">体检完成 · 检出 6 条风险</span>
      </div>
      <div class="row mt16" style="gap:18px">
        <div><span class="lv high">高 2</span></div><div><span class="lv mid">中 3</span></div><div><span class="lv low">低 1</span></div>
        <div class="right" style="display:flex;gap:8px">
          <button class="btn ghost sm" onclick="openExportReport()">导出报告</button>
          <button class="btn sm" ${undone.length?'':'disabled'} onclick="goReport()">逐条确认（剩余 ${undone.length}）</button>
        </div>
      </div>
    </div>
  </div>
  <div class="report-wrap mt16" id="reportWrap"></div>`;
}

/* ============ 审查报告（体检/合同共用） ============ */
function reportData(){
  return state.view==='tender' ? DATA.tenderRisk : DATA.contractRisk;
}
function docHtml(){
  const h = (s,l) => `<span class="hl lv-${l}">${s}</span>`;
  if(state.view==='tender') return `
    <h4>第一章 招标公告</h4>
    本招标项目 设备采购项目（一期）已由相关部门批准，资金来源为自有资金，招标人为金源集团。现对该项目进行公开招标，欢迎符合条件的投标人参加投标。<br><br>
    <b>投标人资格要求：</b><br>
    3.1 投标人须为中华人民共和国境内合法注册的企业法人；<br>
    3.2 ${h('投标人须在X省境内注册，且注册时间不少于3年','h')}；<br>
    3.3 投标人须具有同类项目业绩不少于 2 个，并提供合同复印件；<br>
    3.4 本项目不接受联合体投标。<br><br>
    <h4>第四章 技术规格与要求</h4>
    4.2 核心设备参数：<br>
    4.2.1 ${h('核心交换机须为N品牌同档次产品，并提供N厂商授权书','h')}；<br>
    4.2.2 服务器内存 ≥ 128GB，存储 ≥ 10TB；<br>
    4.2.3 支持国产化操作系统兼容（麒麟/UOS）。<br><br>
    <h4>第五章 评标办法</h4>
    5.1 评标采用综合评分法，价格 40 分，技术 35 分，商务 25 分；<br>
    5.2 ${h('投标人在本省行政区域内的同类业绩，每项得 10 分（满分 10 分）；省外业绩每项得 5 分（满分 5 分）','m')}；<br><br>
    <h4>第六章 合同主要条款</h4>
    6.3 付款方式：${h('货到后支付 50% 款项，验收合格后支付剩余款项','m')}；<br>
    6.4 质保期：${h('整机质保 3 年','l')}，${h('核心部件质保 5 年','l')}；<br>
    6.5 ${h('质保期内一切维修费用由供应商承担','m')}；<br><br>
    <div class="hl-panel"><div class="hp-t">📌 原文高亮说明</div>黄色 = 中风险命中 · 红色 = 高风险命中 · 蓝色 = 低风险命中。点击左侧风险条目可定位到原文。</div>`;
  return `
    <h4>合同编号 CG-HW-2026-012</h4>
    甲方：金源集团 · 乙方：华信科技<br>
    签订日期：2026-09-28<br><br>
    <h4>二、合同标的与价款</h4>
    2.1 合同总价为人民币 壹佰贰拾万元（${h('￥1,200,000 元','l')}）；<br>
    2.2 价格包含设备、运输、安装调试与培训费用。<br><br>
    <h4>三、交付与验收</h4>
    3.1 乙方应于 ${h('合同签订后 60 日历天','h')} 内完成交付；<br>
    3.2 甲方在收到乙方书面验收申请后 15 个工作日内组织验收；<br><br>
    <h4>四、付款</h4>
    4.1 ${h('货到后 60 日内支付 90%，无验收前置','h')}；<br>
    4.2 剩余款项支付时间 ${h('由双方协商确定','m')}。<br><br>
    <div class="hl-panel"><div class="hp-t">📌 三一致校验（R25）</div>本合同的付款方式与交货期条款与招标文件不一致，构成实质性背离（条例57条），须在签约前修订。<button class="btn sm mt8" onclick="toggleCmp()">${state.cmpShown?'收起':'查看'}三一致对照</button></div>
    ${state.cmpShown ? cmpTable() : ''}`;
}
function cmpTable(){
  return `<div class="cmp-table">
    <div class="ct-h"><div>招标文件要求</div><div>投标文件承诺</div><div>合同条款</div></div>
    ${DATA.cmpDiffs.map(d=>`<div class="ct-r"><div class="diff"><span class="diff-mark">▲</span> ${esc(d.tender)}</div><div>${esc(d.bid)}</div><div class="diff"><span class="diff-mark">▲</span> ${esc(d.contract)}</div></div>`).join('')}
  </div>`;
}
function toggleCmp(){ state.cmpShown=!state.cmpShown; render(); }
</script>

<script>
/* ============ 审查报告渲染与绑定 ============ */
function renderReport(){
  const data = reportData();
  const list = data.filter(r=> state.filter==='all' || r.level===state.filter);
  const lv = {high:'高',mid:'中',low:'低'};
  return `
  <div class="panel-left">
    <div class="p-h row"><b>风险清单</b><span class="muted" style="font-size:12px">${data.filter(r=>!r.decision).length} 条待确认</span>
      <div class="right"><span class="tag rule">规则</span><span class="tag llm">AI 语义</span></div></div>
    <div class="filter-row">
      ${['all','high','mid','low'].map(f=>`<span class="fchip ${state.filter===f?'on':''}" onclick="setFilter('${f}')">${f==='all'?'全部':lv[f]}</span>`).join('')}
    </div>
    <div class="risk-list">
      ${list.map(r=>`
      <div class="risk-item ${r.decision?'done':''} ${state.activeRisk===r.id?'on':''}" onclick="locate('${r.id}')">

function setFilter(f){ state.filter=f; render(); }
function locate(id){
  state.activeRisk = id; render();
  const r = reportData().find(x=>x.id===id); if(!r) return;
  const els = [...document.querySelectorAll('.doc-body .hl')];
  const target = els.find(e=>e.textContent.includes(r.quote.slice(0,10))) || els[0];
  if(target){
    target.scrollIntoView({behavior:'smooth', block:'center'});
    target.style.outline='3px solid #2563EB';
    target.style.background='rgba(37,99,235,.18)';
    let n=0; const blink=setInterval(()=>{ target.style.background = n%2? 'rgba(37,99,235,.18)':''; if(++n>5){ clearInterval(blink); target.style.background=''; } }, 280);
    setTimeout(()=>target.style.outline='', 1800);
  }
}
function decide(id, d){
  const r = reportData().find(x=>x.id===id);
  r.decision = 'ACCEPTED';
  state.activeRisk = null;
  toast(`已采纳：${r.title.slice(0,16)}…`, ()=>{ r.decision=null; toast('已撤销采纳'); render(); });
  if(state.view==='tender' && reportData().every(x=>x.decision)) setTimeout(()=>toast('体检风险已全部确认，可导出修改建议汇总'), 400);
  render();
}
function openReject(id){
  const r = reportData().find(x=>x.id===id);
  openModal(`
    <div class="m-h">驳回风险条目<span class="x" onclick="closeModal()">✕</span></div>
    <div class="m-b">
      <div class="fm"><label>风险条目</label><div>${lvBadge(r.level)} ${esc(r.title)}</div></div>
      <div class="fm"><label>驳回理由（必选）</label>
        <div class="reason-chips" id="reasons">

        </div></div>
      <div class="fm"><label>备注</label><textarea rows="2" style="width:100%" placeholder="补充说明（选填）"></textarea></div>
    </div>
    <div class="m-f"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="submitReject('${id}')">确认驳回</button></div>
  `);
}
function pickReason(el){ el.parentElement.querySelectorAll('span').forEach(s=>s.classList.remove('on')); el.classList.add('on'); }
function submitReject(id){
  const picked = document.querySelector('#reasons .on');
  if(!picked){ toast('请选择驳回理由'); return; }
  const r = reportData().find(x=>x.id===id); r.decision='REJECTED'; r.rejectReason=picked.textContent;
  closeModal(); state.activeRisk=null;
  toast(`已驳回（${r.rejectReason}）：理由将回流到规则优化`, ()=>{ r.decision=null; r.rejectReason=null; toast('已撤销驳回'); render(); });
  render();

function openModify(id){
  const r = reportData().find(x=>x.id===id);
  openModal(`
    <div class="m-h">改判风险条目<span class="x" onclick="closeModal()">✕</span></div>
    <div class="m-b">

        <label><input type="radio" name="mlv" value="mid" ${r.level==='mid'?'checked':''}> 中</label>

      <div class="fm"><label>修改建议</label><textarea rows="3" style="width:100%">${esc(r.suggest)}</textarea></div>
    </div>
    <div class="m-f"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="submitModify('${id}')">确认改判</button></div>
  `);
}
function submitModify(id){
  const lv = document.querySelector('input[name="mlv"]:checked');
  if(!lv){ toast('请选择风险级别'); return; }
  const r = reportData().find(x=>x.id===id);

  {k:'华信', t:'供应商', v:'vendor'},

function initGlobalSearch(){
  const input = document.getElementById('gSearch');
  const box = document.getElementById('gSuggest');
  if(!input||!box) return;
  input.addEventListener('input', ()=>{
    const q = input.value.trim();
    if(!q){ box.classList.remove('show'); return; }
    const hits = SEARCH_ITEMS.filter(i=>i.k.toLowerCase().includes(q.toLowerCase()));
    box.innerHTML = hits.length
      ? hits.map(i=>`<div class="gs-i" data-v="${i.v}">${i.k.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\\\]/g,'\\\\$&')+')','ig'),'<b style="color:var(--blue)">$1</b>')}<span class="gs-t">${i.t}</span></div>`).join('')
      : '<div class="np-empty">无匹配结果</div>';
    box.classList.add('show');
  });
  box.addEventListener('click', e=>{
    const it = e.target.closest('.gs-i'); if(!it) return;
    box.classList.remove('show'); input.value='';
    nav(it.dataset.v);
  });
  document.addEventListener('click', e=>{ if(!e.target.closest('.h-search')) box.classList.remove('show'); });
}

let upTimer;
function openUpload(title, doneMsg){
  const t = title || '上传招标文件';
  const dm = doneMsg || '体检完成 · 检出 6 条风险（高 2 · 中 3 · 低 1）';
  openModal(`<div class="m-h">${esc(t)}<span class="x" onclick="closeModal()">✕</span></div>

    <div id="upProg" style="display:none;margin-top:12px"><div style="font-size:12px;color:var(--gray);margin-bottom:6px" id="upTxt">解析中 10%…</div><div class="bar"><div class="fill" id="upFill" style="width:10%"></div></div></div>
  </div>
  <div class="m-f"><button class="btn ghost" onclick="closeModal()">取消</button></div>`);
  const dz = document.getElementById('dropZone');
  if(dz){
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.style.borderColor='var(--blue)'; dz.style.background='var(--gray-l)'; });
    dz.addEventListener('dragleave', ()=>{ dz.style.borderColor='#CBD5E1'; dz.style.background=''; });
    dz.addEventListener('drop', e=>{ e.preventDefault(); dz.style.borderColor='#CBD5E1'; dz.style.background=''; pickFile(dm); });
  }
}
function pickFile(doneMsg){
  const dm = doneMsg || '体检完成 · 检出 6 条风险（高 2 · 中 3 · 低 1）';
  const dz = document.getElementById('dropZone'); const pg = document.getElementById('upProg');
  if(!dz||!pg) return;
  dz.style.display='none'; pg.style.display='block';
  let p = 10;
  clearInterval(upTimer);
  upTimer = setInterval(()=>{
    p = Math.min(p + 6 + Math.floor(Math.random()*10), 100);
    document.getElementById('upFill').style.width = p+'%';
    document.getElementById('upTxt').textContent = p<100 ? `解析中 ${p}%…` : '解析完成 · 正在生成报告…';
    if(p>=100){
      clearInterval(upTimer);
      setTimeout(()=>{ closeModal(); toast(dm); }, 900);
    }
  }, 260);
}

/* ============ 初始化 ============ */
function init(){
  const main = document.getElementById('main');
  /* URL hash 导航支持（#dashboard / #tender / #contract / #alert / #rules） */
  const h = (location.hash||'').replace('#','');
  if(['dashboard','tender','contract','bid','draft','vendor','alert','rules','board','trend'].includes(h)) state.view = h;
  syncNav(state.view);
  const views = { dashboard:renderDash, tender:renderTender, contract:renderContract, bid:renderBid, draft:renderDraft, vendor:renderVendor, alert:renderAlert, rules:renderRules, board:renderBoard, trend:renderTrend };
  main.innerHTML = (views[state.view]||renderDash)();
  const w = document.getElementById('reportWrap');
  if(w && (state.view==='tender'||state.view==='contract')) w.innerHTML = renderReport();
  document.querySelectorAll('.h-nav button').forEach(b=> b.addEventListener('click', ()=>{
    const v = b.dataset.nav==='home'?'dashboard':b.dataset.nav==='review'?'contract':b.dataset.nav;
    nav(v);
  }));
  initGlobalSearch();
  initNoti();
}
/* 报告区注入：仅体检/合同视图有 reportWrap */
function renderReportInto(){
  const w = document.getElementById('reportWrap');
  if(w && (state.view==='tender'||state.view==='contract')) w.innerHTML = renderReport();
}
/* 在 render() 内联渲染后补齐报告区 */
const _origRender = render;
render = function(){
  const main = document.getElementById('main');
  const views = { dashboard:renderDash, tender:renderTender, contract:renderContract, bid:renderBid, draft:renderDraft, vendor:renderVendor, alert:renderAlert, rules:renderRules };
  main.innerHTML = (views[state.view]||renderDash)();
  const w = document.getElementById('reportWrap');
  if(w && (state.view==='tender'||state.view==='contract')) w.innerHTML = renderReport();
  bind();
};
init();
</script>
