<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1210" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="1210" fill="#f7f9fc"/>
  <text x="340" y="26" font-size="17" font-weight="700" fill="#1f2d3d" text-anchor="middle">Procura 关键链路时序（LLD v0.3 · 总纲 §21.5 落地）</text>
  <text x="340.0" y="44" font-size="9.29" fill="#6b7785" text-anchor="middle">蓝=采购域 OUT · 绿虚线=外部 INBOUND · 红虚线=故障分支 · 紫=重放/补偿；事件注册表见总纲附录 B，payload 真源 contracts/asyncapi.yaml</text>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2f6fed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2e7d32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#c62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6a1b9a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ============================ ① S2P ============================ -->
  <rect x="16" y="58" width="648" height="372" rx="10" fill="#ffffff" stroke="#d7e0ea"/>
  <rect x="16" y="58" width="648" height="26" rx="10" fill="#eef3fb"/>
  <rect x="16" y="74" width="648" height="10" fill="#eef3fb"/>
  <text x="30" y="76" font-size="12" font-weight="700" fill="#1f2d3d">① S2P 端到端：寻源 → 准入闸门 → PO 确认（含超时重试 / 批量部分失败 / 提交后确认失败）</text>

  <g font-size="9" font-weight="600" text-anchor="middle">
    <rect x="26" y="92" width="110" height="30" rx="5" fill="#e3f2fd" stroke="#2f6fed"/><text x="81" y="111" fill="#0d47a1">需求方 / 采购员</text>
    <rect x="155" y="92" width="110" height="30" rx="5" fill="#e3f2fd" stroke="#2f6fed"/><text x="210" y="111" fill="#0d47a1">02 寻源与准入</text>
    <rect x="285" y="92" width="110" height="30" rx="5" fill="#e3f2fd" stroke="#2f6fed"/><text x="340" y="111" fill="#0d47a1">01 供应商 MDM</text>
    <rect x="415" y="92" width="110" height="30" rx="5" fill="#e3f2fd" stroke="#2f6fed"/><text x="470" y="111" fill="#0d47a1">04 交易 / PO</text>
    <rect x="544" y="92" width="110" height="30" rx="5" fill="#fff8e1" stroke="#f9a825"/><text x="599" y="111" fill="#e65100">05 门户 / 供应商</text>
  </g>
  <g stroke="#c9d4e2" stroke-width="1" stroke-dasharray="4 4">
    <line x1="81" y1="122" x2="81" y2="410"/><line x1="210" y1="122" x2="210" y2="410"/>
    <line x1="340" y1="122" x2="340" y2="410"/><line x1="470" y1="122" x2="470" y2="410"/>
    <line x1="599" y1="122" x2="599" y2="410"/>
  </g>

  <g font-size="8.6" fill="#26384f">
    <line x1="81" y1="146" x2="210" y2="146" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="145" y="141" text-anchor="middle">提交寻源申请（Idempotency-Key）</text>
    <text x="145" y="159" text-anchor="middle" fill="#7a8798">SourcingProject.DRAFT → PUBLISHED</text>

    <line x1="210" y1="176" x2="599" y2="176" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="404" y="171" text-anchor="middle">RfxPublished → 门户邀请（通知按 (rfx_no, supplier_id) 幂等）</text>

    <line x1="599" y1="206" x2="210" y2="206" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="404" y="201" text-anchor="middle">BidSubmitted（payload 不含报价明文；盲拍隔离）</text>

    <line x1="210" y1="236" x2="340" y2="236" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="275" y="231" text-anchor="middle">AwardDecided（人工确认）→ QualificationVerified / OnboardingApproved</text>
    <text x="275" y="249" text-anchor="middle" fill="#7a8798">OCR 资质须人工复核；禁止自动放行</text>

    <line x1="340" y1="266" x2="470" y2="266" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="405" y="261" text-anchor="middle">VendorActivated（准入 + 银行核验 + 税务 + 付款条件 + 重复发票检查）</text>
    <text x="405" y="279" text-anchor="middle" fill="#7a8798">Supplier 合作资格 ≠ Vendor 交易/付款资格；SupplierChanged 同步消费方</text>

    <line x1="470" y1="296" x2="599" y2="296" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="510.9" y="291" text-anchor="middle">PurchaseOrderCreated（X12 850 语义；Money 为字符串 + ISO 4217）</text>

    <line x1="599" y1="326" x2="470" y2="326" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aGreen)"/>
    <text x="534" y="321" text-anchor="middle" fill="#2e7d32">PurchaseOrderAcknowledged（855 / INBOUND）</text>
    <text x="518.2" y="339" text-anchor="middle" fill="#c62828">超时未确认 → 同 key 退避重试；非法迁移 409 invalid_transition</text>

    <line x1="470" y1="356" x2="599" y2="356" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="534" y="351" text-anchor="middle">批量下发 N 行（逐行快照，池级口径）</text>
    <text x="534" y="369" text-anchor="middle" fill="#c62828">单条失败 → 例外台账 + 部分成功，禁止整批回滚 / 静默吞错</text>

    <line x1="599" y1="386" x2="470" y2="386" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aRed)"/>
    <text x="534" y="381" text-anchor="middle" fill="#c62828">确认响应丢失（提交成功但客户端未收到）</text>
    <text x="489.6" y="399" text-anchor="middle" fill="#7a8798">GET /po/{po_no} 幂等重查，不重发 POST；partition_key = tenant_id + po_no</text>
  </g>
  <rect x="26" y="412" width="628" height="14" rx="3" fill="#f5f8fd"/>
  <text x="34" y="422" font-size="8.4" fill="#54657a">状态机：显式迁移表 Map&lt;State, Map&lt;Event, Transition&gt;&gt; + @Version CAS，未列出即拒绝（总纲 §21.1）；phase 为权威、status 为投影</text>

  <!-- ==================== ② 三单匹配跨域 ==================== -->
  <rect x="16" y="444" width="648" height="352" rx="10" fill="#ffffff" stroke="#d7e0ea"/>
  <rect x="16" y="444" width="648" height="26" rx="10" fill="#eef3fb"/>
  <rect x="16" y="460" width="648" height="10" fill="#eef3fb"/>
  <text x="30" y="462" font-size="12" font-weight="700" fill="#1f2d3d">② 三单匹配跨域：采购产出数据 → Finance 裁决 → 回传（采购域无放行接口）</text>

  <g font-size="9" font-weight="600" text-anchor="middle">
    <rect x="26" y="478" width="110" height="30" rx="5" fill="#e3f2fd" stroke="#2f6fed"/><text x="81" y="497" fill="#0d47a1">采购域 04 / 05</text>
    <rect x="155" y="478" width="110" height="30" rx="5" fill="#e8f5e9" stroke="#43a047"/><text x="210" y="497" fill="#1b5e20">Outbox / Broker</text>
    <rect x="285" y="478" width="110" height="30" rx="5" fill="#fff8e1" stroke="#f9a825"/><text x="340" y="497" fill="#e65100">Inventory (ACL)</text>
    <rect x="415" y="478" width="110" height="30" rx="5" fill="#fff8e1" stroke="#f9a825"/><text x="470" y="497" fill="#e65100">Finance (ACL)</text>
    <rect x="544" y="478" width="110" height="30" rx="5" fill="#fff8e1" stroke="#f9a825"/><text x="599" y="497" fill="#e65100">ERP / 付款执行</text>
  </g>
  <g stroke="#c9d4e2" stroke-width="1" stroke-dasharray="4 4">
    <line x1="81" y1="508" x2="81" y2="762"/><line x1="210" y1="508" x2="210" y2="762"/>
    <line x1="340" y1="508" x2="340" y2="762"/><line x1="470" y1="508" x2="470" y2="762"/>
    <line x1="599" y1="508" x2="599" y2="762"/>
  </g>

  <g font-size="8.6" fill="#26384f">
    <line x1="81" y1="532" x2="210" y2="532" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="152.6" y="527" text-anchor="middle">PO / ASN / InvoiceSubmitted 写入（业务 + outbox 同事务）</text>

    <line x1="340" y1="562" x2="81" y2="562" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aGreen)"/>
    <text x="210" y="557" text-anchor="middle" fill="#2e7d32">GoodsReceived（INBOUND / GR 投影，只读）</text>
    <text x="210" y="575" text-anchor="middle" fill="#7a8798">856 ASN 与 997 仅语法回执，997 不置 MATCHED</text>

    <line x1="210" y1="592" x2="470" y2="592" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="340" y="587" text-anchor="middle">交付 PO / GR / Invoice 原始数据 + aggregate_version（乱序旧版本丢弃）</text>

    <line x1="470" y1="622" x2="81" y2="622" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aRed)"/>
    <text x="275" y="617" text-anchor="middle" fill="#c62828">IrExceptionRaised（数量 / 价差 / 税差）→ 采购侧例外台账</text>
    <text x="275" y="635" text-anchor="middle" fill="#7a8798">MIRO/LIV 冻结与 MRBR 放行均属 Finance，采购域不提供放行接口</text>

    <line x1="470" y1="652" x2="81" y2="652" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aGreen)"/>
    <text x="275" y="647" text-anchor="middle" fill="#2e7d32">InvoiceMatched（INBOUND / 采购域只读，不改写应付余额）</text>

    <line x1="81" y1="682" x2="210" y2="682" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="145" y="677" text-anchor="middle">PaymentRequested（Idempotency-Key）</text>
    <text x="145" y="695" text-anchor="middle" fill="#7a8798">由 Inbox 去重后的 InvoiceMatched 触发；不重复请款</text>

    <line x1="210" y1="712" x2="599" y2="712" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="404" y="707" text-anchor="middle">付款指令 → ERP 执行（820 语义）</text>

    <line x1="599" y1="742" x2="81" y2="742" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aGreen)"/>
    <text x="340" y="737" text-anchor="middle" fill="#2e7d32">PaymentRecorded（Finance ACL / INBOUND）→ QUOTA·PAYMENT·CASE_SETTLE 三通道对账 + 差异例外台账</text>
    <text x="340" y="755" text-anchor="middle" fill="#7a8798">最终一致：不存在「未结应付 = 已收未付发票净额」等式；红冲复用原 fx_rate</text>
  </g>
  <rect x="26" y="766" width="628" height="24" rx="3" fill="#fff3f3" stroke="#efc7c7"/>
  <text x="34" y="777" font-size="8.4" fill="#a12020">采购域只产出 PO / GR / Invoice 数据并消费裁决结果；三单匹配、放行、付款裁决全部归属 Finance（总体 §4.2 / 领域 §5.4）。</text>
  <text x="34" y="787" font-size="8.4" fill="#a12020">禁止采购域直写 Finance 表、禁止把 997 当业务确认、禁止用「净额等式」替代三通道对账。</text>

  <!-- ==================== ③ Outbox / DLQ / Replay ==================== -->
  <rect x="16" y="810" width="648" height="382" rx="10" fill="#ffffff" stroke="#d7e0ea"/>
  <rect x="16" y="810" width="648" height="26" rx="10" fill="#eef3fb"/>
  <rect x="16" y="826" width="648" height="10" fill="#eef3fb"/>
  <text x="30" y="828" font-size="12" font-weight="700" fill="#1f2d3d">③ Outbox → 投递 → Inbox → DLQ → 重放 / 补偿（at-least-once，无 exactly-once 承诺）</text>

  <g font-size="9" font-weight="600" text-anchor="middle">
    <rect x="26" y="844" width="110" height="30" rx="5" fill="#e3f2fd" stroke="#2f6fed"/><text x="81" y="863" fill="#0d47a1">应用服务（写侧）</text>
    <rect x="155" y="844" width="110" height="30" rx="5" fill="#e8f5e9" stroke="#43a047"/><text x="210" y="863" fill="#1b5e20">t_proc_outbox</text>
    <rect x="285" y="844" width="110" height="30" rx="5" fill="#e8f5e9" stroke="#43a047"/><text x="340" y="863" fill="#1b5e20">Relay 中继</text>
    <rect x="415" y="844" width="110" height="30" rx="5" fill="#e8f5e9" stroke="#43a047"/><text x="470" y="863" fill="#1b5e20">Broker / Inbox</text>
    <rect x="544" y="844" width="110" height="30" rx="5" fill="#f3e5f5" stroke="#6a1b9a"/><text x="599" y="863" fill="#6a1b9a">DLQ / Ops</text>
  </g>
  <g stroke="#c9d4e2" stroke-width="1" stroke-dasharray="4 4">
    <line x1="81" y1="874" x2="81" y2="1152"/><line x1="210" y1="874" x2="210" y2="1152"/>
    <line x1="340" y1="874" x2="340" y2="1152"/><line x1="470" y1="874" x2="470" y2="1152"/>
    <line x1="599" y1="874" x2="599" y2="1152"/>
  </g>

  <g font-size="8.6" fill="#26384f">
    <line x1="81" y1="898" x2="210" y2="898" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="145" y="893" text-anchor="middle">业务写入 + outbox 同一本地事务（唯一提交点）</text>
    <text x="145" y="911" text-anchor="middle" fill="#7a8798">8 字段信封；partition_key 落表列，不进信封</text>

    <line x1="210" y1="928" x2="340" y2="928" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="275" y="923" text-anchor="middle">relay 批量拉取待投递（按 partition_key 保序）</text>

    <line x1="340" y1="958" x2="470" y2="958" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aRed)"/>
    <text x="405" y="953" text-anchor="middle" fill="#c62828">故障注入：publish 成功、mark 发送态前进程崩溃</text>

    <line x1="340" y1="988" x2="470" y2="988" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="405" y="983" text-anchor="middle">重启后重投同 eventId（重复投递不可避免 → at-least-once）</text>

    <path d="M470 1008 h34 a5 5 0 0 1 5 5 v14 h-39" fill="none" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#aBlue)"/>
    <text x="470" y="1003" text-anchor="middle">Inbox (consumer_group, event_id) 去重 + 业务副作用同事务</text>
    <text x="470" y="1039" text-anchor="middle" fill="#7a8798">未知字段忽略、未知枚举隔离告警（Tolerant Reader §16.3）</text>

    <line x1="470" y1="1058" x2="599" y2="1058" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aRed)"/>
    <text x="534" y="1053" text-anchor="middle" fill="#c62828">重试耗尽 → platform.dead_letter.v1 转投（自建中继）</text>

    <line x1="599" y1="1088" x2="81" y2="1088" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#aPurple)"/>
    <text x="340" y="1083" text-anchor="middle" fill="#6a1b9a">Replay mode=REBUILD（默认）：只重建读模型，抑制不可逆副作用</text>

    <line x1="599" y1="1118" x2="81" y2="1118" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#aPurple)"/>
    <text x="340" y="1113" text-anchor="middle" fill="#6a1b9a">REDELIVER 须显式审批 + 新 eventId + 消费者白名单，禁止整库重放</text>

    <line x1="81" y1="1148" x2="210" y2="1148" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#aPurple)"/>
    <text x="340" y="1143" text-anchor="middle" fill="#6a1b9a">Saga 补偿：COMPENSATABLE → PIVOT → RETRIABLE；t_proc_orchestration_step 持久化 saga_class / correlation_id</text>
  </g>
  <rect x="26" y="1160" width="628" height="26" rx="3" fill="#f5f8fd"/>
  <text x="34" y="1171" font-size="8.4" fill="#54657a">运行纪律：中继滞后 / DLQ 堆积 / Inbox 去重率三信号 + RED·USE 指标（总纲 §19）；终态不可回写；schema 破坏性变更走 .v2 双发布。</text>
  <text x="34" y="1182" font-size="8.4" fill="#54657a">顺序仅在同 partition_key 内成立：非顺序敏感用 tenant_id；PO→Ack→ASN→GR→Invoice→Payment 用 tenant_id + aggregate_key。</text>
</svg>
