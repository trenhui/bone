type: object
properties:
  records:
    type: array
    items: {}
  total:
    type: string
    description: 记录总数；后端为包装类型 Long（PageResult#total），被全局 Long→String 序列化器输出为字符串。page/size/pages 为Integer，仍是 number
  page:
    type: integer
  size:
    type: integer
  pages:
    type: integer
  hasNext:
    type: boolean
  hasPrevious:
    type: boolean
  nextCursor:
    type: [string, 'null']
