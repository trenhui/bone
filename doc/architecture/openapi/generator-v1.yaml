openapi: 3.1.0
info:
  title: Bone Studio Generator API
  version: 1.0.0
  description: |
    代码生成服务（As-Is）。规范见 Bone-API-规范.md §13.1；
    详设：doc/design/modules/8.Studio Generator 详细设计方案.md。

    **LRO**：`POST /code-generation` 默认 **202**，`Location` → `/operations/{taskId}`；
    `?sync=true` 同步 200。`operationId` 与 `taskId` 相同。
servers:
  - url: /api/v1/generator
paths:
  /data-sources:
    get:
      summary: 分页查询数据源
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 10 } }
        - { name: name, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK（ApiResponse + PageResult.records）
    post:
      summary: 创建数据源
      responses:
        '200': { description: OK }
  /data-sources/{id}:
    get:
      summary: 数据源详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
    put:
      summary: 更新数据源
      responses:
        '200': { description: OK }
    delete:
      summary: 删除数据源
      responses:
        '200': { description: OK }
  /data-sources/{id}:test-connection:
    post:
      summary: 测试连接（冒号动作）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /data-sources/{id}/tables:
    get:
      summary: JDBC 物理表发现
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /data-sources/{id}/tables:sync:
    post:
      summary: 同步表元数据
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /templates:
    get:
      summary: 模板列表
      responses:
        '200': { description: OK }
    post:
      summary: 创建模板
      responses:
        '200': { description: OK }
  /templates/{id}:publish:
    post:
      summary: 发布模板
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /metadata-entity-snapshots:
    get:
      summary: 已发布 meta_* 实体快照（CATALOG_SNAPSHOT）
      responses:
        '200': { description: OK }
  /code-generation:
    post:
      summary: Freemarker 异步代码生成任务
      parameters:
        - name: sync
          in: query
          schema: { type: boolean }
          description: true 同步 200；false 强制 202 LRO
      responses:
        '200': { description: 同步完成，data 为 taskId }
        '202': { description: Accepted，Location → /operations/{taskId} }
  /code-generation/tasks/{taskId}/status:
    get:
      summary: 任务状态（兼容；推荐 GET /operations/{id}）
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: PENDING|PROCESSING|SUCCESS|FAILED }
  /operations/{operationId}:
    get:
      summary: LRO 轮询
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: done、progress、result、error（ApiResponse 信封）
        '404': { description: 操作不存在 }
  # /generation-tasks（旧备用生成入口）已于 2026-09-25 移除，统一收敛至 /code-generation
  /capabilities:
    get:
      summary: @Capability 能力列表
      responses:
        '200': { description: OK }
