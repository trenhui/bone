openapi: 3.1.0
info:
  title: Bone Blueprint Order API
  version: 1.0.0
  description: |
    bone-blueprint 订单样板 REST 契约（As-Is）。
    规范：[Bone-API-规范.md](../Bone-API-规范.md)；
    DDD 参考：[bone-blueprint/README.md](../../../bone-blueprint/README.md)。

    **多租户（As-Is）**：请求头 `X-Tenant-Id`（见 TenantContextFilter）。

servers:
  - url: /api/v1/orders

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      $ref: './components/ApiResponse.yaml'
    PageResult:
      $ref: './components/PageResult.yaml'
    CreateOrderReq:
      type: object
      required: [customerId, items]
      properties:
        customerId: { type: integer, format: int64 }
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemReq'
    OrderItemReq:
      type: object
      required: [productId, productName, quantity, unitPrice]
      properties:
        productId: { type: integer, format: int64 }
        productName: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0, exclusiveMinimum: true }
    OrderSummaryResp:
      type: object
      properties:
        id: { type: integer, format: int64 }
        customerId: { type: integer, format: int64 }
        totalAmount: { type: number }
        status: { type: string, description: 'CREATED | PAID | CANCELLED' }
        createdAt: { type: string, format: date-time }
    OrderDetailResp:
      type: object
      properties:
        id: { type: integer, format: int64 }
        customerId: { type: integer, format: int64 }
        totalAmount: { type: number }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResp'
    OrderItemResp:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        productName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        subtotal: { type: number }
    CreateOrderData:
      type: object
      properties:
        id: { type: integer, format: int64 }

security:
  - bearerAuth: []

paths:
  /:
    get:
      summary: 分页查询订单
      operationId: pageOrders
      tags: [Order]
      parameters:
        - { name: customerId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: pageNum, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/OrderSummaryResp' }
    post:
      summary: 创建订单
      operationId: createOrder
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderReq' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string, example: /api/v1/orders/1001 }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CreateOrderData' }
  /{id}:
    get:
      summary: 查询订单详情
      operationId: getOrderById
      tags: [Order]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderDetailResp' }
  /{id}/pay:
    post:
      summary: 支付订单
      operationId: payOrder
      tags: [Order]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /{id}/cancel:
    post:
      summary: 取消订单
      operationId: cancelOrder
      tags: [Order]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
