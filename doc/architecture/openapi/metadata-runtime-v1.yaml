openapi: 3.1.0
info:
  title: Bone Metadata Runtime API（模式 B）
  version: 1.2.4
  description: |
    已发布且 `delivery_mode=RUNTIME` 的实体，通过 `bone-metadata-engine` 的 `JdbcRuntimeRecordService`
    对物理表执行动态 CRUD；动作通道（已实现，Runtime 数据面设计 §4）为：
    - Describe（唯一形态，§4.3.1）：page 级 `meta.allowedActionsByStatus`（list 响应内嵌）；
      另提供实体级动作清单 `GET  …/actions`（按权限裁剪，供管理/调试）。
    - Invoke：`POST …/records/{id}/actions/{actionCode}`（状态机校验 + 幂等去重 + 执行生命周期）。
    服务宿主：**bone-metadata-server** :9001。

    - 规范：[Bone-API-规范.md](../Bone-API-规范.md)
    - 详设：[元数据管理模块](../../design/modules/2.%20元数据管理模块详细设计方案.md) §0.1、§2.4
    - **低代码读/动态动作**：[BONE-低代码Runtime数据面设计.md](../../design/lowcode/BONE-低代码Runtime数据面设计.md)
    - PRD：META-002B / 低代码最小闭环 §2.5.8–2.5.9 / UIF-008
    - 业界对标：Salesforce sObject + Actions describe/invoke；NocoBase collection + resource:action ACL（见设计文 §0.1）

    **前置条件**：实体 status=已发布(1)、delivery_mode=RUNTIME(1)；物理表 `table_name` 已存在且列名与 `meta_field.code` 对齐。

    **边界**：
    - CRUD：单实体行读写（本文件已实现路径）。
    - Actions Invoke + 实体级清单：**已实现**（状态机边校验、requires_idempotency 幂等去重、执行日志四态生命周期）。
    - 单行 Describe 端点：**取消**（§4.3.1 唯一形态 = page 级 `meta.allowedActionsByStatus`），本文件保留仅为契约历史。
    - **禁止** MetaList 默认挂 `/expense-claims`、`/replenishments`；Mode A 可自有 Controller。

servers:
  - url: /api/v1/runtime

security:
  - bearerAuth: []

paths:
  /entities/{entityCode}/records:
    get:
      summary: 分页查询运行时记录
      operationId: listRuntimeRecords
      tags: [RuntimeRecord]
      parameters:
        - $ref: '#/components/parameters/EntityCode'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: 页码（从 1 开始）
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
          description: 每页条数
        - name: fields
          in: query
          schema: { type: string }
          description: |
            列投影，逗号分隔的 `meta_field.code`。
            与前端 `projectColumns` 对齐；省略则返回引擎默认列集。
          example: claim_no,title,amount,status
        - name: sort
          in: query
          schema: { type: string }
          description: |
            排序：`[-|+]field[,…]`。`-` 降序，`+` 或无前缀为升序。
            实现见 `RuntimePageQuery.parseSort`。
          example: -expense_date,claim_no
        - name: q
          in: query
          schema: { type: string }
          description: |
            **MVP 单条件等值过滤**，格式 `field:value`（不是全文 keyword）。
            例：`status:APPROVED`。多条件/运算符 → v1.1。
          example: status:APPROVED
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RuntimeRecordPage'
        '400':
          $ref: '#/components/responses/RuntimeError'
        '401':
          description: 未认证
    post:
      summary: 创建运行时记录
      operationId: createRuntimeRecord
      tags: [RuntimeRecord]
      parameters:
        - $ref: '#/components/parameters/EntityCode'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: 创建幂等键（可选）；重复提交回放首次结果
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeRecordBody'
      responses:
        '201':
          description: Created（创建后的完整记录）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RuntimeRecord'
        '200':
          description: 幂等回放（若带 Idempotency-Key 且命中）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RuntimeRecord'
        '400':
          $ref: '#/components/responses/RuntimeError'

  /entities/{entityCode}/records/deleted:
    get:
      summary: 回收站视图（仅查 deleted=1 的归档记录）
      operationId: listDeletedRuntimeRecords
      tags: [RuntimeRecord]
      parameters:
        - $ref: '#/components/parameters/EntityCode'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: 页码（从 1 开始）
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
          description: 每页条数
        - name: fields
          in: query
          schema: { type: string }
          description: 列投影，逗号分隔的 meta_field.code；省略则返回引擎默认列集。
        - name: sort
          in: query
          schema: { type: string }
          description: 排序：[-|+]field[,…]；- 为降序。
        - name: q
          in: query
          schema: { type: string }
          description: MVP 单条件等值过滤，格式 field:value。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RuntimeRecordPage'
        '400':
          $ref: '#/components/responses/RuntimeError'
        '401':
          description: 未认证
      x-implementation-status: implemented

  /entities/{entityCode}/records/{id}:
    get:
      summary: 按主键查询记录
      operationId: getRuntimeRecord
      tags: [RuntimeRecord]
      parameters:
        - $ref: '#/components/parameters/EntityCode'
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: OK；成功时响应头带 ETag（version）
          headers:
            ETag:
              schema: { type: string }
              description: 乐观锁版本，供后续 If-Match
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RuntimeRecord'
        '404':
          $ref: '#/components/responses/RuntimeError'
    put:
      summary: 更新运行时记录
      operationId: updateRuntimeRecord
      tags: [RuntimeRecord]
      parameters:
        - $ref: '#/components/parameters/EntityCode'
        - $ref: '#/components/parameters/RecordId'
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: |
            与 GET 返回的 ETag 对齐；冲突返回 412。
            MVP 宽限期可省略（见 PRD D3）；强制后客户端必须带。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeRecordBody'
      responses:
        '200':
          description: OK；响应带新 ETag
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RuntimeRecord'
        '412':
          description: 版本冲突（If-Match）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeErrorEnvelope'
        '404':
          $ref: '#/components/responses/RuntimeError'
    delete:
      summary: 删除运行时记录（有 deleted 列则软删）
      operationId: deleteRuntimeRecord
      tags: [RuntimeRecord]
      parameters:
        - $ref: '#/components/parameters/EntityCode'
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './components/ApiResponse.yaml'
        '404':
          $ref: '#/components/responses/RuntimeError'

  /entities/{entityCode}/records/{id}/restore:
    post:
      summary: 恢复归档记录（回收站 → 在用）
      operationId: restoreRuntimeRecord
      tags: [RuntimeRecord]
      parameters:
        - $ref: '#/components/parameters/EntityCode'
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: OK；恢复后的完整记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RuntimeRecord'
        '404':
          $ref: '#/components/responses/RuntimeError'
      x-implementation-status: implemented

  /entities/{entityCode}/actions:
    get:
      summary: 实体级动作清单（已实现 · 按权限裁剪）
      description: |
        返回该实体全部已注册动作（含状态机边、is_escape、requires_idempotency、permission）。
        由 RuntimeAccessGuard 按动作细码裁剪（§4.6）；页面按钮真源仍是 page 级
        `meta.allowedActionsByStatus`（§4.3.1 唯一 Describe 形态），本端点供管理/调试。
      operationId: listRuntimeActions
      tags: [RuntimeAction]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/EntityCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RuntimeActionDescriptor'
        '404':
          $ref: '#/components/responses/RuntimeError'

  /entities/{entityCode}/records/{id}/actions:
    get:
      summary: 描述当前行可用动作（单行 Describe · 已取消）
      description: |
        **已取消**（Runtime 数据面设计 §4.3.1 定案：唯一形态 = page 级 `meta.allowedActionsByStatus`，
        按 (entityCode, status) 分组一次算全量，前端按行 status 查本地映射，零额外请求）。
        保留此路径仅为契约历史，客户端不应依赖；页面按钮真源请读 list 响应的 meta 字段。
      operationId: describeRuntimeRecordActions
      tags: [RuntimeAction]
      x-implementation-status: superseded
      parameters:
        - $ref: '#/components/parameters/EntityCode'
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RuntimeActionDescribe'
        '404':
          $ref: '#/components/responses/RuntimeError'

  /entities/{entityCode}/records/{id}/actions/{actionCode}:
    post:
      summary: 执行记录动作（已实现 · Invoke）
      description: |
        **已实现于 engine**（Runtime 数据面设计 §4，RuntimeActionService + RuntimeActionDispatcher）。

        - `actionCode` 动态：`submit` / `approve` / `reject` / `confirmPayout` 等。
        - `kind=state_transition`：内置状态机边校验（from→to）+ 由平台统一流转 status_field（G14，调用方无法直写）。
        - `kind=escape`：SPI Handler（打款）；逃逸动作经执行日志生命周期（PENDING→succeeded/failed/orphaned），
          orphan 重放拒绝自动重跑（对真实网关重放 = 二次出金），幂等命中返回原结果 + `idempotentReplay`。
        - MetaList **只拼本路径**，不写死业务名词资源。
      operationId: invokeRuntimeRecordAction
      tags: [RuntimeAction]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/EntityCode'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/ActionCode'
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: 强烈建议；冲突 412
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: escape 副作用类 Should 强制；重复 Key → 200 + idempotentReplay
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeActionBody'
      responses:
        '200':
          description: OK（含幂等回放）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RuntimeActionResult'
        '400':
          description: 缺 Idempotency-Key 等
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeErrorEnvelope'
        '403':
          description: 无动作权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeErrorEnvelope'
        '404':
          description: 实体/行/动作未注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeErrorEnvelope'
        '409':
          description: 非法状态转移
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeErrorEnvelope'
        '412':
          description: If-Match 冲突

  # ----- G10 关联/子表（v1.2.4 · RuntimeRelationController 为真源） -----
  /entities/{entityCode}/lookup-options:
    get:
      summary: REFERENCE 候选选项（G10 已实现）
      description: |
        返回目标实体满足条件的候选行，每条含 value(目标主键) + label(labelField 翻译，缺省目标 id)。
        供 REFERENCE 字段选择器展开时调用（未展开零请求）；服务端按 reference 声明过滤（filterField 生效），
        前端只负责渲染。权限：目标实体 runtime 读码。
      operationId: lookupRuntimeReferenceOptions
      tags: [RuntimeRelation]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/EntityCode'
        - name: field
          in: query
          required: true
          schema: { type: string }
          description: 本实体上的 REFERENCE 字段 code（关系声明在 validation_rules.reference）
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: 关键字（labelField 前缀/包含匹配）
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            value: { type: string, description: 目标实体主键 }
                            label: { type: string, description: labelField 翻译值 }
        '403':
          description: 无读权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeErrorEnvelope'
        '404':
          description: 实体/字段未注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeErrorEnvelope'

  /entities/{entityCode}/records/{id}/children/{childEntityCode}:
    get:
      summary: 列出一行父记录的子表行（G10 已实现）
      description: |
        按 CHILD_TABLE 声明（validation_rules.childTable）的 foreignKey/orderColumn 查子表；
        REFERENCE 字段已补 `{code}__label`（enrichReferenceLabels）。权限：父/子实体 runtime 读码。
      operationId: listRuntimeChildRecords
      tags: [RuntimeRelation]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/EntityCode'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/ChildEntityCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { type: object, additionalProperties: true }
        '403':
          description: 无读权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeErrorEnvelope'
        '404':
          description: 实体/关系声明未注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeErrorEnvelope'
    post:
      summary: 批量替换子表行（G10 已实现）
      description: |
        整组替换语义（同一事务）：父行存在性校验 + 子行增删改 + 孤儿软删原子提交；
        rows 为空即清空。行内键 = 子实体字段 code（含 id 则更新，无 id 则插入）。
        权限：父/子实体 runtime 写码。
      operationId: replaceRuntimeChildRecords
      tags: [RuntimeRelation]
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/EntityCode'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/ChildEntityCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rows:
                  type: array
                  items: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OK（返回保存后的子表行）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './components/ApiResponse.yaml'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { type: object, additionalProperties: true }
        '403':
          description: 无写权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeErrorEnvelope'
        '404':
          description: 实体/关系声明未注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeErrorEnvelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EntityCode:
      name: entityCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z][a-zA-Z0-9_]*$'
      description: 元数据实体编码（meta_entity.code），如 t_expense_claim
    RecordId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 主键值（通常为 Snowflake 数字字符串）
    ActionCode:
      name: actionCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z][a-zA-Z0-9_]*$'
      description: |
        动作编码（动态）。例：submit、approve、confirmPayout、receive。
    ChildEntityCode:
      name: childEntityCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z][a-zA-Z0-9_]*$'
      description: 子实体编码（CHILD_TABLE 声明 childEntityCode），如 expense_claim_item
      example: confirmPayout

  schemas:
    RuntimeRecord:
      type: object
      additionalProperties: true
      description: 物理表行，键为列名（与 meta_field.code 对齐）
      example:
        id: '1234567890123456789'
        tenant_id: '1'
        claim_no: EXP-20261009-001
        title: 上海客户拜访
        amount: 128.50
        status: APPROVED
        version: 3

    RuntimeRecordBody:
      type: object
      additionalProperties: true
      description: 可写字段子集；禁止传 id/tenant_id 等系统列（服务端过滤）
      example:
        title: 客户拜访差旅
        amount: 128.50
        category: 差旅
        status: DRAFT
        applicant: 张三

    RuntimeActionBody:
      type: object
      description: 动作可选载荷；纯状态转移可空体
      properties:
        payload:
          type: object
          additionalProperties: true
      example:
        payload: {}

    RuntimeActionDescriptor:
      type: object
      properties:
        code: { type: string, example: confirmPayout }
        label: { type: string, example: 确认打款 }
        kind:
          type: string
          enum: [state_transition, escape]
        enabled: { type: boolean }
        permission: { type: string, example: runtime:t_expense_claim:confirmPayout }
        requiresIdempotencyKey: { type: boolean }
        confirm:
          type: object
          properties:
            required: { type: boolean }
            message: { type: string }

    RuntimeActionDescribe:
      type: object
      properties:
        recordId: { type: string }
        status: { type: string, example: APPROVED }
        actions:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeActionDescriptor'

    RuntimeActionResult:
      type: object
      description: Invoke 结果信封（设计文 §4.4）
      properties:
        record:
          $ref: '#/components/schemas/RuntimeRecord'
        action: { type: string, example: confirmPayout }
        fromStatus: { type: string, example: APPROVED }
        toStatus: { type: string, example: PAID }
        sideEffects:
          type: array
          items: { type: string }
          example: [payment_voucher_created]
        idempotentReplay: { type: boolean, default: false }

    RuntimeRecordPage:
      type: object
      description: 平台统一分页信封（components/PageResult.yaml）：records/total/page/size/pages/hasNext/hasPrevious。`list` 为后端 @Deprecated getter（@JsonIgnore），**不出现在响应中**
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeRecord'
        total:
          type: string
          description: 记录总数；后端 Long 经全局序列化为字符串（MetadataAutoConfiguration boneLongToStringCustomizer，勿在业务侧注册自定义 ObjectMapper 覆盖）
        page:
          type: integer
        size:
          type: integer
        pages:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    RuntimeErrorEnvelope:
      type: object
      properties:
        errorCode:
          type: string
          enum:
            - META_RUNTIME_ENTITY_NOT_FOUND
            - META_RUNTIME_RECORD_NOT_FOUND
            - META_RUNTIME_INVALID_IDENTIFIER
            - META_RUNTIME_INVALID_QUERY
            - META_RUNTIME_VALIDATION_FAILED
