openapi: 3.1.0
info:
  title: Bone Integration API
  version: 1.0.0
  description: |
    集成引擎（As-Is · INT-09 同步 MVP）。规范：[Bone-API-规范.md](../Bone-API-规范.md)；
    详设：[集成管理模块](../../design/modules/4.%20集成管理模块详细设计方案.md) §5。

    网关前缀：`/api/v1/integration` → bone-integration :8085。

servers:
  - url: /api/v1/integration

paths:
  # ───────────────── Connector（ConnectorController）─────────────────
  /connectors:
    get:
      summary: 分页查询连接器
      operationId: listConnectors
      tags: [Connector]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: OK（PageResult.records[ConnectorDTO]） }
    post:
      summary: 创建连接器
      operationId: createConnector
      tags: [Connector]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConnectorCommand' }
      responses:
        '201': { description: Created（id） }
  /connectors/{id}:
    get:
      summary: 连接器详情
      operationId: getConnector
      tags: [Connector]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK（ConnectorDTO） }
        '404': { description: 连接器不存在（INT_CONNECTOR_NOT_FOUND） }
    put:
      summary: 更新连接器
      operationId: updateConnector
      tags: [Connector]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateConnectorCommand' }
      responses:
        '200': { description: OK }
    delete:
      summary: 删除连接器
      operationId: deleteConnector
      tags: [Connector]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /connectors/{id}/test:
    post:
      summary: 测试连接器
      operationId: testConnector
      tags: [Connector]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK（Boolean） }
        '501': { description: 连接器类型未实现（INT_CONNECTOR_NOT_IMPLEMENTED） }
  /connectors/{id}/enable:
    post:
      summary: 启用连接器
      operationId: enableConnector
      tags: [Connector]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /connectors/{id}/disable:
    post:
      summary: 禁用连接器
      operationId: disableConnector
      tags: [Connector]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }

  # ───────────────── Flow（FlowController）─────────────────
  /flows:
    get:
      summary: 分页查询流程
      operationId: listIntegrationFlows
      tags: [Flow]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: OK（PageResult.records[FlowDTO]） }
    post:
      summary: 创建流程
      operationId: createIntegrationFlow
      tags: [Flow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFlowCommand' }
      responses:
        '201': { description: Created（id） }
  /flows/{id}:
    get:
      summary: 流程详情
      operationId: getIntegrationFlow
      tags: [Flow]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK（FlowDetailDTO） }
        '404': { description: 流程不存在（INT_FLOW_NOT_FOUND） }
    put:
      summary: 更新流程
      operationId: updateIntegrationFlow
      tags: [Flow]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFlowCommand' }
      responses:
        '200': { description: OK }
    delete:
      summary: 删除流程
      operationId: deleteIntegrationFlow
      tags: [Flow]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /flows/{id}/activate:
    post:
      summary: 激活流程
      operationId: activateIntegrationFlow
      tags: [Flow]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /flows/{id}/deactivate:
    post:
      summary: 停用流程
      operationId: deactivateIntegrationFlow
      tags: [Flow]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /flows/{id}/test:
    post:
      summary: 测试流程（试运行）
      operationId: testIntegrationFlow
      tags: [Flow]
      x-implementation-status: vision
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK（试运行结果） }
        '501': { description: 未实现（INT_FLOW_TEST_NOT_IMPLEMENTED） }
  /flows/{id}/versions:
    get:
      summary: 获取流程版本历史
      operationId: listIntegrationFlowVersions
      tags: [Flow]
      x-implementation-status: vision
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK（版本列表） }
        '501': { description: 未实现（INT_FLOW_VERSION_NOT_IMPLEMENTED） }

  # ───────────────── Monitor（MonitorController）─────────────────
  /executions:
    post:
      summary: 执行流程（同步 MVP）
      operationId: executeIntegrationFlow
      tags: [Monitor]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteFlowCommand' }
      responses:
        '200': { description: OK（execution id） }
    get:
      summary: 分页查询执行日志
      operationId: listExecutions
      tags: [Monitor]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: OK（PageResult.records[ExecutionLogDTO]） }
  /executions/{id}:
    get:
      summary: 执行详情
      operationId: getExecution
      tags: [Monitor]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK（ExecutionLogDTO，含 input/output/error） }
        '404': { description: 执行记录不存在（INT_EXECUTION_NOT_FOUND） }
  /executions/{id}/retry:
    post:
      summary: 重试执行
      operationId: retryExecution
      tags: [Monitor]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK（new execution id） }
  /statistics:
    get:
      summary: 流程执行统计
      operationId: getIntegrationStatistics
      tags: [Monitor]
      parameters:
        - { name: flowId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK（FlowStatisticsDTO） }

components:
  schemas:
    CreateConnectorCommand:
      type: object
      properties:
        name: { type: string }
        type: { type: string, description: 'REST / JDBC / FTP / MQ' }
        config: { type: object, additionalProperties: true }
    UpdateConnectorCommand:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        config: { type: object, additionalProperties: true }
    CreateFlowCommand:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/FlowNodeCmd' }
        connections:
          type: array
          items: { $ref: '#/components/schemas/FlowConnectionCmd' }
    UpdateFlowCommand:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/FlowNodeCmd' }
        connections:
          type: array
          items: { $ref: '#/components/schemas/FlowConnectionCmd' }
    ExecuteFlowCommand:
      type: object
      properties:
        flowId: { type: integer, format: int64 }
        inputData: { type: object, additionalProperties: true }
    FlowNodeCmd:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        config: { type: object, additionalProperties: true }
        positionX: { type: number }
        positionY: { type: number }
    FlowConnectionCmd:
      type: object
      properties:
        sourceNodeId: { type: integer, format: int64 }
        targetNodeId: { type: integer, format: int64 }
        condition: { type: string }
