openapi: 3.1.0
info:
  title: Bone Extension Studio API
  version: 1.0.0
  description: 扩展引擎管理台；规范见 Bone-API-规范.md §13.1
servers:
  - url: /api/v1/extension
paths:
  /points:
    get:
      summary: 扩展点列表
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: domain, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: size, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './components/ApiResponse.yaml'
    post:
      summary: 创建扩展点
      responses:
        '201':
          description: Created
  /points/{id}:
    get:
      summary: 扩展点详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
    put:
      summary: 更新扩展点
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
    delete:
      summary: 删除扩展点
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: No Content }
  /points/{id}:enable:
    post:
      summary: 启用扩展点
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /points/{id}:disable:
    post:
      summary: 禁用扩展点
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /plugins:
    get:
      summary: 插件列表
      responses:
        '200': { description: OK }
    post:
      summary: 创建插件
      responses:
        '201': { description: Created }
  /plugins/{id}:
    get:
      summary: 插件详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
    put:
      summary: 更新插件
      responses:
        '200': { description: OK }
    delete:
      summary: 删除插件
      responses:
        '204': { description: No Content }
  /plugins:upload:
    post:
      summary: 上传插件 JAR
      responses:
        '201': { description: Created }
  /plugins/{id}:deploy:
    post:
      summary: 部署插件
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /plugins/{id}:undeploy:
    post:
      summary: 卸载插件
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /plugins/{id}:rollback:
    post:
      summary: 回滚插件版本
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /plugins/{id}:publish-runtime:
    post:
      summary: 发布运行时元数据
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /plugins/{id}:simulate:
    post:
      summary: 模拟插件执行
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /execution-logs:
    get:
      summary: 执行日志（默认游标分页）
      parameters:
        - { name: pluginId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: page, in: query, description: 遗留 offset 分页, schema: { type: integer } }
        - { name: size, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          headers:
            Link:
              schema: { type: string }
              description: 'rel="next" 游标链接'
  /execution-logs:ingest:
    post:
      summary: SDK 执行日志上报
      responses:
        '200': { description: OK }
  /overview:
    get:
      summary: 扩展概览
      responses:
        '200': { description: OK }
  /sandbox/config:
    get:
      summary: 沙箱配置
      responses:
        '200': { description: OK }
  /audit-logs:
    get:
      summary: Studio 审计日志（游标分页）
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          headers:
            Link:
              schema: { type: string }
