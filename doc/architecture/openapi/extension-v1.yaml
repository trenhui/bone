openapi: 3.1.0
info:
  title: Bone Extension Studio API
  version: 1.2.0
  description: |
    扩展引擎管理台（As-Is）。规范见 Bone-API-规范.md §13.1；
    详设 v2.1：doc/design/modules/5. 扩展管理模块详细设计方案.md。

    **术语**：路径 `/plugins/{id}` 的 id = 扩展实现 ID（exts_extension_impl），非独立插件主表。

    **[Target]**：POST 创建 201+Location；写操作 Idempotency-Key；PUT If-Match/version；
    大制品 :deploy 支持 202 LRO（默认异步）与 ?sync=true 同步 200。
servers:
  - url: /api/v1/extension
security:
  - bearerAuth: []
paths:
  /points:
    get:
      summary: 扩展点列表
      operationId: listExtensionPoints
      tags: [Point]
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: domain, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: size, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './components/ApiResponse.yaml'
    post:
      summary: 创建扩展点
      operationId: createExtensionPoint
      tags: [Point]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created（[Target] Location 头）
        '200':
          description: OK（As-Is 兼容）
  /points/{id}:
    get:
      summary: 扩展点详情
      operationId: getExtensionPoint
      tags: [Point]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
    put:
      summary: 更新扩展点
      operationId: updateExtensionPoint
      tags: [Point]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: OK }
        '412': { description: 'Precondition Failed（[Target] 乐观锁）' }
    patch:
      summary: 部分更新扩展点
      operationId: patchExtensionPoint
      tags: [Point]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: OK }
        '412': { description: Precondition Failed }
    delete:
      summary: 删除扩展点
      operationId: deleteExtensionPoint
      tags: [Point]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: No Content }
  /points/{id}:enable:
    post:
      summary: 启用扩展点
      operationId: enableExtensionPoint
      tags: [Point]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /points/{id}:disable:
    post:
      summary: 禁用扩展点
      operationId: disableExtensionPoint
      tags: [Point]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /plugins:
    get:
      summary: 扩展实现列表（控制台称插件）
      operationId: listPlugins
      tags: [Plugin]
      responses:
        '200': { description: OK }
    post:
      summary: 创建扩展实现元数据
      operationId: createPlugin
      tags: [Plugin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: 'Created（[Target]）' }
        '200': { description: OK（As-Is） }
  /plugins/{id}:
    get:
      summary: 扩展实现详情
      operationId: getPlugin
      tags: [Plugin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
    put:
      summary: 更新扩展实现
      operationId: updatePlugin
      tags: [Plugin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: OK }
    patch:
      summary: 部分更新扩展实现
      operationId: patchPlugin
      tags: [Plugin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: OK }
    delete:
      summary: 删除扩展实现
      operationId: deletePlugin
      tags: [Plugin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: No Content }
  /plugins:upload:
    post:
      summary: 上传 JAR 制品
      operationId: uploadPluginArtifact
      tags: [Plugin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Created }
        '200': { description: OK（As-Is） }
  /plugins/{id}/versions/{ver}:download:
    get:
      summary: 下载制品 JAR（鉴权，逻辑路径）
      operationId: downloadPluginArtifact
      tags: [Plugin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: ver, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: application/octet-stream }
        '404': { description: 插件或版本不存在 }
  /plugins/{id}:deploy:
    post:
      summary: 部署/激活扩展实现
      operationId: deployPlugin
      tags: [Plugin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sync, in: query, schema: { type: boolean }, description: true 强制同步 200；false 强制 202 LRO }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 'OK（同步，?sync=true 或配置 deploy-sync-by-default）' }
        '202': { description: 'Accepted（LRO，Location 指向 /operations/{id}）' }
  /operations/{operationId}:
    get:
      summary: LRO 操作状态轮询
      operationId: getExtensionOperation
      tags: [Operation]
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 含 done、progress、result、error（ApiResponse 信封）
        '404': { description: 操作不存在 }
  /plugins/{id}:undeploy:
    post:
      summary: 卸载
      operationId: undeployPlugin
      tags: [Plugin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /plugins/{id}:rollback:
    post:
      summary: 回滚制品版本
      operationId: rollbackPlugin
      tags: [Plugin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: OK }
  /plugins/{id}:publish-runtime:
    post:
      summary: 发布运行时路由元数据
      operationId: publishPluginRuntime
      tags: [Plugin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /plugins/{id}:simulate:
    post:
      summary: 沙箱模拟执行
      operationId: simulatePlugin
      tags: [Plugin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /execution-logs:
    get:
      summary: 执行日志（默认游标分页）
      operationId: listExecutionLogs
      tags: [ExecutionLog]
      parameters:
        - { name: pluginId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: page, in: query, description: 遗留 offset 分页, schema: { type: integer } }
        - { name: size, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          headers:
            Link:
              schema: { type: string }
              description: 'rel="next" 游标链接'
  /execution-logs:ingest:
    post:
      summary: SDK 执行日志上报
      operationId: ingestExecutionLogs
      tags: [ExecutionLog]
      responses:
        '200': { description: OK }
  /overview:
    get:
      summary: 扩展概览
      operationId: getExtensionOverview
      tags: [Studio]
      responses:
        '200': { description: OK }
  /sandbox/config:
    get:
      summary: 沙箱配置
      operationId: getSandboxConfig
      tags: [Studio]
      responses:
        '200': { description: OK }
  /audit-logs:
    get:
      summary: Studio 审计日志（游标分页）
      operationId: listExtensionAuditLogs
      tags: [Studio]
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          headers:
            Link:
              schema: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: '[Target] 幂等写；TTL 24h，见 Bone-API-规范 §8'
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: '[Target] 乐观锁，值为实体 version 或 ETag'
      schema: { type: string }
