<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bone Sub-App-1 - Micro Frontend Example" />
  <meta name="keywords" content="Bone, Micro Frontend, Sub-App, React" />
  <meta name="author" content="Bone Team" />
  
  <!-- 预加载关键字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- 安全相关元标签 -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  
  <!-- 性能优化标签 -->
  <link rel="preload" href="/assets/index.css" as="style" />
  <link rel="preload" href="/assets/index.js" as="script" />
  
  <title>Bone Sub-App-1</title>
</head>
<body>
  <!-- 子应用根容器 -->
  <div id="root"></div>
  
  <!-- 微应用挂载点（用于主应用挂载） -->
  <div id="sub-app-1-container"></div>
  
  <!-- 微前端全局配置 -->
  <script>
    // 微应用环境变量检测
    window.__MICRO_APP_ENVIRONMENT__ = false;
    window.__MICRO_APP_NAME__ = 'sub-app-1';
    
    // 错误处理
    window.addEventListener('error', (error) => {
      console.error('Sub-App-1 error:', error.error);
    });
    
    window.addEventListener('unhandledrejection', (event) => {
      console.error('Sub-App-1 unhandled promise rejection:', event.reason);
    });
  </script>
  
  <!-- 主应用脚本 -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
