id: role_user_search
sql: |
  SELECT r.id        AS role_id,
         r.role_name,
         u.id        AS user_id,
         u.name
  FROM roles r
  JOIN sys_user_role ur ON ur.role_id = r.id
  JOIN users u ON u.id = ur.user_id
  <where>
    <if test="roleName != null">
      AND r.role_name = :roleName
    </if>
  </where>
mappedClassName: com.bone.metadata.sdk.test.domain.dto.RoleUserDTO
