server:
  port: ${BONE_EXTENSION_STUDIO_PORT:8088}
  servlet:
    context-path: /

spring:
  application:
    name: bone-extension-studio
  profiles:
    default: in-memory
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  # 数据库配置（metadata profile 会覆盖 url 并执行 schema-h2.sql）
  datasource:
    url: jdbc:h2:mem:extension-studio;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: 

  # H2控制台（仅开发环境使用，生产环境应禁用）
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false

  # Redis（控制面路由元数据发布通道；无 Redis 时回退 InMemoryExtensionMetadataStore）
  data:
    redis:
      host: ${BONE_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${BONE_REDIS_PORT:${REDIS_PORT:6379}}

# 与 bone-iam 对齐的 JWT（生产环境请外部化 secretKey）
bone:
  iam:
    jwt:
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}
      header-name: Authorization
      token-prefix: "Bearer "
  extension:
    enabled: false
    studio:
      runtime-sync:
        enabled: true
      artifact:
        storage-path: ${BONE_EXTENSION_ARTIFACT_PATH:./data/extension-plugins}
        max-versions-per-plugin: 3
      # 控制面鉴权开关。**基配置必须是 false（失败关闭）**：
      # 未显式声明该键的profile（含误配 profile、漏加 profile 的部署）一律要求 JWT。
      # 原实现在此硬编码 true —— 环境变量无法覆盖，且 dev/in-memory 靠继承拿到放行，
      # 意味着"忘记配置"就是一次静默降级为全站匿名。安全配置的默认必须是"拒绝"。
      # 需要联调放行时由对应 profile（in-memory/dev）显式打开，或临时注入
      # BONE_EXTENSION_STUDIO_PERMIT_UNAUTHENTICATED=true；生产 profile 恒为 false。
      security:
        permit-unauthenticated: ${BONE_EXTENSION_STUDIO_PERMIT_UNAUTHENTICATED:false}
        # 数据面上报通道（/api/v1/extension/execution-logs:ingest）的机器身份共享密钥。
        # 该端点因上报方是业务进程（无用户 JWT）只能 permitAll，若不留空则任何能访问该端口的人
        # 都能伪造执行日志。**生产必须通过环境变量注入**，与 SDK 侧
        # bone.extension.studio.report.token 保持一致。
        reporter-token: ${BONE_EXTENSION_REPORTER_TOKEN:}
        # 令牌未配置时是否拒绝一切上报。默认 true = 失败关闭：
        # 漏配密钥时上报端点返回 503（业务方立刻发现日志没上报），而不是退化为匿名可写。
        # 安全配置的默认必须是"拒绝" —— 默认放行意味着"忘记配置"是一次静默降级，
        # 且只有一条 WARN 日志，足够被忽略。仅本地联调可经环境变量置 false 临时放行。
        reporter-auth-required: ${BONE_EXTENSION_REPORTER_AUTH_REQUIRED:true}
      
      # 缓存配置
      cache:
        enabled: true
        ttl: 3600

# 安全配置
security:
  basic:
    enabled: false
  
# 日志配置
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.bone.engine.extension.studio: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always