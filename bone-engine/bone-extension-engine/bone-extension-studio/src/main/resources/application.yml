server:
  port: ${BONE_EXTENSION_STUDIO_PORT:8088}
  servlet:
    context-path: /

spring:
  application:
    name: bone-extension-studio
  profiles:
    default: in-memory
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  # 数据库配置（metadata profile 会覆盖 url 并执行 schema-h2.sql）
  datasource:
    url: jdbc:h2:mem:extension-studio;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
  
  # H2控制台
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# 与 bone-iam 对齐的 JWT（生产环境请外部化 secretKey）
bone:
  iam:
    jwt:
      secret-key: ${BONE_IAM_JWT_SECRET:change-me-change-me-change-me-change-me-32bytes}
      header-name: Authorization
      token-prefix: "Bearer "
  extension:
    enabled: false
    studio:
      runtime-sync:
        enabled: true
      artifact:
        storage-path: ${BONE_EXTENSION_ARTIFACT_PATH:./data/extension-plugins}
        max-versions-per-plugin: 3
      # 扩展点扫描配置
      scan:
        enabled: true
        base-packages: com.bone.engine.extension.example
      
      # 缓存配置
      cache:
        enabled: true
        ttl: 3600

# 安全配置
security:
  basic:
    enabled: false
  
# 日志配置
logging:
  level:
    root: INFO
    com.bone.engine.extension.studio: DEBUG

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always