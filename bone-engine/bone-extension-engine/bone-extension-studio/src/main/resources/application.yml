server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: bone-extension-studio
  
  # 数据库配置
  datasource:
    url: jdbc:h2:mem:extension-studio;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  
  # H2控制台
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# 扩展引擎配置
bone:
  extension:
    studio:
      # 扩展点扫描配置
      scan:
        enabled: true
        base-packages: com.bone.engine.extension.example
      
      # 缓存配置
      cache:
        enabled: true
        ttl: 3600

# 安全配置
security:
  basic:
    enabled: false
  
# 日志配置
logging:
  level:
    root: INFO
    com.bone.engine.extension.studio: DEBUG

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always