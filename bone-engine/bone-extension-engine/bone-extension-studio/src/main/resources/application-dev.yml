# 本地开发：metadata 持久化 + Redis 运行时同步（详设 §0.4 EXT-MVP-07）
# 启动：mvn spring-boot:run -Dspring-boot.run.profiles=dev,metadata
spring:
  profiles:
    include: metadata
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # 开发环境启用 H2 控制台
  h2:
    console:
      enabled: true

bone:
  extension:
    studio:
      persistence:
        mode: metadata
      runtime-sync:
        enabled: true
        refresh-channel: bone:ext:metadata:refresh
      idempotency:
        backend: redis
  iam:
    jwt:
      # 开发环境默认密钥，生产环境必须通过环境变量注入
      secret-key: ${BONE_IAM_JWT_SECRET:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}

logging:
  level:
    com.bone.engine.extension.studio.sync: DEBUG
