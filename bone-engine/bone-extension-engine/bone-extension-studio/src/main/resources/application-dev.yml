# 本地开发：metadata 持久化 + Redis 运行时同步（详设 §0.4 EXT-MVP-07）
# 注意：Spring Boot 2.4+ 禁止在 profile 专属配置文件里使用 spring.profiles.include，
# metadata 激活改为启动参数：SPRING_PROFILES_ACTIVE=dev,metadata
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # 开发环境启用 H2 控制台
  h2:
    console:
      enabled: true

bone:
  extension:
    studio:
      persistence:
        mode: metadata
      runtime-sync:
        enabled: true
        refresh-channel: bone:ext:metadata:refresh
      idempotency:
        backend: redis
      security:
        # 本地开发 profile 显式打开放行。此前本 profile 靠继承基配置的 true 拿到放行，
        # 基配置收敛为 false（失败关闭）后必须在此显式声明，否则本地启动会全线 401。
        # 仍可用 BONE_EXTENSION_STUDIO_PERMIT_UNAUTHENTICATED=false 单个环境变量关掉。
        permit-unauthenticated: ${BONE_EXTENSION_STUDIO_PERMIT_UNAUTHENTICATED:true}
  iam:
    jwt:
      # 开发环境默认密钥，生产环境必须通过环境变量注入
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}

logging:
  level:
    com.bone.engine.extension.studio.sync: DEBUG
