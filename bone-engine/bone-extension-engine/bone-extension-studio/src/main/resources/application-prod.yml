# 生产/联调 MySQL：Metadata 模式，DDL 仅来自 bone-init.sql
# 启动：source scripts/dev/load-env.sh && mvn spring-boot:run -Dspring-boot.run.profiles=prod
spring:
  config:
    import: optional:classpath:application-metadata-mysql.yml

logging:
  level:
    root: INFO
    com.bone.engine.extension.studio: INFO

bone:
  extension:
    studio:
      seed:
        enabled: false
