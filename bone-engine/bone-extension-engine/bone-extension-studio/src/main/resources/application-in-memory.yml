# 默认联调：内存 Store，不加载 Metadata SQL 仓储
spring:
  autoconfigure:
    exclude:
      - com.bone.metadata.sdk.support.config.MetadataAutoConfiguration
      - com.bone.metadata.sdk.support.config.SqlRepositoryAutoConfiguration

bone:
  extension:
    studio:
      persistence:
        mode: in-memory
      security:
        permit-unauthenticated: true
      lro:
        deploy-enabled: true
        deploy-sync-by-default: true
