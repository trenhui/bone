spring:
  main:
    allow-circular-references: true
  sql:
    init:
      mode: never
  application:
    name: bone-metadata-server
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${BONE_DB_PASSWORD}

server:
  port: 9001

management:
  health:
    db:
      enabled: false
    defaults:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

security:
  enabled: ${SECURITY_ENABLED:false}
  auth-mode: api-key
  api-key: ${API_KEY:bone-metadata-default-key}

# catalog / runtime 横切（缓存、幂等）；集群部署可改为 redis
bone:
  metadata:
    # 字典绑定灰度开关（界面设计器字典打通 v1.1 §6.5）。
    # 默认关 = 生产上线不改变任何存量租户行为（字段全按 L0 enumValues 渲染与校验）；
    # 逐租户开放走 enabled-tenants（逗号分隔，* = 全部），运行时还可用
    # PUT /api/v1/metadata/dict-binding/toggle?enabled=true 临时拉闸/放开。
    dict-binding:
      enabled: ${BONE_DICT_BINDING_ENABLED:false}
      enabled-tenants: ${BONE_DICT_BINDING_TENANTS:}
    catalog:
      runtime-entity-cache-ttl: 60s
      runtime-entity-cache:
        backend: memory
        key-prefix: "bone:metadata:runtime-entity:"
      idempotency:
        backend: memory
        key-prefix: "bone:metadata:idempotency:"
        # 幂等记录保存时长（Runtime §4.6.1 缺陷 #2：原硬编码 24h）。
        # 资金类动作的幂等窗口必须覆盖整个业务窗口（对账 / 退款周期常以天计），
        # 否则记录过期后重放同一 Key 会二次记账。生产建议 PT72H 起。
        ttl: ${BONE_IDEMPOTENCY_TTL:PT24H}

  # JWT 验签密钥（与 IAM 共享）：声明键名以满足配置键契约（MVP-10 ②）。
  # 值优先从环境变量注入（BONE_IAM_JWT_SECRET_KEY / BONE_JWT_SECRET）；未设置时回落为与 IAM 同源的
  # dev 默认密钥，保证「开箱即用的 dev / 联调」两端可互验。
  #
  # 关键：此处**不能**回落为空。JwtUtil 在两个键皆空时会生成「每次启动随机密钥」，
  # 导致 IAM 签发的令牌一律验签失败 → 请求被匿名化 → CurrentUserProvider 拿不到 userId
  # → 审批中心 / 我的待办等以「登录用户为办理人」检索的接口恒 403
  # 「匿名主体没有待办」（2026-10-28 全模块联调实测确诊）。
  # 其余服务（iam / file / masterdata / integration / extension / generator）早已使用该 dev 默认，
  # 本服务是唯一回落为空的例外，故补齐以消除不对称。生产务必以环境变量覆盖。
  iam:
    jwt:
      secret:
        key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}
  jwt:
    secret: ${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}

  # 工作流审批人组织目录（bone-workflow-spring-boot-starter 的 IamOrgHierarchyProvider）。
  #
  # 作用：点亮 LINE_MANAGER / DEPT_HEAD / LEVEL_UP 三个指派策略——它们的取数源是 IAM 的
  # iam_account.manager_id 与 iam_dept.leader_id（迁移 0082 建列、0083 起报销/采购流程改用）。
  #
  # 【默认关闭，且这是刻意的】关闭时 OrgHierarchyProvider bean 不存在，组织类策略一律
  # 解析不出人 ⇒ 引擎挂起（fail-closed）。也就是说：升级本模块不会让任何「本来按设计挂起」
  # 的单据突然路由到某个真实的人。开启是显式动作，不是默认结果。
  #
  # 【为什么地址用 127.0.0.1 而不是 localhost】macOS 把 localhost 解析成 ::1，而 Spring 默认
  # 绑 IPv4，会出现「服务起着却连不上」的假故障（bone-local-e2e 已记录同款陷阱）。
  #
  # 【cache-ttl-seconds 故意取小值】审批是低频关键路径，多一次 HTTP 完全可以接受；刚给某人
  # 设了主管就发起单据，不该因为缓存而解析到旧主管——那会把单据挂到不该审的人头上。
  #
  # 【服务账号】服务间登录用，生产必须外部化（严禁把口令留在配置文件里）。
  workflow:
    org-directory:
      enabled: ${BONE_WF_ORG_DIRECTORY_ENABLED:false}
      iam-base-url: ${BONE_WF_ORG_IAM_BASE_URL:http://127.0.0.1:8081}
      service-username: ${BONE_WF_ORG_SERVICE_USERNAME:admin}
      service-password: ${BONE_WF_ORG_SERVICE_PASSWORD:}
      cache-ttl-seconds: ${BONE_WF_ORG_CACHE_TTL_SECONDS:30}
      max-levels: ${BONE_WF_ORG_MAX_LEVELS:10}
      connect-timeout-millis: ${BONE_WF_ORG_CONNECT_TIMEOUT_MILLIS:2000}
      read-timeout-millis: ${BONE_WF_ORG_READ_TIMEOUT_MILLIS:4000}