spring:
  datasource:
    url: jdbc:h2:mem:studio_generator;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

bone:
  # 同主配置：测试态同样关闭扩展引擎自动配置（详见 src/main/resources/application.yml）
  extension:
    enabled: false
  generator:
    lro:
      code-generation-enabled: true
      code-generation-sync-by-default: true
  metadata:
    datasource:
      enabled: false

metadata:
  sdk:
    deployment-mode: EMBEDDED
    sql:
      enabled: true

server:
  port: 0

logging:
  level:
    com.bone: warn
    org.springframework: warn
