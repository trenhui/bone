spring:
  sql:
    init:
      mode: never
  application:
    name: bone-studio-generator
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
    username: root
    password: ${BONE_DB_PASSWORD:mysql123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

server:
  port: 8086
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

management:
  health:
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

metadata:
  sdk:
    appcode: bone
    deployment-mode: EMBEDDED
    sql:
      enabled: true
      executor:
        allow:
          dml: true
      database:
        type: MYSQL

bone:
  # studio-generator 不消费扩展点（未使用 @EnableExtensionPoints / 无扩展实现），
  # 关闭 bone-extension-sdk 的 ExtensionAutoConfiguration：否则 classpath 上自动装配会因缺少其依赖的
  # 自注册 Bean（ExtensionRepositoryFactory 等）导致应用无法启动。
  extension:
    enabled: false
  generator:
    lro:
      code-generation-enabled: true
      code-generation-sync-by-default: false
  metadata:
    datasource:
      enabled: true
  blueprint:
    cqrs:
      default-level: L1

logging:
  level:
    com.bone: info
    org.springframework: warn