spring:
  application:
    name: bone-studio-generator
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
    username: root
    password: mysql123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 平台 DDL 真源为 bone-init.sql §6（gen_*），禁止 Hibernate 自动改表
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

server:
  port: 8085
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

metadata:
  sdk:
    appcode: bone
    deployment-mode: EMBEDDED
    sql:
      enabled: true
      executor:
        allow:
          dml: true
      database:
        type: MYSQL

bone:
  generator:
    lro:
      code-generation-enabled: true
      code-generation-sync-by-default: false
  metadata:
    datasource:
      enabled: true
  blueprint:
    cqrs:
      default-level: L1

logging:
  level:
    com.bone: info
    org.springframework: warn