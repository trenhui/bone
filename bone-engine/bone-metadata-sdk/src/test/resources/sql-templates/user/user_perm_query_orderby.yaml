id: user_perm_query_orderby
sql: |
  SELECT
    u.id,
    u.name               AS userName,
    r.role_name          AS roleName,
    p.perm_code          AS permCode,
    p.perm_name          AS permName,
    p.path               AS permPath,
    p.biz_identity_code  AS bizCode,
    p.perm_type          AS permType,
    p.sort_order         AS sortOrder,
    u.created_at         AS createdAt,
    u.created_by         AS createdBy,
    u.updated_at         AS updatedAt,
    u.updated_by         AS updatedBy,
    u.deleted            AS deleted
  FROM users u
  LEFT JOIN sys_user_role ur   ON u.id = ur.user_id
  LEFT JOIN roles r            ON r.id = ur.role_id
  LEFT JOIN sys_role_permission rp ON rp.role_id = r.id
  LEFT JOIN sys_permission p   ON p.id = rp.perm_id
  <where>
      <if test="userName != null">
        AND u.name LIKE CONCAT('%', :userName, '%')      </if>
      <if test="roleName != null and roleName != ''">
        AND r.role_name = :roleName
      </if>
      <if test="roleNames != null and roleNames.size() > 0">
        AND r.role_name IN (<foreach collection="roleNames" item="item" separator=",">:item</foreach>)
      </if>
      <if test="permCode != null">
        AND p.perm_code LIKE CONCAT('%', :permCode, '%')      </if>
      <if test="permName != null">
        AND p.perm_name LIKE CONCAT('%', :permName, '%')      </if>
      <if test="bizCode != null">
        AND p.biz_identity_code = :bizCode
      </if>
      <if test="permType != null">
        AND p.perm_type = :permType
      </if>
      <if test="deleted != null">
        AND u.deleted = :deleted
      </if>
      <if test="createdAtBegin != null">
        AND u.created_at >= :createdAtBegin
      </if>
      <if test="createdAtEnd != null">
        AND u.created_at <= :createdAtEnd
      </if>
  </where>
  <if test="orderBy != null and orderBy != ''">
  ORDER BY ${orderBy}
  </if>
  <if test="orderBy == null or orderBy == ''">
  ORDER BY u.id 
  </if>
mappedClassName: com.bone.metadata.sdk.test.domain.dto.UserPermPageDTO