spring:
  config:
    activate:
      on-profile: test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  sql:
    init:
      # 由 ExternalScriptExecutor 按 sql/{h2|mysql}/ 加载，避免与根目录 schema.sql 重复建表
      mode: never
  datasource:
    # 默认 H2 内存库（CI/本地无需 MySQL）；连 MySQL 时设置 DB_URL 并可选 DB_TYPE=MYSQL
    url: ${DB_URL:jdbc:h2:mem:extTest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000

metadata:
  sdk:
    appcode: ${APP_CODE:extTest}
    deployment-mode: EMBEDDED
    slow-query-threshold: 3000
    sql:
      enabled: true
      executor:
        allow:
          dml: true
          batch: true
          max-rows: 5000
      database:
        type: ${DB_TYPE:H2}
        auto-detect-dialect: true
        default-ds: primary
        batch-size: 500
      template:
        base-path: classpath:/sql/
        yaml-path: classpath:/sql-templates/
        load-priority: annotation-first
        fallback-enabled: true
        enable-classpath-scan: true
        enable-annotation-templates: true
        cache-size: 500
        max-template-size: 1048576
        expire-hours: 1
        async-preload: true
        stale-while-revalidate: 5m
        preload: []
      cache:
        expression-cache-size: 1000
        ast-cache-size: 500
        spel-cache-size: 500
        expire-hours: 1
      tenant:
        enabled: false
        header-name: X-Tenant-Id
        column-name: tenant_id
        excluded-tables: []
      monitor:
        enabled: false
        endpoint: /sql-monitor
        slow-query-threshold-ms: 500
        prometheus-enabled: false
      security:
        allowed-tables:
          - "*"
        allowed-dollar-pattern: "^[a-zA-Z0-9_]+$"
        allowed-hosts:
          - "localhost"
          - "*.test.company.com"

logging:
  level:
    root: WARN
    com.bone.metadata.sdk: INFO