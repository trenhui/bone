spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/extTest?useSSL=false&autoReconnect=true&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql123}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000

metadata:
  sdk:
    appcode: ${APP_CODE:extTest}
    deployment-mode: EMBEDDED
    slow-query-threshold: 3000
    sql:
      enabled: true
      executor:
        allow:
          dml: true
          batch: true
          max-rows: 5000
      database:
        type: MYSQL
        auto-detect-dialect: true
        default-ds: primary
        batch-size: 500
      template:
        base-path: classpath:/sql/
        yaml-path: classpath:/sql-templates/
        load-priority: annotation-first
        fallback-enabled: true
        enable-classpath-scan: true
        enable-annotation-templates: true
        cache-size: 500
        max-template-size: 1048576
        expire-hours: 1
        async-preload: true
        stale-while-revalidate: 5m
        preload: []
      cache:
        expression-cache-size: 1000
        ast-cache-size: 500
        spel-cache-size: 500
        expire-hours: 1
      tenant:
        enabled: false
        header-name: X-Tenant-Id
        column-name: tenant_id
        excluded-tables: []
      monitor:
        enabled: false
        endpoint: /sql-monitor
        slow-query-threshold-ms: 500
        prometheus-enabled: false
      security:
        allowed-tables:
          - "*"
        allowed-dollar-pattern: "^[a-zA-Z0-9_]+$"
        allowed-hosts:
          - "localhost"
          - "*.test.company.com"

logging:
  level:
    root: WARN
    com.bone.metadata.sdk: INFO