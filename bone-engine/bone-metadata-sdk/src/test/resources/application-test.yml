spring:
  config:
    activate:
      on-profile: test
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${DB_URL:jdbc:mysql://localhost:3306/extTest?useSSL=false&autoReconnect=true&characterEncoding=utf8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql123}
    hikari:
      pool-name: TestDBPool
      minimum-idle: 5
      idle-timeout: 600000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      # Optional H2 configuration for testing
      # url: ${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;TRACE_LEVEL_SYSTEM_OUT=3}
      # driver-class-name: org.h2.Driver
      # username: ${DB_USERNAME:sa}
      # password: ${DB_PASSWORD:""}

metadata:
  sdk:
    appcode: ${APP_CODE:extTest}
    deployment-mode: EMBEDDED
    slow-query-threshold: 3000
    sql:
      enabled: true
      executor:
        allow:
          dml: true
          batch: true
          max-rows: 10000
      database:
        type: ${DB_TYPE:MYSQL}
        auto-detect-dialect: true
        default-ds: primary
        batch-size: 1000
      # 完全移除template节点以避免所有配置绑定错误

      # 完全移除cache节点以避免解析错误
      # 完全移除tenant节点以避免配置绑定错误
      # 完全移除monitor节点以避免配置绑定错误
      # 完全移除security节点以避免解析错误
      # 完全移除service节点以避免配置绑定错误

feign:
  client:
    config:
      default:
        logger-level: NONE
        connect-timeout: 5000
        read-timeout: 5000

logging:
  level:
    root: WARN
    feign: DEBUG
    com.bone: TRACE