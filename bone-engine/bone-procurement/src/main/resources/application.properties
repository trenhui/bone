# 服务配置
server.port=8080
server.servlet.context-path=/procurement

# 数据源配置
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2数据库配置
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA配置
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 日志配置
logging.level.root=INFO
logging.level.com.bone=DEBUG

# 元数据配置
bone.smartmeta.cache.enabled=true
bone.smartmeta.validation.mode=STRICT
bone.smartmeta.entity-scan-package=com.bone.procurement.entity

# 动态模型配置
bone.dynamic-models.enabled=true
bone.dynamic-models.base-package=com.bone.procurement.entity.dynamic
bone.dynamic-models.auto-create-tables=true

# 动态模型定义示例
bone.dynamic-models.models.product.label=产品
bone.dynamic-models.models.product.description=动态产品模型
bone.dynamic-models.models.product.fields.name.type=string
bone.dynamic-models.models.product.fields.name.label=产品名称
bone.dynamic-models.models.product.fields.name.required=true
bone.dynamic-models.models.product.fields.name.max-length=100
bone.dynamic-models.models.product.fields.price.type=double
bone.dynamic-models.models.product.fields.price.label=价格
bone.dynamic-models.models.product.fields.price.required=true
bone.dynamic-models.models.product.fields.price.min-value=0
bone.dynamic-models.models.product.fields.stock.type=integer
bone.dynamic-models.models.product.fields.stock.label=库存

# 第二个动态模型示例
bone.dynamic-models.models.customer.label=客户
bone.dynamic-models.models.customer.description=动态客户模型
bone.dynamic-models.models.customer.fields.name.type=string
bone.dynamic-models.models.customer.fields.name.label=客户名称
bone.dynamic-models.models.customer.fields.name.required=true
bone.dynamic-models.models.customer.fields.email.type=string
bone.dynamic-models.models.customer.fields.email.label=电子邮箱
bone.dynamic-models.models.customer.fields.email.required=true
bone.dynamic-models.models.customer.fields.phone.type=string
bone.dynamic-models.models.customer.fields.phone.label=电话号码
bone.dynamic-models.models.customer.fields.active.type=boolean
bone.dynamic-models.models.customer.fields.active.label=是否激活
bone.dynamic-models.models.customer.fields.active.default-value=true