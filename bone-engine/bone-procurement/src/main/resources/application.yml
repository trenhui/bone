server:
  port: 8885

spring:
  application:
    name: bone-procurement
  profiles:
    active: dev
  # 允许bean定义覆盖
  main:
    allow-bean-definition-overriding: true
  # 部分禁用自动配置，保留数据源配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  # 禁用Redis连接尝试
  redis:
    host: localhost
    port: 6379
    timeout: 500
  # 配置HikariCP数据源，使用MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/bone_procurement?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      auto-commit: false
      pool-name: MySQLHikariCP
  # 配置数据库初始化脚本
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8

# 智能元数据引擎配置
bone:
  smartmeta:
    enabled: true
    scan-packages: com.bone.procurement.entity
  # bone-metadata-sdk配置
  metadata:
    sdk:
      enabled: true
      scan-packages: com.bone.procurement.entity
      sql:
        template:
          cache-size: 1000
        cache:
          expire-hours: 24