spring:
  application:
    name: bone-procurement-service
    
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/bone_procurement?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
        format_sql: true
        use_sql_comments: true
        
  # Redis配置（用于缓存）
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10000
    
  # 消息队列配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

# 服务配置
server:
  port: 8082
  servlet:
    context-path: /procurement
  
# 日志配置
logging:
  level:
    root: INFO
    com.bone.procurement: DEBUG
    com.bone.smartmeta: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/bone-procurement-service.log

# 元数据引擎配置
smartmeta:
  engine:
    cache:
      enabled: true
      ttl: 3600
    version:
      enabled: true
    tenant:
      enabled: true
    impact:
      enabled: true

# 采购模块特有配置
procurement:
  # 订单配置
  order:
    code:
      prefix: PO
      # 订单号格式: PO + yyyyMMdd + 6位随机数
      format: "PO${yyyyMMdd}${random:000000}"
    # 审批配置
    approval:
      # 金额阈值配置（单位：元）
      threshold:
        level1: 5000
        level2: 20000
        level3: 100000
      # 紧急采购配置
      emergency:
        # 紧急采购阈值（元）
        threshold: 10000
        # 紧急采购审批人
        approver: "urgent_approver_role"
      # 跳过审批的条件
      skip:
        # 低于此金额跳过审批
        amount: 1000
  # 供应商配置
  supplier:
    # 验证供应商启用状态
    validate-enabled: true
  # 库存集成配置
  inventory:
    # 是否验证库存
    validate: true
    # 库存不足时的处理方式: WARN, ERROR, IGNORE
    on-insufficient: "WARN"