partnerCode: "CPL"
partnerName: "中邮人寿"
interfaces:
  - interfaceCode: "acknowledgeClaim"
    interfaceName: "案件签收"
    interfaceType: "INBOUND"
    protocol: "HTTP"
    sourceURI: "netty-http:http://127.0.0.1:30888/api/cpl/claims/acknowledge"
    authConfig:
      authType: "Basic"
      username: "ftp_user"
      password: "ftp_password"
    inputAdmFilePath: "partner/atlasmap/cpl/cpl-claimRequest-input.adm"
    inputFormat: "JSON"
    targetURI: "http://127.0.0.1:8810/api/v1/claims/acknowledge"
    outputAdmFilePath: "partner/atlasmap/cpl/cpl-claimRequest-output.adm"
    outputFormat: "XML"

  - interfaceCode: "finalizeClaim"
    interfaceName: "结案处理"
    interfaceType: "OUTBOUND"
    protocol: "HTTP"
    sourceURI: "netty-http:http://127.0.0.1:30888/api/v1/claims/finalize"
    authConfig:
      authType: "Bearer"
      token: "YOUR_CPL_TOKEN"
    inputAdmFilePath: "partner/atlasmap/cpl/cpl-claimFinalizeRequest-input.adm"
    inputFormat: "JSON"
    targetURI: "http://127.0.0.1:8810/mock/cpl/api/v1/claims/finalize"
    outputAdmFilePath: "partner/atlasmap/cpl/cpl-claimFinalizeResponse-output.adm"
    outputFormat: "XML"