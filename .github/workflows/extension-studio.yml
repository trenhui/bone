name: Extension Studio

on:
  workflow_dispatch:
  push:
    paths:
      - 'bone-engine/bone-extension-engine/**'
      - 'bone-platform/bone-gateway/**'
      - 'bone-frontend/apps/bone-extension-app/**'
      - 'doc/architecture/openapi/extension-v1.yaml'
      - 'doc/architecture/openapi/components/**'
      - 'doc/_generated/extension/**'
      - 'doc/design/modules/5. 扩展管理模块详细设计方案.md'
      - 'tools/extension-compliance-collector/**'
      - 'scripts/ci/collect-extension-compliance.sh'
      - '.github/workflows/extension-studio.yml'
  pull_request:
    paths:
      - 'bone-engine/bone-extension-engine/**'
      - 'bone-platform/bone-gateway/**'
      - 'bone-frontend/apps/bone-extension-app/**'
      - 'doc/architecture/openapi/extension-v1.yaml'
      - 'doc/architecture/openapi/components/**'
      - 'doc/_generated/extension/**'
      - 'doc/design/modules/5. 扩展管理模块详细设计方案.md'
      - 'tools/extension-compliance-collector/**'
      - 'scripts/ci/collect-extension-compliance.sh'
      - '.github/workflows/extension-studio.yml'

jobs:
  docs-compliance:
    name: Extension Docs-as-Code (compliance.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate compliance artifacts
        run: bash scripts/ci/collect-extension-compliance.sh --sync-doc
      - name: Verify committed _generated matches workspace
        run: python3 tools/extension-compliance-collector/collect.py --check

  openapi-lint:
    name: OpenAPI Lint (extension-v1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Redocly lint
        run: npx --yes @redocly/cli@1 lint doc/architecture/openapi/extension-v1.yaml --config doc/architecture/openapi/redocly.yaml

  studio-backend:
    name: Studio Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install bone-core
        run: mvn install -DskipTests -pl bone-framework/bone-core --batch-mode
      - name: Test bone-extension-studio
        run: >
          mvn test -pl bone-engine/bone-extension-engine/bone-extension-studio --batch-mode
          -Dtest=ExtensionApiContractTest,ExtensionManagementControllerTest,
          StudioPersistenceConverterTest,PluginExecutionLogCursorTest,
          MetadataPersistenceIntegrationTest,InMemoryStudioAuditStoreTest,
          ExtensionStudioSmokeIT,ExtensionApiTargetFeaturesTest,
          ExtensionApiLroTest,StudioIdempotencyServiceTest,
          StudioApplicationStartupTest

  gateway-extension-route:
    name: Gateway Extension Route IT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test bone-gateway extension routes
        run: >
          mvn test -pl bone-platform/bone-gateway --batch-mode
          -Dtest=ExtensionGatewayRouteIT,GeneratorGatewayRouteIT

  extension-sdk:
    name: Extension SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install bone-core
        run: mvn install -DskipTests -pl bone-framework/bone-core --batch-mode
      - name: Test bone-extension-sdk
        run: >
          mvn test -pl bone-engine/bone-extension-engine/bone-extension-sdk --batch-mode
          -Dtest=ExtensionExecutionGuardTest,DefaultExtensionPointRouterTest,
          ExtensionPointProxyObjectMethodsTest

  studio-mysql-it:
    name: Studio MySQL IT (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install bone-core
        run: mvn install -DskipTests -pl bone-framework/bone-core --batch-mode
      - name: MySQL integration test
        run: >
          mvn test -pl bone-engine/bone-extension-engine/bone-extension-studio --batch-mode
          -Dtest=StudioMetadataMysqlIT

  extension-frontend:
    name: Extension App (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bone-frontend/apps/bone-extension-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm install
      - name: Test
        run: npm run test -- --run
      - name: Typecheck
        run: npm run typecheck

  extension-e2e-api:
    name: Extension API E2E (manual stack)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: bone-frontend/apps/bone-extension-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: API smoke (expects Gateway+Studio on runner)
        run: npm run e2e:api
        continue-on-error: true
