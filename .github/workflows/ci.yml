name: Bone CI/CD

on:
  # 2026-10-04 修复「存在 ≠ 生效」P0-1：本仓唯一活跃开发分支是 dev
  # （实测 master..dev = 254 提交、dev..master = 0，origin/dev 与 origin/master 并存，
  # 而 origin/HEAD 指向 master），触发器此前却只列 [main, master, develop] ⇒
  # 5 个 job 与全部门禁在 dev 上**从不运行**，所有"已接线"门禁的回归保护在事实上为零。
  # develop 的拼写也与真实分支名不符，是显性的失效配置。
  #
  # 只改分支名治标不治本（分支会再次漂移），故补一条**门禁自身存活**判据
  # （scripts/check-gate-liveness.py：断言触发器包含当前分支、且 blocking 步骤数达标），
  # 让"门禁没跑"这件事本身变成一次红灯，而不是静默失效。
  # L3：CI 脚本修改，架构师审批后落地。
  push:
    branches: [dev, main, master]
  pull_request:
    branches: [dev, main, master]

env:
  # JDK 21：与 bone-parent 的 java.version=21 严格对齐（各子模块的 17 覆盖已全部清理）。
  # 若回退到 17，编译将报 "invalid target release: 21" 而全红——故本变更属 JDK 统一工程的
  # 必需配套，而非可选优化。2026-10-04 已获架构师追认（L3：CI 脚本修改需审批）。
  JAVA_VERSION: '21'
  NODE_VERSION: '18'

jobs:
  backend-quality:
    name: Backend Quality Check
    runs-on: ubuntu-latest
    # 真机 MySQL（2026-10-05）：H2 的 MODE=MySQL 只覆盖语法子集——实测它连
    # `ENGINE=InnoDB DEFAULT CHARSET=utf8mb4` 都直接报语法错误，也给不出真实 information_schema
    # 的行为，所以「这段 DDL 在 MySQL 上到底能不能跑、重复执行会不会炸、字符集落在哪」只能真机验
    # （见 JdbcPhysicalStructureGatewayAdapterMysqlTest）。
    # 测试侧连不上会自动 skip（@BeforeAll + assumeTrue），故对无 MySQL 的环境无害；
    # 这里提供 service，是为了让这些断言在 CI 上**真正生效**而不是恒为 skip。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.BONE_IT_DB_PASSWORD || 'bone_ci_only' }}
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -uroot --password=\"$$MYSQL_ROOT_PASSWORD\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      BONE_IT_DB_URL: jdbc:mysql://127.0.0.1:3306/bone_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      BONE_IT_DB_USERNAME: root
      BONE_IT_DB_PASSWORD: ${{ secrets.BONE_IT_DB_PASSWORD || 'bone_ci_only' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Code Format Check (Spotless)
        run: mvn spotless:check --batch-mode

      - name: Build, Test & ArchUnit (verify, skip ITs)
        run: mvn clean verify --batch-mode -DskipITs=true

      # ArchUnit 冻结基线开关（2026-10-04 建立）：ArchUnit 的 allowStoreUpdate 默认 true，
      # 意味着架构违规**首次运行时被自动写进基线、此后永久豁免**。而 .gitignore 的
      # `*.properties`（第 139 行）会把 src/test/resources/archunit.properties 全部吞掉
      # ⇒ 干净 checkout 上这份配置根本不存在，开关恒为 true、"冻结基线"是假的冻结。
      # 本门禁断言：每个含 ArchitectureTest 的模块都有该文件，且内容关闭 store 更新，
      # 并且**已纳入版本控制**（未被 .gitignore 吞掉）——只查文件存在会漏掉忽略项，
      # 只查 gitignore 又会在文件缺失时误报，两条必须同时成立。
      - name: ArchUnit Freeze Baseline Lint (blocking)
        run: /usr/bin/env python3 scripts/check-archunit-freeze-baseline.py --check

      - name: Generate JaCoCo Coverage Report
        run: mvn jacoco:report --batch-mode

      - name: JaCoCo Coverage Check (≥10% instruction, 起步门禁)
        run: mvn jacoco:check --batch-mode

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/**'

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'

      - name: DDD Doc↔Code Sync Lint (blocking)
        run: /usr/bin/env python3 scripts/ci/check-ddd-doc-code-sync.py --strict

      - name: DDD Doc Drift Lint (blocking)
        run: /usr/bin/env python3 scripts/check-ddd-doc-drift.py

      - name: DDD Gate State Lint (blocking)
        run: /usr/bin/env python3 scripts/check-ddd-gate-state.py

      - name: DDD Gate State Tables in sync with gate-state.json (blocking)
        run: /usr/bin/env python3 scripts/check-ddd-gate-state.py generate --check

      # 门禁自身存活（2026-10-04 建立）：断言「CI 会在当前分支上跑」且没有空壳步骤。
      # 存在理由：此前 ci.yml 触发器只列 [main, master, develop]，而本仓唯一活跃分支是 dev
      # ⇒ 20+ 个门禁**从不运行**却全绿，改对分支名只治标（分支会再漂移），
      # 本判据让「门禁没跑」这件事本身成为红灯。L3：CI 脚本修改，架构师审批后落地。
      - name: Gate Liveness Check (blocking)
        run: /usr/bin/env python3 scripts/check-gate-liveness.py --strict

      # 以下 6 项此前**只存在于 scripts/ci-check.sh 里，而该脚本在全仓零调用者**
      # （2026-10-04 实测：命中全是脚本自身 docstring 与 gate-state.json 的描述文本，
      # ci.yml 里唯一出现处是一句注释）⇒ 六个维度完全没有回归保护。
      # 接入策略：显式逐条调用，而不是去调 ci-check.sh —— 逐条能看清每条判据、单独标注 blocking，
      # 也避免把「一个没人跑的脚本」变成第二个没人跑的脚本。
      # scripts/check.sh（pre-commit）仍会跑其中一部分，但它只认已 staged 的 .java
      # （见 scripts/check.sh [2/22] 的变更模块检测），删码/未 stage/纯配置改动仍是盲区。
      - name: DDL Table List Doc Sync Lint (blocking)
        run: /usr/bin/env python3 scripts/check-ddl-doc-sync.py

      # HC-008：新增表缺必备列（tenant_id/created_at/updated_at/deleted）。
      # 存量缺口逐表登记在 doc/architecture/ddl-required-columns-baseline.json（只可收缩），
      # 本步只拦新增缺口。
      - name: HC-008 Required Columns Lint (blocking)
        run: /usr/bin/env python3 scripts/check-ddl-required-columns.py --check

      # 多租户：DDL 有 tenant_id ≠ SDK 认这张表是租户表；实体不声明 tenantId 时
      # TenantFilterInjector 直接 return ⇒ 查询不注入租户条件 = 静默跨租户读。
      - name: Tenant Entity Declaration Lint (blocking)
        run: /usr/bin/env python3 scripts/check-tenant-entity-declaration.py --check

      # 租户离场清退覆盖：含 tenant_id 且非平台/全局/样板表必须登记离场清退清单，
      # 否则租户删除后数据残留。
      - name: Tenant Deletion Coverage Lint (blocking)
        run: /usr/bin/env python3 scripts/check-tenant-deletion-coverage.py --check

      # ADR-0035：application 层只放 ApplicationService + 契约端口 + support，
      # 否则第二类 service / 角色包会长回架构里。
      - name: Application Constructs Lint (blocking)
        run: /usr/bin/env python3 scripts/check-application-constructs.py --check

      # ADR-0036 D5：聚合必须包在 domain/model/{聚合}/ 下（两套分组并存是历史债的信号）。
      - name: Domain Model Layout Lint (blocking)
        run: /usr/bin/env python3 scripts/check-domain-model-layout.py

      # 主键注解落位：@Id 标在哪个字段就决定 SDK 所有按主键 SQL 的 where 条件。
      # 2026-10-07 实测 9 个实体的 @Id 被 javadoc 顶到 deleted 上 ⇒ findById 恒 404、
      # update/软删静默失效，而列表照常返回（findPage 无主键谓词）。javac/spotless 均不报错。
      - name: Id Annotation Placement Lint (blocking)
        run: /usr/bin/env python3 scripts/check-id-annotation.py

      # ADR-0040：对外发布模块（SDK）不得以空壳冒充，且有业务类必须有契约测试。
      # 门禁 16 此前只在本地 ci-check.sh [11/11] 运行，.github/workflows 未调用，
      # 即"看起来有门禁、实则 CI 形同虚设"。此处补齐使它真正成为阻断门禁。
      - name: SDK Contract Surface Lint (blocking)
        run: /usr/bin/env python3 scripts/check-sdk-contract-surface.py --check

      # 前端 ID 字段类型契约：后端全平台把 Long 序列化为 JSON 字符串（雪花 ID 超JS Number
      # 上限 2^53，以 number 返回会被静默截断且无任何 JS 报错）。前端若把 ID 声明为 number
      # 即type lie（===/Map key/Tree node.key 不可预期）。存量 330 处已于 2026-10-03 全部
      # 改为 string，本门禁防其重新引入。基线 doc/architecture/frontend-id-type-baseline.json
      # 只可收缩。
      - name: Frontend ID Type Lint (blocking)
        run: /usr/bin/env python3 scripts/frontend/check-frontend-id-types.py --check

      # OpenAPI 契约结构：doc/architecture/openapi 下的规范是对外 SDK 的唯一契约真源
      # （ADR-0040）。2026-10-03 实测两类既存缺陷 ——
      #   ① extension/generator/integration 三份规范的 flow mapping 值未加引号，
      #      YAML 根本无法解析（实测 redocly lint EXIT=1），SDK 生成器拿不到契约；
      #  ② extension/generator/integration/masterdata/metadata-runtime 五份完全没有
      #      securitySchemes，而 redocly 的 security-defined 此前被显式关掉。
      # 本门禁离线可跑（PyYAML + 标准库），npx redocly 需联网故只作各模块独立 job。
      # PyYAML 显式安装：不依赖 runner 预装，缺失时门禁会 exit 2 而非静默放过。
      - name: Install PyYAML for OpenAPI lint
        run: /usr/bin/env python3 -m pip install --quiet pyyaml

      - name: OpenAPI Contract Structure Lint (blocking)
        run: /usr/bin/env python3 scripts/check-openapi-contract.py

      # ADR-0040 A2：OpenAPI 声明 integer/int64 但后端下发的是 JSON 字符串。
      # 判据不是"见 int64 就改" —— 全局 ToStringSerializer 只对**包装类型 Long** 生效，
      # 原生 long/double 仍是 number。核对 Java 侧后：60 处 ID/外键/PageResult.total
      # 已改为 type: string；console 的 11 处指标（原生 long）保持 int64。
      - name: OpenAPI int64 Contract Lint (blocking)
        run: /usr/bin/env python3 scripts/check-openapi-int64-contract.py

      # OpenAPI 生成器前置条件：下面两类缺陷在上两条门禁 + redocly 下**全绿**，
      # 却会让 openapi-generator 直接拒绝或产出不可用的 SDK（2026-10-03 实测）：
      #   ① path 模板变量未声明为 path 参数 ⇒ 抛 SpecValidationException，
      #      generator-v1 的 PUT/DELETE /data-sources/{id} 曾让整份规范生成失败；
      #   ② 缺 operationId / tags ⇒ iam/extension/generator 共 90 个操作全部塞进
      #      单个 DefaultApi，方法名退化为 accountsIdGetPost 这类 path 拼接。
      # 判据必须先解 $ref：metadata-runtime 有 5 处"缺参"其实是 $ref 到
      # components/parameters 的正常写法，第一版判据没解 $ref 会误报。
      # 同时核对 scripts/generate-sdk.sh 的 SPECS 清单与磁盘规范一一对应。
      - name: OpenAPI Generation Readiness Lint (blocking)
        run: /usr/bin/env python3 scripts/check-openapi-generation-readiness.py

      # 认证强制、授权不强制：各模块 SecurityConfig 统一 anyRequest().authenticated()，
      # 缺方法级 @PreAuthorize 意味着任何登录用户都能调写端点。
      - name: Controller Write Endpoint Authorization Lint (blocking)
        run: /usr/bin/env python3 scripts/check-controller-authorization.py

      # URL 层 permitAll 不得覆盖含写端点的业务路径前缀。两层授权各管一件事：
      # URL 层决定"要不要认证"，方法层 @PreAuthorize 决定"这次调用准不准"。
      # 漏写 @PreAuthorize 在普通路径上只是"任何登录用户可写"，而在被 permitAll
      # 覆盖的路径上是**"任何人可写"** —— 爆炸半径差一个量级。
      # 本条 2026-10-04 建成但长期未接入任何流水线（= 假门禁），
      # 2026-10-06 孤儿审计（对每个 check-*.py 查 hooks 引用数）发现并补上。
      - name: URL Layer PermitAll Bypass Lint (blocking)
        run: /usr/bin/env python3 scripts/check-controller-authorization-url-bypass.py

      # Spring Security 的 /error 白名单：Controller 抛异常后容器 FORWARD 到 /error，
      # 若它不在 permitAll 里会被 AuthorizationFilter 拦下 ⇒ AuthorizationDeniedException
      # ⇒ 对外 **401「未认证」**，把真实的 404/403/500 统统掩盖。
      # 2026-10-06 在 bone-file 上实测确诊（download 不存在的对象返 401 而非 404），
      # 排查时被误导到「密钥不一致 / 权限码缺失」，最终靠 TRACE 日志才定位真因。
      # 其余模块当时未暴露仅因有 @RestControllerAdvice 兜底 —— 任何新增的直写响应体端点
      # 都会立刻暴露它，故对全仓 SecurityConfig 一律要求。
      - name: SecurityConfig /error Permit-All Lint (blocking)
        run: /usr/bin/env python3 scripts/ci/check-error-endpoint-permit-all.py

      # AFTER_COMMIT 处理器必须显式切租户（ADR-0031 D3）。
      # SDK 写路径对缺租户**失败关闭**，而 Spring 的 AFTER_COMMIT 已脱离 HTTP 请求
      # 线程、TenantContext 通常为 null ⇒ 处理器漏切租户会让跨聚合联动
      # **静默失效**：编译通过、单测全绿、功能从未生效，且日志只留一行 WARN。
      # 2026-10-06 已在 ShipmentOrderSyncEventHandler 上用负向探针实测复现：
      # 把 callAs 的租户换成 null 后，E2E 精确报 2 条 FAIL，根因日志为
      # "tenantId must not be null: 异步入口必须显式声明租户（ADR-0031 D3）"。
      - name: Async Tenant Context Lint (blocking)
        run: /usr/bin/env python3 scripts/ci/check-async-tenant-context.py

      # 软删声明：骨核判定聚合可否软删，依据是**实体内有无带 @Deleted 的字段**，
      # 与 DDL 有无 deleted 列无关 —— 表有列、实体没声明时 `deleteById` 照常
      # 执行 `DELETE FROM`，行永久消失而调用方拿到 HTTP 200。
      # extends AggregateRoot / TenantAggregateRoot 的实体一律中招（基类不提供该字段）。
      # 本门禁 2026-10-03 建立后**长期未接入任何流水线**，等于没有门禁：
      # 存量 22 张表的缺口若被新表复制扩大，无人阻断。
      # 基线 doc/architecture/soft-delete-declaration-baseline.json 只可收缩。
      - name: Soft Delete Declaration Lint (blocking)
        run: /usr/bin/env python3 scripts/check-soft-delete-declaration.py

      # 配置键契约：`@Value("${some.key:default}")` 的键名写错时 Spring **静默回落**
      # 到默认值 —— 不报错不打日志，症状出现在离故障点很远的地方
      # （曾表现为全链路 401 而日志只有「验签失败」）。单测与 ArchUnit 都抓不到。
      # --strict 把 WARN 也计为失败：WARN 的定义是「键不在任何 yml 定义但给了默认值」，
      # 实践中几乎都是笔误。存量若确有合法例外，应在 yml 显式定义该键。
      # COMMON_* 公共错误码重复定义：`CommonErrorCodes`（bone-core）的设计意图是「跨模块共用的语义
      # 必须集中一处」，但实测 6 个码值在 2~3 个模块各自字面量重定义。危害不是多一个常量，而是
      # **修复时漏改** —— 真源改了值/改名，副本还留着旧值，同一语义对外出现两个码。
      # 存量 6 组登记在 doc/architecture/error-code-duplication-baseline.json（只可收缩）；
      # 本门禁拦的是**新增**重复。存量替换受 i18n 门禁 CODE_RE 只认字面量的约束，需与扫描口径一起改。
      - name: Error Code Duplication Lint (blocking)
        run: /usr/bin/env python3 scripts/check-error-code-duplication.py --check

      - name: Config Key Contract Lint (blocking)
        run: /usr/bin/env python3 scripts/ci/check-config-key-contract.py --strict

      # 文档类名漂移：doc/ 里写的 Java 类名若在仓库中不存在，读者按图索骥必然落空。
      # 判据是「后缀白名单 + 反引号包裹」，只抓 Controller / Repository / Handler /
      # ApplicationService / Gateway / Adapter 这类构件名，不会误伤普通英文词。
      # 基线 doc/architecture/doc-code-symbols-baseline.json 只可收缩；登记时必须写明
      # reason（历史快照 / 目标态设计 / 流程示意 / Spring 通用词误报），不能无脑豁免。
      - name: Doc Code Symbols Lint (blocking)
        run: /usr/bin/env python3 scripts/check-doc-code-symbols.py

      # 控制面匿名放行开关必须默认拒绝。`permit-unauthenticated` 打开等于整个
      # Studio 控制面匿名可写（插件上传 / 部署 / 版本切换全部免凭证），与权限码缺失同级。
      # 原基配置硬编码 `true` —— 连环境变量都覆盖不了（占位符才能被 Spring 解析），
      # 且 dev/in-memory 靠继承拿到放行 ⇒ "忘记配置"＝一次静默的全站匿名降级。
      # 三条判据：R1 放行不得裸字面量、R2 基配置占位符默认值须 false、
      # R3 生产 profile 恒为字面量 false（不该存在"注入环境变量即可放行"的路径）。
      # src/test/resources 豁免：单测需无 JWT 构造请求，那是测试替身而非部署配置。
      - name: Security Fail-Open Default Lint (blocking)
        run: /usr/bin/env python3 scripts/check-security-fail-open-default.py --strict

      # 门禁自身的有效性自证：注入 R1/R2/R3 违规 + 用 HEAD 真实历史样本，
      # 断言脚本精确失败且不误伤合法形态。改了判据却没跑它，就无法区分
      # "门禁有效"与"门禁只会打印 ✅"。
      - name: Security Fail-Open Default Negative Probe
        run: /usr/bin/env python3 scripts/ci/probe-security-fail-open-default.py

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Secret Scan (Gitleaks)
        # HC-012a 此前仅本地脚本执行、未接入 CI；此处补齐，使密钥扫描真正成为阻断门禁。
        # 存在基线时只拦截新增泄露，避免历史存量阻断构建。
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          if [ -f .gitleaks.baseline.json ]; then
            /tmp/gitleaks detect --source . --config .gitleaks.toml --baseline-path .gitleaks.baseline.json --verbose
          else
            /tmp/gitleaks detect --source . --config .gitleaks.toml --verbose
          fi

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            --batch-mode \
            -DfailBuildOnCVSS=7

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.html'

  # 集成测试 job：仅 PR 时触发，使用 Testcontainers (MySQL 8 + Redis 7)
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend-quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Integration Tests (Testcontainers MySQL 8 + Redis 7)
        run: mvn clean verify --batch-mode -Dspring.profiles.active=test
        env:
          # Testcontainers 使用 Docker，GitHub runner 已预装 Docker
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-failsafe-reports
          path: '**/target/failsafe-reports/*.xml'

      - name: Upload Integration JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-jacoco-coverage
          path: '**/target/site/jacoco/**'

  # OpenAPI diff 契约检查 job：仅 PR 时触发，检测破坏性变更
  openapi-diff:
    name: OpenAPI Contract Diff Check
    runs-on: ubuntu-latest
    needs: backend-quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史以对比 main 分支

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Checkout main branch OpenAPI specs
        run: |
          mkdir -p /tmp/openapi-main
          git fetch origin ${{ github.base_ref }}:main-ref
          # 将 main 分支的 openapi 目录复制到临时目录
          git show main-ref:doc/architecture/openapi/ > /dev/null 2>&1 || true
          git worktree add --detach /tmp/openapi-main-wt main-ref 2>/dev/null || true
          if [ -d /tmp/openapi-main-wt/doc/architecture/openapi ]; then
            cp -r /tmp/openapi-main-wt/doc/architecture/openapi/* /tmp/openapi-main/
          else
            echo "WARNING: main branch has no openapi directory; skipping diff"
          fi

      - name: Run OpenAPI Diff (oasdiff)
        run: |
          # 安装 oasdiff（Go 工具，单二进制）
          OASDIFF_VERSION="0.10.0"
          curl -sSL "https://github.com/Tufin/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp oasdiff
          chmod +x /tmp/oasdiff

          OPENAPI_DIR="doc/architecture/openapi"
          MAIN_DIR="/tmp/openapi-main"
          HAS_BREAKING=0

          if [ ! -d "$MAIN_DIR" ] || [ -z "$(ls -A $MAIN_DIR 2>/dev/null)" ]; then
            echo "No baseline OpenAPI specs found on main; skipping diff check."
            exit 0
          fi

          # 对比每个 *-v1.yaml 契约文件
          for spec in "$OPENAPI_DIR"/*-v1.yaml; do
            [ -f "$spec" ] || continue
            filename=$(basename "$spec")
            base_spec="$MAIN_DIR/$filename"
            if [ ! -f "$base_spec" ]; then
              echo "INFO: $filename is new (no baseline); skipping diff."
              continue
            fi
            echo "=== Diffing $filename ==="
            # breaking 检测：如果有破坏性变更，exit code = 1
            /tmp/oasdiff breaking "$base_spec" "$spec" || HAS_BREAKING=1
            # 变更摘要（changelog，不失败）
            /tmp/oasdiff changelog "$base_spec" "$spec" || true
          done

          if [ $HAS_BREAKING -eq 1 ]; then
            echo "::error::Breaking OpenAPI changes detected! See diff output above."
            exit 1
          fi
          echo "No breaking OpenAPI changes detected."

  frontend-quality:
    name: Frontend Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bone-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: bone-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # i18n 门禁：后端 errorCode 常量 ↔ 错误码台账 ↔ 前端语言包 的差集校验。
      # 脚本在仓库根（相对路径依赖 bone-frontend/… 与 doc/…），故显式覆盖 working-directory。
      # 存量漂移走显式白名单 config/i18n/errorcode-baseline.json，新增码不豁免。
      - name: i18n Sync Check
        working-directory: .
        run: python3 scripts/check-i18n-sync.py

      - name: Unit Tests (Vitest)
        run: npm run test

      - name: Test Coverage (Vitest + c8)
        run: npm run test:coverage

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: bone-frontend/coverage/**

      - name: Build All Apps
        run: npm run build:apps

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    strategy:
      matrix:
        include:
          # bone-platform 平台服务
          - module: bone-iam
            module-path: bone-platform/bone-iam
            artifact-id: bone-iam
          - module: bone-system
            module-path: bone-platform/bone-system
            artifact-id: bone-system
          - module: bone-masterdata
            module-path: bone-platform/bone-masterdata
            artifact-id: bone-masterdata
          - module: bone-gateway
            module-path: bone-platform/bone-gateway
            artifact-id: bone-gateway
          - module: bone-integration
            module-path: bone-platform/bone-integration
            artifact-id: bone-platform-integration
          # bone-engine 引擎服务
          - module: bone-metadata-server
            module-path: bone-engine/bone-metadata-server
            artifact-id: bone-metadata-server
          - module: bone-extension-studio
            module-path: bone-engine/bone-extension-engine/bone-extension-studio
            artifact-id: bone-extension-studio
          - module: studio-generator
            module-path: bone-engine/studio-generator
            artifact-id: bone-studio-generator
          # 脚手架
          - module: bone-blueprint
            module-path: bone-blueprint
            artifact-id: bone-blueprint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            -f ./docker/Dockerfile \
            --build-arg MODULE_PATH=${{ matrix.module-path }} \
            --build-arg ARTIFACT_ID=${{ matrix.artifact-id }} \
            -t bone/${{ matrix.module }}:${{ github.sha }} \
            .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bone/${{ matrix.module }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
