name: Migration Verify

# 仅当迁移目录或迁移工具本身有改动时触发，避免对普通提交造成额外 CI 成本。
# 注意必须包含门禁脚本/执行器/门禁自测三条路径：否则「改坏了门禁」这一类改动恰好不跑 CI，
# 而它正是唯一能发现「清单悄悄失守」的作业要守的东西（2026-10-30 补）。
on:
  push:
    paths:
      - 'scripts/migration/**'
      - 'scripts/seed/**'
      - 'bone-init.sql'
      - 'scripts/check-migration-manifest.py'
      - 'scripts/check-migration-init-coverage.py'
      - 'scripts/migrate.py'
      - 'scripts/sync-init-from-live.py'
      - 'scripts/seed-bootstrap.py'
      - 'scripts/tests/test_check_migration_manifest.py'
      - 'scripts/tests/test_check_migration_init_coverage.py'
      - 'scripts/tests/test_migrate_journal.py'
      - 'scripts/tests/test_sync_init_from_live.py'
      - 'scripts/tests/test_seed_and_lock.py'
      - '.github/workflows/migration-verify.yml'
  pull_request:
    paths:
      - 'scripts/migration/**'
      - 'scripts/seed/**'
      - 'bone-init.sql'
      - 'scripts/check-migration-manifest.py'
      - 'scripts/check-migration-init-coverage.py'
      - 'scripts/migrate.py'
      - 'scripts/sync-init-from-live.py'
      - 'scripts/seed-bootstrap.py'
      - 'scripts/tests/test_check_migration_manifest.py'
      - 'scripts/tests/test_check_migration_init_coverage.py'
      - 'scripts/tests/test_migrate_journal.py'
      - 'scripts/tests/test_sync_init_from_live.py'
      - 'scripts/tests/test_seed_and_lock.py'
      - '.github/workflows/migration-verify.yml'

jobs:
  manifest-and-journal:
    name: Migration manifest + journal smoke
    runs-on: ubuntu-latest
    # 账本自测要真连 MySQL（CREATE TABLE / 主键与唯一键行为），用与 ci.yml 一致的 service。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: bone_ci_only
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -uroot -pbone_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mysql client
        run: |
          command -v mysql >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
          }
          mysql --version

      # 静态判据：清单与磁盘双向一致、order 连续、重号已登记、kind 与内容一致。
      - name: Manifest gate
        run: python3 scripts/check-migration-manifest.py

      # 两个 DDL 真源必须等价：迁移脚本建过的表必须已在 bone-init.sql 里（存量缺口在基线，只可收缩）。
      - name: Init coverage gate
        run: python3 scripts/check-migration-init-coverage.py

      # 门禁自身回归：判据被改坏时这里先红，而不是等到「清单悄悄失守」。
      # 含账本比对逻辑的纯函数单测（不连库）：重编号不得被误判成「脚本被改动」。
      - name: Manifest gate self-test
        run: |
          python3 scripts/tests/test_check_migration_manifest.py -v
          python3 scripts/tests/test_check_migration_init_coverage.py -v
          python3 scripts/tests/test_migrate_journal.py -v
          python3 scripts/tests/test_sync_init_from_live.py -v
          python3 scripts/tests/test_seed_and_lock.py -v

      # 账本功能自测。**不跑「空库全量 apply」**：bone-init.sql 已是当前全量结构，
      # 84 个脚本面向存量环境，空库全量必然失败（2026-10-30 实测 65 成功 / 19 失败，
      # 多为 Duplicate column 或脚本自带 SIGNAL 校验发现目标状态不满足）。
      - name: Journal smoke (baseline → status → apply no-op → drift → renumber)
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: bone_ci_only
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot -pbone_ci_only -e "CREATE DATABASE mig_journal_smoke"
          python3 scripts/migrate.py --db mig_journal_smoke | tee /tmp/s0.txt
          grep -q "待应用 [1-9]" /tmp/s0.txt   # 空账本：应有待应用项
          python3 scripts/migrate.py --db mig_journal_smoke --baseline
          python3 scripts/migrate.py --db mig_journal_smoke | tee /tmp/s1.txt
          grep -q "待应用 0" /tmp/s1.txt       # 登记后：不应再有待应用项
          # baseline 与真跑过必须可分辨：否则一次登记就能把漏跑的脚本永久掩盖成绿。
          grep -q "条是 --baseline 登记" /tmp/s1.txt
          python3 scripts/migrate.py --db mig_journal_smoke --apply | tee /tmp/a.txt
          grep -q "无待应用项" /tmp/a.txt
          # 校验和漂移必须被判红：改一行记账后 status 应退 1
          mysql -h127.0.0.1 -uroot -pbone_ci_only mig_journal_smoke \
            -e "UPDATE schema_migration_journal SET sha256=REPEAT('0',64) WHERE file='0001_masterdata_mdm_convergence.sql'"
          if python3 scripts/migrate.py --db mig_journal_smoke >/tmp/s2.txt 2>&1; then
            echo "❌ 校验和漂移未被判红（账本失去发现「已发脚本被改动」的能力）"; exit 1
          fi
          grep -q "校验和不符" /tmp/s2.txt
          # 清掉上一段注入的假校验和（删行后重新登记即可拿回正确 sha），否则下一段会同时报两类问题
          mysql -h127.0.0.1 -uroot -pbone_ci_only mig_journal_smoke \
            -e "DELETE FROM schema_migration_journal WHERE file='0001_masterdata_mdm_convergence.sql'"
          python3 scripts/migrate.py --db mig_journal_smoke --baseline >/dev/null
          # 回归：账本按 file 认身份。整体重编号（等价于清单里插入一个新脚本）只能报「order 变更」，
          # 绝不能被诊断成「已发脚本被改动」——那会诱导人去还原一个本来就没错的文件。
          mysql -h127.0.0.1 -uroot -pbone_ci_only mig_journal_smoke \
            -e "UPDATE schema_migration_journal SET order_no=order_no+1 WHERE order_no>=2"
          python3 scripts/migrate.py --db mig_journal_smoke >/tmp/s3.txt 2>&1 || true
          grep -q "order 变更" /tmp/s3.txt
          if grep -q "校验和不符（已应用后脚本被改动" /tmp/s3.txt; then
            echo "❌ 重编号被误判成「脚本被改动」（账本按 order 认身份，已回归）"; exit 1
          fi
          # 失败行必须与「从未执行」分开：前者库可能是半截状态，处置完全不同。
          mysql -h127.0.0.1 -uroot -pbone_ci_only mig_journal_smoke \
            -e "UPDATE schema_migration_journal SET success=0, error_msg='simulated 1064' WHERE file='0002_extension_impl_app_id_and_tenant_code.sql'"
          if python3 scripts/migrate.py --db mig_journal_smoke >/tmp/s4.txt 2>&1; then
            echo "❌ 存在执行失败行时 status 不该退 0"; exit 1
          fi
          grep -q "执行失败 1" /tmp/s4.txt
          grep -q "待应用 0" /tmp/s4.txt    # 失败行不得被算成「从未执行」

  fresh-env:
    name: Fresh env — init + seed 能建出可用库
    runs-on: ubuntu-latest
    # 这条是「新环境只需 init」这个说法的唯一机器判据。2026-10-30 实测这句原本**不成立**：
    # init 建出 121 张表，而有 25 张结构表只存在于迁移脚本里（wf_* 8 / t_claim_* 6 / meta_* 6 …），
    # 灌完 init 工作流引擎与理赔轨迹直接缺表；数据侧更糟：iam_menu = 0 行、sys_dict_type = 0 行。
    # 两个方向都已补齐（init 并入托管区块、种子单独入口），这里把它固定住。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: bone_ci_only
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -uroot -pbone_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mysql client
        run: |
          command -v mysql >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
          }

      - name: Apply full schema
        run: mysql -h127.0.0.1 -uroot -pbone_ci_only --default-character-set=utf8mb4 < bone-init.sql

      # 表数从 init 自身数出来，而不是写死 146：新增表时判据跟着走，不需要有人记得改这里。
      - name: Assert schema is complete
        run: |
          set -euo pipefail
          expected=$(grep -c '^CREATE TABLE' bone-init.sql)
          actual=$(mysql -h127.0.0.1 -uroot -pbone_ci_only -N -B -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='bone' AND table_type='BASE TABLE'")
          echo "init 声明 $expected 张表，库里有 $actual 张"
          [ "$actual" = "$expected" ] || { echo "❌ 表数不符：灌 init 后缺 $((expected-actual)) 张"; exit 1; }
          # 6 张双证表：这 6 张曾经 init 命中 0、dev 命中 6，就是「代码上线、DDL 没跟上」的现场。
          for t in wf_task wf_instance wf_status_outbox t_claim_case_track t_claim_inspection meta_runtime_record_audit; do
            n=$(mysql -h127.0.0.1 -uroot -pbone_ci_only -N -B -e \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='bone' AND table_name='$t'")
            [ "$n" = "1" ] || { echo "❌ 缺表 $t（新环境会在这里静默失败）"; exit 1; }
          done

      - name: Apply bootstrap seed
        env:
          BONE_DB_HOST: 127.0.0.1
          BONE_DB_PORT: '3306'
          BONE_DB_USER: root
          BONE_DB_PASSWORD: bone_ci_only
        run: python3 scripts/seed-bootstrap.py --apply --db bone

      # 结构齐了但数据是空的 —— 这就是「空壳」：登录后侧栏空白、下拉无值、接口 403，
      # 而所有只看结构的门禁全绿。所以这一条必须单独断言，不能靠 seed 清单自证。
      - name: Assert not a shell (menu / dict / permission)
        run: |
          set -euo pipefail
          # 不用 `set -- $pair` 分词：zsh 默认不做变量分词，本地跑同一段脚本会静默失败，
          # 而 CI 是 bash 又能过 —— 这种「只在本地/只在 CI 出问题」的写法迟早埋雷。
          for pair in "iam_menu:288" "iam_permission:126" "sys_dict_type:81" "sys_dict_item:237"; do
            name="${pair%%:*}"; min="${pair##*:}"
            n=$(mysql -h127.0.0.1 -uroot -pbone_ci_only -N -B bone -e "SELECT COUNT(*) FROM $name")
            echo "$name = $n（下限 $min）"
            [ "$n" -ge "$min" ] || { echo "❌ $name 只有 $n 行，低于下限 $min —— 新环境是空壳"; exit 1; }
          done

  verify-0052:
    name: Verify 0052 rename migration
    runs-on: ubuntu-latest
    # 复用与 ci.yml 一致的 mysql:8.0 service（真机 MySQL 才能验证 DDL / information_schema 行为）。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: bone_ci_only
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -uroot -pbone_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pymysql
        run: pip install pymysql
      - name: Verify 0052 migration against MySQL 8
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: bone_ci_only
          PYTHONSAFEPATH: '1'
        run: python3 scripts/migration/verify_0052.py
