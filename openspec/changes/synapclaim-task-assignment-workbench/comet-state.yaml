        proposal:
          input:
            change: synapclaim-task-assignment-workbench
            changeDir: openspec/changes/synapclaim-task-assignment-workbench
            workspaceBaseline:
              ref: d733ab9b-db28-40e3-810f-a2e7c12b800b
          outputs:
            full.design.handoff:
              handoffContext: openspec/changes/synapclaim-task-assignment-workbench/.comet/handoff/design-context.json
              handoffHash: d3705270f538dc9e0bf21e1d99426b96efddb519713009f193234503b141230c
              proposal: 批 1 技术方案候选（待用户确认）：【方案 A 推荐】expand 新增 t_claim_task /
                t_claim_assign_rule；生成列 active_key + UNIQUE(tenant_id,
                active_key) 保证同案同类型至多一条生效任务、终态行返回 NULL 不占唯一性；并发领取用唯一键 + @Version
                乐观锁，冲突映射 SC_CLAIM_TASK_CONFLICT，禁用 SELECT ... FOR
                UPDATE；规则表按租户/险种/金额段/渠道/任务类型固定顺序与显式优先级求解（目标
                USER|DEPT|ROLE），命中记录落库，写入期把归属落进任务行、查询期只读；服务端 total 用与列表同一过滤条件的
                COUNT(*)，前端只传 page/size 并去掉固定 50 条切片；AUTO_ASSIGN
                开关关闭时分配器停写、任务表保留不读，旧 {claimId} 兼容层保留。【比较】方案 B 规则引擎外置 +
                查询期动态求解：归属随时刻漂移，破坏批 2 归因与批 4 超时回池，引入不可回退表达式面，不采用；方案 C 应用层先查后写 +
                分布式锁免生成列：并发双写窗口无法满足 spec「并发双领取恰 1 成功」，且项目禁 FOR
                UPDATE，不采用。【关键取舍】多两张表与一次增量迁移，换取一案多任务、行级并发领取、可审计归属与批 2/3/4
                可复用事实。【风险与处理】① 并行会话占用
                ClaimWorkbenchController/ClaimSearch*/ClaimCaseRepository →
                等其入库后开工、精确路径复核、绝不 git add 全量；② 迁移清单撞号 →
                追加末尾空位、脚本+清单+bone-init.sql 同批入库、已发迁移含注释不回改；③ 新表列与活库不一致致静默读空 → 实体
                @Column 与 information_schema 逐列求差、每个仓储方法同批 SQL 模板且 SELECT
                列对齐、模板首行必须是语句关键字；④ 新增错误码四处同批（错误码类 + HTTP 状态 + 前端双语包 + 登记台账 §6）；⑤
                前端雪花 ID 一律 string；⑥ 三条索引 EXPLAIN 均命中；⑦ 变异验证「前端固定切片」与「整表
                total」两处判据必须转红；⑧ worktree 被全仓扫描误扫如实归因，不宣称全仓 check.sh exit
                0。【测试策略】单元（规则求解/候选全不可用/优先级/金额段边界、冲突映射、COUNT
                同源）；集成（information_schema 终态断言、启动期无
                TemplateNotFoundException、仓储读回写入值、跨租户探针返回空）；探针（137 条翻页
                total/逐页和/ID 去重均为 137、1 万在办 100 次采样 P95<300ms、并发双领取恰 1
                成功）；负向与变异；运行期证据写 docs/superpowers/reports/ 并带实测数值。【Spec
                Patch】无：不新增能力、不改公开行为与验收，范围严格来自已批准 proposal/spec/tasks 与 v2.3
                §13.5。【开工约束】用户裁定等并行会话在途改动入库 + 全量门禁转绿后才进
                Build；本阶段只出设计文档，不写实现代码，确认后仍需另行确认 Build
                执行配置（build_mode/tdd_mode/review_mode），不自动进入 Build。
