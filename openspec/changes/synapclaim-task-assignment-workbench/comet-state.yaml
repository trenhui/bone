                active_key) 保证同案同类型至多一条生效任务、终态行返回 NULL 不占唯一性；并发领取用唯一键 + @Version
                乐观锁，冲突映射 SC_CLAIM_TASK_CONFLICT，禁用 SELECT ... FOR
                UPDATE；规则表按租户/险种/金额段/渠道/任务类型固定顺序与显式优先级求解（目标
                USER|DEPT|ROLE），命中记录落库，写入期把归属落进任务行、查询期只读；服务端 total 用与列表同一过滤条件的
                COUNT(*)，前端只传 page/size 并去掉固定 50 条切片；AUTO_ASSIGN
                开关关闭时分配器停写、任务表保留不读，旧 {claimId} 兼容层保留。【比较】方案 B 规则引擎外置 +
                查询期动态求解：归属随时刻漂移，破坏批 2 归因与批 4 超时回池，引入不可回退表达式面，不采用；方案 C 应用层先查后写 +
                分布式锁免生成列：并发双写窗口无法满足 spec「并发双领取恰 1 成功」，且项目禁 FOR
                UPDATE，不采用。【关键取舍】多两张表与一次增量迁移，换取一案多任务、行级并发领取、可审计归属与批 2/3/4
                可复用事实。【风险与处理】① 并行会话占用
