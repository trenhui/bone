              handoffHash: cbf8a76de2110d4133da063c95a63471914ad6ecb35d8dec5a2c1398c815babc
              proposal: 【方案 A 推荐】沿用既有「domain 纯判据 + application 取数/读配置 + adapter 形态准入」三段式：新增
                ReviewFatigueConfig 作为 REVIEW_FATIGUE_GUARD.config_json
                唯一解析真源（maxPerShift=120、restPromptMinutes=120、shiftEndExclusionMinutes=30、sensitiveAmountYuan=10000，越界/非法/未知键回落基线并登记
                rejected）；Application 按
                tenant+assignee+status=DONE+finished_at>=UTC 当日零点统计完成量，达到上限的
                USER 候选由 FatigueAwareEligibilityPort 判不可用，TaskAssigner 既有
                ALL_INELIGIBLE→入池回落形成超量自动转派；新增只读 GET
                /review/fatigue-guard/evaluation
                返回超量/休息提示/敏感案件资格，不写库、不改案件状态。关键取舍：零 DDL、不新增 SQL
                模板、不碰金额/拒赔/支付；班末硬排除因缺可信服务端班次事实源只做 soft prompt，如实登记
                gap，不宣称已实现；主管抽检不再重复实现（前批已落地）。测试策略：配置解析正/反向、当日计数口径、超量回落入池、计数异常
                fail-closed、端点契约与前端 typecheck；定向单测 + synap-claim-app 全量 +
                check.sh 59/59。【方案 B 不采用】新建独立疲劳服务/表：需新 DDL 与跨服务一致性，当前不可证伪且超出零
                DDL 边界。【方案 C 不采用】只做前端静态文案：属于“配了不生效”，无法回池转派，违反联调证据要求。【Spec
                Patch】新增 claim/review-fatigue capability（soft prompt 评估），修改
                claim/task-assignment 的候选准入判据；不改变资金/拒赔公开验收。
