            proposal: 方案：新建报案聚合 t_claim_report（report_no 全局唯一，RP 前缀），赔案通过 report_id
              单向引用，报赔基数 1:0..N；两套编号共用 Feistel+Base32+Luhn32 内核（校验位只覆盖日期+载荷，故回填
              CL->RP 仍合法）；幂等键保留在赔案，报案与首案同事务创建，冲突整事务回滚；报案状态只落 REPORTED/CLOSED
              表达可否追加，赔付进度由赔案派生；追加赔案继承保单/计划/被保人/出险时间，请求体出现保单维度即 400；新增 POST
              /api/v1/claims/reports/{reportNo}/cases 与 GET
              /api/v1/claims/reports/{reportNo}；存量回填一条赔案一条报案（复用赔案
              id，report_no=RP+claim_no[2:]），迁移幂等 + 5
              条终态断言；前端详情页纠正赔案号标签并展示报案号与同案清单，追加入口复用报案页 ?reportNo=
              模式。取舍：否决内嵌字段、级联子集合、幂等键搬移、迁移内实现 Feistel、独立 Modal
              表单。风险：孤儿报案（同事务解决）、跨租户挂靠（应用层+终态断言）、发票唯一不可放松。Spec Patch：无。
