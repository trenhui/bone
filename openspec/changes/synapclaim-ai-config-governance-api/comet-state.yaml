                      @TenantScope + /*bone:tenant*/ 锚点 + @Version 乐观锁，禁 FOR
                      UPDATE；写 API 开关双闸门（服务端拒写 + 治理页读开关态渲染只读）；曝光/裁决回流复用并行会话在途
