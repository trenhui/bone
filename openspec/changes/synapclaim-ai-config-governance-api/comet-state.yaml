            proposal: 批 2 技术方案候选（待用户确认）：【方案 A 推荐】服务端只收紧棘轮：逐字段比较当前生效值，只接受相等或更严格，写入期拒绝放宽并留
              append-only 审计；写端点挂 /api/v1/claims/**，@PreAuthorize + SDK
              @TenantScope + /*bone:tenant*/ 锚点 + @Version 乐观锁，禁 FOR UPDATE；写
              API 开关双闸门（服务端拒写 + 治理页读开关态渲染只读）；曝光/裁决回流复用并行会话在途
              0124_synap_claim_ai_feedback_event.sql 与 AiFeedback*，不重复建表，租户内
              event_id 唯一键，同键同载荷返回首次结果、同键异载荷 409
              且不覆盖首次事实，事件不含姓名/证件/金额；端点不改案件状态、不写资金。【比较】方案 B 前端/网关做棘轮、后端只
              CRUD：直连即可绕过放宽，服务端无审计与幂等事实，采纳率分母不可信，不采用；方案 C 新建 t_ai_config_version
              事件溯源：与 t_feature_toggle 形成双真源触发「配了不生效」，且与 0124
              重复造轮子，不采用。【关键取舍】不新增业务表，代价是配置历史只有 append-only
              审计记录、无完整版本快照回放。【风险与处理】① 并行会话占用
              ClaimErrorCodes/ClaimErrors/AiFeedback* → 等入库后精确路径复核、绝不 git add
              全量；② 迁移号追加末尾空位，脚本+清单+bone-init.sql 同批，已发迁移含注释不回改；③ 新增错误码四处齐（错误码类 +
              HTTP 状态映射 + 前端双语包 + 台账 §6）；④ 新增仓储方法同批 SQL 模板，首行语句关键字、SELECT
              列对齐实体、含租户锚点；⑤ 前端雪花 ID 一律 string；⑥ 开关/配置先找消费方，缺则 fail-closed；⑦
              变异验证「放宽阈值被拒」必须转红。【测试策略】单元（棘轮逐字段/边界/相等、开关双态、幂等载荷摘要比对）；集成（无权限与跨租户被拒、409
              不覆盖首次事实、启动期无 TemplateNotFoundException、读回新值）；负向（放宽阈值、关闭写 API、盲标/非
              AI_ASSISTED 裁决）；变异；运行期证据写 docs/superpowers/reports/ 并带实测数值。【Spec
              Patch】无：不新增能力、不改公开行为与验收，范围严格来自已批准 proposal/spec/tasks 与 v2.3
              §13.5。【开工约束】用户裁定等并行会话入库 + 全量门禁转绿后才进 Build；本阶段只出设计文档，不写实现代码。
