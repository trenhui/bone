                ClaimErrorCodes/ClaimErrors/AiFeedback* → 等入库后精确路径复核、绝不 git add
                全量；② 迁移号追加末尾空位，脚本+清单+bone-init.sql 同批，已发迁移含注释不回改；③ 新增错误码四处齐（错误码类
                + HTTP 状态映射 + 前端双语包 + 台账 §6）；④ 新增仓储方法同批 SQL 模板，首行语句关键字、SELECT
                列对齐实体、含租户锚点；⑤ 前端雪花 ID 一律 string；⑥ 开关/配置先找消费方，缺则 fail-closed；⑦
                变异验证「放宽阈值被拒」必须转红。【测试策略】单元（棘轮逐字段/边界/相等、开关双态、幂等载荷摘要比对）；集成（无权限与跨租户被拒、409
                不覆盖首次事实、启动期无 TemplateNotFoundException、读回新值）；负向（放宽阈值、关闭写
                API、盲标/非 AI_ASSISTED 裁决）；变异；运行期证据写 docs/superpowers/reports/
                并带实测数值。【Spec Patch】无：不新增能力、不改公开行为与验收，范围严格来自已批准
                proposal/spec/tasks 与 v2.3 §13.5。【开工约束】用户裁定等并行会话入库 + 全量门禁转绿后才进
                Build；本阶段只出设计文档，不写实现代码。
