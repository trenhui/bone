                  事实表，不提供历史更新删除入口；代理区间唯一性用生成列 active_key=IF(区间生效,key,NULL) +
                  UNIQUE(tenant_id,active_key)（MySQL 无 partial unique
                  index），生成列不进实体，区间外不生效、重叠生效代理第二条被拒；打回写入期先查资金状态，已支付且无冲正事实 MUST
                  拒绝、不事后补偿，冲正后生成重办任务并留痕关联，资金流水保持 append-only 且三值口径
                  available=initial-claimed-frozen 不变，额度写用 REQUIRED 禁
                  REQUIRES_NEW；超时回池扫描复用既有 ScheduleLockService
                  不引入新调度框架，回池前置为任务仍处超时未领且归属未释放，配合 @Version
                  乐观锁保证重复扫描不产生第二条事实，监控计数按小时可观测，归属闸门与池级闸门不串联；抽检比例从全局 @Value 迁入
                  t_feature_toggle 并上屏，INSPECTION_ACTION 关闭时只登记不生效；DDL 文档一致性门禁用
                  finditer + 计数对账并先跑全仓正向审计，避免 package-info.java 类假红。【比较】方案 B
                  打回后异步补偿冲正：存在资金缺口窗口，违反 spec「MUST 先完成冲正」，不采用；方案 C 代理用应用层先查后写 +
                  分布式锁免生成列：并发双写窗口无法满足「同一时段至多一条生效代理」且项目禁 FOR
                  UPDATE，不采用。【关键取舍】多三张表与一次增量迁移换取可追溯事实与并发正确性；不引入新调度框架，代价是扫描幂等须由前置断言
                  + 乐观锁自证。【风险与处理】① 迁移号追加末尾空位、脚本+清单+bone-init.sql 同批、已发迁移含注释不回改；②
                  实体 @Column 与 information_schema 逐列求差、末尾强断言 +
                  SIGNAL（MESSAGE_TEXT ≤128 字符）；③ 新增仓储方法同批 SQL 模板，首行语句关键字、SELECT
                  列对齐、含租户锚点；④ 新错误码四处齐；⑤ 门禁误报比漏报更致命 → 正向审计 + 互补变异；⑥ 前端 ID 一律
                  string；⑦
                  不改资金三值口径与网关白名单。【测试策略】单元（区间外不生效、重叠代理被拒、扫描幂等、冲正闸门）；集成（information_schema
                  终态断言、启动期无
                  TemplateNotFoundException、历史转交更新被拒、资金流水含冲正事实、页面值=配置读回值）；变异（已支付未冲正被拒
                  / 重复扫描幂等两处判据必须转红）；运行期证据写 docs/superpowers/reports/。【Spec
                  Patch】无：不新增能力、不改公开行为与验收，范围严格来自已批准 proposal/spec/tasks 与 v2.3
                  §13.5。【开工约束】用户裁定等并行会话入库 + 全量门禁转绿后才进 Build；本阶段只出设计文档，不写实现代码。
