            proposal: 批 5 技术方案候选（待用户确认）：【方案 A 推荐】不推倒重来，沿用已落地的「只读上下文 → 仓储富化 → QLExpress
              求值」三段式架构，把 2026-11-07 已提交（320573ffa）的两条真实数据驱动风控维度正式纳入
              Design：`findByInsuredIdHash`
              取同租户同被保人历史案件，`priorClaimCount`/`recentClaims90d` 排除本案后注入 facts，规则集
              v3→v4 新增 R-FRAUD-22（重复索赔，risk=true，priority 27）与
              R-ANOM-03（近90天高频，risk=false，priority 54）。关键取舍：只接库内已有
              `insured_id_hash` 与 createdAt，零
              DDL、零新配置；黑名单比对、诊疗-费用合理性、社会关系网络需外部数据源，如实登记 gap，不伪造、不宣称
              L3。风险与处理：排除本案自身防止 100% 误报；异常 best-effort 降级不阻断主链路；版本 bump
              保证回放可区分；6 项单测 + 双向变异已实跑，M1/M2 各按预期转红并恢复绿。【方案 B
              不采用】另起图计算/外部黑名单服务：依赖外部数据与新基础设施，当前不可证伪且违反本轮零 DDL 边界。【方案 C
              不采用】把两条规则硬编码进领域聚合：破坏规则资产化与可回放口径，且 AI/规则不得碰钱（F1）。【测试策略】已落地 4
              新命中/未命中用例 + 2 既有补桩；门禁 `check.sh` 59/59、全量单测与变异证据在提交/verify
              阶段复核。【Spec Patch】无：不新增 capability，不改变公开验收，仅扩展 `claim/rule-engine`
              的富化变量与规则资产。若方案 A 获批，Build 配置建议沿用前四批：`executing-plans / tdd /
              thorough / subagent_dispatch=null`，隔离方式沿用当前绑定的
              dev（isolation=current）。
