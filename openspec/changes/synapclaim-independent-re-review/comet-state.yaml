                双人复核并列登记，状态机只加新边不改旧边，字典对账用例钉死三者共存互不覆盖；职责分离放写侧领域服务硬断言（初审人 !=
                独立复审人），命中即拒并返回可辨认错误码，不依赖 UI 隐藏且 RE_REVIEW 关闭时也不放宽；复审队列按
                claim:re-review:write 权限 + 批 1 t_claim_task 归属 + 租户隔离 +
                status=43 过滤，SQL 模板含 /*bone:tenant*/ 锚点且 SELECT
                列对齐实体；权限码在字典与网关前缀白名单同时登记，端点复用
                /api/v1/claims/**；新增错误码四处齐（ClaimErrorCodes +
                ClaimErrors.DEFAULT_HTTP_STATUS + 前端中英语言包 + 台账
                §6），缺任一处门禁判红；RE_REVIEW 关闭后无 43/46 新流转，44 与初审行为不变。【比较】方案 B 复用 44
                加「是否独立」标记位：违反 spec「MUST 并列、不得合并」，三状态无法并列查询且变异用例会判红，不采用；方案 C
                前端队列按人过滤 + 后端只做权限校验：跨租户/越权案件可枚举、职责分离可被直连绕过，不采用。【关键取舍】不新建任务表（复用批
                1），代价是队列强依赖批 1 归属字段已落地，两批必须按序开工。【风险与处理】① 状态字典与前端字典漂移 → 字典对账 +
                合并写法变异判红；② 错误码四处不齐导致类加载即抛 → 同批交付 + _check_error_code_i18n.py
                E1-E5；③ 权限码未登记网关导致整体 404 无后端日志 → 白名单与字典同批；④ 并行会话占用
                ClaimErrorCodes/ClaimErrors → 等入库；⑤ 新增仓储方法同批 SQL 模板；⑥ 前端 ID 一律
                string。【测试策略】单元（三状态并列、职责分离含开关关闭态、错误码 HTTP
                映射）；集成（无权限写入被拒、跨租户不可见、队列只出 43、关闭开关零流量且 44 可用、启动期不抛）；变异（合并写法 /
                同人自审两处判据必须转红）；运行期证据写 docs/superpowers/reports/。【Spec
                Patch】无：不新增能力、不改公开行为与验收，范围严格来自已批准 proposal/spec/tasks 与 v2.3
                §13.5。【开工约束】用户裁定等并行会话入库 + 全量门禁转绿后才进 Build；本阶段只出设计文档，不写实现代码。
