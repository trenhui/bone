        value:
          handoffContext: openspec/changes/procurement-transaction-pr-po-slice/.comet/handoff/design-context.json
          handoffHash: a73e59ee1a4108113aa2ba4da8ea986416fa6b5a411e7ba6c33a0fe40f46190d
          proposal: |-
            采购交易 PR+PO 切片技术方案（详见 design.md）：

            **结构与边界**：bone-apps/bone-procurement（pom 聚合器）+ bone-procurement-app（薄应用壳：仅 ProcurementApplication/配置/能力开关，装配口径对齐 ClaimApplication）+ bone-procurement-transaction（PR/PO 四层业务代码）。备选对比：全塞 app（synap-claim 原样）因采购 8 上下文会成巨型模块、无法平级追加 sourcing/fulfillment 而否决；一次建 9 模块因'为不存在的边界付复杂度'（PA-08）否决。

            **依赖方向**：transaction → bone-masterdata 仅经 VendorQueryPort 端口与投影 DTO；adapter 实现在 transaction 侧（放 masterdata 侧会使主数据反向依赖交易，否决）。

            **金额与不变量**：Money(BigDecimal,currency)，scale=4 HALF_UP，按行舍入后再求和；po_amount=Σline_amount 在 domain 强一致。

            **状态机**：显式迁移表 Map<Status,Map<Event,Transition>>，未列出即拒绝；PR DRAFT→SUBMITTED→APPROVED→CONVERTED/CANCELLED；PO DRAFT→SUBMITTED→APPROVED→SENT/CANCELLED（ACKNOWLEDGED 等保留枚举供 05 履约）。

            **快照**：t_proc_price_snapshot 只追加不可变，computed_hash=SHA256(poNo+version+逐行净价/数量/金额+税额+币种+fxAsOf+roundingMode+taxCodeVersion)，同版本已存在则复用不重写。

            **幂等与并发**：@Version CAS + 业务唯一键（convert 以 PR 状态迁出唯一、send 以同版本快照存在即复用），不引入分布式幂等组件（PA-08 单库）。

            **持久化**：metadata-sdk @Table/@Column，审计列 java.util.Date；bone-init.sql 首次引入 4 张 t_proc_* 表。

            **前端**：暂放 bone-masterdata-app，沿用上一轮三层范式（types/services 含 total 归一化/pages 纯逻辑/组件测试）。

            **风险与取舍**：① 快照不含 PriceCondition 条件引擎 ⇒ INV-07/08/09 与 M4-4/M4-8 条件部分不在本期验收，报告中显式声明；② 预算占用为占位（L19 待决），不得表述为已实现；③ 供应商模块仍在 bone-masterdata 不符 §4.2，记偏差后续独立 change 偿还；④ 前端暂与主数据应用同包，属阶段性妥协；⑤ 单号靠取最大值+1 与唯一约束重试（上限 3 次），热点出现再引入序列表。

            **迁移与回滚**：新模块只加 module 不改既有启动链；DDL 只新增不改既有表；开关 bone.procurement.transaction.enabled 默认 false，置 false 即停止暴露端点。

            **Spec Patch**：无。现有 3 个 delta spec 已覆盖 PR/PO/控制台行为，本轮设计未发现需回改需求之处。
