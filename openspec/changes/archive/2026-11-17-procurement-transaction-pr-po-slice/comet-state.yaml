              handoffContext: openspec/changes/procurement-transaction-pr-po-slice/.comet/handoff/design-context.json
              handoffHash: 78a912af9f26cffec64d02c83f4270d43cb688350262f8953676861721a8503f
              proposal: |-
                采购交易 PR+PO 切片技术方案（修订 2，权威载体 openspec/changes/procurement-transaction-pr-po-slice/design.md）。

                【结构与边界】D1/D2：bone-apps/bone-procurement（pom 聚合器）→ bone-procurement-app（薄壳：ProcurementApplication + application.yml + 能力开关 + 装配测试）+ bone-procurement-transaction（PR/PO 四层业务代码，包 com.bone.procurement.transaction）。照搬 synap-claim 把业务塞进 app 不可行，因采购有 8 个上下文（总体架构 §4.2），平级扩展会变巨型模块。依赖方向 app → transaction → bone-masterdata（仅端口与 DTO），不反向依赖 bone-app-purchase。VendorQueryPort 定义在 transaction 侧 domain/port，适配器在 transaction 的 infrastructure 注入 SupplierApplicationService，把 SupplierStateDTO 投影为 VendorSnapshot；放 masterdata 侧会反向依赖，已否决。

                【金额与不变量】D3：Money(BigDecimal amount, String currency)，scale=4 + HALF_UP，跨币种运算抛异常；行金额按行舍入后再汇总，避免 po_amount 与 Σline_amount 漂移。

                【状态机】D4：显式 Map<Status, Map<Event, Transition>>，未列出即拒绝。PR：DRAFT→SUBMITTED→APPROVED→CONVERTED，CANCELLED 终态。PO：DRAFT→SUBMITTED→APPROVED→SENT；ACKNOWLEDGED/PARTIAL_RECEIVED/FULLY_RECEIVED/CLOSED 保留枚举供 05 履约，本期不提供推进入口。非法迁移统一 409 invalid_transition，错误体带 currentState/attempted/allowed[]。

                【幂等与并发】D5：聚合带 @Version，状态迁移与版本 CAS 同事务，冲突 409。convert 以 PR 从 APPROVED 迁出为唯一性保证；send 以「同版本快照已存在则复用」为幂等依据。PA-08 单库不引入分布式幂等组件。

                【价格快照】D6：t_proc_price_snapshot 只追加不可变，一行对应 (tenant_id, po_no, po_version)，含逐行净价 JSON、税额、币种、fx_rate/fx_as_of/fx_source、rounding_mode、tax_code_version、computed_hash（SHA-256 规范化串）、computed_at。po_version 取下达时 t_proc_po.version 的值，不新增独立业务修订列。本期简化：净价直接取订单行净价，不经 PriceCondition，INV-07/08/09 与 M4-4/M4-8 的条件引擎部分不在本期验收范围。

                【持久化】D7（本次修订点）：4 张表 t_proc_requisition / t_proc_po / t_proc_po_line / t_proc_price_snapshot，均含 id、tenant_id、审计四列 DATETIME(3) UTC、deleted、version；金额 DECIMAL(19,4)+currency CHAR(3)，数量 DECIMAL(19,6)。唯一键修正为：t_proc_requisition uk(tenant_id,pr_no)；t_proc_po uk(tenant_id,po_no)（PO 主表不带 po_version）；t_proc_po_line uk(tenant_id,po_id,line_no)；t_proc_price_snapshot uk(tenant_id,po_no,po_version)。上一版把 uk(tenant_id,po_no,po_version) 同时写在 PO 主表与快照表，属自相矛盾（PO 主表无业务修订列），已更正。索引 idx(tenant_id,org_id,status)、idx(tenant_id,vendor_id,status)。

                【单号与开关】D8：PR-{yyyy}-{6 位} / PO-{yyyy}-{6 位}，按 (tenant_id,类型,年份) 取最大值 +1，唯一约束兜底，冲突重试 ≤3 次。D9：bone.procurement.transaction.enabled 默认 false，关闭时两个 Controller 不注册。

                【前端】D10：暂落 bone-masterdata-app，沿用已建立三层范式（types/purchase.ts 白名单投影、services/purchaseApi.ts 含分页归一化、pages/purchaseView.ts 纯逻辑 node 可测、PurchaseConsole.tsx + 组件测试）。代价：与主数据同包属边界妥协，02/05/06 前端扩张时应拆独立子应用。

                【风险与取舍 5 项】① 供应商模块包名 com.bone.masterdata 不符 §4.2，本期不搬迁、报告记偏差；② 快照不含条件引擎，31401 与 INV-09 条件部分本期无法验收；③ 预算为占位（只记 budget_ref），L19 待决；④ 单号靠取最大值+1+唯一约束重试，高并发多次重试，超限返回可读错误不静默失败；⑤ bone-init.sql 首次引入 t_proc_*，DDL 列与 SDK @Column 必须逐列对齐，以对账测试兜底。

                【迁移与回滚】聚合器加 module；bone-init.sql 只新增不改既有表；开关默认 false 故未开启环境无行为变化；回滚将开关置 false 即停止暴露端点。

                【Spec Patch】无。OpenSpec specs 与 tasks 不变，仅 design.md 的 D7 唯一键定义与 D6 补充 po_version 来源说明。
