            处硬编码清单 + 2 个 migration SQL；供应商治理页 7 文件从 masterdata-app 迁入；交易控制台 404
            空态/403 只读/失败保留字段/迁移不本地推进状态。【取舍】仅冻结行净价快照，不做 PriceCondition
            条件引擎；预算占用为占位；单库本地事务，不引入 Outbox/MQ/Saga；供应商后端模块仍在
            bone-masterdata（命名偏差如实记录）。【风险与兜底】菜单白屏以 shell
            四注册+菜单可达性探针兜底；供应商页迁移以组件测试全绿兜底；金额精度/跨币种/终态回写由领域不变量+负向探针 M4-1/2/5/6/10
            兜底；DDL↔实体列对账测试防漏列。【本轮唯一增量】design.md 一行端点计数 6→7（非行为变化，行为已由批准 spec
            覆盖），其余与已批准设计一致。
