              handoffHash: 61c9ea6ed4f421e9a2639f8355e8193670be8093fcb38e45efacca298cb39d28
              proposal: |-
                # Brainstorm Summary — procuraai-production-hardening

                - Change: procuraai-production-hardening
                - Date: 2026-11-20
                - Phase: design
                - 状态：候选方案（用户已确认范围与授权边界；以下 T1–T7 为 Agent 技术判断，随 Design Wait 一并确认）

                ## 一、已由用户确认的裁决（不可再作为开放问题）

                1. **范围**：单 change「生产化加固」，不拆 PRD。目标是 9 个 InMemory 仓储/端口改持久化、6 张 init-only 表、跨租户唯一约束、总闸即时生效、门禁三入口与注入反证。
                2. **授权边界**：允许触碰 DDL/init 脚本与 CI/门禁常量；真模型接入与评测集状态/下界虽已获触碰授权，但列为**本轮非目标**，不伪造效果、标注或转正状态。
                3. **工作区**：沿用当前 `dev` 目录，不建分支/Worktree；未跟踪的 `openspec/changes/synapclaim-architecture-convergence/` 保持不动。
                4. **Open 产物**：change 名称、proposal、6 条 Requirement 的规格、设计与 17 项任务已获用户确认（approval hash `c78651af6a6e0efe929716c68ec1e8e62fd31d410cc9aa154706090da3df7bed`）。

                ## 二、候选技术方案（Agent 判断）

                ### T1 — 全量切 SDK 持久化（方案 A）
                A 类（sourcing/qualification/risk）实体与 DDL 已就绪，只需扩充 `@EnableSqlRepositories` 扫描包并移除同接口内存 bean；B 类（contract/governance）新增实体 + SDK 仓储 + 端口 Adapter。备选方案 B「只切 A 类」无法满足规格中的跨租户隔离与审计不可变；方案 C「手写 JDBC」违反 HC-001。选择 A。

                ### T2 — 6 张 init-only 表，不建增量迁移
                沿用采购域既有 8 必备列、`uk_` 租户打头与 `idx_` 约定；在 `bone-init.sql` 内 `DROP TABLE IF EXISTS` + `CREATE`，`数据库开发规范.md` 表数 15 → 21。真实 MySQL DDL 执行明确转 L3，本轮不执行。

                ### T3 — 跨租户双防线
                服务端生成 `review_id`（不接受请求自报）+ `(tenant_id, review_id)` 唯一约束。单独服务端生成不能防同租户重复键覆写；单独唯一约束仍可能让越权键进入异常路径。两者并用后读侧也无法命中他人记录。

                ### T4 — 总闸无缓存
                `GlobalKillSwitchStore` 持久化 Adapter 每次裁决读最新行；缺登录态操作人写入 fail-closed。备选「短 TTL 缓存」不满足「切换后下一次裁决立即生效」规格。

                ### T5 — 复杂事实 JSON 列 + 原文禁入
                审查明细、追溯、AI 建议与人工终决分字段；只存结构化摘要、引用与 hash，`output` 原文入口扫描后即丢弃。实体与领域 record 分离，Adapter 负责映射，不给领域类加持久化注解。

                ### T6 — 新增两个门禁判据并同步三入口
                `persistenceGate` / `persistenceProbe` 显式注册到 `tools/check_procura_alignment.py` 常量与 `_cmd_key()`；`ci.yml`、`scripts/check.sh` G0、`check-procura-ci.sh` 同步命令；补注入必红探针与正例对照；开发期 `--sync-manifest` 同步证据清单。备选「塞进 docGate」会绕过集合机器比对，形成假绿，不采用。

                ### T7 — 验证策略
                A 类靠既有 DDL 对账测试；B 类补实体映射、端口契约、负向测试；最后跑 Maven 全量（含 ArchUnit E-5.4）、对齐主判据 + self-test、evalset 零漂移、前端 tsc/eslint(json)/vitest。CLI 绿只证明结构与隔离，不等于 AI 可上线。

                ## 三、风险与失败路径

                - 同接口双 bean 启动失败 → 条件化或移除内存实现；ApplicationContextRunner 断言每端口唯一。
                - E-5.4 转红 → 写操作放 Adapter，不在 application 直调 `*Repository.save*`；必要时 `@NoDomainEvent` 显式豁免。
                - DDL 未在真实 MySQL 执行 → 只做静态对账；真实库验收转 L3，不伪造。
                - JSON 映射漂移 → 每类事实往返测试；字段新增同步 Adapter 与测试。
                - 门禁清单漂移 → `--sync-manifest` 一次性同步 + 注入必红/正例不误杀双验。
                - 范围外文件误改 → 精确 add 本 change 与实现文件，不碰用户未跟踪 change。

                ## 四、Spec Patch

                无。规格 Open 阶段已确认，候选方案未改变外部行为或验收，不需要修改 delta spec；若后续需要改规格，必须先说明具体补丁并取得用户同意。

                ## 五、仍需用户在 Design Wait 确认

                方案 A + T1–T7 及风险缓解是否作为正式技术设计。确认后写入唯一 Design Doc（`openspec/changes/procuraai-production-hardening/design.md`）并进入 Build 配置确认。
