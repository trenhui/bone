          ### T7 — 验证策略

          A 类靠既有 DDL 对账测试；B 类补实体映射、端口契约、负向测试；最后跑 Maven 全量（含 ArchUnit
          E-5.4）、对齐主判据 + self-test、evalset 零漂移、前端 tsc/eslint(json)/vitest。CLI
          绿只证明结构与隔离，不等于 AI 可上线。


          ## 三、风险与失败路径


          - 同接口双 bean 启动失败 → 条件化或移除内存实现；ApplicationContextRunner 断言每端口唯一。

          - E-5.4 转红 → 写操作放 Adapter，不在 application 直调 `*Repository.save*`；必要时
          `@NoDomainEvent` 显式豁免。

          - DDL 未在真实 MySQL 执行 → 只做静态对账；真实库验收转 L3，不伪造。

          - JSON 映射漂移 → 每类事实往返测试；字段新增同步 Adapter 与测试。

          - 门禁清单漂移 → `--sync-manifest` 一次性同步 + 注入必红/正例不误杀双验。

          - 范围外文件误改 → 精确 add 本 change 与实现文件，不碰用户未跟踪 change。


          ## 四、Spec Patch


          无。规格 Open 阶段已确认，候选方案未改变外部行为或验收，不需要修改 delta
          spec；若后续需要改规格，必须先说明具体补丁并取得用户同意。


          ## 五、仍需用户在 Design Wait 确认


          方案 A + T1–T7 及风险缓解是否作为正式技术设计。确认后写入唯一 Design
          Doc（`openspec/changes/procuraai-production-hardening/design.md`）并进入
          Build 配置确认。
