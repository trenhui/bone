            proposal: 工程证据底座：为 synapClaim 的 fail-closed 安全姿态建立可机检、可变异证伪的只读证据视图。四个关键取舍：(1)
              证据视图只读，ai-native-readiness 12 项门禁判据不放宽，冲突取更保守值，防第二配置源与绕过双签；(2)
              不可达维度（区域/医保/药品/诊疗）在既有 LimitedConditions 入口显式拒绝并返回稳定原因码，不新增
              DDL、不碰金额；(3) provider 缺失 fail-fast、决策保持 MANUAL_REQUIRED，复用
              AiRuntimeHealthLocator 口径、桩不冒充模型；(4) MANUAL_REQUIRED 决策轨迹补充可查询
              fail-closed 原因码，不改节点拓扑与决策结果。风险缓解：优先复用既有错误码避免三处齐备问题；每项判据配变异验证；无
              provider 的 E2E 负向钉子验证主链仍走 MANUAL_REQUIRED。无 Spec Patch，范围与 Open
              产物一致，无开放问题。
            requirementsEvidence:
              contentHash: 0cc95f19d04f3801ef28e1a758bf38074fd9f86ae3598d5da3afc7ef19468476
