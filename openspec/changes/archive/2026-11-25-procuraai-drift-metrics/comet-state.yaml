            proposal: 采纳方案 A：领域纯函数裁决（DriftVerdict 三态 + DriftThresholds + DriftSignal +
              DriftSignalPolicy），计数复用现有 tracePort/ledger 真实计数不新增端口不落库，阈值由调用方配置缺省
              UNDETERMINED，只读端点复用 procurement:ai-governance:read
              权限。关键取舍：样本数来自追溯事件偏保守不会误报触阈；不硬编码 owner 通过线；不改 DDL/CI
              判据/evalset。风险：追溯留痕不完整会低估样本（偏保守）；阈值缺省不可判定是刻意诚实。无 Spec Patch，spec 与
              design 与 Open 一致。
