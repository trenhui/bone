      - id: procuraai-readiness-linkage:47
        stepId: full.design.confirm
        sequence: 47
        status: resolved
        proposal:
          input:
            change: procuraai-readiness-linkage
            changeDir: openspec/changes/procuraai-readiness-linkage
            workspaceBaseline:
              ref: b61008f6-a29c-412d-96b6-8ebcaf23f6a5
          outputs:
            full.design.handoff:
              handoffContext: openspec/changes/procuraai-readiness-linkage/.comet/handoff/design-context.json
              handoffHash: 7b78886539e89990a9049a824d3c90c153a965692a6d8890f1a3637dd3497d74
              proposal: 候选方案：1) 装配一致性——AdvisoryController/AdvisoryApplicationService 与治理 Bean
                同用 @ConditionalOnAiGovernanceEnabled，双态 ApplicationContextRunner
                探针；否决无条件装配治理 Bean（破坏关闭即无 AI）与 ObjectProvider 兜底（掩盖错误）。2) Mock
                降级——ContractReviewPortAdapter.review() 在 gateway.invoke() 后识别
                mock 身份，追加 MOCK_PROVIDER_REJECTED trace 并复用现有
                degrade()（UNKNOWN+强制人工），不在网关全局拒绝。3) readiness 端点——新增只读
                AiReadinessApplicationService 聚合 provider 配置/能力注册/总闸/评测四态，判词
                AVAILABLE/DEGRADED/UNKNOWN，未知
                fail-closed，响应分离部署门禁与授标/放款许可，前端未知码原样显示。4) OCR
                人工复核——Qualification 实体加幂等 reviewByHuman，服务 findById→领域方法→save 替换
                UnsupportedOperationException，新增 Controller，不改 DDL，完整复核台账留
                backlog。5) 前端三页
                AiReadiness/HumanReviewConsole/GovernanceStatus，复用现有
                services/useMessage，失败显示无法确认、AI 建议不渲染为已生效。6)
                验收分机器/运行/数据三层，真实启动后端+前端并用浏览器完成端到端，写操作以落库为第二证据。风险：默认关闭 advisory
                前端入口不可达→readiness 页常驻解释；本地 MySQL 需密码→优先内存/H2 test profile
                不改生产库；readiness 读 evalset 只读失败即 UNKNOWN 不写文档族；新增权限点需 owner
                登记则报告列遗留不阻塞联调。无 Spec Patch：行为已由 Open 两份 delta spec 覆盖。
              requirementsEvidence:
