            proposal: 候选技术方案（源码实证，随本次 Design Wait 请确认）：T1 onboarding approve 复用已注入的
              ReviewIdentityPort（QualificationController:86-92 当前仍自报
              request.tenantId/operator，同文件 reviewOcr:81-82
              已是登录态基线），请求体同名字段仅做一致性校验，冲突/匿名/缺租户 fail-closed 不落库。T2 sourcing
              新增本域只读 AwardIdentityPort，基础设施从 SecurityContextHolder+JwtPrincipal
              解析，避免跨域依赖 qualification（备选直接复用会泄漏准入域概念，不采用）。T3 授标端点按 OpenAPI 已登记的
              POST /api/v1/procurement/rfx/{rfxNo}/award，经 findRfxByNo 取
              projectId 再 tenant 锚定定位项目，新增只读 findProjectByRfxNo 到仓储端口；不存在/不对应
              400 状态不变（用 projectNo 路径会触发 A8 契约漂移，不采用）。T4 请求体不带
              confirmed_by，OpenAPI 文案同步为确认人来自登录态，状态码集合不变（403/400/409）。T5 不新增
              DDL/表/列/迁移，复用现有
              Repository。取舍：新增一个本域身份端口与一个只读仓储查询，换取限界上下文边界与可审计身份链。风险与失败路径：同步更新匿名/请求体
              operator 的既有测试夹具并保留负向场景；rfxNo→project 映射缺失用只读定位单测+400 覆盖；OpenAPI
              口径同 change 内同步不动判据。验证：具名授标/准入正向 + 冒名/匿名/跨租户/空白操作人/非对应项目/AI
              直接授标负向均不落库；qualification+sourcing 全量测试、前端
              tsc/vitest/eslint(json)、procuraAI 对齐/evalset/AsyncAPI/persistence
              门禁。Spec Patch：无，Open 阶段规格已确认，方案不改外部行为与验收。
