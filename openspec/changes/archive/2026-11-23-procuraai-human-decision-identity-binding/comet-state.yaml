                  到仓储端口；不存在/不对应 400 状态不变（用 projectNo 路径会触发 A8 契约漂移，不采用）。T4 请求体不带
                  confirmed_by，OpenAPI 文案同步为确认人来自登录态，状态码集合不变（403/400/409）。T5 不新增
                  DDL/表/列/迁移，复用现有
                  Repository。取舍：新增一个本域身份端口与一个只读仓储查询，换取限界上下文边界与可审计身份链。风险与失败路径：同步更新匿名/请求体
                  operator 的既有测试夹具并保留负向场景；rfxNo→project 映射缺失用只读定位单测+400
