              proposal: >-
                供应商治理前端 + 真实联调方案（承接已确认 Open 产物，无 Spec Patch）：


                【方案】复用 bone-masterdata-app 既有 apiClient/normalizePage 范式，新增
                supplierApi.ts 封装后端 5 端点，新增 SupplierManagement
                页面分区呈现双角色状态与迁移历史；前端只做"允许事件展示"，所有守卫裁决仍在后端；以 success/message
                顶层字段判成败，404/403 可观察降级，PII 白名单过滤、未知码原样呈现。


                【关键取舍】① 不新建采购子应用（避免 qiankun 注册/端口成本）；②
                不在前端复制状态机规则表（避免与后端迁移表分叉，沿用 A-10 权衡）；③ 联调证据 = 前端契约测试 + 后端完整
                Spring Boot HTTP 测试(SupplierHttpIntegrationTest) +
                前端渲染测试三层交叉，不宣称浏览器跨网直连生产（需 R-2 前置）；④ 能力开关默认关闭时前端显示"未启用"空态，是正确
                fail-closed 呈现。


                【风险】能力未启用呈现为不可用（正确行为）；事件按钮是只读投影可能与后端允许集合略有差异（以后端拒绝信息为准）；PII
                若后端误加前端白名单兜底。均有测试锁定。


                【测试策略】vitest 契约测试锁请求/响应形状；Testing Library
                覆盖双状态/未知码/失败降级/PII/分页归一；后端 clean test +
                SupplierHttpIntegrationTest 复验全链路；tsc + eslint(json,查
                errorCount) 门禁。


                设计文档 design.md 已在 Open 阶段产出并通过 OpenSpec 校验，正文与提案一致，仅按要求补
                frontmatter。无新增范围、无红线变更。
