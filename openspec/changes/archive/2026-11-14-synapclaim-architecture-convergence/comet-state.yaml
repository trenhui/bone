                契约、依赖边界机检；阶段 D 人工窗口（M2 责任要素 DDL、D4 物理包重构、05 契约 node_type
                枚举扩展、FraudScreen 真实接入）。关键取舍：一是不伪造 7 步节点，canonical 五节点保持唯一真源，落地版
                7.3 改写为现状加待评审扩展阶段；用户 Q3 要求强制全做，但 L4 项 AI
                不得执行，本轮另产出可直接进入评审的人工窗口执行包。二是脚本沙箱不用 JVM 全局 SecurityManager，不引
