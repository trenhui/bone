              并加回退开关）；阶段 C 纯函数内核迁 adjustment-engine、synap-claim-sdk 落纯 Java
              契约、依赖边界机检；阶段 D 人工窗口（M2 责任要素 DDL、D4 物理包重构、05 契约 node_type
              枚举扩展、FraudScreen 真实接入）。关键取舍：一是不伪造 7 步节点，canonical 五节点保持唯一真源，落地版
              7.3 改写为现状加待评审扩展阶段；用户 Q3 要求强制全做，但 L4 项 AI
              不得执行，本轮另产出可直接进入评审的人工窗口执行包。二是脚本沙箱不用 JVM 全局 SecurityManager，不引
              Aviator。三是复用双轨对拍、缺口哨兵、变异鉴别三轨锁金额等价，oracle 不并入生产。四是 D4
              用逻辑映射加门禁而非物理移动 500 余个 Java 文件。风险：L4 架构师审批与 R1-R8
              未拍板、文档目标态定义不自洽、并发提交者混入、全仓门禁基线、全量提交含他人增量。验证：1290 例单测零失败、12
              道提交门禁、文档机检 19 步、错误码 52 对 52 与双语覆盖、clean test 核对提交树。Spec Patch：无，三份
              delta spec 与 proposal 一致，不改动需求。
