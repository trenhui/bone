      - sequence: 6
        value:
          choice: approved
          proposal:
            input:
              change: procurement-supplier-mdm-slice
              changeDir: openspec/changes/procurement-supplier-mdm-slice
              workspaceBaseline:
                ref: 9872e244-56c8-462b-93a5-a7e5006166a7
            outputs:
              full.design.handoff:
                handoffContext: openspec/changes/procurement-supplier-mdm-slice/.comet/handoff/design-context.json
                handoffHash: e2ddd28ccc090b0c8683c281038ecbc1f4fd123c8d94403703c97f7c46e050b4
                proposal: |-
                  【方案】在 bone-masterdata 内以 DDD 分层落地采购域供应商主数据最小可验证切片：LegalEntity（身份载体）+ Supplier（合作资格）+ Vendor（交易与付款资格）双角色双状态机 + SupplyRelationship/SupplierItem（Purchasing Org data），复用既有 Golden Record 内核（GoldenRecordMerger / EntityKeyMappingRegistry）做合并与身份解析，域端口 + 内存适配，能力开关 bone.procurement.supplier-mdm.enabled 默认关闭。

                  D1 落地宿主：不新建 Maven 模块，在 com.bone.masterdata 下新增供应商域包。理由：Golden Record 内核在同进程可直调，新建模块引入跨模块依赖（L2）且同样绕不开 DDL 红线。
                  D2 角色语义严格对齐 LLD 真源（Design 阶段修正）：Supplier=合作资格（寻源/准入/绩效/风险/退出），Vendor=财务侧 Company Code data（银行/税务/付款条件/付款冻结）；依据 01-供应商主数据模块详细设计.md:22、采购领域架构设计方案.md:109,223。SupplyRelationship 为独立聚合根，Owner=采购。
                  D3 身份与合并：只调用既有内核，不新增任何 dedup/merge 服务（终局分工要求业务域不另建黄金记录）。
                  D4 持久化：SupplierRepositoryPort + 内存实现；生产 JDBC adapter 与 t_proc_* DDL 属 R-2 红线，不在本切片。
                  D5 双状态机均用「枚举 + Map<State, Map<Event, Transition>>」显式迁移表，守卫集中 domain，未列出即拒绝（fail-closed），非法迁移抛 DomainException 携带 current_state/attempted/allowed[]。
                    Supplier: PROSPECT → ONBOARDING → ACTIVE ⇄ SUSPENDED / CORRECTIVE → EXITED
                    Vendor: PENDING_VENDOR → ACTIVE_VENDOR ⇄ PAYMENT_BLOCKED → INACTIVE_VENDOR
                    禁止：EXITED→任意（终态不可回写）；INACTIVE_VENDOR→ACTIVE_VENDOR 须重走闸门；PENDING_VENDOR→ACTIVE_VENDOR 未经闸门一律拒绝。
                  D6 跨域 Guard 用可注入布尔断言端口 SupplierExitGuard / VendorActivationGuard，不写死 true、不伪造通过（否则 spec 的「退出前置校验」Scenario 变假绿）。
                  D7 PAYMENT_BLOCKED 的「本域不可自发放行」用命令来源校验：只接受声明为外部财务事件的来源，域内来源一律拒绝。

                  【关键取舍】内存适配换可运行闭环（不宣称生产落库能力）；跨域事实用端口换可负向注入（不宣称已接上游）；同进程复用内核换零依赖变更（接受耦合，物理拆模块时改显式依赖即可）。

                  【风险】内存适配≠生产持久化（R-2 前置）；跨域 Guard 可能被误读为已接上游；PAYMENT_BLOCKED 无 Finance 上游，只验证 fail-closed 语义；Design 阶段修正了 Open 时的角色语义（旧 spec 断言不得作验收依据）；能力默认关闭导致「看不见」（测试显式开启 + 负向探针验证关闭不注册端点）。

                  【Spec Patch 已落地，待本次批准绑定】P1 角色分离语义按 LLD 纠正（Supplier/Vendor 不得互为替代，各持互不覆盖状态机）；P2 原「供应商准入生命周期状态机」拆为 Supplier 状态机 + 新增 Vendor 交易与付款资格状态机两个 Requirement；P3 非法迁移/终态回写/未经闸门开通/退出前置校验全部落为可测 Scenario。tasks.md 同步为 15 项（1.1 双角色互不覆盖、1.2 SupplyRelationship 独立聚合、2.2 Supplier 机、2.3 Vendor 机、5.2 六类负向探针）。

                  【Non-Goals】不写 bone-init.sql / t_proc_* DDL；不实现 JDBC adapter；不做其余 8 个采购模块；不修改既有 Golden Record 内核；不接真实 Finance/PO/合同上游；不碰 CI 三入口与生产库/密钥/发布。
                requirementsEvidence:
                  contentHash: 6468c2e1fd911e65fe882de27f8ea6063aad0d00086f2af552a8714ffd60e84b
