                FULL_GATE_KEYS。关键取舍：进程内事件闭环先跑通，生产 MQ/Outbox 属
                L3；能力开关默认关闭。风险与边界：审查修复后补充两处诚实口径——D3 明确进程内直连不等于生产事件能力，D6 明确
