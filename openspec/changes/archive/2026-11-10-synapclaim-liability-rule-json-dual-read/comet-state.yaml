      - id: synapclaim-liability-rule-json-dual-read:6
        stepId: full.design.confirm
        sequence: 6
        status: resolved
        proposal:
          input:
            change: synapclaim-liability-rule-json-dual-read
            changeDir: openspec/changes/synapclaim-liability-rule-json-dual-read
            workspaceBaseline:
              ref: fb8f6555-a1ac-4187-9cf4-82d1e87e3252
          outputs:
            full.design.handoff:
              handoffContext: openspec/changes/synapclaim-liability-rule-json-dual-read/.comet/handoff/design-context.json
              handoffHash: eb99f5ef58d56ce5abb5b59e076556ba632542a676c35b387a5ad9af746a63f3
              proposal: |-
                【方案】采纳候选 A：domain 值对象 LiabilityRuleJson 新增纯函数 resolve(key, scalar) 做按键回落；LiabilityRule.fromLegacy 增接收 JSON 的重载并复用同一 build 链；application 增读开关 bone.claim.liability.rule-json-read.enabled 默认 false，以模式值参数传入 domain；DUAL_READ 下同时算旧标量路径与回落路径，差异只写结构化日志与计数（责任 ID/版本/差异键/两侧数值），返回金额始终取旧路径。无 DDL、无迁移、无存量回填。
                【关键取舍】对比 B（application 预解析透传三值）与 C（直接切主+历史回填）：B 结构上做不到——Adjustment.apply() 在 domain，读路径不经过 application，且会拆出第二条参数通道；C 会改赔付金额、需回填且无差异证据，已被用户范围决策排除。A 的代价是一个重载 + 一个模式参数 + 一组比对用例，换来零行为变更、装配点唯一、二进制可自动回滚。等价判据用 BigDecimal.compareTo 而非字符串（② 实测 MySQL 把 90.00 规范化为 90.0 并重排键序）。
                【风险与验证】整列判断丢键 → 只配 1 键反例 + 改整列判断变异必红；B 类键被当 0 或拒绝 → 单 B 类键反例 + 历史 NULL 行逐笔等价；开关引入新失败模式 → 注入差异仍返回旧金额且必产日志、删比对实现必转红；误报 → 90.00/90.0 判等不误报、90/80 必报差异；改签名波及夹具 → 保留 12 参数原签名，mvn -o -am test 全绿 + 架构测试 28 例。
                【L3 结论】engine_version 源码读取点为 0 ⇒ 不落实体/DDL，台账登记触发条件与复核命令；本地无 org/pitest 制品、mvn -o 不可解析 ⇒ 不接 pom/check.sh/allowlist，登记触发条件（CI 联网 + 路由开关生产启用评审前）。均不制造孤儿字段或假绿门禁。
                【O-06】按用户裁定把闸门触发条件收窄为「与 mapping 有交集的配置面改造开工前」，原条文/日期/理由/复核命令留痕；5 个硬缺口与 liability_rule_json 读路径零代码与数据交集。
                【Spec Patch】无。capability spec 的 6 条需求 18 个场景已覆盖全部行为，本轮只定实现方式；文档措辞更正（§9.1.1 ③ 的 RuleJsonCodec.resolve() → domain 归属）属实现归属更正，不是验收变化。
                【Design Doc】沿用唯一 openspec/changes/synapclaim-liability-rule-json-dual-read/design.md，已补 frontmatter 与候选方案对比章节，D1–D7 与 specs 对齐。
