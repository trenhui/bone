            proposal: |-
              Design 提案（方案已在 Open 产物确认时批准，无 Spec Patch）：
              【方案】①领域纯函数裁决：OversightVerdict 三态 + OversightThresholds（缺省未配置、fail-closed）+ OversightSignal（claimsModelHealthy=false）+ OversightSignalPolicy；②数据来自既有人工终决台账只读扩展 HumanDecisionLedger.findByCapability()，SDK adapter 复用 query()，退役内存实现同步签名，不新增 DDL/表/仓储；③阈值服务端配置、缺省未配置，Controller 只接受路径参数 code，不接受客户端注入；④只读端点 GET /capabilities/{code}/oversight 复用 procurement:ai-governance:read 与 ApiResponse/OversightMetricsView(modelHealthClaim=NONE)；⑤三类风险优先于比率：无理由推翻/未回流评测任一存在即 REVIEW_REQUIRED，耗时过短按 owner 比例阈值触阈，未触阈不构成背书，任何判词不自动改能力状态、不替代人工终决。
              【关键取舍】应用服务内联判断→否（不可独立负向探针/变异测试）；新增独立仓储/聚合表→否（超范围+双写+DDL）；客户端传阈值→否（owner 通过线不可注入，上一轮 I1 同类问题已修复）。
              【风险】推翻理由含 PII→只统计是否为空、不回传原文；findByCapability 大租户全量 load→本期低频只读治理端点不进主链路；退役内存实现接口不同步→同批改签名编译期发现；比率边界→明确 >= 触阈并加边界测试。
              【Spec Patch】无。候选方案与已批准 delta spec 一致。
