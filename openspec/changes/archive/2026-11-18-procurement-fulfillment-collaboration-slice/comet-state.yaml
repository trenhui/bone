              proposal: 技术方案（基于已确认的 LLD 05 卷 v0.3 与 Open 产物，代码勘探已完成）：① 新增
                bone-procurement-fulfillment DDD 模块，由 bone-procurement-app
                统一装配；经 PoQueryPort 只读依赖 transaction，经
                InventoryAclPort/FinanceAclPort/ToleranceConfigPort 承接跨上下文（默认
                fail-closed、运行期不触发真实上游）。② 关键取舍 D1：现有 PoStatus 对 SENT
                及履约保留态故意注册空迁移表（注释写明避免提前实现 05 语义），本轮仅受控解锁唯一一条 SENT→ACKNOWLEDGED
                作为 ASN 可信上游，其余保留态继续 fail-closed，用 PoStatusTest
                增补断言守住只允许这一条；备选『履约独立确认态』因与 PO 状态双真源被否决。③ D3 跨上下文用端口+fail-closed
                桩（沿袭上轮 VendorQueryPortAdapter 范式），不引 MQ/Outbox（PA-08），Finance
                不可用时发票保持 MATCH_PENDING、不推断通过。④ D4 金额/数量遵循 LLD §14
                类型基线，容差按供应商/品类配置、禁止硬编码，TDS=ΣIT1±SAC 逐行舍入。⑤ D5
                权限复用内部采购角色+供应商维度过滤（外部账号属二期 L23），越权 403+零数据；D6 前端在现有
                bone-procurement-app 加履约页与 /transactions/fulfillment 路由，不改 shell
                注册；D7 错误码 31501-31506 + 409 invalid_transition。⑥ 风险：LLD
                openapi.yaml 端点为 /api/v1/portal/*（BFF），本轮内部实现
                /api/v1/procurement/*，如实登记为路径偏差、不谎称契约覆盖，措辞避开 A10.16 黑名单。⑦ Spec
                Patch：无（行为需求以 5 份 delta spec 为准，design.md 不新增规格）。完整技术设计见
                design.md（已补 SDK frontmatter）。
