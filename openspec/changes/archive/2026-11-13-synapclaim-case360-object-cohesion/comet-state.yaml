            proposal: 候选方案 A（推荐）：对象内聚 + 常驻可见分组，不改 IAM。① 把 6 个使用 CaseIdBar/useClaimIdParam
              的单案作业页拆成「无壳内容组件 + 页面壳」，内嵌为案件 360 的 Tab，claimId 由 ?claimId=&tab=
              唯一真源提供，overview 保留概览与 AI 结论卡，trace（核赔工作台，队列型）保留深链桥，旧作业路由与「回案件
              360」继续可达且不出现双标题双 ID 输入；② shell 侧栏按 hash
              常量加「作业/查询/配置/治理」常驻可见分组标题，子项默认展开且仍可直接点击，未知 hash
              落「未分组」并保留可点性，菜单名/顺序/permission/icon/hash 一字不改；③ 单导航探针与 UI
              冒烟同批新增断言（分组常驻、15 项可见可点、Tab 内无需再输 ID、深链分享/回退、18 位雪花 ID 无截断、非
              AI_ASSISTED 无裁决动作），计数用精确值并做三种缺陷写法的互补变异验证；④ 清理设计提案中与 v2.0
              改判矛盾的旧表述、补 NN/g/Fiori/Guidewire 依据强度、同步速览 HTML。关键取舍：依据 NN/g
              隐藏导航实测（可见 48–50% vs 隐藏 27%、时间 +39%）与 Fiori/Guidewire
              对象内聚，否决「折叠四空间」「只做分组」「直接改 IAM 菜单树撤 6 条」三案；本 change
              不撤任何菜单条目，撤菜单待真实使用率可观测后另立 change 与 IAM
              迁移、探针同批改；不新增角色表、不改后端契约、不做数据迁移、不做真人卡片分类。风险与缓解：6 页抽组件可能改变既有页面行为 →
              页面壳复用同一组件与取数入口、逐页单测 + 探针逐项点击；并行会话在途文件可能被代提交 →
              精确路径暂存、提交前核对；qiankun/shell 下分组选择器兼容 → 真实浏览器验证 + 变异验证；受保护动作被误做成批量 →
              规格约束 + UI 冒烟负向断言；回滚只需恢复深链桥渲染并移除分组映射。Spec Patch：无，本轮不修改两份 delta
              spec 的任何 requirement/scenario。测试策略：tsc --noEmit、改动文件 eslint
              零警告、claim-app 全量单测、契约联调 40/40、UI 冒烟、单导航探针、文档族门禁
              19/19、变异验证对照记录，全部实际运行并保存退出码。待确认：方案 A 及 D1–D5 取舍、无 Spec Patch、「本
              change 不撤菜单」边界；确认后沿用 design.md 为唯一 Design Doc 并进入 Build。
