              t_proc_contract_outbox/inbox/dlq 三表，以 tenant_id+review_id
              唯一约束去重（否决：复用 append-only 的 review_trace）；(2) 审查结论与 Outbox
              同事务，唯一键冲突判定幂等（否决：业务层 SELECT FOR UPDATE，AGENTS.md 禁止）；(3) 以消费方
              TenantContext 校验事件租户，不一致拒绝并留痕（否决：信任事件 tenant）；(4) 消费失败入 DLQ、按
              review_id 显式重放（否决：无限自动重试）；(5) 事件 7 字段/PII 禁入/UNKNOWN 隔离/AI
              披露三态/快照不可变全部保持；(6) 按 A10.17 D-11 四入口一致流程在 GATE_KEYS 追加
              eventChainGate/eventChainProbe，同步
              ci.yml/check.sh/check-procura-ci.sh + 门禁常量 +
              注入必红反证。风险：三入口并行冲突→fetch+rebase 收敛；persistence 门禁 6 表断言需扩展；Outbox
              只存 7 字段避免 PII。Spec Patch：无（design.md 4 Requirement 与 delta spec
              一致）。
