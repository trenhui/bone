spring:
  application:
    name: bone-blueprint
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    # 必填变量，不给默认值：缺失时启动即失败（配置与环境规范 §1.4 fail-fast），
    # 避免用空密码去连库、报出难以定位的认证错误。
    password: ${BONE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # DDL 真源唯一为仓库根 bone-init.sql（数据库开发规范 §1）。模块内不提供建表脚本，
  # 并显式关掉 Spring Boot 对 schema.sql / data.sql 的自动执行，避免双轨 DDL 漂移。
  sql:
    init:
      mode: never
  # === 时间字段的 UTC 契约（i18n 方案 §6.4，bone-blueprint 作为改造样板）===
  jackson:
    # 输出带偏移的 ISO-8601（...Z），而不是时间戳数组。
    # ⚠️ 注意 spring.jackson.time-zone **对 LocalDateTime 无效**（LocalDateTime 本身不带时区）——
    #    它只影响 java.util.Date / Calendar / ZonedDateTime 等带时区的类型。
    #    因此对外契约的时间字段一律用 Instant（见 adapter/web/dto/response/*Resp），
    #    本配置只是把"默认行为"显式固定下来，避免依赖 Spring Boot 版本默认值。
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

bone:
  iam:
    jwt:
      # 与其余 7 个模块（bone-system / bone-masterdata / bone-integration 等）同款声明：
      # 必须与 bone-iam 的 bone.iam.jwt.secret-key 一致，本地开发未注入环境变量时各模块
      # 落到同一未解析占位符字面量，天然一致；生产由环境变量 BONE_IAM_JWT_SECRET_KEY 注入。
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}
  # 注意：此处不再有 bone.metadata.enabled / scan-packages——全仓无任何 @ConfigurationProperties 以
  # bone.metadata 为前缀（SDK 的真前缀是 metadata.sdk.* 与 bone.metadata.datasource.*），写了也不会被绑定，
  # 属"写了却不生效"的死配置。SDK 相关配置请写 metadata.sdk.*。
  # Redis：与 extension-studio / iam 共用本地实例，承载控制面路由元数据同步
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # === 扩展引擎数据面：控制面同步 + 执行日志上报（真实联调链路）===
  extension:
    sync:
      # 订阅 bone:ext:metadata:refresh 刷新通道，叠加 studio 发布的路由元数据
      enabled: true
    studio:
      report:
        # 每次扩展点调用后异步上报执行日志到 studio（前端「运行日志」可见真实执行）
        enabled: true
        base-url: ${BONE_EXTENSION_STUDIO_BASE_URL:http://localhost:8088}
  # === 定价规则中心（bone-metadata-server 模式 B 动态记录）===
  pricing-rule:
    enabled: true
    base-url: ${BONE_GATEWAY_BASE_URL:http://localhost:8888}
    entity-code: PRICING_RULE
    cache-ttl-seconds: 30
  # === 字典消费（bone-system 字典「下拉数据源」ACL，跨服务消费字典唯一入口）===
  dict:
    system-base-url: ${BONE_SYSTEM_BASE_URL:http://localhost:8083}
    iam-base-url: ${BONE_IAM_BASE_URL:http://localhost:8081}
    service-username: ${BONE_DICT_SERVICE_USERNAME:admin}
    service-password: ${BONE_DICT_SERVICE_PASSWORD:123456}
    cache-ttl-seconds: 300
  blueprint:
    payment:
      callback:
        # 回调来源白名单（逗号分隔 IPv4/IPv6）；为空=不限制来源（默认，便于联调）
        allowed-source-ips: ""
        # 可信代理白名单（逗号分隔 IPv4/IPv6），填自家网关的出口 IP。
        # 部署形态=渠道 → bone-gateway → blueprint：此时 remoteAddr 是网关 IP，真实渠道 IP 在
        # X-Forwarded-For 里。配了本键后，**仅当 remoteAddr 命中本列表**才采信 XFF，
        # 并从左取第一个非可信代理地址作为来源 IP ⇒ 绕过网关直连本应用并伪造 XFF 的请求无效。
        # 留空=保持旧行为（无条件采信 XFF 首段，兼容性优先，但该形态下 XFF 可被伪造）。
        trusted-proxy-ips: ""
    # === 多渠道开放平台接入（真实渠道网关）===
    channel:
      openapi:
        # MOCK=不出网，只跑归一化逻辑（本地/CI 默认）；HTTP=调真实开放平台。
        # 切到 HTTP 后凭证缺失会立即失败（BP_CHANNEL_CREDENTIAL_MISSING），不会静默退回 MOCK。
        transport: ${BONE_CHANNEL_OPENAPI_TRANSPORT:MOCK}
        connect-timeout-ms: 3000
        read-timeout-ms: 10000
        # 仅对网络类错误重试；渠道业务拒绝不重试（重试无意义且会加剧限流）
        max-attempts: 2
        # 各渠道凭证（app-key / app-secret / access-token）。
        # 生产建议走密钥管理并用环境变量注入，此处仅声明结构。
        credentials:
          TAOBAO:
            app-key: ${TAOBAO_APP_KEY:}
            app-secret: ${TAOBAO_APP_SECRET:}
            access-token: ${TAOBAO_ACCESS_TOKEN:}
          JD:
            app-key: ${JD_APP_KEY:}
            app-secret: ${JD_APP_SECRET:}
            access-token: ${JD_ACCESS_TOKEN:}
          DOUYIN:
            app-key: ${DOUYIN_APP_KEY:}
            app-secret: ${DOUYIN_APP_SECRET:}
            access-token: ${DOUYIN_ACCESS_TOKEN:}
          PDD:
            app-key: ${PDD_APP_KEY:}
            app-secret: ${PDD_APP_SECRET:}
            access-token: ${PDD_ACCESS_TOKEN:}
      broadcast:
        # 库存广播 Outbox 中继：库存变更同事务入队，中继异步投递到各渠道
        enabled: true
        batch-size: 50
        interval-ms: 5000
        max-retry: 5
        base-backoff-ms: 10000
        max-backoff-ms: 300000
        stuck-timeout-ms: 120000
    outbox:
      enabled: true
      mq-enabled: false
      batch-size: 50
      max-retries: 5
      # Topic 命名遵循《Bone-消息与事件规范》§2：{scope}.{domain}.{resource}_{action}.v{major}
      order-paid-topic: domain.order.order_paid.v1
      payment-succeeded-topic: domain.payment.payment_succeeded.v1
      payment-inconsistent-topic: domain.order.order_payment_inconsistent.v1
      payment-refunded-topic: domain.payment.payment_refunded.v1
      payment-failed-topic: domain.payment.payment_failed.v1
      # 库存动作失败主题：库存预留/扣减远程失败时中继，下游用于告警与补偿对账
      stock-action-failed-topic: domain.order.order_stock_action_failed.v1
      # 终端失败（超过 max-retries）转投平台死信主题（消息与事件规范 §6）
      dead-letter-topic: platform.dead_letter.v1
      consumer-group: bone-blueprint-order-paid-consumer
      relay-delay-ms: 5000
    idempotency:
      # 幂等写（Idempotency-Key）：关闭后 /api/v1/orders 的重复提交不再返回历史响应
      enabled: true
    schedule:
      # ① 扫描周期：Spring cron（6 段：秒 分 时 日 月 周），由 @Scheduled 占位符直读
      cancel-expired-orders-cron: "0 0/5 * * * ?"
      close-expired-payments-cron: "0 0/5 * * * ?"
      payment-inconsistency-check-cron: "0 0/10 * * * ?"
      # ② 扫描门限（分钟）：超时窗口是运营策略，按业务线 / 渠道调整，无需改代码发版
      order-timeout-minutes: 30
      payment-timeout-minutes: 30
      confirm-grace-minutes: 10

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    # 生产默认关 DEBUG（日志规范 §4）；本地排障由 application-dev.yml 覆盖
    com.bone: INFO
