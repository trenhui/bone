spring:
  application:
    name: bone-blueprint
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    # 必填变量，不给默认值：缺失时启动即失败（配置与环境规范 §1.4 fail-fast），
    # 避免用空密码去连库、报出难以定位的认证错误。
    password: ${BONE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # DDL 真源唯一为仓库根 bone-init.sql（数据库开发规范 §1）。模块内不提供建表脚本，
  # 并显式关掉 Spring Boot 对 schema.sql / data.sql 的自动执行，避免双轨 DDL 漂移。
  sql:
    init:
      mode: never
  # === 时间字段的 UTC 契约（i18n 方案 §6.4，bone-blueprint 作为改造样板）===
  jackson:
    # 输出带偏移的 ISO-8601（...Z），而不是时间戳数组。
    # ⚠️ 注意 spring.jackson.time-zone **对 LocalDateTime 无效**（LocalDateTime 本身不带时区）——
    #    它只影响 java.util.Date / Calendar / ZonedDateTime 等带时区的类型。
    #    因此对外契约的时间字段一律用 Instant（见 adapter/web/dto/response/*Resp），
    #    本配置只是把"默认行为"显式固定下来，避免依赖 Spring Boot 版本默认值。
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

bone:
  iam:
    jwt:
      # 与其余 7 个模块（bone-system / bone-masterdata / bone-integration 等）同款声明：
      # 必须与 bone-iam 的 bone.iam.jwt.secret-key 一致，本地开发未注入环境变量时各模块
      # 落到同一未解析占位符字面量，天然一致；生产由环境变量 BONE_IAM_JWT_SECRET_KEY 注入。
      secret-key: ${BONE_IAM_JWT_SECRET_KEY}
  # 注意：此处不再有 bone.metadata.enabled / scan-packages——全仓无任何 @ConfigurationProperties 以
  # bone.metadata 为前缀（SDK 的真前缀是 metadata.sdk.* 与 bone.metadata.datasource.*），写了也不会被绑定，
  # 属"写了却不生效"的死配置。SDK 相关配置请写 metadata.sdk.*。
  blueprint:
    payment:
      callback:
        # 回调来源白名单（逗号分隔 IPv4/IPv6）；为空=不限制来源（默认，便于联调）
        allowed-source-ips: ""
    outbox:
      enabled: true
      mq-enabled: false
      batch-size: 50
      max-retries: 5
      # Topic 命名遵循《Bone-消息与事件规范》§2：{scope}.{domain}.{resource}_{action}.v{major}
      order-paid-topic: domain.order.order_paid.v1
      payment-succeeded-topic: domain.payment.payment_succeeded.v1
      payment-inconsistent-topic: domain.order.order_payment_inconsistent.v1
      payment-refunded-topic: domain.payment.payment_refunded.v1
      payment-failed-topic: domain.payment.payment_failed.v1
      # 库存动作失败主题：库存预留/扣减远程失败时中继，下游用于告警与补偿对账
      stock-action-failed-topic: domain.order.order_stock_action_failed.v1
      # 终端失败（超过 max-retries）转投平台死信主题（消息与事件规范 §6）
      dead-letter-topic: platform.dead_letter.v1
      consumer-group: bone-blueprint-order-paid-consumer
      relay-delay-ms: 5000
    idempotency:
      # 幂等写（Idempotency-Key）：关闭后 /api/v1/orders 的重复提交不再返回历史响应
      enabled: true
    schedule:
      # ① 扫描周期：Spring cron（6 段：秒 分 时 日 月 周），由 @Scheduled 占位符直读
      cancel-expired-orders-cron: "0 0/5 * * * ?"
      close-expired-payments-cron: "0 0/5 * * * ?"
      payment-inconsistency-check-cron: "0 0/10 * * * ?"
      # ② 扫描门限（分钟）：超时窗口是运营策略，按业务线 / 渠道调整，无需改代码发版
      order-timeout-minutes: 30
      payment-timeout-minutes: 30
      confirm-grace-minutes: 10

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    # 生产默认关 DEBUG（日志规范 §4）；本地排障由 application-dev.yml 覆盖
    com.bone: INFO
