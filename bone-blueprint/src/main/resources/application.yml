spring:
  application:
    name: bone-blueprint
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${BONE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

bone:
  metadata:
    enabled: true
    scan-packages: com.bone.blueprint.domain
  blueprint:
    outbox:
      enabled: true
      mq-enabled: false
      batch-size: 50
      max-retries: 5
      order-paid-topic: bone.order.paid
      consumer-group: bone-blueprint-order-paid-consumer
      relay-delay-ms: 5000

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.bone: DEBUG
