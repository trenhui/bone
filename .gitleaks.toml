title = "Bone Gitleaks Config"

[allowlist]
  description = "允许的路径"
  paths = [
    '''node_modules/.*''',
    '''target/.*''',
    '''.git/.*''',
  ]

[[rules]]
id = "hardcoded-password"
description = "检测硬编码密码"
regex = '''(?i)password\s*[:=]\s*["'][^"']{4,}["']'''
tags = ["secret", "password"]

[[rules]]
id = "hardcoded-jwt-secret"
description = "检测硬编码 JWT 密钥"
regex = '''(?i)(jwt|secret[_-]?key)\s*[:=]\s*["'][^"']{16,}["']'''
tags = ["secret", "jwt"]

[[rules]]
id = "hardcoded-api-key"
description = "检测硬编码 API Key"
regex = '''(?i)(api[_-]?key|access[_-]?token)\s*[:=]\s*["'][^"']{16,}["']'''
tags = ["secret", "api-key"]
