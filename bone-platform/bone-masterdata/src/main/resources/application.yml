spring:
  application:
    name: bone-masterdata
  cloud:
    nacos:
      config:
        # 本地 Nacos 3.0.3（MySQL+鉴权）：通过 spring.config.import 在启动期拉取共享配置
        server-addr: ${BONE_NACOS_ADDR:127.0.0.1:8848}
        username: ${BONE_NACOS_USERNAME:nacos}
        password: ${BONE_NACOS_PASSWORD:nacos}
        namespace: ${BONE_NACOS_NAMESPACE:}
        group: BONE
        file-extension: yaml
  config:
    # optional: 与 README「Nacos 不作为所有场景默认依赖」一致——无 Nacos 时以本地 yml 默认值启动，
    # 便于本地开发与 docker compose 一键起后端；prod profile 仍强制拉取（见 application-prod.yml）。
    import:
      - optional:nacos:bone-common.yaml?group=BONE&refreshEnabled=true
  # === 时间字段的 UTC 契约（i18n 方案 §6.4，照 blueprint/system 样板）===
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${BONE_DB_URL:jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${BONE_DB_USERNAME:root}
    password: ${BONE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

metadata:
  sdk:
    appcode: bone-masterdata
    deploymentMode: EMBEDDED

server:
  port: 8084
  # 全 scope JWT 约 4.5KB + 网关注入头会越过 Tomcat 默认 8KB，
  # 真实浏览器偶发 400「Request header is too large」（curl 头少永不复现）。
  max-http-request-header-size: 16KB
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

bone:
  iam:
    jwt:
      # 必须与 bone-iam 的 secret-key 一致，生产由环境变量 BONE_IAM_JWT_SECRET_KEY 注入
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}
      token-prefix: "Bearer "
      header-name: Authorization

masterdata:
  # 由 MasterDataProperties 绑定并在用例入口校验；kebab-case 对应其 camelCase 字段
  entity-max-fields: 100
  record-max-size: 1048576
  export-max-records: 10000
  # 本轮新增：Golden Record 摘要与 Outbox 中继配置（@Value 须在此显式声明，strict 门禁禁止静默回落）
  golden-record:
    # 防低熵 PII 摘要被反推的盐值；生产由环境变量 BONE_MASTERDATA_DIGEST_PEPPER 注入，dev 仅占位
    digest-pepper: ${BONE_MASTERDATA_DIGEST_PEPPER:dev-only-digest-pepper-change-in-prod}
  outbox-relay:
    # 具名消费者，禁止匿名投递
    consumer-id: ${BONE_MASTERDATA_OUTBOX_CONSUMER_ID:bone-masterdata-relay}
    max-attempts: 3

logging:
  level:
    com.bone.masterdata: info
