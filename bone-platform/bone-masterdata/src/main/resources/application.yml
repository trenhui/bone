spring:
  application:
    name: bone-masterdata
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8
    username: root
    password: ${BONE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

metadata:
  sdk:
    appcode: bone-masterdata
    deploymentMode: EMBEDDED

server:
  port: 8084
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

masterdata:
  entity:
    max.fields: 100
  record:
    max.size: 1048576
  quality:
    check:
      batch.size: 1000
  import:
    batch.size: 500
  export:
    max.records: 10000

logging:
  level:
    com.bone.masterdata: info
