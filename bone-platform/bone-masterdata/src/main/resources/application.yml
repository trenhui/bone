spring:
  application:
    name: bone-masterdata
  cloud:
    nacos:
      config:
        # 本地 Nacos 3.0.3（MySQL+鉴权）：通过 spring.config.import 在启动期拉取共享配置
        server-addr: ${BONE_NACOS_ADDR:127.0.0.1:8848}
        username: ${BONE_NACOS_USERNAME:nacos}
        password: ${BONE_NACOS_PASSWORD:nacos}
        namespace: ${BONE_NACOS_NAMESPACE:}
        group: BONE
        file-extension: yaml
  config:
    import:
      - nacos:bone-common.yaml?group=BONE&refreshEnabled=true
  # === 时间字段的 UTC 契约（i18n 方案 §6.4，照 blueprint/system 样板）===
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8
    username: root
    password: ${BONE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

metadata:
  sdk:
    appcode: bone-masterdata
    deploymentMode: EMBEDDED

server:
  port: 8084
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

bone:
  iam:
    jwt:
      # 必须与 bone-iam 的 secret-key 一致，生产由环境变量 BONE_IAM_JWT_SECRET_KEY 注入
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}
      token-prefix: "Bearer "
      header-name: Authorization

masterdata:
  # 由 MasterDataProperties 绑定并在用例入口校验；kebab-case 对应其 camelCase 字段
  entity-max-fields: 100
  record-max-size: 1048576
  export-max-records: 10000

logging:
  level:
    com.bone.masterdata: info
