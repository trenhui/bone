# 本地开发环境配置（MySQL）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BONE_DB_URL:jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${BONE_DB_USERNAME:root}
    password: ${BONE_DB_PASSWORD:}

bone:
  iam:
    jwt:
      # 开发环境默认密钥，生产必须通过环境变量注入
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}

logging:
  level:
    com.bone.masterdata: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
