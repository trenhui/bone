# 本地开发环境配置（H2 内存数据库）
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:masterdata;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

# MySQL 开发覆盖（取消注释以使用 MySQL）
# spring:
#   datasource:
#     url: jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8
#     username: root
#     password: ${BONE_DB_PASSWORD:bone_dev_pass}

logging:
  level:
    com.bone.masterdata: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
