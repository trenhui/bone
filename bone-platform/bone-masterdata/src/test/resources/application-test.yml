spring:
  application:
    name: bone-masterdata-test
  datasource:
    url: jdbc:h2:mem:bone_masterdata_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

metadata:
  sdk:
    appcode: bone-masterdata-test
    deployment-mode: EMBEDDED
    sql:
      database:
        type: H2
        auto-detect-dialect: true

logging:
  level:
    com.bone: warn
    org.springframework: warn
