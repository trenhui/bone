server:
  port: 8085

spring:
  application:
    name: bone-integration
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ${BONE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    password: ${BONE_REDIS_PASSWORD}
    database: 0
  rocketmq:
    name-server: localhost:9876
    producer:
      group: bone-integration-producer

metadata:
  sdk:
    appcode: bone-integration
    deploymentMode: EMBEDDED

bone:
  integration:
    outbox:
      enabled: ${BONE_INTEGRATION_OUTBOX_ENABLED:true}
      mq-enabled: ${BONE_INTEGRATION_OUTBOX_MQ_ENABLED:false}
      batch-size: 50
      max-retries: 5
      relay-interval-ms: 5000
    security:
      jwt-enabled: ${BONE_INTEGRATION_JWT_ENABLED:false}
  iam:
    jwt:
      secret-key: ${BONE_IAM_JWT_SECRET_KEY}

integration:
  camel:
    enabled: true
    # INT-11：true 时 FlowExecutionService 走 Camel 编译路由；默认 false 保持线性运行时
    execution-enabled: ${BONE_INTEGRATION_CAMEL_EXECUTION:false}
  flow:
    max.nodes: 50
    execution.timeout: 300
  connector:
    max.count: 100
  log:
    retention.days: 30
  alert:
    # true 时接入 bone-notification；通道未启用时仍写结构化日志
    enabled: ${BONE_INTEGRATION_ALERT_ENABLED:true}

# bone-notification（见 config/env/README.md § 集成告警）
alert:
  policies:
    INFO:
      channels: [LOG]
    MEDIUM:
      channels: [EMAIL, LOG]
    HIGH:
      channels: [DINGTALK, EMAIL, LOG]
    CRITICAL:
      channels: [DINGTALK, SMS, EMAIL, LOG]
  channels:
    mail:
      enabled: ${BONE_ALERT_MAIL_ENABLED:false}
      from: ${BONE_ALERT_MAIL_FROM:alerts@bone.local}
      recipients:
        - ${BONE_ALERT_MAIL_TO:ops@bone.local}
    dingtalk:
      enabled: ${BONE_ALERT_DINGTALK_ENABLED:false}
      webhook: ${DINGTALK_WEBHOOK:https://placeholder.local}
      secret: ${DINGTALK_SECRET:}
    sms:
      enabled: ${BONE_ALERT_SMS_ENABLED:false}
      provider: Aliyun
      apiKey: ${SMS_API_KEY:}
      apiSecret: ${SMS_API_SECRET:}
      phoneNumbers: []
      templateId: ${SMS_TEMPLATE_ID:}

camel:
  springboot:
    name: bone-integration-camel
  component:
    http:
      use-system-properties: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# Resilience4j（Servlet 栈）：外部 HTTP/连接器调用的熔断与重试
# 已知限制：当前仅做默认值兜底；实际 Connector/Flow 调用点需显式添加
#   @CircuitBreaker(name = "connectorHttp", fallbackMethod = "...") @Retry(name = "connectorHttp")
# 才会生效；未标注时此配置无作用，仅为后续接入提供统一契约。
resilience4j:
  circuitbreaker:
    instances:
      connectorHttp:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - java.lang.IllegalArgumentException
      flowExecution:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 10
        failure-rate-threshold: 30
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    instances:
      connectorHttp:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - org.springframework.web.client.ResourceAccessException
      flowExecution:
        max-attempts: 2
        wait-duration: 500ms
  timelimiter:
    instances:
      connectorHttp:
        timeout-duration: 10s
        cancel-running-future: true
      flowExecution:
        timeout-duration: 300s
        cancel-running-future: true
