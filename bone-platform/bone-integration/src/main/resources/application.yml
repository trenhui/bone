server:
  port: 8085
  servlet:
    context-path: /api

spring:
  application:
    name: bone-integration
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8
    username: root
    password: ${BONE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    password: ${BONE_REDIS_PASSWORD:}
    database: 0
  rocketmq:
    name-server: localhost:9876
    producer:
      group: bone-integration-producer

bone:
  integration:
    outbox:
      enabled: ${BONE_INTEGRATION_OUTBOX_ENABLED:true}
      mq-enabled: ${BONE_INTEGRATION_OUTBOX_MQ_ENABLED:false}
      batch-size: 50
      max-retries: 5
      relay-interval-ms: 5000
    security:
      jwt-enabled: ${BONE_INTEGRATION_JWT_ENABLED:false}
  iam:
    jwt:
      secret-key: ${BONE_IAM_JWT_SECRET:change-me-change-me-change-me-change-me-32bytes}

integration:
  camel:
    enabled: true
  flow:
    max.nodes: 50
    execution.timeout: 300
  connector:
    max.count: 100
  log:
    retention.days: 30
  alert:
    # true 时接入 bone-notification；通道未启用时仍写结构化日志
    enabled: ${BONE_INTEGRATION_ALERT_ENABLED:true}

# bone-notification（见 config/env/README.md § 集成告警）
alert:
  policies:
    INFO:
      channels: []
    MEDIUM:
      channels: [EMAIL]
    HIGH:
      channels: [DINGTALK, EMAIL]
    CRITICAL:
      channels: [DINGTALK, SMS, EMAIL]
  channels:
    mail:
      enabled: ${BONE_ALERT_MAIL_ENABLED:false}
      from: ${BONE_ALERT_MAIL_FROM:alerts@bone.local}
      recipients:
        - ${BONE_ALERT_MAIL_TO:ops@bone.local}
    dingtalk:
      enabled: ${BONE_ALERT_DINGTALK_ENABLED:false}
      webhook: ${DINGTALK_WEBHOOK:}
      secret: ${DINGTALK_SECRET:}
    sms:
      enabled: ${BONE_ALERT_SMS_ENABLED:false}
      provider: Aliyun
      apiKey: ${SMS_API_KEY:}
      apiSecret: ${SMS_API_SECRET:}
      phoneNumbers: []
      templateId: ${SMS_TEMPLATE_ID:}

camel:
  springboot:
    name: bone-integration-camel
  component:
    http:
      use-system-properties: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
