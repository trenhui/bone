server:
  port: ${BONE_GATEWAY_PORT:8888}

spring:
  application:
    name: bone-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3008"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: extension-studio
          uri: ${BONE_EXTENSION_STUDIO_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/extension/**
        - id: bone-iam
          uri: ${BONE_IAM_URI:http://localhost:8081}
          predicates:
            # AppController（应用/模块）归属 IAM 上下文，但路径前缀是 /api/v1/apps 而非 /api/v1/iam/**。
            # 未登记会让元数据「应用管理 / 模块管理」页经网关调用时 404（前端只经过网关）。
            - Path=/api/v1/iam/**, /api/v1/apps/**
        - id: bone-masterdata
          uri: ${BONE_MASTERDATA_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/masterdata/**
        - id: bone-system
          uri: ${BONE_SYSTEM_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/system/**
        # 控制台与 bone-system 同上游；Authorization 头默认透传（bone-system JwtAuthenticationFilter 验签）
        - id: bone-console
          uri: ${BONE_SYSTEM_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/console/**
        - id: bone-integration
          uri: ${BONE_INTEGRATION_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/integration/**
        - id: bone-file
          uri: ${BONE_FILE_URI:http://localhost:8107}
          predicates:
            - Path=/api/v1/file/**
        # bone-notification 为 SDK，REST 端点由宿主 bone-system 暴露
        - id: bone-notification
          uri: ${BONE_SYSTEM_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/notification/**
        - id: studio-generator
          uri: ${BONE_GENERATOR_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/generator/**
        - id: bone-metadata-server
          uri: ${BONE_METADATA_SERVER_URI:http://localhost:9001}
          predicates:
            - Path=/api/v1/metadata/**, /api/v1/runtime/**

# 网关统一鉴权（JWT 密钥与 bone-iam 等签发模块共享）
bone:
  gateway:
    jwt:
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}
      whitelist:
        - /api/v1/iam/auth/login
        - /api/v1/iam/login
        - /actuator/
        - /favicon.ico
    ratelimit:
      enabled: false
      capacity: 100
      window-seconds: 60
      by-ip: true
      by-user: true
    resilience:
      enabled: true

  data:
    redis:
      host: ${BONE_REDIS_HOST:localhost}
      port: ${BONE_REDIS_PORT:6379}
      timeout: 3000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# Resilience4j（Reactive 栈）：网关全局路由的熔断配置
# 已知限制：CircuitBreakerGatewayFilter 目前使用 ReactiveCircuitBreaker 默认工厂；
# 如需严格对齐下述实例，需在 filter 中显式指定 id="gatewayRoutes" 或改为 Resilience4JCircuitBreakerFactory 直接创建。
resilience4j:
  circuitbreaker:
    instances:
      gatewayRoutes:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    instances:
      gatewayRoutes:
        timeout-duration: 30s
        cancel-running-future: true
  retry:
    instances:
      gatewayRoutes:
        max-attempts: 2
        wait-duration: 100ms
        retry-exceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
