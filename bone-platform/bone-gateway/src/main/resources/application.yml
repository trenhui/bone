server:
  port: ${BONE_GATEWAY_PORT:8888}

spring:
  application:
    name: bone-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            # 与前端各微应用实际端口对齐（bone-shell 3000 / iam 3003 / metadata 3004 /
            # masterdata 3005 / integration 3006 / extension 3008 / generator 3009 /
            # commerce 3010，见设计稿 §5.4）。
            # 原配置漏 3003-3006、3009——子应用独立 dev 直连网关会被 CORS 拒绝（G-10）；
            # 3010 随交易域微应用（bone-commerce-app）新增，漏配会让订单/支付页直连网关被拒。
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3003"
              - "http://localhost:3004"
              - "http://localhost:3005"
              - "http://localhost:3006"
              - "http://localhost:3008"
              - "http://localhost:3009"
              - "http://localhost:3012"
            allowedMethods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: extension-studio
          uri: ${BONE_EXTENSION_STUDIO_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/extension/**
        - id: bone-iam
          uri: ${BONE_IAM_URI:http://localhost:8081}
          predicates:
            # AppController（应用/模块）归属 IAM 上下文，但路径前缀是 /api/v1/apps 而非 /api/v1/iam/**。
            # 未登记会让元数据「应用管理 / 模块管理」页经网关调用时 404（前端只经过网关）。
            - Path=/api/v1/iam/**, /api/v1/apps/**
        - id: bone-masterdata
          uri: ${BONE_MASTERDATA_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/masterdata/**
        # blueprint 交易域：下单/订单查询经网关转发到 blueprint(8082)，与 masterdata 主数据消费链路打通。
        # payments 同属 blueprint 上下文（PaymentController），路径前缀是 /api/v1/payments；
        # 原配置只登记了 orders，导致「下单后支付」这条链路经网关 404 —— 前端只经网关，整条
        # 订单→支付→发货 主链路在 UI 上断在第二跳。此处与 orders 并列登记。
        #
        # 注：blueprint 另有内部 RPC 面 /api/rpc/orders（服务间调用，非用户 API），**故意不登记**——
        # 网关是南北向用户流量入口，内部 RPC 不应从外部可达。此处留注以防后人误补。
        - id: bone-blueprint
          uri: ${BONE_BLUEPRINT_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/orders/**, /api/v1/payments/**
        - id: bone-system
          uri: ${BONE_SYSTEM_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/system/**
        # 控制台与 bone-system 同上游；Authorization 头默认透传（bone-system JwtAuthenticationFilter 验签）
        - id: bone-console
          uri: ${BONE_SYSTEM_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/console/**
        - id: bone-integration
          uri: ${BONE_INTEGRATION_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/integration/**
        - id: bone-file
          uri: ${BONE_FILE_URI:http://localhost:8107}
          predicates:
            - Path=/api/v1/file/**
        # bone-notification 为 SDK，REST 端点由宿主 bone-system 暴露
        - id: bone-notification
          uri: ${BONE_SYSTEM_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/notification/**
        - id: studio-generator
          uri: ${BONE_GENERATOR_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/generator/**
        - id: bone-metadata-server
          uri: ${BONE_METADATA_SERVER_URI:http://localhost:9001}
          predicates:
            - Path=/api/v1/metadata/**, /api/v1/runtime/**

# 网关统一鉴权（JWT 密钥与 bone-iam 等签发模块共享）
bone:
  gateway:
    jwt:
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}
      whitelist:
        - /api/v1/iam/login
        # 支付渠道回调：渠道方是外部系统，不会持有本平台签发的 JWT。
        # blueprint 的 SecurityConfig 虽已把该路径设为 permitAll，但网关在转发之前就会校验
        # JWT——不放通的话真实渠道回调会被网关拦在 401 GW_UNAUTHORIZED，支付链路最后一跳是断的
        # （曾因此误判「支付链路已打通」：联调全程带 admin token，掩盖了无凭证场景）。
        #
        # 【必须精确到 /callback，不能写 /api/v1/payments】本白名单是「前缀匹配」，
        # 写短了会把 /initiate 与 /{id}/refund 一并匿名放通——那是资金操作端点，绝不可匿名可达。
        #
        # 【放通后的信任边界】匿名可达后，该端点的全部防护落在服务端两层纵深：
        #   1. 应用服务内 HMAC-SHA256 验签（PaymentSignaturePort）；
        #   2. PaymentController 的来源 IP 白名单 bone.blueprint.payment.callback.allowed-source-ips。
        # 第 2 层默认为空即不限制——联调可接受，**生产上线前必须配置**，否则任何人只要
        # 掌握签名密钥即可从任意来源改写支付状态。另注意 MockPaymentSignaturePortAdapter 的
        # 密钥是硬编码常量，真实接入须外部化到配置。
        - /api/v1/payments/callback
        # 仅放通健康检查；metrics/prometheus 等运维端点须经 JWT 鉴权，禁止网关匿名暴露
        - /actuator/health
        - /favicon.ico
    ratelimit:
      enabled: false
      capacity: 100
      window-seconds: 60
      by-ip: true
      by-user: true
    resilience:
      enabled: true

  data:
    redis:
      host: ${BONE_REDIS_HOST:localhost}
      port: ${BONE_REDIS_PORT:6379}
      timeout: 3000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# 熔断参数单一真源（G-1，设计稿 §5.2 裁决）：ResilienceConfig#gatewayCircuitBreakerCustomizer。
# 原 resilience4j.instances.gatewayRoutes 整段已删除——breakerId 是 routeId（bone-iam 等），
# 与实例名 gatewayRoutes 不匹配，configureDefault 生效后此处调参从未实际生效。运维调参改 Java 侧。
