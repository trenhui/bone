server:
  port: ${BONE_GATEWAY_PORT:8888}

spring:
  application:
    name: bone-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3008"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: extension-studio
          uri: ${BONE_EXTENSION_STUDIO_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/extension/**
        - id: bone-iam
          uri: ${BONE_IAM_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/iam/**
        - id: bone-masterdata
          uri: ${BONE_MASTERDATA_URI:http://localhost:8080}
          predicates:
            - Path=/api/v1/masterdata/**
        - id: bone-system
          uri: ${BONE_SYSTEM_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/system/**
        # 控制台与 bone-system 同上游；Authorization 头默认透传（bone-system JwtAuthenticationFilter 验签）
        - id: bone-console
          uri: ${BONE_SYSTEM_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/console/**
        - id: bone-integration
          uri: ${BONE_INTEGRATION_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/integration/**
        - id: studio-generator
          uri: ${BONE_GENERATOR_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/generator/**
        - id: bone-metadata-server
          uri: ${BONE_METADATA_SERVER_URI:http://localhost:9001}
          predicates:
            - Path=/api/v1/metadata/**, /api/v1/runtime/**

# 网关统一鉴权（JWT 密钥与 bone-iam 等签发模块共享）
bone:
  gateway:
    jwt:
      secret-key: ${BONE_JWT_SECRET:${BONE_IAM_JWT_SECRET_KEY:change-me-change-me-change-me-change-me-32bytes}}
      whitelist:
        - /api/v1/iam/auth/login
        - /actuator/
        - /favicon.ico
    ratelimit:
      enabled: false
      capacity: 100
      window-seconds: 60
      by-ip: true
      by-user: true
    resilience:
      enabled: true

spring:
  data:
    redis:
      host: ${BONE_REDIS_HOST:localhost}
      port: ${BONE_REDIS_PORT:6379}
      timeout: 3000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
