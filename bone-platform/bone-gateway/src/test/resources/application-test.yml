# Gateway 集成测试：挂载 extension / generator 路由，上游由 Mock HTTP Server 提供
spring:
  cloud:
    gateway:
      routes:
        - id: extension-studio
          uri: ${extension.studio.mock-uri}
          predicates:
            - Path=/api/v1/extension/**
        - id: studio-generator
          uri: ${generator.mock-uri}
          predicates:
            - Path=/api/v1/generator/**
