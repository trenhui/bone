spring:
  application:
    name: bone-iam
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8
    username: root
    password: ${BONE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    password: ${BONE_REDIS_PASSWORD:}
    database: 0

server:
  port: 8080
  servlet:
    context-path: /

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.bone.iam.domain.model

logging:
  level:
    com.bone.iam: info
