spring:
  main:
    lazy-initialization: false
  application:
    name: bone-iam
  # === 时间字段的 UTC 契约（i18n 方案 §6.4，照 blueprint/system 样板）===
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ${BONE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${BONE_REDIS_HOST:localhost}
    port: ${BONE_REDIS_PORT:6379}
    password: ${BONE_REDIS_PASSWORD:}
    database: 0

server:
  port: ${BONE_SERVER_PORT:8081}
  servlet:
    context-path: /

metadata:
  sdk:
    appcode: bone-iam
    deploymentMode: EMBEDDED

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.bone.iam: info
    com.bone.metadata.sdk: debug

bone:
  cors:
    allowed-origins: ${BONE_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3003}
  minio:
    endpoint: ${BONE_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${BONE_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${BONE_MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${BONE_MINIO_BUCKET_NAME:audit-logs}
  metadata:
    enabled: true
    mode: EMBEDDED
    scan-packages: com.bone.iam.domain
  iam:
    jwt:
      secret-key: ${BONE_IAM_JWT_SECRET_KEY}
      expiration-ms: ${BONE_JWT_EXPIRATION_MS:7200000}
      refresh-expiration-ms: ${BONE_JWT_REFRESH_EXPIRATION_MS:604800000}
      token-prefix: "Bearer "
      header-name: "Authorization"
