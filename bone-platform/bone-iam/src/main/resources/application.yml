spring:
  main:
    allow-circular-references: true
    lazy-initialization: true
  application:
    name: bone-iam
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8
    username: root
    password: ${BONE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    password: ${BONE_REDIS_PASSWORD:}
    database: 0

server:
  port: 8081
  servlet:
    context-path: /

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.bone.iam.domain.model

logging:
  level:
    com.bone.iam: info
    com.bone.metadata.sdk: debug

bone:
  metadata:
    enabled: true
    mode: EMBEDDED
    scan-packages: com.bone.iam.domain
    embedded:
      datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8
        username: root
        password: ${BONE_DB_PASSWORD:}
  iam:
    jwt:
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:change-me-change-me-change-me-change-me-32bytes}}
      expiration-ms: ${BONE_JWT_EXPIRATION_MS:7200000}
      refresh-expiration-ms: ${BONE_JWT_REFRESH_EXPIRATION_MS:604800000}
      token-prefix: "Bearer "
      header-name: "Authorization"
