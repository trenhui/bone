spring:
  application:
    name: bone-iam
  config:
    # prod 强制拉取共享配置：Nacos 不可达则启动失败（fail-loud），与默认 profile 的 optional 不同。
    import:
      - nacos:bone-common.yaml?group=BONE&refreshEnabled=true
  datasource:
    url: ${BONE_DB_URL:jdbc:mysql://localhost:3306/bone?useSSL=true&autoReconnect=true&characterEncoding=utf8}
    username: ${BONE_DB_USERNAME:root}
    password: ${BONE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${BONE_REDIS_HOST:localhost}
    port: ${BONE_REDIS_PORT:6379}
    password: ${BONE_REDIS_PASSWORD:}
    database: 0

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # prod 仅暴露 health/info/metrics：metrics 经 JWT 鉴权、不放通匿名；prometheus 抓取端点不在 prod 暴露
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
