spring:
  application:
    name: bone-iam
  datasource:
    url: ${BONE_DB_URL:jdbc:mysql://localhost:3306/bone?useSSL=true&autoReconnect=true&characterEncoding=utf8}
    username: ${BONE_DB_USERNAME:root}
    password: ${BONE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${BONE_REDIS_HOST:localhost}
    port: ${BONE_REDIS_PORT:6379}
    password: ${BONE_REDIS_PASSWORD:}
    database: 0

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
