# 本地开发环境配置
# 启动方式：mvn spring-boot:run -Dspring-boot.run.profiles=dev
# 或设置环境变量 SPRING_PROFILES_ACTIVE=dev
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ${BONE_DB_PASSWORD:bone_dev_pass}
  redis:
    host: localhost
    port: 6379
    password: ${BONE_REDIS_PASSWORD:}

bone:
  metadata:
    embedded:
      datasource:
        url: jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
        username: root
        password: ${BONE_DB_PASSWORD:bone_dev_pass}
  minio:
    # 开发环境默认 MinIO 凭证，生产环境必须通过环境变量注入
    access-key: ${BONE_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${BONE_MINIO_SECRET_KEY:minioadmin}
  iam:
    jwt:
      # 开发环境默认密钥，生产环境必须通过环境变量注入
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}

logging:
  level:
    com.bone.iam: debug
    com.bone.metadata.sdk: debug
