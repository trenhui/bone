alert:
  policies:
    CRITICAL:
      channels: [DINGTALK, SMS, EMAIL]
      retry: 3
    HIGH:
      channels: [EMAIL, DINGTALK]

  channels:
    mail:
      enabled: true
      from: alerts@company.com
      recipients:
        - ops@company.com
    dingtalk:
      enabled: true
      webhook: ${DINGTALK_WEBHOOK:}
      secret: ${DINGTALK_SECRET:}
      atMobiles:
        - ${DINGTALK_AT_MOBILE:}
    sms:
      enabled: true
      provider: "Aliyun"
      apiKey: ${SMS_API_KEY:}
      apiSecret: ${SMS_API_SECRET:}
      phoneNumbers:
        - ${SMS_PHONE_1:}
        - ${SMS_PHONE_2:}
      templateId: ${SMS_TEMPLATE_ID:}

  async:
    corePoolSize: 10
    maxPoolSize: 20
    queueCapacity: 1000
    keepAliveSeconds: 60
