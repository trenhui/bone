server:
  port: 8107

spring:
  application:
    name: bone-file
  cloud:
    nacos:
      config:
        # 本地 Nacos 3.0.3（MySQL+鉴权）：通过 spring.config.import 在启动期拉取共享配置
        server-addr: ${BONE_NACOS_ADDR:127.0.0.1:8848}
        username: ${BONE_NACOS_USERNAME:nacos}
        password: ${BONE_NACOS_PASSWORD:nacos}
        namespace: ${BONE_NACOS_NAMESPACE:}
        group: BONE
        file-extension: yaml
  config:
    import:
      - nacos:bone-common.yaml?group=BONE&refreshEnabled=true
  datasource:
    url: jdbc:mysql://${BONE_DB_HOST:localhost}:${BONE_DB_PORT:3306}/${BONE_DB_NAME:bone}?useSSL=false&autoReconnect=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${BONE_DB_USERNAME:root}
    password: ${BONE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

bone:
  iam:
    jwt:
      secret-key: ${BONE_IAM_JWT_SECRET_KEY}
      token-prefix: "Bearer "
      header-name: Authorization
  file:
    minio:
      endpoint: ${BONE_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${BONE_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${BONE_MINIO_SECRET_KEY:minioadmin}
      bucket: ${BONE_MINIO_BUCKET:platform-files}

management:
  endpoints:
    web:
      exposure:
        include: health,info
