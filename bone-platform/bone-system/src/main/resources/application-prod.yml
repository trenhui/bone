server:
  port: 8083

spring:
  application:
    name: bone-system
  datasource:
    # 默认连接平台共享库 `bone`（与 IAM / Metadata / Integration / Extension 同库），
    # 这是控制台 keyMetrics 跨表 COUNT(iam_account / meta_entity / int_flow / exts_plugin_version) 的前置条件。
    # 若运维选择分库（如 `bone_system`），keyMetrics 会按 graceful degradation 退化为 0，
    # 详见详设 §3.3.3 与 §11.2「[Target] 跨库指标聚合」。
    url: jdbc:mysql://${BONE_DB_HOST:localhost}:${BONE_DB_PORT:3306}/${BONE_DB_NAME:bone}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${BONE_DB_USERNAME:root}
    password: ${BONE_DB_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

bone:
  system:
    log-retention-days: 180
