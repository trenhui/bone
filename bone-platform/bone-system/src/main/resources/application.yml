server:
  port: 8083

spring:
  application:
    name: bone-system
  # === 时间字段的 UTC 契约（i18n 方案 §6.4，照 blueprint 样板）===
  jackson:
    # 输出带偏移的 ISO-8601（...Z），而不是时间戳数组。
    # 注意 spring.jackson.time-zone 对 LocalDateTime 无效（其本身无时区）；
    # 对外契约的时间字段一律用 Instant（见 adapter/web/dto/response/*Resp），此处仅固定默认行为。
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  datasource:
    # 默认连共享库 `bone`；keyMetrics 跨表 COUNT 依赖此库存在 iam_*/meta_*/int_*/exts_* 表（详设 §3.3.3）。
    url: jdbc:mysql://${BONE_DB_HOST:localhost}:${BONE_DB_PORT:3306}/${BONE_DB_NAME:bone}?useSSL=false&autoReconnect=true&characterEncoding=utf8
    username: ${BONE_DB_USERNAME:root}
    password: ${BONE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

bone:
  iam:
    jwt:
      # 必须与 bone-iam `bone.iam.jwt.secret-key` 一致；
      # 生产环境通过环境变量 BONE_IAM_JWT_SECRET_KEY 注入。
      # 与 bone-iam 一致：优先 BONE_IAM_JWT_SECRET_KEY，兼容历史变量 BONE_JWT_SECRET
      secret-key: ${BONE_IAM_JWT_SECRET_KEY}
      token-prefix: "Bearer "
      header-name: Authorization
  system:
    log-retention-days: 180
    log:
      # 每日 03:30 清理超过保留期的 sys_log（详设 §2.3「日志保留期 180 天」的落地实现）
      cleanup-cron: "0 30 3 * * ?"
    alert:
      # 告警规则周期评估：60s 一轮；设为 false 可整体停用（如压测降噪）
      evaluation-enabled: true
      evaluation-interval-ms: 60000
    config:
      # 敏感配置 AES-256-GCM 加密密钥（对齐 bone.iam.jwt.secret-key 先例：本地/开发用 dev 默认值，
      # 生产环境必须经环境变量 BONE_CONFIG_ENCRYPT_KEY 注入独立密钥，见 application-prod.yml fail-fast）
      encrypt-key: ${BONE_CONFIG_ENCRYPT_KEY:dev-only-config-encrypt-key-local}
