server:
  port: 8083

spring:
  application:
    name: bone-system
  datasource:
    url: ${BONE_DB_URL:jdbc:mysql://localhost:3306/bone?useSSL=false&autoReconnect=true&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${BONE_DB_USERNAME:root}
    password: ${BONE_DB_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

bone:
  iam:
    jwt:
      # 开发环境默认密钥，生产环境必须通过环境变量注入
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}
  system:
    log-retention-days: 180
