--- #################### 数据库相关配置 ####################
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/extTest?useSSL=false&autoReconnect=true&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: mysql123
    # 指定为HikariDataSource
    type: com.zaxxer.hikari.HikariDataSource
    # hikari连接池配置
    hikari:
      #连接池名
      pool-name: HikariCP
      #最小空闲连接数
      minimum-idle: 5
      # 空闲连接存活最大时间，默认10分钟
      idle-timeout: 600000
      # 连接池最大连接数，默认是10
      maximum-pool-size: 10
      # 此属性控制从池返回的连接的默认自动提交行为,默认值：true
      auto-commit: true
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
      max-lifetime: 1800000
      # 数据库连接超时时间,默认30秒
      connection-timeout: 30000
      # 连接测试query
      connection-test-query: SELECT 1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.yourcompany.com  # OAuth2 授权服务器地址
          jwk-set-uri: https://auth.yourcompany.com/.well-known/jwks.json

# 其他配置项保持不变
sql:
  executor:
    allow:
      dml: true
  template:
    path: classpath:/sql-templates/
  database:
    type: MYSQL

# 服务端配置
security:
  auth-mode: api-key # 测试环境使用api-key，生产环境改为jwt
  api-key: test-token # 测试API Key

metadata:
  sdk:
    appcode: extTest
    deploymentMode: EMBEDDED
  service:
    config:
      remote:
        auth-mode: api-key # 与服务端保持一致
        endpoint: http://localhost:9001
        token: test-token
        timeout: 3000
      embedded:
        cache-ttl: 600

feign:
  client:
    config:
      default:
        loggerLevel: NONE
        connectTimeout: 5000
        readTimeout: 5000

ribbon:
  eureka:
    enabled: false

logging:
  level:
    root: WARN
    com.bone.metadata: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    metadataService:
      enabled: true

  # Redis 配置。Redisson 默认的配置足够使用，一般不需要进行调优
#  data:
#    redis:
#      host: 114.215.101.209
#      port: 6379
#      database: 0
#      password: "@Pukang_123"
#  redis:
#    host: 127.0.0.1 # 地址
#    port: 6379 # 端口
#    database: 0 # 数据库索引
#    password: 123456 # 密码，建议生产环境开启


--- #################### 监控相关配置 ####################

# Actuator 监控端点的配置项
management:
  endpoints:
    web:
      base-path: /actuator # Actuator 提供的 API 接口的根目录。默认为 /actuator
      exposure:
        include: '*' # 需要开放的端点。默认值只打开 health 和 info 两个端点。通过设置 * ，可以开放所有端点。

