spring:
  application:
    name: bone-ai-app
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${BONE_AI_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/bone?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${BONE_AI_DB_USERNAME:root}
    password: ${BONE_AI_DB_PASSWORD:}

server:
  shutdown: graceful
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,readiness,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        # K8s 探针分组（详设 §6.1 生产就绪）：liveness 只看进程活性（不查外部依赖——DB/Redis 抖动不该重启 pod）；
        # readiness 看进程 + DB（没就绪就别进流量，但不需要因此杀进程）
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

bone:
  ai:
    rag-top-k: 5
    rag-min-score: 0        # 分数阈值（精排后过滤；0=不启用，须按评测集实测分布校准）
    rag-max-scan: 3000     # 容量护栏：作用域切片数上限，超限 fail-closed（AI_RAG_SCOPE_OVER_LIMIT）；2026-10-24 由 10000 下调（过渡态内存打分，几千条已劣化）
    rag-answer-model: gpt-4o-mini   # RAG 回答链生成模型档位（经网关卡面调用；引用接地质量对档位敏感，按评测集实测上调）
    default-integration-mode: AUTOMATED
    notification-webhook-url: ${BONE_AI_WEBHOOK_URL:}
    rag:
      # 共享推理服务（TEI / infinity 兼容，数据不出域红线；不配则回落 过渡哈希 / NoOpReranker）
      # embedding:
      #   base-url: ${BONE_AI_RAG_EMBEDDING_URL:http://tei:80}
      #   model: BAAI/bge-m3
      #   version: bge-m3@http
      # rerank:
      #   base-url: ${BONE_AI_RAG_RERANK_URL:http://tei:80}
      #   model: BAAI/bge-reranker-v2-m3
      candidate-pool: 30    # 进入 cross-encoder 精排的候选池（≥ topK；详设 §2.6 top-30 → top-5）
      min-score: 0          # 同 bone.ai.rag-min-score（模块级配置，请求可覆盖）
      max-scan: 3000       # 同 bone.ai.rag-max-scan（模块级配置，请求可覆盖）
      mmr-lambda: 0         # 同 bone.ai.rag-mmr-lambda（模块级配置，请求可覆盖）
      # 文档级 ACL：默认 fail-closed 拒绝检索（2026-10-24 起，DenyDocAcl 空可见集）——未接入 ACL 实现不放行全租户；
      # 接入方提供 RagAclPort Bean（读文档中心 ACL）后「无 ACL 归属的 doc 不可见」fail-closed 生效（AI_RAG_DOC_FORBIDDEN）；
      # 仅开发联调可 bone.ai.rag.acl.default-deny=false 回落 NoDocAcl（仅租户硬隔离，禁止带入生产）
      acl:
        default-deny: true
      # 写入侧 PII 字段级掩码（2026-10-24 起默认开：身份证/手机号/银行卡/邮箱等长局部掩码，span 锚点不漂移）
      ingest:
        pii-mask-enabled: true
      # 生成侧接地（确定性守卫阈值 + 可选语义裁判；2026-10-24 R5）
      grounding:
        # 语义接地裁判（faithfulness NLI 判定，经网关卡面）：确定性守卫过关后追加一层，拦「词面全对但结论上下文没给」的
        # paraphrase 编造。**默认 false = opt-in**——裁判使每次问答成本约翻倍（生成 + 裁判两次模型调用），默认只保留
        # 零成本确定性守卫；高合规场景显式置 true。裁判自身故障回落确定性守卫 + degradations=GROUNDING_JUDGE_DEGRADED
        judge-enabled: false
      # 检索链路阶段计时（B16 / R6 子项，opt-in，默认关）：开启时每次 retrieve 末尾汇总各阶段墙钟时延事件
      # （RETRIEVE_STAGES，形如 acl=..;embed=..;score=..;rerank=..;mmr=..;assemble=..;total=..;candidates=..），
      # 经 RagEventSink 落 trace 证据快照，供诊断 / 压测期定位性能瓶颈（与 RETRIEVE_SLOW 同告警线）。
      # 默认关——每查询多落一条证据快照，生产常态不付该开销；待接入 OTel 后升级为真实 gen_ai.* 子 span。
      stage-tracing-enabled: false
