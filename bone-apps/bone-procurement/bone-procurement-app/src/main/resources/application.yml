server:
  port: ${BONE_PROCUREMENT_PORT:8090}
  max-http-request-header-size: 16KB

spring:
  application:
    name: bone-procurement
  datasource:
    url: jdbc:mysql://${BONE_DB_HOST:localhost}:${BONE_DB_PORT:3306}/${BONE_DB_NAME:bone}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${BONE_DB_USERNAME:root}
    password: ${BONE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jackson:
    time-zone: UTC

metadata:
  sdk:
    appcode: bone-procurement
    deploymentMode: EMBEDDED

bone:
  iam:
    jwt:
      # 与 IAM / bone-claim 同款：本地验签密钥必须与签发方一致
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}
  procurement:
    transaction:
      enabled: ${BONE_PROCUREMENT_TRANSACTION_ENABLED:false}
    fulfillment:
      enabled: ${BONE_PROCUREMENT_FULFILLMENT_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
