server:
  port: ${BONE_CLAIM_PORT:8087}
  # 请求头上限：默认 8192 字节。实测 BONE 平台签发的 JWT 携带全部角色 scope 时约 4.5KB，
  # 叠加浏览器全套默认头（UA / sec-ch-ua / Accept-Language / Cookie 等 ~3KB）后已达上限——
  # 表现为「浏览器发起的请求稳定 400（Tomcat HTML 错误页）、curl 同接口却 200」，
  # 因为 curl 头部极少永远不超限，问题只在真实浏览器复现，极具迷惑性。
  # 16KB 给当前最坏情况留一倍余量；再多的鉴权信息膨胀应优先瘦身 token 而非无线上调。
  max-http-request-header-size: 16KB

spring:
  application:
    name: synap-claim
  datasource:
    url: ${BONE_DB_URL:jdbc:mysql://localhost:3306/bone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${BONE_DB_USERNAME:root}
    # 必填变量，不给默认值：缺失时启动即失败（配置与环境规范 §1.4 fail-fast），
    # 避免用空密码去连库、报出难以定位的认证错误。口径与 bone-blueprint 一致。
    password: ${BONE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # DDL 真源：scripts/migration/0058_synap_claim_tables.sql（由模块库内迁移 V1-V5 合并生成，
  # 与《工程详细设计（落地版）》§9.3/§9.5 对齐）。显式关掉 Spring Boot 对 schema.sql/data.sql
  # 的自动执行，避免双轨 DDL 漂移（同 bone-blueprint 口径）。
  sql:
    init:
      mode: never
  # 时间字段 UTC 契约（i18n 方案 §6.4）：对外契约时间字段用 Instant，
  # 此处把默认行为显式固定，避免依赖 Spring Boot 版本默认值。
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

# bone-metadata-sdk：仓储代理与 SQL 模板加载（前缀 metadata.sdk.*，勿写 bone.metadata.* 死配置）。
metadata:
  sdk:
    appcode: synap-claim
    deploymentMode: EMBEDDED

bone:
  iam:
    jwt:
      # 与其余模块同款声明：必须与 bone-iam 的 bone.iam.jwt.secret-key 一致，
      # 本地开发未注入环境变量时各模块落到同一未解析占位符字面量，天然一致。
      secret-key: ${BONE_IAM_JWT_SECRET_KEY:${BONE_JWT_SECRET:dev-only-secret-key-minimum-32-bytes-long}}
  claim:
    idempotency:
      # 提交理赔的 Idempotency-Key 快照落库开关（表 claim_idempotency_record）；
      # false 时退化为「不记录快照」（同 blueprint bone.blueprint.idempotency.enabled 口径）。
      enabled: ${BONE_CLAIM_IDEMPOTENCY_ENABLED:true}
    ruleset:
      # 核责规则资产位置：默认 classpath 内的 claim-ruleset.json；指向外部文件即可不发版调整规则。
      # 配置文件缺失/损坏/为空时适配器回退内置规则集（fail-closed 方向），不会静默放行。
      location: ${BONE_CLAIM_RULESET_LOCATION:classpath:claim-ruleset.json}
    document-parse:
      # 感知层实现：text = 数电票文本层确定性解析（默认）；llm = 模型驱动结构化抽取（需真实 provider）。
      # llm 模式未配 provider 时网关回落 MockLlmClient，适配器显式拒绝并转人工，绝不伪造解析产物。
      mode: ${BONE_CLAIM_DOCUMENT_PARSE_MODE:text}
      image:
        # D2 图像感知通道：默认 false——图像件维持转人工补录，开与不开现网行为不变。
        # true 时 ImageDocumentParsePortAdapter 装配，图像件经网关多模态解析；
        # 网关异常/超时/契约违反/mock 一律落 FAILED + 归因码（IMAGE_GATEWAY_UNAVAILABLE /
        # IMAGE_OUTPUT_INVALID / IMAGE_MOCK_REJECTED）转人工，禁止文本层兜底冒充。
        enabled: ${BONE_CLAIM_DOCUMENT_PARSE_IMAGE_ENABLED:false}
    knowledge:
      # D3 受控 RAG 语义检索支路：默认 false——知识层行为与现状（目录准入核验）完全一致。
      # true 时 RagKnowledgeRetrievalPortAdapter 装配为 KnowledgeRetrievalPort 主实现：
      # 目录准入逻辑不变，仅「目录未收录」且有检索词时走 bone-ai-rag 受控检索；
      # 结果必须带 clauseRef（引用强制），无语料/检索异常 → available=false + 受控成因码。
      rag:
        enabled: ${BONE_CLAIM_KNOWLEDGE_RAG_ENABLED:false}
    auto-decision:
      # 材料锁定 → 自动触发决策图。默认关闭：须 G3 放量演练通过后才按租户打开，
      # 打开后仍受「AI 不碰钱」、反欺诈硬闸与自动放款开关三重约束。
      enabled: ${BONE_CLAIM_AUTO_DECISION_ENABLED:false}
    quota-year:
      # 额度年度口径（额度账户行键的一部分，读写两侧共用 QuotaYearResolver 裁决）：
      #   CALENDAR    自然年（默认）。业务日缺失的历史案件退回处理日，与切换前行为一致。
      #   POLICY_TERM 保单年度。按保单生效日起算每满 12 个月为一个年度，quota_year 记该年度起始年份；
      #               期间查不到 / 业务日缺失 / 业务日超出保单期间一律拒算（SC_CLAIM_POLICY_NOT_ACTIVE
      #               或 SC_CLAIM_OUT_OF_POLICY_PERIOD），不会静默退回自然年。
      # 切换前必须完成两件事，否则历史累计读不到（免赔重扣、封顶重满）：
      #   ① PolicyQueryPort 接真实保单系统（一期为进程内存桩，只有 dev seeder 种进去的保单）；
      #   ② 把既有 t_quota_account.quota_year 按保单年度重映射（数据迁移，不是开关）。
      basis: ${BONE_CLAIM_QUOTA_YEAR_BASIS:CALENDAR}
  # 模型 provider（OpenAI 兼容协议）。三项都由环境变量注入，配置库零明文。
  # 留空 base-url = 网关回落 MockLlmClient：服务照常启动，但 AiGatewayPortAdapter 显式拒绝替身响应
  # （fail-closed），所有 AI 节点降级——「没配」与「配错」在运行期报表上表现相同，
  # 用 GET /api/v1/claim-ops/ai-provider-probe 区分（它会真发一次最小请求）。
  # 密钥若留着未解析的 ${...} 占位符，LlmGatewayProperties 会启动即失败，不会带着字面量去鉴权。
  ai:
    gateway:
      base-url: ${BONE_AI_GATEWAY_BASE_URL:}
      api-key: ${BONE_AI_GATEWAY_API_KEY:}
      model: ${BONE_AI_GATEWAY_MODEL:gpt-4o-mini}
      timeout: ${BONE_AI_GATEWAY_TIMEOUT:30s}

# 生产可观测性出口（与 bone-system / bone-iam 同口径）：
# 缺此块时指标只留在进程内存里，Prometheus 抓不到 —— 有埋点等于没有。
# 抓取端点 /actuator/prometheus 仅供集群内 Prometheus 拉取（Security 中 /actuator/** 已放行，
# 故须由网关/网络策略限制外部可达，勿在公网暴露）。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      # 多服务共用同一 Prometheus 时用于区分来源（否则同名指标会被聚合混淆）
      application: ${spring.application.name}
