# 示例 L1 契约 - 完整 CRUD 功能
# 使用方法: 复制此文件并重命名为 {feature}.yaml，填写内容

meta:
  feature: example-crud
  owner: yourname
  level: L1
  template: crud-base
  lock: false

mission: "为示例模块增加完整的 CRUD 管理功能"

# 数据模型
data_model:
  entity_name: "ExampleEntity"
  table_name: "example_entity"
  fields:
    - name: id
      type: Long
      primary: true
      auto_increment: true
    - name: code
      type: String
      length: 64
      nullable: false
      unique: true
    - name: name
      type: String
      length: 128
      nullable: false
    - name: description
      type: String
      length: 512
      nullable: true
    - name: status
      type: Integer
      default: 1
    - name: createdAt
      type: LocalDateTime
      auto: "creation"
    - name: updatedAt
      type: LocalDateTime
      auto: "update"

# API 契约
api_contract:
  base_path: "/api/example/entities"

  endpoints:
    # 分页查询
    - method: GET
      path: ""
      query:
        page: { type: int, default: 1, min: 1 }
        size: { type: int, default: 20, min: 1, max: 100 }
        keyword: { type: string, required: false }
        status: { type: int, required: false }
      response:
        status: 200
        body:
          code: 200
          message: "success"
          data:
            list: [{ id, code, name, status, createdAt }]
            total: long
            page: int
            size: int

    # 根据 ID 查询
    - method: GET
      path: "/{id}"
      path_params:
        id: { type: long }
      response:
        status: 200
        body:
          code: 200
          data:
            id: long
            code: string
            name: string
            description: string
            status: int
            createdAt: datetime
            updatedAt: datetime

    # 创建
    - method: POST
      path: ""
      request:
        code: { type: string, required: true, pattern: "^[A-Z][A-Z0-9_]*$" }
        name: { type: string, required: true, maxLength: 128 }
        description: { type: string, required: false, maxLength: 512 }
      response:
        status: 201
        body:
          code: 201
          data:
            id: long
            code: string
            name: string

    # 更新
    - method: PUT
      path: "/{id}"
      path_params:
        id: { type: long }
      request:
        name: { type: string, required: true }
        description: { type: string, required: false }
        status: { type: integer, required: false }
      response:
        status: 200
        body:
          code: 200
          data:
            id: long
            name: string
            updatedAt: datetime

    # 删除（软删除）
    - method: DELETE
      path: "/{id}"
      path_params:
        id: { type: long }
      response:
        status: 200
        body:
          code: 200
          message: "删除成功"
          data: { success: true }

# 质量门禁
guardrails:
  coverage: ">80%"
  max_cyclomatic: 10
  max_method_lines: 50
  max_class_lines: 500

  block_patterns:
    - "**/security/*"
    - "generated/**"

  naming_convention:
    controller: "*Controller"
    command_handler: "*CommandHandler"
    query_handler: "*QueryHandler"
    repository: "*Repository"
    dto_req: "*Req"
    dto_resp: "*Resp"
